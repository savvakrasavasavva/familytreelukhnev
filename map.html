<html lang="ru"><head><meta charset="utf-8">

<title>Карта рода Лухнёвых</title>

<style>
*{box-sizing:border-box}
:root{--paper:#EDEDE9;--card:#FBFBF8;--ink:#1B1B1A;--soft:#6E6E68;--rail:#C0392B;
--stamp:#2C4A6E;--rule:#CFCFC8;
--birth:#2a78d6;--move:#eb6834;--route:#1baf7a;
--serif:Georgia,"PT Serif","Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:11px 16px 9px;border-bottom:1px solid var(--rule);position:relative;z-index:500;
background:var(--paper)}
h1{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
h1 em{font-style:normal;color:var(--rail)}
.sub{font-size:11px;color:var(--soft);font-family:var(--mono);margin-top:2px}
#langrow{position:absolute;top:10px;right:14px}
#lang{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--rule);
background:var(--card);color:inherit;border-radius:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.chip{padding:5px 9px;border:1px solid var(--rule);background:transparent;border-radius:2px;
font-size:12.5px;color:var(--ink);white-space:nowrap;text-decoration:none;display:inline-block}
.chip[aria-pressed=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.sep{width:1px;height:18px;background:var(--rule);margin:0 2px}
#slider{display:flex;align-items:center;gap:7px}
#yr{font-family:var(--mono);font-size:11px;color:var(--soft);min-width:74px}
input[type=range]{width:190px;accent-color:var(--stamp)}
#map{position:absolute;left:0;right:0;bottom:0;top:var(--hh,116px);background:var(--paper)}
.leaflet-container{background:var(--paper);font-family:var(--sans)}
/* легенда и список мест — они же «текстовая версия» карты */
#side{position:absolute;left:14px;bottom:14px;width:264px;max-height:calc(100% - 150px);
overflow:auto;border:1.5px solid var(--ink);background:var(--card);border-radius:2px;
z-index:600;box-shadow:0 4px 20px rgba(0,0,0,.12)}
#side h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin:0;padding:10px 12px 6px;border-bottom:1px solid var(--rule)}
.lg{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12.5px}
.sw{width:22px;height:0;flex:none;border-top:3px solid}
.sw.dot{height:11px;width:11px;border:2px solid;border-radius:50%;border-top-width:2px}
.sw.dash{border-top-style:dashed}
.pit{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px;
border-bottom:1px solid var(--rule);line-height:1.3}
.pit:hover,.pit:focus-visible{background:#fff}
.pn{font-family:var(--serif);font-size:13px}
.pc{float:right;font-family:var(--mono);font-size:10px;color:var(--soft)}
.pr{display:block;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
#panel{position:absolute;right:14px;bottom:14px;width:296px;max-height:calc(100% - 150px);
overflow:auto;border:1.5px solid var(--ink);background:var(--card);padding:14px 15px;
border-radius:2px;z-index:600;box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
#panel.on{display:block}
#panel h2{font-family:var(--serif);font-size:16px;font-weight:400;margin:0 0 2px;line-height:1.25}
#panel .pid{font-family:var(--mono);font-size:10px;color:var(--soft)}
#close{position:absolute;top:8px;right:9px;border:0;background:none;font-size:17px;color:var(--soft)}
#panel dl{margin:12px 0 0;font-size:12.5px}
#panel dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin-top:10px}
#panel dd{margin:2px 0 0;line-height:1.45}
#panel a{color:var(--stamp)}
.note{padding:8px 12px;font-size:11px;color:var(--soft);line-height:1.35}
@media (max-width:820px){#side{left:6px;right:6px;width:auto;max-height:32%}
#panel{right:6px;left:6px;width:auto;bottom:auto;top:calc(var(--hh,116px) + 8px);max-height:40%}}

const ROUTES=[{"id": "L004", "n": "Лухнёв Николай Дмитриевич", "pts": [{"p": "P01", "y": 1902, "u": "1902", "t": "рождение"}, {"p": "P08", "y": null, "u": "", "t": "служба"}, {"p": "P03", "y": null, "u": "", "t": "служба"}, {"p": "P09", "y": null, "u": "", "t": "служба"}, {"p": "P10", "y": null, "u": "", "t": "служба"}, {"p": "P02", "y": null, "u": "", "t": "служба"}]}, {"id": "AH001", "n": "Ахмадуллин Габидулла", "pts": [{"p": "P14", "y": 1904, "u": "1904", "t": "рождение"}, {"p": "P15", "y": 1942, "u": "1942", "t": "служба"}]}, {"id": "D013", "n": "Daniloff Elsie Deena H (Henry)", "pts": [{"p": "P04", "y": 1912, "u": "1912", "t": "рождение"}, {"p": "P05", "y": 1985, "u": "1985", "t": "смерть"}]}, {"id": "ZG004", "n": "Загретдинов Сафуан Сафиевич", "pts": [{"p": "P12", "y": 1915, "u": "1915", "t": "рождение"}, {"p": "P13", "y": null, "u": "", "t": "жительство"}]}, {"id": "L021", "n": "Лухнёва Юлия Николаевна", "pts": [{"p": "P25", "y": 1965, "u": "1965", "t": "рождение"}, {"p": "P16", "y": 1993, "u": "сейчас", "t": "жительство"}]}, {"id": "L027", "n": "Лухнёв Савва Николаевич", "pts": [{"p": "P16", "y": 1995, "u": "1995", "t": "рождение"}, {"p": "P17", "y": 2012, "u": "", "t": "учёба"}, {"p": "P18", "y": 2012, "u": "2021", "t": "жительство"}, {"p": "P16", "y": 2021, "u": "2022", "t": "жительство"}, {"p": "P19", "y": 2022, "u": "2024", "t": "жительство"}, {"p": "P20", "y": 2025, "u": "2025", "t": "жительство"}, {"p": "P21", "y": 2026, "u": "2026", "t": "жительство"}, {"p": "P22", "y": 2026, "u": "сейчас", "t": "жительство"}]}, {"id": "KH002", "n": "Хасанова Руфина Ильсуровна", "pts": [{"p": "P24", "y": 1996, "u": "1996", "t": "рождение"}, {"p": "P16", "y": 2021, "u": "2022", "t": "жительство"}, {"p": "P19", "y": 2022, "u": "2024", "t": "жительство"}, {"p": "P20", "y": 2025, "u": "2025", "t": "жительство"}, {"p": "P21", "y": 2026, "u": "2026", "t": "жительство"}, {"p": "P22", "y": 2026, "u": "сейчас", "t": "жительство"}]}, {"id": "L089", "n": "Лухнёв Алексей Саввич", "pts": [{"p": "P18", "y": 2014, "u": "2021", "t": "жительство"}, {"p": "P16", "y": 2021, "u": "2022", "t": "жительство"}, {"p": "P19", "y": 2022, "u": "2024", "t": "жительство"}, {"p": "P23", "y": 2025, "u": "сейчас", "t": "жительство"}]}, {"id": "L090", "n": "Лухнёв Марк Саввич", "pts": [{"p": "P18", "y": 2019, "u": "2021", "t": "жительство"}, {"p": "P16", "y": 2021, "u": "2022", "t": "жительство"}, {"p": "P19", "y": 2022, "u": "2024", "t": "жительство"}, {"p": "P20", "y": 2025, "u": "2025", "t": "жительство"}, {"p": "P21", "y": 2026, "u": "2026", "t": "жительство"}, {"p": "P23", "y": 2026, "u": "сейчас", "t": "жительство"}]}];
const LIVED={"P08": [{"id": "L004", "n": "Лухнёв Николай Дмитриевич", "y": null, "u": "", "t": "служба"}], "P03": [{"id": "L004", "n": "Лухнёв Николай Дмитриевич", "y": null, "u": "", "t": "служба"}, {"id": "L015", "n": "Лухнёв Александр Николаевич", "y": null, "u": "", "t": "жительство"}], "P09": [{"id": "L004", "n": "Лухнёв Николай Дмитриевич", "y": null, "u": "", "t": "служба"}], "P10": [{"id": "L004", "n": "Лухнёв Николай Дмитриевич", "y": null, "u": "", "t": "служба"}], "P02": [{"id": "L004", "n": "Лухнёв Николай Дмитриевич", "y": null, "u": "", "t": "служба"}, {"id": "L019", "n": "Колпакова Татьяна Николаевна (Лухнева)", "y": null, "u": "", "t": "жительство"}], "P13": [{"id": "ZG004", "n": "Загретдинов Сафуан Сафиевич", "y": null, "u": "", "t": "жительство"}], "P17": [{"id": "L027", "n": "Лухнёв Савва Николаевич", "y": 2012, "u": "", "t": "учёба"}], "P18": [{"id": "L027", "n": "Лухнёв Савва Николаевич", "y": 2012, "u": "2021", "t": "жительство"}, {"id": "L089", "n": "Лухнёв Алексей Саввич", "y": 2014, "u": "2021", "t": "жительство"}, {"id": "L090", "n": "Лухнёв Марк Саввич", "y": 2019, "u": "2021", "t": "жительство"}], "P16": [{"id": "L027", "n": "Лухнёв Савва Николаевич", "y": 2021, "u": "2022", "t": "жительство"}, {"id": "KH002", "n": "Хасанова Руфина Ильсуровна", "y": 2021, "u": "2022", "t": "жительство"}, {"id": "L089", "n": "Лухнёв Алексей Саввич", "y": 2021, "u": "2022", "t": "жительство"}, {"id": "L090", "n": "Лухнёв Марк Саввич", "y": 2021, "u": "2022", "t": "жительство"}, {"id": "L021", "n": "Лухнёва Юлия Николаевна", "y": 1993, "u": "сейчас", "t": "жительство"}], "P19": [{"id": "L027", "n": "Лухнёв Савва Николаевич", "y": 2022, "u": "2024", "t": "жительство"}, {"id": "KH002", "n": "Хасанова Руфина Ильсуровна", "y": 2022, "u": "2024", "t": "жительство"}, {"id": "L089", "n": "Лухнёв Алексей Саввич", "y": 2022, "u": "2024", "t": "жительство"}, {"id": "L090", "n": "Лухнёв Марк Саввич", "y": 2022, "u": "2024", "t": "жительство"}], "P20": [{"id": "L027", "n": "Лухнёв Савва Николаевич", "y": 2025, "u": "2025", "t": "жительство"}, {"id": "KH002", "n": "Хасанова Руфина Ильсуровна", "y": 2025, "u": "2025", "t": "жительство"}, {"id": "L090", "n": "Лухнёв Марк Саввич", "y": 2025, "u": "2025", "t": "жительство"}], "P21": [{"id": "L027", "n": "Лухнёв Савва Николаевич", "y": 2026, "u": "2026", "t": "жительство"}, {"id": "KH002", "n": "Хасанова Руфина Ильсуровна", "y": 2026, "u": "2026", "t": "жительство"}, {"id": "L090", "n": "Лухнёв Марк Саввич", "y": 2026, "u": "2026", "t": "жительство"}], "P22": [{"id": "L027", "n": "Лухнёв Савва Николаевич", "y": 2026, "u": "сейчас", "t": "жительство"}, {"id": "KH002", "n": "Хасанова Руфина Ильсуровна", "y": 2026, "u": "сейчас", "t": "жительство"}], "P23": [{"id": "L089", "n": "Лухнёв Алексей Саввич", "y": 2025, "u": "сейчас", "t": "жительство"}, {"id": "L090", "n": "Лухнёв Марк Саввич", "y": 2026, "u": "сейчас", "t": "жительство"}], "P26": [{"id": "AY003", "n": "Аюпов Ахметшариф Абуталипович", "y": 1944, "u": "1945", "t": "служба"}], "P15": [{"id": "AH001", "n": "Ахмадуллин Габидулла", "y": 1942, "u": "1942", "t": "служба"}], "P28": [{"id": "L005", "n": "Лухнёв Алексей Дмитриевич", "y": 1939, "u": "1945", "t": "служба"}]};
const SKIPPED=["Кавказ"];
const YMIN=1877,YMAX=2026;
const VAR={birth:"#2a78d6",move:"#eb6834",route:"#1baf7a"};

const PL={},AT={};
PLACES.forEach(p=>{PL[p.id]=p;AT[p.id]=[]});
// к месту относится и тот, кто там родился, и тот, кто там умер:
// иначе Евпатория, где L004 погиб, но не родился, не попала бы на карту
PEOPLE.forEach(p=>{if(p.bp)AT[p.bp].push(p);if(p.dp&&p.dp!==p.bp)AT[p.dp].push(p)});

const I18N={
 ru:{title:'Карта рода <em>Лухнёвых</em>',docTitle:'Карта рода Лухнёвых',
  sub:(n,m)=>`${n} человек с известным местом · ${m} мест на карте`,
  births:'Люди на местах',moves:'Род → ребёнок',routes:'Путь человека',
  legend:'Слои',places:'Места',byYear:y=>`по ${y} год`,all:'все годы',
  tree:'Дерево',bornHere:'Родились здесь',diedHere:'Умерли здесь',livedHere:'Жили здесь',
  evt:{'жительство':'жил(а)','переезд':'переезд','служба':'служба','работа':'работа',
       'учёба':'учёба','эмиграция':'эмиграция','прочее':'прочее'},
  historical:'Раньше называлось',region:'Регион',note:'Примечание',
  noCoords:n=>`Без координат, на карте не показаны: ${n}`,
  peopleAt:n=>`${n} чел.`,openInTree:'Открыть в дереве',
  pFrom:y=>`с ${y}`,pUntil:y=>`по ${y}`,pNow:'сейчас'},
 en:{title:'Lukhnev Family <em>Map</em>',docTitle:'Lukhnev Family Map',
  sub:(n,m)=>`${n} people with a known place · ${m} places mapped`,
  births:'People by place',moves:'Parent → child',routes:'Life route',
  legend:'Layers',places:'Places',byYear:y=>`up to ${y}`,all:'all years',
  tree:'Tree',bornHere:'Born here',diedHere:'Died here',livedHere:'Lived here',
  evt:{'жительство':'lived','переезд':'moved','служба':'service','работа':'work',
       'учёба':'studies','эмиграция':'emigration','прочее':'other'},
  historical:'Formerly',region:'Region',note:'Note',
  noCoords:n=>`No coordinates, not shown: ${n}`,
  peopleAt:n=>`${n} people`,openInTree:'Open in tree',
  pFrom:y=>`from ${y}`,pUntil:y=>`until ${y}`,pNow:'present'},
};
const LSKEY='familytree-lang';
let LANG=localStorage.getItem(LSKEY)||((navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en');
const tr=(k,...a)=>{const v=(I18N[LANG]||I18N.ru)[k];return typeof v==='function'?v(...a):v};
const trEvt=t=>{const d=(I18N[LANG]||I18N.ru).evt;return (d&&d[t])||t};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// «2012–2021», «с 2012», «2026» — отрезок словами текущего языка
function trPeriod(y,u){
  const now=u==='сейчас';
  if(y&&now)return tr('pFrom',y);
  if(y&&u)return y===u?y:y+'–'+u;
  if(y)return y;
  if(now)return tr('pNow');
  return u?tr('pUntil',u):'';
}

const map=L.map('map',{zoomControl:true,worldCopyJump:true}).setView([52,25],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19
}).addTo(map);

let year=YMAX,show={births:true,moves:true,routes:true},sel=null;
const gBirth=L.layerGroup().addTo(map),gMove=L.layerGroup().addTo(map),
      gRoute=L.layerGroup().addTo(map);

const upTo=p=>p.by==null||p.by<=year;
const livedTo=s=>s.y==null||s.y<=year;
// Люди места на выбранный год: родившиеся, умершие и жившие — по одному разу
// каждый, даже если человек и родился здесь, и потом сюда вернулся.
function atPlace(id){
  const seen=new Map();
  (AT[id]||[]).filter(upTo).forEach(p=>seen.set(p.id,p));
  (LIVED[id]||[]).filter(livedTo).forEach(s=>{
    if(!seen.has(s.id))seen.set(s.id,{id:s.id,n:s.n,y:'',by:s.y})});
  return [...seen.values()];
}

function radius(n){return Math.min(26,5+Math.sqrt(n)*4.2)}

function draw(){
  gBirth.clearLayers();gMove.clearLayers();gRoute.clearLayers();
  PLACES.forEach(pl=>{
    const n=atPlace(pl.id).length;
    if(!n)return;
    L.circleMarker([pl.la,pl.lo],{radius:radius(n),color:'#fff',weight:2,
      fillColor:VAR.birth,fillOpacity:.8})
     .on('click',()=>openPlace(pl.id))
     .bindTooltip(esc(pl.n)+' · '+tr('peopleAt',n),{direction:'top'})
     .addTo(gBirth);
  });
  MOVES.forEach(m=>{
    if(m.y!=null&&m.y>year)return;
    const a=PL[m.f],b=PL[m.t];if(!a||!b)return;
    L.polyline([[a.la,a.lo],[b.la,b.lo]],{color:VAR.move,weight:1+Math.min(4,m.n),
      opacity:.75}).addTo(gMove);
  });
  ROUTES.forEach(r=>{
    // ползунок обрезает и путь: отрезки, начавшиеся позже выбранного года,
    // ещё не случились. Шаги без года остаются — иначе старые записи,
    // где известен только порядок, пропали бы с карты совсем.
    const steps=r.pts.filter(s=>s.y==null||s.y<=year);
    const pts=steps.map(s=>PL[s.p]).filter(Boolean).map(p=>[p.la,p.lo]);
    if(pts.length<2)return;
    L.polyline(pts,{color:VAR.route,weight:2.5,opacity:.9,dashArray:'6 5'})
     .bindTooltip('<b>'+esc(r.n)+'</b><br>'+steps.map(s=>{
        const w=trPeriod(s.y==null?'':String(s.y),s.u);
        return (w?'<span class="pr" style="display:inline">'+esc(w)+'</span> ':'')+
               esc((PL[s.p]||{}).n||s.p);
      }).join('<br>'),{direction:'top'})
     .addTo(gRoute);
  });
  renderPlaces();
}

function openPlace(id){
  sel=id;
  const pl=PL[id],panel=document.getElementById('panel');
  const here=atPlace(id),
        born=here.filter(p=>p.bp===id),
        died=here.filter(p=>p.dp===id),
        lived=(LIVED[id]||[]).filter(livedTo);
  const link=p=>'<a href="index.html#'+encodeURIComponent(p.id)+'">'+esc(p.n)+'</a>'+
               (p.y?' <span class="pr" style="display:inline">'+esc(p.y)+'</span>':'');
  // у жившего вместо годов жизни — годы, которые он провёл именно здесь
  const lnk=s=>'<a href="index.html#'+encodeURIComponent(s.id)+'">'+esc(s.n)+'</a>'+
    ' <span class="pr" style="display:inline">'+
    esc([trPeriod(s.y==null?'':String(s.y),s.u),
         s.t==='жительство'?'':trEvt(s.t)].filter(Boolean).join(' · '))+'</span>';
  panel.innerHTML='<button id="close">×</button><h2>'+esc(pl.n)+'</h2>'+
    '<div class="pid">'+esc(pl.id)+(pl.t?' · '+esc(pl.t):'')+'</div><dl>'+
    (pl.h?'<dt>'+tr('historical')+'</dt><dd>'+esc(pl.h)+'</dd>':'')+
    ((pl.r||pl.c)?'<dt>'+tr('region')+'</dt><dd>'+esc([pl.r,pl.c].filter(Boolean).join(', '))+'</dd>':'')+
    (born.length?'<dt>'+tr('bornHere')+'</dt><dd>'+born.map(link).join('<br>')+'</dd>':'')+
    (lived.length?'<dt>'+tr('livedHere')+'</dt><dd>'+lived.map(lnk).join('<br>')+'</dd>':'')+
    (died.length?'<dt>'+tr('diedHere')+'</dt><dd>'+died.map(link).join('<br>')+'</dd>':'')+
    (pl.z?'<dt>'+tr('note')+'</dt><dd>'+esc(pl.z)+'</dd>':'')+'</dl>';
  panel.classList.add('on');
  panel.querySelector('#close').onclick=()=>{panel.classList.remove('on');sel=null;renderPlaces()};
  map.panTo([pl.la,pl.lo]);
  renderPlaces();
  history.replaceState(null,'','#'+encodeURIComponent(id));
}

function renderPlaces(){
  const rows=PLACES.map(pl=>({pl,n:atPlace(pl.id).length}))
                   .filter(x=>x.n).sort((a,b)=>b.n-a.n||a.pl.n.localeCompare(b.pl.n));
  document.getElementById('plist').innerHTML=rows.map(({pl,n})=>
    '<button type="button" class="pit" data-id="'+esc(pl.id)+'"'+
    (pl.id===sel?' aria-current="true"':'')+'><span class="pc">'+n+'</span>'+
    '<span class="pn">'+esc(pl.n)+'</span><span class="pr">'+
    esc([pl.r,pl.c].filter(Boolean).join(', '))+'</span></button>').join('');
  document.querySelectorAll('#plist .pit').forEach(b=>b.onclick=()=>openPlace(b.dataset.id));
}

function relabel(){
  document.documentElement.lang=LANG;
  document.title=tr('docTitle');
  document.getElementById('lang').value=LANG;
  document.getElementById('h1').innerHTML=tr('title');
  document.getElementById('sub').textContent=tr('sub',PEOPLE.length,PLACES.length);
  document.getElementById('lgLegend').textContent=tr('legend');
  document.getElementById('lgPlaces').textContent=tr('places');
  [['Birth','births'],['Move','moves'],['Route','routes']].forEach(([sfx,key])=>{
    document.getElementById('lb'+sfx).textContent=tr(key);
    document.getElementById('lg'+sfx).textContent=tr(key);
  });
  document.getElementById('treelink').textContent=tr('tree');
  const nc=document.getElementById('nocoords');
  if(nc&&SKIPPED.length)nc.textContent=tr('noCoords',SKIPPED.join(', '));
  yearLabel();
  if(sel)openPlace(sel); else renderPlaces();
}
function yearLabel(){
  document.getElementById('yr').textContent=year>=YMAX?tr('all'):tr('byYear',year);
}

const rng=document.getElementById('range');
rng.min=YMIN;rng.max=YMAX;rng.value=YMAX;
rng.oninput=e=>{year=+e.target.value;yearLabel();draw()};
[['births',gBirth],['moves',gMove],['routes',gRoute]].forEach(([k,g])=>{
  const b=document.getElementById('t_'+k);
  b.setAttribute('aria-pressed',show[k]);
  b.onclick=()=>{show[k]=!show[k];b.setAttribute('aria-pressed',show[k]);
    show[k]?g.addTo(map):map.removeLayer(g)};
});
document.getElementById('lang').onchange=e=>{
  LANG=e.target.value;localStorage.setItem(LSKEY,LANG);relabel();draw()};
const hh=()=>document.documentElement.style.setProperty('--hh',
  document.querySelector('header').offsetHeight+'px');
addEventListener('resize',()=>{hh();map.invalidateSize()});
hh();

relabel();
draw();
if(PLACES.length){
  // отступы несимметричные: слева легенда, справа карточка места —
  // иначе крайние точки уезжают под панели
  const b=L.latLngBounds(PLACES.map(p=>[p.la,p.lo]));
  const wide=innerWidth>820;
  map.fitBounds(b,{paddingTopLeft:[wide?300:20,30],
                   paddingBottomRight:[wide?330:20,30],maxZoom:6});
}
const want=decodeURIComponent(location.hash.replace(/^#/,''));
if(want&&PL[want])openPlace(want);

</script></body></html>
