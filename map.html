, "t": "город", "la": 59.938732, "lo": 30.316229, "z": "Город, где родился Антон Агафонов (AG005) в 2001 и где с 2021 года живёт вся ближняя родня Дарьи (AG002). Сама Дарья с сыновьями живёт в КОЛПИНО (P23) — это район Петербурга, заведённый отдельной точкой, потому что вся семейная жизнь Агафоновых привязана именно к нему (S80)", "ne": "Sankt-peterburg", "ce": "Russia"}, {"id": "P111", "n": "Астана", "h": "Целиноград", "r": "", "c": "Казахстан", "t": "город", "la": 51.115993, "lo": 71.467706, "z": "Родина бабушки Алексея (L089) и Марка (L090) по материнской линии, 1972 год. В документах стоит «гор. Целиноград» — так город назывался с 1961 по 1992, до того Акмолинск, после Акмола и с 1998 Астана (S80). Ещё одна казахстанская точка в дереве, независимая от усть-каменогорской линии Лухнёвых", "ne": "Astana", "he": "Tselinograd", "ce": "Kazakhstan", "ze": "The birthplace of the grandmother of Aleksei (L089) and Mark (L090) on their mother's side, 1972. The documents give \"the town of Tselinograd\" — the city's name from 1961 to 1992; before that Akmolinsk, afterwards Akmola, and from 1998 Astana (S80). One more Kazakhstan point in the tree, independent of the Ust-Kamenogorsk line of the Lukhnevs."}, {"id": "P113", "n": "Школа № 456 (Октябрьская улица)", "h": "", "r": "Колпино, Санкт-Петербург", "c": "Россия", "t": "школа", "la": 59.738626, "lo": 30.616773, "z": "ГБОУ средняя общеобразовательная школа № 456 Колпинского района. Здесь Алексей (L089) доучился четвёртый класс и перешёл в пятый — справка школы от 23.04.2026; Марк (L090) должен пойти в первый класс той же школы в сентябре 2026 (S80). Первая русская школа для обоих после трёх заграничных лет и первая ОЧНАЯ школа Алексея с 2022 года: между «Берёзкой» и ней всё было либо семейным, либо заграничным", "a": 1, "ne": "Shkola № 456 (oktyabrskaya ulitsa)", "re": "Kolpino, St Petersburg", "ce": "Russia"}, {"id": "P114", "n": "Микрорайон Радиоцентр, 7", "h": "", "r": "Балашиха, Московская область", "c": "Россия", "t": "дом", "la": 55.792566, "lo": 37.89161, "z": "Дом Андрея Евгеньевича Агафонова (AG001) — второго деда мальчиков, по линии матери. Здесь с 05.05.2015 по 05.05.2018 был зарегистрирован по месту пребывания Алексей (L089), то есть первые школьные годы бумаги привязывали его к дедову адресу, а не к родительскому (S80). Координаты — по микрорайону: точного дома на карте нет", "a": 1, "ne": "Mikrorayon Radiotsentr, 7", "ce": "Russia"}, {"id": "P115", "n": "Улица Парковая Аллея, 60", "h": "", "r": "Калининград, Калининградская область", "c": "Россия", "t": "дом", "la": 54.745142, "lo": 20.51867, "z": "ТРЕТИЙ КАЛИНИНГРАДСКИЙ АДРЕС, о котором в дереве не знали: в заявлении Саввы (L027) на сертификат дополнительного образования от 05.09.2022 адресом проживания Алексея (L089) указан дом 60 по Парковой Аллее, квартира 10 (S80). Прописаны мальчики были в тот момент на Воейкова (P84), а жили, выходит, здесь. Чей это адрес — съём или родня — неизвестно (Q176)", "a": 1, "ne": "Ulitsa Parkovaya Alleya, 60", "ce": "Russia"}, {"id": "P116", "n": "Детский сад № 29 (улица Тазаева)", "h": "", "r": "Колпино, Санкт-Петербург", "c": "Россия", "t": "детский сад", "la": 59.742504, "lo": 30.611239, "z": "Государственный детский сад Колпинского района — при поступлении Алексея (L089) он назывался № 27, теперь № 29. Первый и самый долгий садик в его жизни: с 01.09.2016 по 31.08.2021, приказ № 91-Д от 30.08.2016 (S80). Ходил он туда, живя у бабушки по материнской линии в Колпино, пока родители были в Подмосковье. В том же Колпино он окажется снова через десять лет, в 2025 году", "a": 1, "ne": "Detsky sad № 29 (ulitsa Tazaeva)", "re": "Kolpino, St Petersburg", "ce": "Russia", "ze": "A state kindergarten of the Kolpino district — when Aleksei (L089) was admitted it was no. 27, and is now no. 29. The first and longest kindergarten of his life: from 1 September 2016 to 31 August 2021, order no. 91-Д of 30 August 2016 (S80). He went there while living with his grandmother on his mother's side in Kolpino, his parents being in the Moscow region. He would find himself in Kolpino again ten years later, in 2025."}, {"id": "P117", "n": "Хургада", "h": "", "r": "Красное море", "c": "Египет", "t": "город", "la": 27.222556, "lo": 33.830706, "z": "Первая заграница в жизни Алексея (L089) — и без родителей: с 5 по 20 марта 2022 года его возила сюда бабушка по материнской линии, вылетали из Петербурга, жили в двух отелях на Абу-Сома (S80). Это за десять месяцев до отъезда семьи во Вьетнам", "ne": "Khurgada", "re": "Red Sea", "ce": "Egypt", "ze": "The first trip abroad in Aleksei's life (L089) — and without his parents: from 5 to 20 March 2022 his grandmother on his mother's side took him here; they flew from St Petersburg and stayed in two hotels at Abu Soma (S80). This was ten months before the family left for Vietnam."}, {"id": "P118", "n": "Данмор-Ист (Dunmore East)", "h": "", "r": "графство Уотерфорд, Мунстер", "c": "Ирландия", "t": "посёлок", "la": 52.14884, "lo": -6.994731, "z": "Рыбацкий посёлок на побережье Уотерфорда, регистрационный округ Вудстаун. Здесь 8 февраля 1912 года родилась Элси Дина Хетерингтон (D013) — по гражданской записи о рождении № 277 (S84). Её отец (H001) служил здесь священником Церкви Ирландии. МЕСТО ЗАМЕНИЛО ГРИНВИЧ: до 18.08.2026 в дереве стояло рождение в лондонском Гринвиче по индексу GRO, и это оказалось чужой записью — разбор в карточке D013", "ne": "Danmor-ist (dunmore East)", "ce": "Ireland"}, {"id": "P119", "n": "Борнмут (Bournemouth)", "h": "", "r": "Дорсет", "c": "Великобритания", "t": "город", "la": 50.7192, "lo": -1.8808, "z": "Здесь Семён Данилов (D008) познакомился с Элси (D013) — приезжал в языковую школу подтягивать английский и сошёлся с друзьями её родителей (S85). Со слов её зятя Роя Вуда (D016), август 2026. Борнмут в тридцати километрах от Пула (P05), где Элси прожила потом всю вторую половину жизни, — то есть знакомство случилось в её краях, а не в его", "ne": "Bornmut (bournemouth)", "re": "Dorset", "ce": "United Kingdom", "ze": "This is where Semyon Danilov (D008) met Elsie (D013) - he came to a language school to improve his English and fell in with friends of her parents (S85). As told by her son-in-law Roy Wood (D016), August 2026. Bournemouth also confirmed in print: her parents were living in Bournemouth West (Kilnerath, Erpingham Road) from at least 1930, and her father died in the Poole district in 1936 (S93, S97)"}, {"id": "P120", "n": "Арильд (Arild)", "h": "", "r": "Хёганес, Сконе", "c": "Швеция", "t": "посёлок", "la": 56.273819, "lo": 12.57211, "z": "Приморская деревня на полуострове Куллен, куда Семён Данилов (D008) ездил писать маслом — по словам его зятя Роя (S85), он писал Арильд особенно много. Это не случайное место у моря: с 1850-х годов Арильд был шведской художественной колонией, скандинавским аналогом Скагена, — на постоялый двор «Мор Циллы» ездили писать около полусотни известных художников ради «особенно сильного летнего света на Куллаберге». Значит домашний художник, каким его показала проверка шведских аукционов (S71), писал там же, где профессионалы", "ne": "Arild (arild)", "re": "Dorset", "ce": "United Kingdom"}, {"id": "P121", "n": "Чешир (Cheshire)", "h": "", "r": "Чешир", "c": "Великобритания", "t": "графство", "la": 53.2, "lo": -2.5, "z": "Графство на северо-западе Англии. Здесь 16.12.1875 родился Леонард Эдвин Ховард Генри (H001), отец Элси — то есть английская линия Henry начинается не в Ирландии, а в Англии. Точное селение неизвестно: школьный ролл Rathmines School пишет только «in Cheshire» (S86). Координаты — центр графства, не место рождения", "ne": "Cheshire", "re": "Cheshire", "ce": "United Kingdom", "ze": "A county in north-west England. Leonard Edwin Howard Henry (H001), Elsie's father, was born here on 16 December 1875 — which means the English Henry line begins in England, not in Ireland. The exact town or village is unknown: the Rathmines School roll records only \"in Cheshire\" (S86). The coordinates are the centre of the county, not the birthplace."}, {"id": "P122", "n": "Ньюпорт (Newport)", "h": "", "r": "графство Типперэри, Мунстер", "c": "Ирландия", "t": "город", "la": 52.7069, "lo": -8.4053, "z": "Городок в графстве Типперэри, приход диоцеза Кашел. Леонард Эдвин Ховард Генри (H001) был здесь настоятелем (Incumbent) с 1915 года, адрес — St. John's Rectory; с 1920-го к приходу присоединён Киллоскалли (Killoscully). Так записано в Crockford's Clerical Directory 1921 (S86)", "ne": "Newport", "re": "County Tipperary, Munster", "ce": "Ireland", "ze": "A small town in County Tipperary, a parish of the diocese of Cashel. Leonard Edwin Howard Henry (H001) was Incumbent here from 1915, at St John's Rectory; from 1920 the parish of Killoscully was joined to it. So it stands in Crockford's Clerical Directory for 1921 (S86)."}, {"id": "P123", "n": "Дублин (Dublin)", "h": "", "r": "графство Дублин, Ленстер", "c": "Ирландия", "t": "город", "la": 53.3498, "lo": -6.2603, "z": "Здесь учился Леонард Эдвин Ховард Генри (H001), отец Элси: школа Rathmines School и Trinity College Dublin, B.A. 1899, M.A. 1902 (S86). Тот же школьный ролл связывает с Дублином и его отца Джона Уильяма (H003) — правда, строка в этом месте оборвана OCR, поэтому «Dublin» у отца читается как место жительства с оговоркой", "ne": "Dublin", "re": "County Dublin, Leinster", "ce": "Ireland", "ze": "Where Leonard Edwin Howard Henry (H001), Elsie's father, was educated: Rathmines School and Trinity College Dublin, B.A. 1899, M.A. 1902 (S86). The same school roll also ties his father John William (H003) to Dublin — though the line breaks off there in the scanned text, so \"Dublin\" is read as his place of residence with that reservation."}, {"id": "P124", "n": "Миасс", "h": "", "r": "Челябинская область", "c": "Россия", "t": "город", "la": 55.0455, "lo": 60.1084, "z": "Здесь Александр Николаевич (L015) учился в геолого-разведочном техникуме Министерства цветной металлургии СССР с августа 1955 по февраль 1958. Адрес техникума по печатному объявлению — Пушкинская, 54", "ne": "Miass", "re": "Chelyabinsk region", "ce": "Russia", "ze": "This is where Alexander Nikolayevich (L015) studied at the geological prospecting technical school of the USSR Ministry of Non-Ferrous Metallurgy from August 1955 to February 1958. The address of the school, from the printed announcement, was 54 Pushkinskaya Street"}, {"id": "P125", "n": "Вишнёвогорск", "h": "", "r": "Каслинский район, Челябинская область", "c": "Россия", "t": "посёлок", "la": 55.9761, "lo": 60.6572, "z": "Редкометальное месторождение — тантал, ниобий, цирконий. Сюда Александр Николаевич (L015) собирался на производственную практику из Миасса: «в 200-х км от Миасса к северу… близ Каслей, знаменитого чугунолитейного завода, где отливаются художественные отливки» (S87)", "ne": "Vishnevogorsk", "re": "Kasli district, Chelyabinsk region", "ce": "Russia", "ze": "A rare-metal deposit - tantalum, niobium, zirconium. Alexander Nikolayevich (L015) was to come here from Miass for a work placement: \"200 km north of Miass... near Kasli, the famous iron foundry where the art castings are made\" (S87)"}, {"id": "P126", "n": "Таргын", "h": "", "r": "Уланский район, Восточно-Казахстанская область", "c": "Казахстан", "t": "посёлок", "la": 49.9, "lo": 82.1, "z": "Посёлок, где стояла контора геологической экспедиции: отсюда Александр Николаевич (L015) писал матери и брату с летней практики (S87). Работа была засекречена — отчёт сдан в спецчасть, само место работы тоже под грифом. Точка ПРИБЛИЗИТЕЛЬНАЯ: из письма известно только название посёлка и что до Усть-Каменогорска добирались «проскоком»", "ne": "Targyn", "re": "Ulan district, East Kazakhstan region", "ce": "Kazakhstan", "ze": "The settlement where the office of a geological expedition stood: from here Alexander Nikolayevich (L015) wrote to his mother and brother during a summer placement (S87). The work was secret - the report was handed in to the security section, and the place of work was classified too. The point is APPROXIMATE: the letter gives only the name of the settlement and the fact that they got to Ust-Kamenogorsk \"in a dash\""}, {"id": "P127", "n": "Поставы", "h": "", "r": "Витебская область", "c": "Беларусь", "t": "город", "la": 55.1167, "lo": 26.8333, "z": "Отсюда идут первые солдатские письма Николая Николаевича (L013) 1952 года — начало срочной службы", "ne": "Postavy", "re": "Vitebsk region", "ce": "Belarus", "ze": "The first soldier's letters of Nikolai Nikolayevich (L013), of 1952, come from here - the beginning of his conscript service"}, {"id": "P128", "n": "Польша", "h": "", "r": "", "c": "Польша", "t": "страна", "la": 51.9194, "lo": 19.1451, "z": "Северная группа войск: здесь Николай Николаевич (L013) дослуживал срочную и откуда писал брату в 1955 году. Полевая почта 63210 «В» — по адресу на почтовой карточке (S87). Конкретный гарнизон неизвестен, точка — центр страны", "ne": "Poland", "ce": "Poland", "ze": "The Northern Group of Forces: here Nikolai Nikolayevich (L013) served out his conscript term and from here he wrote to his brother in 1955. Field post 63210 \"V\" - from the address on a postcard (S87). The particular garrison is unknown; the point is the centre of the country"}, {"id": "P130", "n": "Камбоджа", "h": "", "r": "", "c": "Камбоджа", "t": "страна", "la": 12.5657, "lo": 104.991, "z": "Поездка семьи в апреле 2025 года: электронные визы одобрены 23 апреля сразу пятерым — Савве (L027), Руфине (KH002), Юлии Николаевне (L021), Марку (L090) и Алексею (L089) (S91). Конкретный город в переписке не назван, точка — центр страны", "ne": "Cambodia", "ce": "Cambodia", "ze": "A family trip in April 2025: electronic visas were approved on 23 April for five people at once - Savva (L027), Rufina (KH002), Yulia Nikolayevna (L021), Mark (L090) and Aleksei (L089) (S91). No particular town is named in the correspondence; the point is the centre of the country"}, {"id": "P131", "n": "Гонконг", "h": "", "r": "", "c": "Китай", "t": "город", "la": 22.3193, "lo": 114.1694, "z": "Поездка в мае 2026 года: бронь отеля Mira Moon, торт подан 24 мая — в день рождения Саввы (S91)", "ne": "Hong Kong", "ce": "China", "ze": "A trip in May 2026: a booking at the Mira Moon hotel, with a cake served on 24 May - Savva's birthday (S91)"}, {"id": "P132", "n": "Введенская начальная школа (Темрюк)", "h": "", "r": "Краснодарский край", "c": "Россия", "t": "школа", "la": 45.2769, "lo": 37.3894, "z": "Школа в Темрюке, которой Антонина Леонидовна (L009) заведовала две недели марта 1929 года — первая руководящая должность в её бумагах (S59). Точка приблизительная, по центру города: адрес школы в справке не указан", "a": 1, "ne": "Vvedenskaya Primary School (Temryuk)", "re": "Krasnodar Krai", "ce": "Russia", "ze": "A school in Temryuk which Antonina Leonidovna (L009) headed for two weeks in March 1929 - the first post of authority in her papers (S59). The point is approximate, at the centre of the town: the school's address is not given in the certificate"}, {"id": "P133", "n": "Ясли консервной фабрики № 8 (Темрюк)", "h": "", "r": "Краснодарский край", "c": "Россия", "t": "детский сад", "la": 45.2769, "lo": 37.3894, "z": "Ясли при консервной фабрике № 8 в Темрюке: здесь Антонина Леонидовна (L009) была сестрой-руководительницей с 5 сентября по 2 октября 1929 года — первый в её пути выход из школьной системы в заводскую (S59). Точка приблизительная, по центру города", "a": 1, "ne": "Nursery of Cannery No. 8 (Temryuk)", "re": "Krasnodar Krai", "ce": "Russia", "ze": "The nursery attached to cannery no. 8 in Temryuk: here Antonina Leonidovna (L009) was senior nurse-supervisor from 5 September to 2 October 1929 - the first move in her path out of the school system and into the factory one (S59). The point is approximate, at the centre of the town"}, {"id": "P134", "n": "Фёрнесс-Вейл (Furness Vale)", "h": "Furness Vale, township Yeardsley-cum-Whaley, приход Taxal, графство Чешир", "r": "Дербишир (High Peak); до 1936 — Чешир", "c": "Великобритания", "t": "селение", "la": 53.3495, "lo": -1.995, "z": "Селение на границе Чешира и Дербишира между Нью-Миллс и Уэйли-Бридж. Здесь 4 января 1874 года родился Уильям Эрнест Чарльз Генри (H004), а 16 декабря 1875-го — его брат Леонард Эдвин Ховард Генри (H001), отец Элси. Школьный ролл Rathmines для первого называет селение, для второго только графство (S93); до 1936 года Фёрнесс-Вейл числился в ЧЕШИРЕ, потом передан в Дербишир. Регистрационный округ рождений — Chapel-en-le-Frith. Уверенность средняя: координаты по селению, не по дому. ОТСЮДА ПОИСКОВЫЙ ХОД: свидетельства о рождении обоих братьев и переписи 1871 и 1881 брать по Chapel-en-le-Frith, а не по Чеширу вообще и не по Дублину", "ne": "Furness Vale", "he": "Furness Vale, township of Yeardsley-cum-Whaley, parish of Taxal, county of Cheshire", "re": "Derbyshire (High Peak); until 1936, Cheshire", "ce": "United Kingdom", "ze": "A village on the Cheshire-Derbyshire border between New Mills and Whaley Bridge. Here William Ernest Charles Henry (H004) was born on 4 January 1874, and his brother Leonard Edwin Howard Henry (H001), Elsie's father, on 16 December 1875. The Rathmines school roll names the village for the first and only the county for the second (S93); until 1936 Furness Vale belonged to CHESHIRE, after which it passed to Derbyshire. The registration district for births is Chapel-en-le-Frith. Confidence is medium: the coordinates are for the village, not for the house. HENCE THE SEARCH MOVE: the birth certificates of both brothers and the censuses of 1871 and 1881 are to be taken by Chapel-en-le-Frith, not by Cheshire at large and not by Dublin"}, {"id": "P135", "n": "Ардмейл (Ardmayle)", "h": "Ardmayle, диоцез Кашел", "r": "графство Типперэри, Мунстер", "c": "Ирландия", "t": "приход", "la": 52.5636, "lo": -7.9022, "z": "Приход в графстве Типперэри. The Clergy List 1906 даёт «Ardmayle Rectory, Cashel, co. Tipperary» как адрес Леонарда Эдвина Ховарда Генри (H001) — этим заполняется часть пустого отрезка 1903–1906 между двумя его сроками в Данмор-Исте (Q186, S93). Уверенность средняя: печать даёт адрес, а не назначение, — он мог жить в ректории Ардмейла, служа в другом приходе", "ne": "Ardmayle", "he": "Ardmayle, diocese of Cashel", "re": "County Tipperary, Munster", "ce": "Ireland", "ze": "A parish in County Tipperary. The Clergy List 1906 gives \"Ardmayle Rectory, Cashel, co. Tipperary\" as the address of Leonard Edwin Howard Henry (H001) - which fills part of the empty stretch of 1903-1906 between his two terms at Dunmore East (Q186, S93). Confidence is medium: the print gives an address, not an appointment - he could have lived in the Ardmayle rectory while serving another parish"}, {"id": "P136", "n": "Палласгрин (Pallasgreen)", "h": "Grean / Pallasgrean, приход диоцеза Эмли", "r": "графство Лимерик, Мунстер", "c": "Ирландия", "t": "посёлок", "la": 52.5583, "lo": -8.3556, "z": "Приход Грин (Grean) диоцеза Эмли. Леонард Эдвин Ховард Генри (H001) был здесь НАСТОЯТЕЛЕМ в 1912–1915 годах — это тот самый отрезок, который OCR школьного ролла отдавал огрызком «Rector of Crean, Co […] 1912-15». Никакого прихода «Crean» не существует ни в одном графстве; «Grean Rectory, Pallasgrean, Co. Limerick» стоит в Crockford's, а в 1915 году в списке местных секретарей напечатано «Pallasgrean: Mrs. Henry, Grean Rectory» — то есть здесь же жила его жена (H002). Сюда семья переехала из Данмор-Иста в год рождения Элси (S98)", "ne": "Pallasgreen", "he": "Grean / Pallasgrean, a parish of the diocese of Emly", "re": "County Limerick, Munster", "ce": "Ireland", "ze": "The parish of Grean in the diocese of Emly. Leonard Edwin Howard Henry (H001) was RECTOR here in 1912-1915 - the very stretch that the OCR of the school roll rendered as the fragment \"Rector of Crean, Co [...] 1912-15\". No parish called \"Crean\" exists in any county; \"Grean Rectory, Pallasgrean, Co. Limerick\" stands in Crockford's, and in 1915 a list of local secretaries prints \"Pallasgrean: Mrs. Henry, Grean Rectory\" - that is, his wife (H002) lived here too. The family moved here from Dunmore East in the year Elsie was born (S98)"}, {"id": "P138", "n": "Кристчёрч (Christchurch)", "h": "", "r": "Гемпшир (ныне Дорсет)", "c": "Великобритания", "t": "город", "la": 50.735, "lo": -1.78, "z": "Регистрационный округ, в котором во 2 квартале 1904 года зарегистрирован брак Леонарда Генри (H001) и Эллен Элизабет Паттерсон (H002): GRO 2b/1485 (S97). Округ охватывал Кристчёрч, Хайклифф, Саутборн и Боскомб — восточную половину нынешнего Борнмута. ОТСЮДА ВАЖНЫЙ ВЫВОД: семья невесты жила здесь ЕЩЁ ДО ИРЛАНДИИ, значит возвращение Генри в Борнмут в двадцатые — возвращение к её родне, а не переезд на новое место, и смерть её в госпитале Боскомба в 1945 году — смерть дома", "ne": "Christchurch", "re": "Hampshire (now Dorset)", "ce": "United Kingdom", "ze": "The registration district in which the marriage of Leonard Henry (H001) and Ellen Elizabeth Patterson (H002) was registered in the 2nd quarter of 1904: GRO 2b/1485 (S97). The district covered Christchurch, Highcliffe, Southbourne and Boscombe - the eastern half of present-day Bournemouth. HENCE AN IMPORTANT CONCLUSION: the bride's family was living here BEFORE IRELAND, so the Henrys' return to Bournemouth in the 1920s was a return to her kin, not a move to a new place, and her death in the Boscombe hospital in 1945 was a death at home"}, {"id": "P139", "n": "Хейфилд (Hayfield)", "h": "регистрационный округ Hayfield", "r": "Чешир / Дербишир", "c": "Великобритания", "t": "округ", "la": 53.377, "lo": -1.945, "z": "Регистрационный округ, в котором в 1 квартале 1876 года зарегистрировано рождение «Henry, Leonard» — GRO 7b/824, единственный Леонард Генри во всей Англии и Уэльсе за 1875–1877, и квартал ложится на 16 декабря 1875 года (S97). Округ лежал на границе двух графств и включал чеширские township-и Дисли, Таксал, Кеттлшульм и Ярдсли-кум-Уэйли, то есть и Фёрнесс-Вейл (P134). Индекс печатает только «Leonard», без Edwin и Howard: так регистрировали сплошь и рядом, остальные имена добавляли при крещении. Точное селение и занятие отца назовёт само свидетельство", "ne": "Hayfield", "he": "Hayfield registration district", "re": "Cheshire / Derbyshire", "ce": "United Kingdom", "ze": "The registration district in which the birth of \"Henry, Leonard\" was registered in the 1st quarter of 1876 - GRO 7b/824, the only Leonard Henry in the whole of England and Wales for 1875-1877, and the quarter falls on 16 December 1875 (S97). The district lay across the boundary of two counties and included the Cheshire townships of Disley, Taxal, Kettleshulme and Yeardsley-cum-Whaley, that is Furness Vale too (P134). The index prints only \"Leonard\", without Edwin and Howard: registrations were made that way all the time, the other names being added at baptism. The exact village and the father's occupation will come from the certificate itself"}, {"id": "P140", "n": "Вознесенское", "h": "с. Вознесенское, центр Афанасьевской волости; Нововыставочный Вознесенский приход", "r": "Афанасьевское сельское поселение, Верхнетоемский район, Архангельская область", "c": "Россия", "t": "село", "la": 62.32611, "lo": 44.22694, "z": "Административный центр ТОГО ЖЕ сельсовета, где стоят Фатьяновская, Кондратовская и Першинская, — 8–10 км от родовой деревни. Здесь похоронен Дмитрий Ефимович (L001): «похоронен в Вознесенске» со слов Юлии Николаевны означает погост своего волостного села, а не город Вознесенск Николаевской области, как думали (Q127). Название подтверждается и военными документами: уроженец Фатьяновской записан в ОБД по адресу «Вознесенское п/о, к/з „Победа“» — то есть это было и почтовое отделение всего куста", "ne": "Voznesenskoye", "he": "the selo of Voznesenskoye, centre of Afanasyevskaya volost; the Novovystavochny Voznesensky parish", "re": "Afanasyevskoye rural settlement, Verkhnyaya Toyma district, Arkhangelsk region", "ce": "Russia", "ze": "The administrative centre of THE SAME rural district in which Fatyanovskaya, Kondratovskaya and Pershinskaya stand - 8-10 km from the ancestral village. Dmitry Yefimovich (L001) is buried here: \"buried at Voznesensk\", as told by Yulia Nikolayevna, means the churchyard of his own volost centre and not the town of Voznesensk in Mykolaiv oblast, as had been thought (Q127). The name is confirmed by military documents as well: a native of Fatyanovskaya is entered in the OBD database with the address \"Voznesenskoye post office, Pobeda collective farm\" - so Voznesenskoye was also the post office of the whole nest"}, {"id": "P141", "n": "Валенсия (Валентия), остров", "h": "Valencia Island, диоцез Ардферт и Ахаду", "r": "графство Керри, Мунстер", "c": "Ирландия", "t": "остров", "la": 51.92, "lo": -10.33, "z": "Викариатство Леонарда Эдвина Ховарда Генри (H001) в 1905–1906 годах — тот самый «[?] Island, Co. Kerry», который OCR школьного ролла отдавал огрызком (Q186). В печати остров пишется через «c»: Crockford's 1921 даёт «Valencia Is. 1905-06 : Dunmore E. 1906-», The Clergy List 1910 отзывается на точную фразу «Valencia Island, Co. Kerry, 1905-6» и не отзывается ни на «Valentia», ни на другие островные приходы Керри. Инкумбент Валентии Александр Делап умер 3 мая 1906 года — викариатство ложится ровно в его последний год", "ne": "Valencia (Valentia) Island", "he": "Valencia Island, diocese of Ardfert and Aghadoe", "re": "County Kerry, Munster", "ce": "Ireland", "ze": "The curacy of Leonard Edwin Howard Henry (H001) in 1905-1906 - the very \"[?] Island, Co. Kerry\" that the OCR of the school roll rendered as a fragment (Q186). In print the island is spelled with a \"c\": Crockford's 1921 gives \"Valencia Is. 1905-06 : Dunmore E. 1906-\", and The Clergy List 1910 responds to the exact phrase \"Valencia Island, Co. Kerry, 1905-6\" and does not respond to \"Valentia\" or to the other island parishes of Kerry. The incumbent of Valencia, Alexander Delap, died on 3 May 1906 - the curacy falls exactly in his last year"}, {"id": "P142", "n": "Полярный", "h": "", "r": "Мурманская область", "c": "Россия", "t": "город", "la": 69.1989, "lo": 33.4506, "z": "База разведывательного отряда разведотдела штаба Северного флота. Место выбытия Константина Васильевича Лухнёва, погибшего 2 августа 1941 года при возвращении десанта с мыса Пикшуев (Q202)", "ne": "Polyarny", "re": "Murmansk region", "ce": "Russia", "ze": "The base of the reconnaissance detachment of the intelligence department of the Northern Fleet staff. The place of loss of Konstantin Vasilyevich Lukhnev, killed on 2 August 1941 while the landing party was returning from Cape Pikshuyev (Q202)"}];

const SKIPPED=[{"n": "Кавказ", "ne": "the Caucasus"}, {"n": "Татьяновская", "ne": "Tatyanovskaya"}, {"n": "Подгорский", "ne": "Podgorsky"}, {"n": "Ровное", "ne": "Rovnoye"}, {"n": "Красное Село (Красносельский с/с)", "ne": "Krasnoye Selo (Krasnoselsky village soviet)"}, {"n": "Кашпур (Большой и Малый)", "ne": "Kashpur (Bolshoy and Maly)"}, {"n": "Филино", "ne": "Filino"}, {"n": "Улица Средняя, 7", "ne": "Ulitsa Srednyaya, 7"}];
const YMIN=1854,YMAX=2026;
const VAR={birth:"#2a78d6",move:"#eb6834",route:"#1baf7a",addr:"#2C4A6E"};

const PL={},AT={};
PLACES.forEach(p=>{PL[p.id]=p;AT[p.id]=[]});
// к месту относится и тот, кто там родился, и тот, кто там умер:
// иначе Евпатория, где L004 погиб, но не родился, не попала бы на карту
PEOPLE.forEach(p=>{if(p.bp)AT[p.bp].push(p);if(p.dp&&p.dp!==p.bp)AT[p.dp].push(p)});

const I18N={
 ru:{title:'Карта рода <em>Лухнёвых</em>',docTitle:'Карта рода Лухнёвых',
  sub:(n,m)=>`${n} человек с известным местом · ${m} мест на карте`,
  births:'Люди на местах',moves:'Род → ребёнок',routes:'Путь человека',
  addrs:'Адреса',
  legend:'Слои',places:'Города и края',byYear:y=>`по ${y} год`,all:'все годы',
  addrHint:'Дом, школа, дача, гараж — точки внутри города. Видны, когда карту приблизишь',
  tree:'Дерево',bornHere:'Родились здесь',diedHere:'Умерли здесь',livedHere:'Жили здесь',
  evt:{'жительство':'жил(а)','переезд':'переезд','служба':'служба','работа':'работа',
       'учёба':'учёба','эмиграция':'эмиграция','прочее':'прочее'},
  kind:{},
  historical:'Раньше называлось',region:'Регион',note:'Примечание',
  noCoords:n=>`Без координат, на карте не показаны: ${n}`,
  peopleAt:n=>`${n} чел.`,openInTree:'Открыть в дереве',
  pFrom:y=>`с ${y}`,pUntil:y=>`по ${y}`,pNow:'сейчас'},
 en:{title:'Lukhnev Family <em>Map</em>',docTitle:'Lukhnev Family Map',
  sub:(n,m)=>`${n} people with a known place · ${m} places mapped`,
  births:'People by place',moves:'Parent → child',routes:'Life route',
  addrs:'Addresses',
  legend:'Layers',places:'Towns and regions',byYear:y=>`up to ${y}`,all:'all years',
  addrHint:'A house, a school, a dacha, a garage — points inside a town. They appear once you zoom in',
  tree:'Tree',bornHere:'Born here',diedHere:'Died here',livedHere:'Lived here',
  evt:{'жительство':'lived','переезд':'moved','служба':'service','работа':'work',
       'учёба':'studies','эмиграция':'emigration','прочее':'other'},
  // Тип места — закрытый список значений, а не текст, поэтому он живёт в
  // словаре интерфейса, а не в data/10_i18n.csv. Дореволюционные единицы
  // (волость, губерния, станица, хутор, аул) английского аналога не имеют:
  // даём транслит с пояснением, иначе «volost» ничего не скажет, а «district»
  // соврёт — это разные вещи.
  kind:{'город':'town','село':'selo (large village)','деревня':'village',
        'посёлок':'settlement','станица':'stanitsa (Cossack village)',
        'хутор':'khutor (hamlet)','аул':'aul (village)','сельсовет':'village soviet',
        'волость':'volost (rural district)','губерния':'governorate',
        'область':'region','округ':'district','регион':'region','страна':'country',
        'полуостров':'peninsula','дача':'dacha','гараж':'garage',
        'дом':'house','школа':'school','детский сад':'kindergarten',
        'музыкальная школа':'music school','университет':'university',
        'кладбище':'cemetery'},
  historical:'Formerly',region:'Region',note:'Note',
  noCoords:n=>`No coordinates, not shown: ${n}`,
  peopleAt:n=>`${n} people`,openInTree:'Open in tree',
  pFrom:y=>`from ${y}`,pUntil:y=>`until ${y}`,pNow:'present'},
};
const LSKEY='familytree-lang';
let LANG=localStorage.getItem(LSKEY)||((navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en');
const tr=(k,...a)=>{const v=(I18N[LANG]||I18N.ru)[k];return typeof v==='function'?v(...a):v};
const trEvt=t=>{const d=(I18N[LANG]||I18N.ru).evt;return (d&&d[t])||t};
const trKind=t=>{const d=(I18N[LANG]||I18N.ru).kind;return (d&&d[t])||t};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Данные по-английски лежат рядом с русскими: n → ne. Одна функция на все места
// вывода, иначе список и всплывашка расходятся по языку. Имя L занято Leaflet.
const TX=(o,k)=>(LANG==='en'&&o&&o[k+'e'])?o[k+'e']:(o?o[k]:'');
// «2012–2021», «с 2012», «2026» — отрезок словами текущего языка
function trPeriod(y,u){
  const now=u==='сейчас';
  if(y&&now)return tr('pFrom',y);
  if(y&&u)return y===u?y:y+'–'+u;
  if(y)return y;
  if(now)return tr('pNow');
  return u?tr('pUntil',u):'';
}

const map=L.map('map',{zoomControl:true,worldCopyJump:true}).setView([52,25],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19
}).addTo(map);

let year=YMAX,show={births:true,moves:true,routes:true,addrs:true},sel=null;
const gBirth=L.layerGroup().addTo(map),gMove=L.layerGroup().addTo(map),
      gRoute=L.layerGroup().addTo(map),gAddr=L.layerGroup();

// Ниже этого приближения адрес показывать нечестно: ромб дома и кружок города
// сливаются в одну кляксу, и карта врёт, будто это два соседних населённых
// пункта. Слой добавляется на карту сам, когда до него дозумили.
const ZADDR=11;
const isAddr=p=>!!p.a;
const ADDRICON=L.divIcon({className:'apw',html:'<i class="apin"></i>',
                          iconSize:[12,12],iconAnchor:[6,6]});
function syncAddr(){
  const near=map.getZoom()>=ZADDR, on=show.addrs&&near;
  if(on&&!map.hasLayer(gAddr))gAddr.addTo(map);
  if(!on&&map.hasLayer(gAddr))map.removeLayer(gAddr);
  const b=document.getElementById('t_addrs');
  if(b)b.classList.toggle('far',show.addrs&&!near);
}
map.on('zoomend',syncAddr);

const upTo=p=>p.by==null||p.by<=year;
const livedTo=s=>s.y==null||s.y<=year;
// Люди места на выбранный год: родившиеся, умершие и жившие — по одному разу
// каждый, даже если человек и родился здесь, и потом сюда вернулся.
function atPlace(id){
  const seen=new Map();
  (AT[id]||[]).filter(upTo).forEach(p=>seen.set(p.id,p));
  (LIVED[id]||[]).filter(livedTo).forEach(s=>{
    if(!seen.has(s.id))seen.set(s.id,{id:s.id,n:s.n,ne:s.ne,y:'',by:s.y})});
  return [...seen.values()];
}

function radius(n){return Math.min(26,5+Math.sqrt(n)*4.2)}

function draw(){
  gBirth.clearLayers();gMove.clearLayers();gRoute.clearLayers();gAddr.clearLayers();
  PLACES.forEach(pl=>{
    const n=atPlace(pl.id).length;
    if(!n)return;
    // адрес — марка постоянного размера: числом людей дом не растёт,
    // а кружок в 26 пикселей накрыл бы весь квартал
    if(isAddr(pl)){
      L.marker([pl.la,pl.lo],{icon:ADDRICON,keyboard:false})
       .on('click',()=>openPlace(pl.id))
       .bindTooltip(esc(TX(pl,'n'))+' · '+tr('peopleAt',n),{direction:'top'})
       .addTo(gAddr);
      return;
    }
    L.circleMarker([pl.la,pl.lo],{radius:radius(n),color:'#fff',weight:2,
      fillColor:VAR.birth,fillOpacity:.8})
     .on('click',()=>openPlace(pl.id))
     .bindTooltip(esc(TX(pl,'n'))+' · '+tr('peopleAt',n),{direction:'top'})
     .addTo(gBirth);
  });
  MOVES.forEach(m=>{
    if(m.y!=null&&m.y>year)return;
    const a=PL[m.f],b=PL[m.t];if(!a||!b)return;
    L.polyline([[a.la,a.lo],[b.la,b.lo]],{color:VAR.move,weight:1+Math.min(4,m.n),
      opacity:.75}).addTo(gMove);
  });
  ROUTES.forEach(r=>{
    // ползунок обрезает и путь: отрезки, начавшиеся позже выбранного года,
    // ещё не случились. Шаги без года остаются — иначе старые записи,
    // где известен только порядок, пропали бы с карты совсем.
    const steps=r.pts.filter(s=>s.y==null||s.y<=year);
    const pts=steps.map(s=>PL[s.p]).filter(Boolean).map(p=>[p.la,p.lo]);
    if(pts.length<2)return;
    L.polyline(pts,{color:VAR.route,weight:2.5,opacity:.9,dashArray:'6 5'})
     .bindTooltip('<b>'+esc(TX(r,'n'))+'</b><br>'+steps.map(s=>{
        const w=trPeriod(s.y==null?'':String(s.y),s.u);
        return (w?'<span class="pr" style="display:inline">'+esc(w)+'</span> ':'')+
               esc(TX(PL[s.p],'n')||s.p);
      }).join('<br>'),{direction:'top'})
     .addTo(gRoute);
  });
  renderPlaces();
}

function openPlace(id){
  sel=id;
  const pl=PL[id],panel=document.getElementById('panel');
  const here=atPlace(id),
        born=here.filter(p=>p.bp===id),
        died=here.filter(p=>p.dp===id),
        lived=(LIVED[id]||[]).filter(livedTo);
  const link=p=>'<a href="index.html#'+encodeURIComponent(p.id)+'">'+esc(TX(p,'n'))+'</a>'+
               (p.y?' <span class="pr" style="display:inline">'+esc(p.y)+'</span>':'');
  // у жившего вместо годов жизни — годы, которые он провёл именно здесь
  const lnk=s=>'<a href="index.html#'+encodeURIComponent(s.id)+'">'+esc(TX(s,'n'))+'</a>'+
    ' <span class="pr" style="display:inline">'+
    esc([trPeriod(s.y==null?'':String(s.y),s.u),
         s.t==='жительство'?'':trEvt(s.t)].filter(Boolean).join(' · '))+'</span>';
  panel.innerHTML='<button id="close">×</button><h2>'+esc(TX(pl,'n'))+'</h2>'+
    '<div class="pid">'+esc(pl.id)+(pl.t?' · '+esc(trKind(pl.t)):'')+'</div><dl>'+
    (pl.h?'<dt>'+tr('historical')+'</dt><dd>'+esc(TX(pl,'h'))+'</dd>':'')+
    ((pl.r||pl.c)?'<dt>'+tr('region')+'</dt><dd>'+
      esc([TX(pl,'r'),TX(pl,'c')].filter(Boolean).join(', '))+'</dd>':'')+
    (born.length?'<dt>'+tr('bornHere')+'</dt><dd>'+born.map(link).join('<br>')+'</dd>':'')+
    (lived.length?'<dt>'+tr('livedHere')+'</dt><dd>'+lived.map(lnk).join('<br>')+'</dd>':'')+
    (died.length?'<dt>'+tr('diedHere')+'</dt><dd>'+died.map(link).join('<br>')+'</dd>':'')+
    (pl.z?'<dt>'+tr('note')+'</dt><dd>'+esc(TX(pl,'z'))+'</dd>':'')+'</dl>';
  panel.classList.add('on');
  panel.querySelector('#close').onclick=()=>{panel.classList.remove('on');sel=null;renderPlaces()};
  // на адрес нельзя просто перелететь: с общего вида его слой выключен,
  // и человек кликнул бы по списку в пустоту
  if(isAddr(pl)&&map.getZoom()<ZADDR)map.setView([pl.la,pl.lo],15);
  else map.panTo([pl.la,pl.lo]);
  syncAddr();
  renderPlaces();
  history.replaceState(null,'','#'+encodeURIComponent(id));
}

function renderPlaces(){
  const rows=PLACES.map(pl=>({pl,n:atPlace(pl.id).length}))
                   .filter(x=>x.n)
                   .sort((a,b)=>b.n-a.n||TX(a.pl,'n').localeCompare(TX(b.pl,'n')));
  const item=({pl,n})=>
    '<button type="button" class="pit" data-id="'+esc(pl.id)+'"'+
    (pl.id===sel?' aria-current="true"':'')+'><span class="pc">'+n+'</span>'+
    '<span class="pn">'+esc(TX(pl,'n'))+'</span><span class="pr">'+
    esc([TX(pl,'r'),TX(pl,'c')].filter(Boolean).join(', '))+'</span></button>';
  document.getElementById('plist').innerHTML=rows.filter(x=>!isAddr(x.pl)).map(item).join('');
  // список адресов — та же карта словами: слой на общем виде выключен,
  // и без списка адрес нельзя было бы ни увидеть, ни открыть
  const addrs=rows.filter(x=>isAddr(x.pl));
  const box=document.getElementById('abox');
  if(box){
    box.style.display=addrs.length?'':'none';
    document.getElementById('alist').innerHTML=addrs.map(item).join('');
  }
  document.querySelectorAll('#side .pit').forEach(b=>b.onclick=()=>openPlace(b.dataset.id));
}

function relabel(){
  document.documentElement.lang=LANG;
  document.title=tr('docTitle');
  document.getElementById('lang').value=LANG;
  document.getElementById('h1').innerHTML=tr('title');
  document.getElementById('sub').textContent=tr('sub',PEOPLE.length,PLACES.length);
  document.getElementById('lgLegend').textContent=tr('legend');
  document.getElementById('lgPlaces').textContent=tr('places');
  const ah=document.getElementById('hAddr'),an=document.getElementById('anote');
  if(ah)ah.textContent=tr('addrs');
  if(an)an.textContent=tr('addrHint');
  [['Birth','births'],['Move','moves'],['Route','routes'],
   ['Addr','addrs']].forEach(([sfx,key])=>{
    document.getElementById('lb'+sfx).textContent=tr(key);
    document.getElementById('lg'+sfx).textContent=tr(key);
  });
  document.getElementById('treelink').textContent=tr('tree');
  const nc=document.getElementById('nocoords');
  if(nc&&SKIPPED.length)nc.textContent=tr('noCoords',SKIPPED.map(s=>TX(s,'n')).join(', '));
  yearLabel();
  if(sel)openPlace(sel); else renderPlaces();
}
function yearLabel(){
  document.getElementById('yr').textContent=year>=YMAX?tr('all'):tr('byYear',year);
}

const rng=document.getElementById('range');
rng.min=YMIN;rng.max=YMAX;rng.value=YMAX;
rng.oninput=e=>{year=+e.target.value;yearLabel();draw()};
[['births',gBirth],['moves',gMove],['routes',gRoute],['addrs',gAddr]].forEach(([k,g])=>{
  const b=document.getElementById('t_'+k);
  b.setAttribute('aria-pressed',show[k]);
  b.onclick=()=>{show[k]=!show[k];b.setAttribute('aria-pressed',show[k]);
    if(k==='addrs'){syncAddr();return}
    show[k]?g.addTo(map):map.removeLayer(g)};
});
syncAddr();
document.getElementById('lang').onchange=e=>{
  LANG=e.target.value;localStorage.setItem(LSKEY,LANG);relabel();draw()};
const hh=()=>document.documentElement.style.setProperty('--hh',
  document.querySelector('header').offsetHeight+'px');
addEventListener('resize',()=>{hh();map.invalidateSize()});
hh();

relabel();
draw();
if(PLACES.length){
  // отступы несимметричные: слева легенда, справа карточка места —
  // иначе крайние точки уезжают под панели
  const b=L.latLngBounds(PLACES.map(p=>[p.la,p.lo]));
  const wide=innerWidth>820;
  map.fitBounds(b,{paddingTopLeft:[wide?300:20,30],
                   paddingBottomRight:[wide?330:20,30],maxZoom:6});
}
const want=decodeURIComponent(location.hash.replace(/^#/,''));
if(want&&PL[want])openPlace(want);

</script></body></html>
