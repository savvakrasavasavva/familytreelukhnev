<style>
*{box-sizing:border-box}
:root{--paper:#EDEDE9;--card:#FBFBF8;--ink:#1B1B1A;--soft:#6E6E68;--rail:#C0392B;
--stamp:#2C4A6E;--rule:#CFCFC8;
--birth:#2a78d6;--move:#eb6834;--route:#1baf7a;
--serif:Georgia,"PT Serif","Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:11px 16px 9px;border-bottom:1px solid var(--rule);position:relative;z-index:500;
background:var(--paper)}
h1{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
h1 em{font-style:normal;color:var(--rail)}
.sub{font-size:11px;color:var(--soft);font-family:var(--mono);margin-top:2px}
#langrow{position:absolute;top:10px;right:14px}
#lang{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--rule);
background:var(--card);color:inherit;border-radius:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.chip{padding:5px 9px;border:1px solid var(--rule);background:transparent;border-radius:2px;
font-size:12.5px;color:var(--ink);white-space:nowrap;text-decoration:none;display:inline-block}
.chip[aria-pressed=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.sep{width:1px;height:18px;background:var(--rule);margin:0 2px}
#slider{display:flex;align-items:center;gap:7px}
#yr{font-family:var(--mono);font-size:11px;color:var(--soft);min-width:74px}
input[type=range]{width:190px;accent-color:var(--stamp)}
#map{position:absolute;left:0;right:0;bottom:0;top:var(--hh,116px);background:var(--paper)}
.leaflet-container{background:var(--paper);font-family:var(--sans)}
/* легенда и список мест — они же «текстовая версия» карты */
#side{position:absolute;left:14px;bottom:14px;width:264px;max-height:calc(100% - 150px);
overflow:auto;border:1.5px solid var(--ink);background:var(--card);border-radius:2px;
z-index:600;box-shadow:0 4px 20px rgba(0,0,0,.12)}
#side h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin:0;padding:10px 12px 6px;border-bottom:1px solid var(--rule)}
.lg{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12.5px}
.sw{width:22px;height:0;flex:none;border-top:3px solid}
.sw.dot{height:11px;width:11px;border:2px solid;border-radius:50%;border-top-width:2px}
.sw.dash{border-top-style:dashed}
.pit{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px;
border-bottom:1px solid var(--rule);line-height:1.3}
.pit:hover,.pit:focus-visible{background:#fff}
.pn{font-family:var(--serif);font-size:13px}
.pc{float:right;font-family:var(--mono);font-size:10px;color:var(--soft)}
.pr{display:block;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
#panel{position:absolute;right:14px;bottom:14px;width:296px;max-height:calc(100% - 150px);
overflow:auto;border:1.5px solid var(--ink);background:var(--card);padding:14px 15px;
border-radius:2px;z-index:600;box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
#panel.on{display:block}
#panel h2{font-family:var(--serif);font-size:16px;font-weight:400;margin:0 0 2px;line-height:1.25}
#panel .pid{font-family:var(--mono);font-size:10px;color:var(--soft)}
#close{position:absolute;top:8px;right:9px;border:0;background:none;font-size:17px;color:var(--soft)}
#panel dl{margin:12px 0 0;font-size:12.5px}
#panel dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin-top:10px}
#panel dd{margin:2px 0 0;line-height:1.45}
#panel a{color:var(--stamp)}
.note{padding:8px 12px;font-size:11px;color:var(--soft);line-height:1.35}
@media (max-width:820px){#side{left:6px;right:6px;width:auto;max-height:32%}
#panel{right:6px;left:6px;width:auto;bottom:auto;top:calc(var(--hh,116px) + 8px);max-height:40%}}

"}, {"id": "P24", "n": "Шингак-Куль", "h": "", "r": "Чишминский район, Башкортостан", "c": "Россия", "t": "село", "la": 54.3861, "lo": 55.21, "z": "Родина Руфины (KH002). Подтверждено по Википедии 11.08.2026: село Шингак-Куль (башк. Шөңгәккүл), Шингак-Кульский сельсовет Чишминского р-на, 27 км от Чишмов, есть ж/д станция. Национальный состав — татары и русские, что сходится с линией Хасановых. Савва называл «Шингаккуль» — то же место. Мои прежние координаты (54.55, 55.13) были угаданы и оказались неверны. Дополнено 12.08.2026: село основано только в 1884 при строительстве Самаро-Златоустовской ж/д (Башкирская энциклопедия) — значит предки Хасановых до 1884 жили где-то ещё, это отдельный вопрос", "ne": "Shingak-Kul", "re": "Chishminsky District, Bashkortostan", "ce": "Russia", "ze": "Rufina's home place (KH002). Confirmed from Wikipedia on 11 August 2026: the selo (large village) of Shingak-Kul (Bashkir Шөңгәккүл), Shingak-Kul village soviet, Chishminsky District, 27 km from Chishmy; it has a railway station. The ethnic composition is Tatar and Russian, which fits the Khasanov line. Savva called it \"Shingakkul\" — the same place. My earlier coordinates (54.55, 55.13) were guesses and proved wrong. Added 12 August 2026: the village was founded only in 1884, during the building of the Samara–Zlatoust railway (the Bashkir Encyclopedia) — which means that before 1884 the Khasanovs' ancestors lived somewhere else; that is a separate question"}, {"id": "P25", "n": "Усть-Каменогорск", "h": "", "r": "Восточно-Казахстанская область", "c": "Казахстан", "t": "город", "la": 49.9481, "lo": 82.628, "z": "", "ne": "Ust-Kamenogorsk", "re": "East Kazakhstan Region", "ce": "Kazakhstan"}, {"id": "P27", "n": "Чусовое", "h": "Старо-Шайтанский Завод (до 1941), Шайтанский завод, Шайтанка", "r": "Шалинский район, Свердловская область", "c": "Россия", "t": "село", "la": 57.42, "lo": 59.1, "z": "Место рождения кандидата S001 (Сарафанов Поливект Нестерович). Координаты приблизительные. 12.08.2026 разобран разнобой написаний: «с. Чусовое», «Старо-Шайтанский с/с», «с. Старо-Шайтанск», «Старо-Шейтанское», «з-д Шайтанка» в документах на S001 — это один и тот же населённый пункт. Село основано в 1709–1721, заселено СТАРООБРЯДЦАМИ из центральной России; Шайтанский железоделательный завод основан Акинфием Демидовым в 1727, с 1769 у Саввы Яковлева, закрыт в 1905. Старошайтанский сельсовет образован в 1934, имя Чусовое село получило указом от 07.03.1941. Практический вывод для поиска: метрики искать в ГАСО, и учитывать, что село старообрядческое — значит возможны раскольнические книги отдельно от приходских.", "ne": "Chusovoye", "he": "Staro-Shaitansky Zavod (until 1941), Shaitansky Zavod, Shaitanka", "re": "Shalinsky District, Sverdlovsk Region", "ce": "Russia", "ze": "Birthplace of the candidate S001 (Sarafanov, Polivekt Nesterovich). The coordinates are approximate. On 12 August 2026 the scatter of spellings was sorted out: \"the selo (large village) of Chusovoye\", \"Staro-Shaitansky village soviet\", \"the selo of Staro-Shaitansk\", \"Staro-Sheytanskoye\" and \"the Shaitanka works\" in the documents on S001 are all one and the same settlement. The village was founded in 1709–1721 and settled by OLD BELIEVERS from central Russia; the Shaitanka ironworks was founded by Akinfy Demidov in 1727, belonged to Savva Yakovlev from 1769 and closed in 1905. The Staro-Shaitansky village soviet was formed in 1934, and the village received the name Chusovoye by a decree of 7 March 1941. Practical conclusion for the search: look for parish registers in GASO (State Archive of Sverdlovsk Region), and bear in mind that the village was an Old Believer one — which means there may be schismatic registers kept separately from the parish ones."}, {"id": "P28", "n": "Фатьяновская", "h": "д. Фатьяновская", "r": "Афанасьевское с/п, Верхнетоемский район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.34189, "lo": 44.17883, "z": "РОДОВОЕ ГНЕЗДО Лухнёвых, место рождения L005 по документам. Координаты уточнены по Википедии 12.08.2026 (прежние 62.23/45.03 были угаданы): 62°20′31″ с.ш., 44°10′44″ в.д., ~44 км к северо-западу от с. Верхняя Тойма, население 30 чел. (2010). ЛОВУШКА: в том же Верхнетоемском районе есть ВТОРАЯ д. Фатьяновская — Двинского с/п, 61.974334/45.596328, население 0. Наша — Афанасьевская. До 1918 это Афанасьевская волость Сольвычегодского уезда ВОЛОГОДСКОЙ губернии, а не Архангельской Историческая принадлежность уточнена 12.08.2026 (S42): до 1924 года это Сольвычегодский уезд ВОЛОГОДСКОЙ губернии, поэтому ревизии и метрики лежат в ГАВО (Вологда), а не в архангельских архивах. ИСТОРИЧЕСКАЯ РАМКА ИСПРАВЛЕНА 15.08.2026 (S61): «Сольвычегодский уезд» верен только для XIX века. По уставной грамоте Ивана IV 1552 года тоемские земли вошли в ПОДВИНСКИЙ СТАН ВАЖСКОГО УЕЗДА, а в XVII веке — в Подвинскую четь Важского уезда; в 1615 году Важский уезд передан в ведение московского ПРИКАЗА БОЛЬШОГО ДВОРЦА, и крестьяне тут были ДВОРЦОВЫЕ, с 1797 года удельные. Сольвычегодским уездом это стало только в 1784-м. Практический вывод: писцовые и переписные книги XVII века надо смотреть ВАЖСКИЕ, а не сольвычегодские, и отдельно фонд Приказа Большого дворца. Проверено независимо по описанию Важского уезда и истории Верхней Тоймы.", "ne": "Fatyanovskaya", "he": "the village of Fatyanovskaya", "re": "Afanasyevskoye rural settlement, Verkhnetoyemsky District, Arkhangelsk Region", "ce": "Russia", "ze": "THE ANCESTRAL SEAT of the Lukhnevs, and L005's birthplace according to the documents. Coordinates refined from Wikipedia on 12 August 2026 (the previous 62.23/45.03 were guesses): 62°20′31″ N, 44°10′44″ E, about 44 km north-west of the selo (large village) of Verkhnyaya Toyma, population 30 (2010). TRAP: the same Verkhnetoyemsky District contains a SECOND village called Fatyanovskaya — in Dvinskoye rural settlement, 61.974334/45.596328, population 0. Ours is the Afanasyevskaya one. Until 1918 this was Afanasyevskaya volost (rural district) of Solvychegodsk uyezd (county) in VOLOGDA Governorate, not Arkhangelsk. Historical affiliation refined on 12 August 2026 (S42): until 1924 this was Solvychegodsk uyezd of VOLOGDA Governorate, so the revisions (poll-tax censuses) and parish registers are held in GAVO (State Archive of Vologda Region), not in the Arkhangelsk archives. THE HISTORICAL FRAME HAS BEEN CORRECTED, 15 August 2026 (S61): \"Solvychegodsk uyezd\" holds true only for the 19th century. Under Ivan IV's charter of 1552 the Toyma lands became part of the PODVINSKY STAN (DISTRICT) OF VAZHSKY UYEZD, and in the 17th century of the Podvinskaya chet (quarter) of Vazhsky uyezd; in 1615 Vazhsky uyezd was placed under the Moscow PRIKAZ (CHANCELLERY) OF THE GREAT PALACE, and the peasants here were PALACE peasants, and appanage peasants from 1797. It became Solvychegodsk uyezd only in 1784. Practical conclusion: the 17th-century cadastral and census books to look at are the VAZHSKY ones, not the Solvychegodsk ones, and separately the fond of the Prikaz of the Great Palace. Verified independently against the description of Vazhsky uyezd and the history of Verkhnyaya Toyma."}, {"id": "P29", "n": "Вантяновная", "h": "д. Вантяновная", "r": "Верхнетоемский район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.23, "lo": 45.03, "z": "Оттуда Лухнёв Павел Иванович (уб. 28.07.1941), см. Q76. РАСХОЖДЕНИЕ: в списке селений Афанасьевского сельсовета (архивный фонд № 48, перепись 1939) деревни с таким названием нет, зато в донесениях ОБД встречается «д. Вантяновный Верхне-Тоемского р-на». Возможно искажение писаря или соседний сельсовет. Не удаляю, но названию верить нельзя — сверять по спискам населённых мест", "ne": "Vantyanovnaya", "he": "the village of Vantyanovnaya", "re": "Verkhnetoyemsky District, Arkhangelsk Region", "ce": "Russia", "ze": "Lukhnev, Pavel Ivanovich (killed 28 July 1941) came from here, see Q76. DISCREPANCY: the list of settlements of the Afanasyevsky village soviet (archival fond no. 48, the 1939 census) has no village of this name, but the OBD casualty reports do contain \"the village of Vantyanovny, Verkhne-Toyemsky District\". Possibly a clerk's corruption, or a neighbouring village soviet. I am not deleting it, but the name cannot be trusted — it has to be checked against the lists of populated places"}, {"id": "P30", "n": "Кондратовская", "h": "д. Кондратовская", "r": "Афанасьевский с/с, Верхнетоемский район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.33964, "lo": 44.18506, "z": "Место рождения L055 по документам «Памяти народа», где записано как «Кондратьево». ИСПРАВЛЕНО 12.08.2026: деревня называется Кондратовская и стоит в 300–400 м от Фатьяновской. Вероятное место жительства L007 Историческая принадлежность уточнена 12.08.2026 (S42): до 1924 года это Сольвычегодский уезд ВОЛОГОДСКОЙ губернии, поэтому ревизии и метрики лежат в ГАВО (Вологда), а не в архангельских архивах. ИСТОРИЧЕСКАЯ РАМКА ИСПРАВЛЕНА 15.08.2026 (S61): «Сольвычегодский уезд» верен только для XIX века. По уставной грамоте Ивана IV 1552 года тоемские земли вошли в ПОДВИНСКИЙ СТАН ВАЖСКОГО УЕЗДА, а в XVII веке — в Подвинскую четь Важского уезда; в 1615 году Важский уезд передан в ведение московского ПРИКАЗА БОЛЬШОГО ДВОРЦА, и крестьяне тут были ДВОРЦОВЫЕ, с 1797 года удельные. Сольвычегодским уездом это стало только в 1784-м. Практический вывод: писцовые и переписные книги XVII века надо смотреть ВАЖСКИЕ, а не сольвычегодские, и отдельно фонд Приказа Большого дворца. Проверено независимо по описанию Важского уезда и истории Верхней Тоймы.", "ne": "Kondratovskaya", "he": "the village of Kondratovskaya", "re": "Afanasyevsky village soviet, Verkhnetoyemsky District, Arkhangelsk Region", "ce": "Russia", "ze": "L055's birthplace according to the documents on \"Pamyat Naroda\" (Memory of the People), where it is written as \"Kondratyevo\". CORRECTED 12 August 2026: the village is called Kondratovskaya and stands 300–400 m from Fatyanovskaya. Probable place of residence of L007. Historical affiliation refined on 12 August 2026 (S42): until 1924 this was Solvychegodsk uyezd (county) of VOLOGDA Governorate, so the revisions (poll-tax censuses) and parish registers are held in GAVO (State Archive of Vologda Region), not in the Arkhangelsk archives. THE HISTORICAL FRAME HAS BEEN CORRECTED, 15 August 2026 (S61): \"Solvychegodsk uyezd\" holds true only for the 19th century. Under Ivan IV's charter of 1552 the Toyma lands became part of the PODVINSKY STAN (DISTRICT) OF VAZHSKY UYEZD, and in the 17th century of the Podvinskaya chet (quarter) of Vazhsky uyezd; in 1615 Vazhsky uyezd was placed under the Moscow PRIKAZ (CHANCELLERY) OF THE GREAT PALACE, and the peasants here were PALACE peasants, and appanage peasants from 1797. It became Solvychegodsk uyezd only in 1784. Practical conclusion: the 17th-century cadastral and census books to look at are the VAZHSKY ones, not the Solvychegodsk ones, and separately the fond of the Prikaz of the Great Palace. Verified independently against the description of Vazhsky uyezd and the history of Verkhnyaya Toyma."}, {"id": "P31", "n": "Афанасьевский сельсовет", "h": "Афанасьевская волость Сольвычегодского уезда Вологодской губернии (1784–1924); в XVIII в. «Афанасьевская боярщина»; в XVII в. Средняя треть Подвинской четверти Важского уезда", "r": "Верхнетоемский район, Архангельская область", "c": "Россия", "t": "сельсовет", "la": 62.34189, "lo": 44.17883, "z": "Административная рамка родового гнезда. СОСТАВ: по переписи 1939 в сельсовет входили 17 селений — Автомоновская, Алексеевская, Бараниха, Верхоиковская, Власьевская (конец), Власьевская Горка, Вознесенское (село), Кондратовская, Копытовская и другие. Приход — Нововыставочный Вознесенский (с. Вознесенское). ЦЕПОЧКА ПОДЧИНЕНИЯ, от старого к новому. С 1552 года по уставной грамоте Ивана IV тоемские земли — Подвинский стан Важского уезда; в XVII–XVIII вв. это СРЕДНЯЯ ТРЕТЬ ПОДВИНСКОЙ ЧЕТВЕРТИ Важского уезда, так волость и названа в описях (РГАДА ф. 350 оп. 1 д. 46, 1716 г., и д. 51, итоги переписи 1678 г.; S63). С 1615 года уезд в ведении московского Приказа Большого дворца, крестьяне здесь ДВОРЦОВЫЕ, с 1797 года удельные — то есть принадлежали царской семье, до 1861. «Афанасьевская боярщина» — единица того же важского ряда, что и Иосиповская боярщина в делах Приказа Большого дворца (оп. 2 д. 469, 1744 г.). С 1784 года — Афанасьевская волость СОЛЬВЫЧЕГОДСКОГО уезда ВОЛОГОДСКОЙ губернии, и так до 1924 года. С 1924 года — Верхнетоемский район Архангельской области. ГДЕ ЧТО ЛЕЖИТ. Метрики: ГААО ф. 29 оп. 23 д. 241 и оп. 28 т. 2 д. 670. Ревизские сказки «Афанасьевской боярщины»: ГААО ф. 1015 оп. 4. Ревизии и метрики XIX века — в ГАВО (Вологда), ф. 388 и ф. 496, а не в архангельских архивах: губерния тогда была Вологодская. Похозяйственные книги: архив Верхнетоемского округа, ф. 48. Важские переписные книги XVII–XVIII вв. — РГАДА ф. 350, все восемь шифров собраны в Q158. ЛОВУШКА-ОМОНИМ: вторая Афанасьевская волость есть в Шенкурском уезде — не путать. Она же может стоять за «Афонасьевской боярщиной» в списках воронежских переселенцев 1740-х, см. Q161.", "ne": "Afanasyevsky village soviet", "he": "Afanasyevskaya volost (rural district), Solvychegodsk uyezd (county), Vologda governorate (1784-1924); in the 18th century the \"Afanasyevskaya boyarshchina\"; in the 17th century the Middle Third of the Podvinye chetvert (quarter) of Vaga uyezd", "re": "Verkhnetoyemsky District, Arkhangelsk Region", "ce": "Russia", "ze": "The administrative frame of the ancestral nest. COMPOSITION: by the 1939 census the village soviet contained 17 settlements - Avtomonovskaya, Alekseyevskaya, Baranikha, Verkhoikovskaya, Vlasyevskaya (the far end), Vlasyevskaya Gorka, Voznesenskoye (a selo), Kondratovskaya, Kopytovskaya and others. The parish was Novovystavochny Voznesensky (the selo of Voznesenskoye). THE CHAIN OF JURISDICTION, from oldest to newest. From 1552, under the charter of Ivan IV, the Toyma lands formed the Podvinye stan of Vaga uyezd (county); in the 17th and 18th centuries this was the MIDDLE THIRD OF THE PODVINYE CHETVERT (quarter) of Vaga uyezd, and that is how the volost is named in the inventories (RGADA (Russian State Archive of Ancient Acts), f. 350, op. 1, d. 46, 1716, and d. 51, the results of the 1678 census; S63). From 1615 the uyezd came under the Moscow Prikaz of the Great Palace, and the peasants here were PALACE peasants, from 1797 udel (crown) peasants - that is, they belonged to the imperial family, until 1861. The \"Afanasyevskaya boyarshchina\" is a unit of the same Vaga series as the Iosipovskaya boyarshchina in the files of the Prikaz of the Great Palace (op. 2, d. 469, 1744). From 1784 it was Afanasyevskaya volost of SOLVYCHEGODSK uyezd, VOLOGDA governorate, and so it remained until 1924. From 1924 it has been Verkhnetoyemsky district, Arkhangelsk Region. WHERE EVERYTHING LIES. Parish registers: GAAO (State Archive of Arkhangelsk Region), f. 29, op. 23, d. 241 and op. 28, vol. 2, d. 670. Revision tales of the \"Afanasyevskaya boyarshchina\": GAAO, f. 1015, op. 4. The nineteenth-century revisions and parish registers are in GAVO (State Archive of Vologda Oblast), f. 388 and f. 496, not in the Arkhangelsk archives: the governorate at that time was Vologda. Household registers: the archive of the Verkhnyaya Toyma district, f. 48. The Vaga census books of the 17th-18th centuries are RGADA, f. 350 - all eight references are gathered in Q158. A HOMONYM TRAP: there is a second Afanasyevskaya volost, in Shenkursk uyezd - do not confuse them. It may also be the one behind the \"Afonasyevskaya boyarshchina\" in the lists of the Voronezh settlers of the 1740s, see Q161."}, {"id": "P32", "n": "Балашиха", "h": "", "r": "Московская область", "c": "Россия", "t": "город", "la": 55.7963, "lo": 37.9384, "z": "Место рождения L089 (2014). Железнодорожный (P18) в 2014 был ещё отдельным городом и вошёл в состав Балашихи только в 2015 — поэтому это два разных места, а не одно", "ne": "Balashikha", "re": "Moscow Region", "ce": "Russia", "ze": "L089's birthplace (2014). In 2014 Zheleznodorozhny (P18) was still a town of its own and became part of Balashikha only in 2015 — so these are two different places, not one"}, {"id": "P33", "n": "Горличевская", "h": "д. Горличевская, Кицкое общество Кицко-Воскресенской волости Шенкурского уезда Архангельской губ.", "r": "Кицкий с/с, Березниковский (ныне Виноградовский) район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.5717, "lo": 42.9336, "z": "Место рождения и жительства LU002 Лухнева Власия Семёновича. ЛОВУШКА: по переписи 1939 в Березниковском (Виноградовском) районе ОДНОВРЕМЕННО существовали ДВЕ деревни, различающиеся одной буквой — Горличевская (Кицкий с/с, ныне Верхняя Кица, 62.5717/42.9336) и Горлишевская (Селецкий с/с, ныне Горлышевская, 62.50198/43.73522, 65 км к юго-востоку от Березника). Путаница древняя: в «Списке населённых мест Архангельской губернии» 1859/1861 запись так и называется — «Горличевская или Горлишевская». Книга памяти пишет у Власия «дер. Горличевская», что буквально указывает на Верхнюю Кицу, и координаты поставлены по ней; но в Горлишевской документально сидят ещё два Лухнёва (Фёдор Степанович 1918, Яков Васильевич 1917), поэтому уверенность НИЗКАЯ и вопрос открыт, см. Q91. Прежние координаты (62.87/42.71) были поставлены по Березнику — это райцентр, а не деревня, и ни одной из двух не соответствуют. АДМИНИСТРАТИВНАЯ РАМКА: до 1929 года обе деревни — Шенкурский уезд Архангельской губернии, Кицкий сельсовет вошёл в Березниковский район только тогда. От Верхнетоемья это не отделяет: в XVII–XVIII вв. Селецкая волость (Горлишевская, Сельцо P80) — та же ПОДВИНСКАЯ четверть Важского уезда, что и Верхотоемская, а Кицкая слободка (Горличевская) — соседняя Шенкурская четверть того же уезда (РГАДА ф. 350 оп. 1 дд. 46 и 51; S63).", "ne": "Gorlichevskaya", "he": "the village of Gorlichevskaya, Kitskoye rural society, Kitsko-Voskresenskaya volost (rural district), Shenkursk uyezd (county), Arkhangelsk Governorate", "re": "Kitsky village soviet, Bereznikovsky (now Vinogradovsky) District, Arkhangelsk Region", "ce": "Russia", "ze": "The birthplace and residence of LU002, Vlasy Semyonovich Lukhnev. A TRAP: by the 1939 census the Berezniki (Vinogradovsky) district contained TWO villages AT THE SAME TIME differing by a single letter - Gorlichevskaya (Kitsky village soviet, now Verkhnyaya Kitsa, 62.5717/42.9336) and Gorlishevskaya (Seletsky village soviet, now Gorlyshevskaya, 62.50198/43.73522, 65 km south-east of Bereznik). The confusion is an old one: in the \"List of Populated Places of Arkhangelsk Governorate\" for 1859/1861 the entry is called exactly that - \"Gorlichevskaya or Gorlishevskaya\". The Book of Remembrance gives Vlasy's as \"the village of Gorlichevskaya\", which points literally to Verkhnyaya Kitsa, and the coordinates have been set by it; but two more Lukhnevs are documented in Gorlishevskaya (Fyodor Stepanovich, 1918, and Yakov Vasilyevich, 1917), so the confidence is LOW and the question remains open, see Q91. The former coordinates (62.87/42.71) had been set by Bereznik - that is the district centre, not a village, and corresponds to neither of the two. THE ADMINISTRATIVE FRAME: until 1929 both villages were in Shenkursk uyezd (county) of Arkhangelsk governorate; the Kitsky village soviet only entered Berezniki district then. That does not separate them from the Verkhnyaya Toyma country: in the 17th and 18th centuries Seletskaya volost (Gorlishevskaya, Seltso P80) belonged to the same PODVINYE chetvert (quarter) of Vaga uyezd as Verkhnyaya Toyma, while Kitskaya slobodka (Gorlichevskaya) belonged to the neighbouring Shenkursk chetvert of the same uyezd (RGADA (Russian State Archive of Ancient Acts), f. 350, op. 1, dd. 46 and 51; S63)."}, {"id": "P34", "n": "Шенкурск", "h": "", "r": "Архангельская область", "c": "Россия", "t": "город", "la": 62.1064, "lo": 42.8994, "z": "Место рождения LU001 Якова Павловича Лухнёва по базе С. В. Волкова (S23). ШЕНКУРСК И ВЕРХНЕТОЕМЬЕ — НЕ РАЗНЫЕ РОДА И НЕ РАЗНЫЕ ЗЕМЛИ. До 1784 года это один Важский уезд, а Кургоминская волость Шенкурского уезда (P79), откуда все известные шенкурские Лухнёвы, и Верхотоемская волость с родовым гнездом стоят в одной ПОДВИНСКОЙ четверти этого уезда, только в разных её третях — Нижней и Средней (РГАДА ф. 350 оп. 1 д. 46, 1716 г.; S63). Граница между Архангельской и Вологодской губерниями появилась в конце XVIII века и наложена на более раннюю общность, поэтому разводить по ней фамилию на два рода нельзя. Родство Якова Павловича с родом при этом не доказано и в дереве не проставлено, см. Q81 и Q88.", "ne": "Shenkursk", "re": "Arkhangelsk Region", "ce": "Russia", "ze": "The birthplace of LU001, Yakov Pavlovich Lukhnev, according to S. V. Volkov's database (S23). SHENKURSK AND THE VERKHNYAYA TOYMA COUNTRY ARE NEITHER DIFFERENT FAMILIES NOR DIFFERENT LANDS. Until 1784 this was one and the same Vaga uyezd (county), and Kurgomen volost (rural district) of Shenkursk uyezd (P79), where all the known Shenkursk Lukhnevs come from, and Verkhnyaya Toyma volost with the ancestral nest both stand in the same PODVINYE chetvert (quarter) of that uyezd, merely in different thirds of it - the Lower and the Middle (RGADA (Russian State Archive of Ancient Acts), f. 350, op. 1, d. 46, 1716; S63). The border between Arkhangelsk and Vologda governorates appeared at the end of the eighteenth century and was laid over an earlier common ground, so the surname cannot be split into two families along it. Yakov Pavlovich's kinship with the family is not proved and has not been entered in the tree, see Q81 and Q88."}, {"id": "P35", "n": "Херсон", "h": "", "r": "Херсонская область", "c": "Украина", "t": "город", "la": 46.6354, "lo": 32.6169, "z": "Место расстрела LU001 Якова Павловича Лухнёва 4 декабря 1920", "ne": "Kherson", "re": "Kherson Region", "ce": "Ukraine", "ze": "The place where LU001, Yakov Pavlovich Lukhnev, was shot on 4 December 1920"}, {"id": "P36", "n": "Мальмё", "h": "Malmö", "r": "Сконе", "c": "Швеция", "t": "город", "la": 55.605, "lo": 13.0038, "z": "Место смерти и погребения D008 Семёна Леонидовича Данилова (Simon Daniloff). Там же в приходе Malmö Sankt Petri в 1946 родился его сын Jan Ragnar Leonid. Ветвь оказалась не только английской, но и шведской", "ne": "Malmö", "he": "Malmö", "re": "Skåne", "ce": "Sweden", "ze": "Place of death and burial of D008, Semyon Leonidovich Danilov (Simon Daniloff). His son Jan Ragnar Leonid was born in the same parish, Malmö Sankt Petri, in 1946. The branch turns out to be not only English but Swedish as well"}, {"id": "P37", "n": "Волковыск", "h": "Волковыск, Белостокская обл. БССР (1941)", "r": "", "c": "Беларусь", "t": "город", "la": 53.1614, "lo": 24.4497, "z": "", "ne": "Vawkavysk", "he": "Volkovysk, Belostok Region, Byelorussian SSR (1941)", "ce": "Belarus"}, {"id": "P38", "n": "Першинская", "h": "д. Першинская", "r": "Афанасьевский с/с, Верхнетоемский район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.3488321, "lo": 44.1306329, "z": "Историческая принадлежность уточнена 12.08.2026 (S42): до 1924 года это Сольвычегодский уезд ВОЛОГОДСКОЙ губернии, поэтому ревизии и метрики лежат в ГАВО (Вологда), а не в архангельских архивах. ИСТОРИЧЕСКАЯ РАМКА ИСПРАВЛЕНА 15.08.2026 (S61): «Сольвычегодский уезд» верен только для XIX века. По уставной грамоте Ивана IV 1552 года тоемские земли вошли в ПОДВИНСКИЙ СТАН ВАЖСКОГО УЕЗДА, а в XVII веке — в Подвинскую четь Важского уезда; в 1615 году Важский уезд передан в ведение московского ПРИКАЗА БОЛЬШОГО ДВОРЦА, и крестьяне тут были ДВОРЦОВЫЕ, с 1797 года удельные. Сольвычегодским уездом это стало только в 1784-м. Практический вывод: писцовые и переписные книги XVII века надо смотреть ВАЖСКИЕ, а не сольвычегодские, и отдельно фонд Приказа Большого дворца. Проверено независимо по описанию Важского уезда и истории Верхней Тоймы.", "ne": "Pershinskaya", "he": "the village of Pershinskaya", "re": "Afanasyevsky village soviet, Verkhnetoyemsky District, Arkhangelsk Region", "ce": "Russia", "ze": "Historical affiliation refined on 12 August 2026 (S42): until 1924 this was Solvychegodsk uyezd (county) of VOLOGDA Governorate, so the revisions (poll-tax censuses) and parish registers are held in GAVO (State Archive of Vologda Region), not in the Arkhangelsk archives. THE HISTORICAL FRAME HAS BEEN CORRECTED, 15 August 2026 (S61): \"Solvychegodsk uyezd\" holds true only for the 19th century. Under Ivan IV's charter of 1552 the Toyma lands became part of the PODVINSKY STAN (DISTRICT) OF VAZHSKY UYEZD, and in the 17th century of the Podvinskaya chet (quarter) of Vazhsky uyezd; in 1615 Vazhsky uyezd was placed under the Moscow PRIKAZ (CHANCELLERY) OF THE GREAT PALACE, and the peasants here were PALACE peasants, and appanage peasants from 1797. It became Solvychegodsk uyezd only in 1784. Practical conclusion: the 17th-century cadastral and census books to look at are the VAZHSKY ones, not the Solvychegodsk ones, and separately the fond of the Prikaz of the Great Palace. Verified independently against the description of Vazhsky uyezd and the history of Verkhnyaya Toyma."}, {"id": "P40", "n": "Джанкой", "h": "", "r": "Джанкойский район, Крым", "c": "", "t": "город", "la": 45.7119746, "lo": 34.3927394, "z": "", "ne": "Dzhankoi", "re": "Dzhankoi District, Crimea"}, {"id": "P41", "n": "Солдатово", "h": "с. Солдатово", "r": "Катон-Карагайский (ранее Больше-Нарымский) район, Восточно-Казахстанская область", "c": "Казахстан", "t": "село", "la": 49.215656, "lo": 85.074898, "z": "", "ne": "Soldatovo", "he": "the selo (large village) of Soldatovo", "re": "Katon-Karagay (formerly Bolshe-Narymsky) District, East Kazakhstan Region", "ce": "Kazakhstan"}, {"id": "P42", "n": "Сольвычегодск", "h": "", "r": "Котласский район, Архангельская область", "c": "Россия", "t": "город", "la": 61.3306, "lo": 46.92, "z": "Место жительства и смерти L005 Алексея Дмитриевича Лухнёва (ул. Ленина, 12, кв. 10). Сольвычегодским РВК он был призван в 1939 — жил там ещё до войны", "ne": "Solvychegodsk", "re": "Kotlas District, Arkhangelsk Region", "ce": "Russia", "ze": "Place of residence and death of L005, Alexey Dmitrievich Lukhnev (12 Lenin Street, flat 10). He was conscripted by the Solvychegodsk district military commissariat (RVK) in 1939 — so he was living there before the war"}, {"id": "P43", "n": "Котлас", "h": "", "r": "Архангельская область", "c": "Россия", "t": "город", "la": 61.2551, "lo": 46.6489, "z": "Место смерти L010 Тамары Николаевны Лухнёвой (1989). Районный центр, к которому относится Сольвычегодск", "ne": "Kotlas", "re": "Arkhangelsk Region", "ce": "Russia", "ze": "Place of death of L010, Tamara Nikolayevna Lukhneva (1989). The district centre to which Solvychegodsk belongs"}, {"id": "P44", "n": "Кандалакша", "h": "", "r": "Мурманская область", "c": "Россия", "t": "город", "la": 67.1553, "lo": 32.4111, "z": "Место смерти L056 Зои Владимировны Лухнёвой (2015). Северный выезд из Верхнетоемского района — та же линия Архангельск–Мурманск", "ne": "Kandalaksha", "re": "Murmansk Region", "ce": "Russia", "ze": "Place of death of L056, Zoya Vladimirovna Lukhneva (2015). The northern way out of Verkhnetoyemsky District — the same Arkhangelsk–Murmansk line"}, {"id": "P45", "n": "Чехов", "h": "", "r": "Московская область", "c": "Россия", "t": "город", "la": 55.1477, "lo": 37.477, "z": "Последний гарнизон и последнее место жительства LU013 Николая Фёдоровича Лухнёва: служил здесь, работал в в/ч 43038 до 1993 года, умер в 2006. Отсюда же надо искать его дочь Н. Н. Логунову", "ne": "Chekhov", "re": "Moscow Region", "ce": "Russia", "ze": "The last garrison and last place of residence of LU013, Nikolai Fyodorovich Lukhnev: he served here, worked at military unit 43038 until 1993 and died in 2006. This is also where the search for his daughter N. N. Logunova has to start"}, {"id": "P46", "n": "Одесса", "h": "", "r": "Одесская область", "c": "Украина", "t": "город", "la": 46.4825, "lo": 30.7233, "z": "После Победы сюда направлен LU013 Николай Фёдорович Лухнёв — разминировал ставку Г. К. Жукова, демобилизован 31.07.1946", "ne": "Odesa", "re": "Odesa Region", "ce": "Ukraine", "ze": "After the Victory, LU013, Nikolai Fyodorovich Lukhnev, was sent here — he cleared mines at G. K. Zhukov's headquarters and was demobilised on 31 July 1946"}, {"id": "P47", "n": "Умба", "h": "пос. Лесной, Терский район, Мурманская область", "r": "Терский район, Мурманская область", "c": "Россия", "t": "посёлок", "la": 66.6833, "lo": 34.35, "z": "Умбская средняя школа в пос. Лесной: LU013 Николай Фёдорович Лухнёв окончил её 14 июня 1941 года, за восемь дней до войны. Значит семья уехала из Верхнетоемского района на Кольский полуостров ещё до войны", "ne": "Umba", "he": "the settlement of Lesnoy, Tersky District, Murmansk Region", "re": "Tersky District, Murmansk Region", "ce": "Russia", "ze": "The Umba secondary school in the settlement of Lesnoy: LU013, Nikolai Fyodorovich Lukhnev, finished it on 14 June 1941, eight days before the war. So the family had left Verkhnetoyemsky District for the Kola Peninsula before the war"}, {"id": "P48", "n": "Ростов-на-Дону", "h": "", "r": "Ростовская область", "c": "Россия", "t": "город", "la": 47.2357, "lo": 39.7015, "z": "Место рождения D010 Раисы Леонидовны Даниловой (1904) по профилю Geni. Значит семья Леонида Прокофьевича Данилова в начале века жила на Дону, а не в Закарпатье", "ne": "Rostov-on-Don", "re": "Rostov Region", "ce": "Russia", "ze": "Birthplace of D010, Raisa Leonidovna Danilova (1904), according to her Geni profile. So at the beginning of the century the family of Leonid Prokofyevich Danilov was living on the Don, not in Transcarpathia"}, {"id": "P49", "n": "Иршанск", "h": "", "r": "Житомирская область", "c": "Украина", "t": "посёлок", "la": 50.6392, "lo": 28.5567, "z": "Место смерти D010 Раисы Леонидовны Ризен по профилю Geni (1986). Год смерти спорный — на семейном листе стоит «199.», см. Q123", "ne": "Irshansk", "re": "Zhytomyr Region", "ce": "Ukraine", "ze": "Place of death of D010, Raisa Leonidovna Rizen, according to her Geni profile (1986). The year of death is disputed — the family sheet has \"199.\", see Q123"}, {"id": "P50", "n": "Хямеэнлинна", "h": "Тавастгус, Великое княжество Финляндское", "r": "Канта-Хяме", "c": "Финляндия", "t": "город", "la": 60.9959, "lo": 24.4643, "z": "Лагеря интернированных Хермола и Хеннола под Тавастгусом (Хямеэнлинна), где весной–летом 1920 года содержался LU001 поручик Яков Павлович Лухнёв после падения Северной области", "ne": "Hämeenlinna", "he": "Tavastehus, Grand Duchy of Finland", "re": "Kanta-Häme", "ce": "Finland", "ze": "The Hermola and Hennola internment camps near Tavastehus (Hämeenlinna), where LU001, Lieutenant Yakov Pavlovich Lukhnev, was held in the spring and summer of 1920 after the fall of the Northern Region"}, {"id": "P51", "n": "Франция", "h": "", "r": "", "c": "Франция", "t": "страна", "la": 46.6034, "lo": 1.8883, "z": "4 сентября 1920 года LU001 Яков Павлович Лухнёв убыл во Францию из финского лагеря — и оттуда вернулся воевать в Крым, где через три месяца был расстрелян", "ne": "France", "ce": "France", "ze": "On 4 September 1920 LU001, Yakov Pavlovich Lukhnev, left the Finnish camp for France — and from there came back to fight in Crimea, where three months later he was shot"}, {"id": "P52", "n": "Германия", "h": "Германская империя / Веймарская республика", "r": "", "c": "Германия", "t": "страна", "la": 51.1657, "lo": 10.4515, "z": "Куда до революции уехал учиться Семён Леонидович Данилов (D008) — со слов Юлии Николаевны, 13.08.2026. Обратно родители его не пустили: началась война, потом революция", "ne": "Germany", "he": "German Empire / Weimar Republic", "ce": "Germany", "ze": "Where Semyon Leonidovich Danilov (D008) went to study before the revolution — as told by Yulia Nikolayevna, 13 August 2026. His parents did not let him come back: the war began, and then the revolution"}, {"id": "P53", "n": "Коряжма", "h": "", "r": "Архангельская область", "c": "Россия", "t": "город", "la": 61.3125, "lo": 47.1653, "z": "Город линии Загребельных–Костиных: там учительствовала Татьяна Алексеевна Загребельная (L037), там же в 2002 году жили её дочь Лариса Костина и внучка Юля. Отсюда же Лариса Иванова, автор страницы Алексея Дмитриевича на «Бессмертном полку»", "ne": "Koryazhma", "re": "Arkhangelsk Region", "ce": "Russia", "ze": "The town of the Zagrebelny–Kostin line: Tatiana Alexeyevna Zagrebelnaya (L037) taught there, and in 2002 her daughter Larisa Kostina and granddaughter Yulia were living there too. Larisa Ivanova, who wrote Alexey Dmitrievich's page on \"Bessmertny Polk\" (the Immortal Regiment), is from there as well"}, {"id": "P54", "n": "Красноборск", "h": "", "r": "Красноборский район, Архангельская область", "c": "Россия", "t": "село", "la": 61.5606, "lo": 45.9264, "z": "Родина Евдокии Фёдоровны Лухнёвой (L002), крестьянки — со слов Юлии Николаевны, 13.08.2026. Красноборск стоит на Северной Двине ниже Верхней Тоймы, то есть невеста была взята из соседнего уезда", "ne": "Krasnoborsk", "re": "Krasnoborsk District, Arkhangelsk Region", "ce": "Russia", "ze": "The home place of Yevdokia Fyodorovna Lukhneva (L002), a peasant woman — as told by Yulia Nikolayevna, 13 August 2026. Krasnoborsk stands on the Northern Dvina downstream from Verkhnyaya Toyma, which means the bride was taken from a neighbouring uyezd (county)"}, {"id": "P56", "n": "Темрюк", "h": "Темрюкъ, Кубанская область, Таманский отдел", "r": "Краснодарский край", "c": "Россия", "t": "город", "la": 45.2769, "lo": 37.3894, "z": "Адрес на двух дореволюционных открытках 1914 года, присланных Леониду Прокофьевичу Данилову (D002) его учениками: «г. Темрюкъ Кубанской области, Е.В.Б. Леониду Прокофьевичу Данилову». Первая известная точка жительства ветви Даниловых, и она в Кубанской области, а не на Украине", "ne": "Temryuk", "he": "Temryuk, Kuban Region, Taman otdel (Cossack district)", "re": "Krasnodar Krai", "ce": "Russia", "ze": "The address on two pre-revolutionary postcards of 1914 sent to Leonid Prokofyevich Danilov (D002) by his pupils: \"the town of Temryuk, Kuban Region, to His High Honour Leonid Prokofyevich Danilov\". The first known place of residence of the Danilov branch, and it is in Kuban Region, not in Ukraine"}, {"id": "P59", "n": "Рыбачий", "h": "полуостров Рыбачий, Мурманская обл.", "r": "Мурманская область", "c": "Россия", "t": "полуостров", "la": 69.7333, "lo": 32.5, "z": "Место гибели LU007 Лухнёва Виталия Александровича 21.05.1942, 23-й укреплённый район 14-й армии. В базе его фамилия искажена как «Лухцев» — обычным поиском не находится", "ne": "Rybachy", "he": "the Rybachy Peninsula, Murmansk Region", "re": "Murmansk Region", "ce": "Russia", "ze": "The place where LU007, Lukhnev, Vitaly Alexandrovich, was killed on 21 May 1942; 23rd Fortified District, 14th Army. In the database his surname is corrupted as \"Lukhtsev\" — an ordinary search does not find him"}, {"id": "P60", "n": "Миргород", "h": "г. Миргород, Миргородский уезд, Полтавская губерния", "r": "Полтавская область", "c": "Украина", "t": "город", "la": 49.9666, "lo": 33.6086, "z": "Леонид Прокофьевич Данилов (D002) преподавал немецкий язык в Миргородской мужской гимназии с 1913/14 учебного года минимум до конца 1916 — Памятные книжки Полтавской губернии на 1914, 1915 и 1916 годы (S56). Гимназия открыта 15.08.1910 взамен частной гимназии К. С. Шварсалона, семь основных классов и приготовительный", "ne": "Myrhorod", "he": "the town of Myrhorod, Myrhorod uyezd (county), Poltava Governorate", "re": "Poltava Region", "ce": "Ukraine", "ze": "Leonid Prokofyevich Danilov (D002) taught German at the Myrhorod boys' gymnasium from the 1913/14 school year until at least the end of 1916 — the Memorandum Books of Poltava Governorate for 1914, 1915 and 1916 (S56). The gymnasium opened on 15 August 1910 in place of K. S. Shvarsalon's private gymnasium, with seven main forms and a preparatory one"}, {"id": "P61", "n": "Нижнечирская", "h": "ст. Нижне-Чирская, область Войска Донского", "r": "Волгоградская область", "c": "Россия", "t": "станица", "la": 48.3564, "lo": 43.0906, "z": "В 1907 году Леонид Прокофьевич Данилов (D002) — исполняющий обязанности преподавателя немецкого языка Нижне-Чирского реального училища; «Циркуляр по Харьковскому учебному округу» за 1908, Высочайшее повеление 22.12.1907 (S56)", "ne": "Nizhnechirskaya", "he": "the stanitsa (Cossack village) of Nizhne-Chirskaya, Don Cossack Host Region", "re": "Volgograd Region", "ce": "Russia", "ze": "In 1907 Leonid Prokofyevich Danilov (D002) was acting teacher of German at the Nizhne-Chirskaya modern school (realnoye uchilishche); the \"Circular of the Kharkiv Educational District\" for 1908, Imperial command of 22 December 1907 (S56)"}, {"id": "P62", "n": "Калининская область (ныне Тверская)", "h": "Калининская область", "r": "Тверская область", "c": "Россия", "t": "область", "la": 56.8587, "lo": 35.9176, "z": "Адрес родных Поливекта Сарафанова (S001) в списке бывших военнопленных 1945 года: район и деревню разобрать не удалось даже при увеличении, поэтому точка стоит на областном центре (Тверь), а не на самой деревне", "ne": "Kalinin Region (now Tver Region)", "he": "Kalinin Region", "re": "Tver Region", "ce": "Russia", "ze": "The address of Polivekt Sarafanov's (S001) relatives in the 1945 list of former prisoners of war: the district and the village could not be made out even under magnification, so the point is placed on the regional centre (Tver) rather than on the village itself"}, {"id": "P63", "n": "Смоленск", "h": "", "r": "Смоленская область", "c": "Россия", "t": "город", "la": 54.7818, "lo": 32.0401, "z": "Со слов мамы (L021), 15.08.2026, из письма 2003 года: там жила дочь Валентины Павловны Ивановой (L067) с мужем", "ne": "Smolensk", "re": "Smolensk Region", "ce": "Russia", "ze": "As told by Mum (L021), 15 August 2026, from a letter of 2003: the daughter of Valentina Pavlovna Ivanova (L067) lived there with her husband"}, {"id": "P64", "n": "Чернигов", "h": "Чернигов, Украина", "r": "Черниговская область", "c": "Украина", "t": "город", "la": 51.4982, "lo": 31.2893, "z": "Со слов мамы (L021), 15.08.2026, из письма 2003 года: там в 2003 жил с детьми Юрий Фёдорович Дружинин (DR002)", "ne": "Chernihiv", "he": "Chernihiv, Ukraine", "re": "Chernihiv Region", "ce": "Ukraine", "ze": "As told by Mum (L021), 15 August 2026, from a letter of 2003: in 2003 Yury Fyodorovich Druzhinin (DR002) was living there with his children"}, {"id": "P65", "n": "Саутгемптон", "h": "", "r": "Хэмпшир", "c": "Великобритания", "t": "город", "la": 50.9097, "lo": -1.4044, "z": "Университетский город: по письму 2003 года там преподавала Эбигейл Вуд (D017) и работали Джеймс (D018) с Мэл (D019)", "ne": "Southampton", "re": "Hampshire", "ce": "United Kingdom", "ze": "A university town: according to the letter of 2003, Abigail Wood (D017) taught there, and James (D018) and Mel (D019) worked there"}, {"id": "P66", "n": "Кембридж", "h": "", "r": "Кембриджшир", "c": "Великобритания", "t": "город", "la": 52.2053, "lo": 0.1218, "z": "Университет, который по письму 2003 года окончила Эбигейл Вуд (D017)", "ne": "Cambridge", "re": "Cambridgeshire", "ce": "United Kingdom", "ze": "The university from which, according to the letter of 2003, Abigail Wood (D017) graduated"}, {"id": "P67", "n": "Керчь", "h": "", "r": "Крым", "c": "", "t": "город", "la": 45.3531, "lo": 36.4715, "z": "Керченская детская трудовая колония имени Томского, где Антонина Леонидовна (L009) работала воспитательницей 06.03.1928–08.01.1929 (S59)", "ne": "Kerch", "re": "Crimea", "ze": "The Kerch children's labour colony named after Tomsky, where Antonina Leonidovna (L009) worked as a carer from 6 March 1928 to 8 January 1929 (S59)"}, {"id": "P68", "n": "Таманская", "h": "", "r": "Темрюкский район, Краснодарский край", "c": "Россия", "t": "станица", "la": 45.2117, "lo": 36.7175, "z": "Детский дом имени павших таманцев: Антонина Леонидовна (L009) работала там воспитательницей 16.10.1925–25.10.1926 (S59)", "ne": "Tamanskaya", "re": "Temryuk District, Krasnodar Krai", "ce": "Russia", "ze": "The children's home named after the fallen Taman men: Antonina Leonidovna (L009) worked there as a carer from 16 October 1925 to 25 October 1926 (S59)"}, {"id": "P69", "n": "Фонталовская", "h": "", "r": "Темрюкский район, Краснодарский край", "c": "Россия", "t": "станица", "la": 45.3392, "lo": 36.9214, "z": "Школа I ступени, где Антонина Леонидовна (L009) две недели ноября 1926 замещала учительницу Мартынову (S59)", "ne": "Fontalovskaya", "re": "Temryuk District, Krasnodar Krai", "ce": "Russia", "ze": "The first-stage school where Antonina Leonidovna (L009) stood in for the teacher Martynova for two weeks in November 1926 (S59)"}, {"id": "P70", "n": "Курчанская", "h": "", "r": "Темрюкский район, Краснодарский край", "c": "Россия", "t": "станица", "la": 45.2825, "lo": 37.4867, "z": "Детясли колхоза «Памяти 21»: Антонина Леонидовна (L009) была там медсестрой лето 1930 (S59)", "ne": "Kurchanskaya", "re": "Temryuk District, Krasnodar Krai", "ce": "Russia", "ze": "The crèche of the \"Pamyati 21\" (In Memory of the 21) collective farm: Antonina Leonidovna (L009) was a nurse there in the summer of 1930 (S59)"}, {"id": "P71", "n": "Понежукай", "h": "", "r": "Теучежский район, Адыгея", "c": "Россия", "t": "аул", "la": 44.7592, "lo": 39.1039, "z": "Центр Псекупского (Понежукайского) района Адыгейской автономной области: оттуда шли назначения Антонине Леонидовне (L009) в 1930–1931 (S59)", "ne": "Ponezhukay", "re": "Teuchezhsky District, Adygea", "ce": "Russia", "ze": "The centre of Psekupsky (Ponezhukaysky) District of the Adyghe Autonomous Region: this is where the appointments issued to Antonina Leonidovna (L009) in 1930–1931 came from (S59)"}, {"id": "P72", "n": "Красногвардейское", "h": "", "r": "Красногвардейский район, Адыгея", "c": "Россия", "t": "село", "la": 45.0417, "lo": 39.25, "z": "Отдел народного образования, переведший Антонину Леонидовну (L009) заведующей школой в октябре 1931 (S59)", "ne": "Krasnogvardeyskoye", "re": "Krasnogvardeysky District, Adygea", "ce": "Russia", "ze": "The department of public education that transferred Antonina Leonidovna (L009) to be head of a school in October 1931 (S59)"}, {"id": "P75", "n": "Поспелиха", "h": "", "r": "Поспелихинский район, Алтайский край", "c": "Россия", "t": "село", "la": 51.9553, "lo": 81.8261, "z": "Место рождения Лидии Сергеевны Трубниковой (L017) 16.03.1937 по свидетельству о рождении (S60). Новая для рода география — Алтай", "ne": "Pospelikha", "re": "Pospelikha District, Altai Krai", "ce": "Russia", "ze": "Birthplace of Lidia Sergeyevna Trubnikova (L017), 16 March 1937, according to her birth certificate (S60). New geography for the family — the Altai"}, {"id": "P76", "n": "Хайфа", "h": "", "r": "Хайфский округ", "c": "Израиль", "t": "город", "la": 32.794, "lo": 34.9896, "z": "Хайфский университет: там преподаёт этномузыкологию д-р Abigail Wood — кандидат на отождествление с D017 (S58). Пока кандидат не подтверждён, событий в дереве по этому месту нет, см. Q153", "ne": "Haifa", "re": "Haifa District", "ce": "Israel", "ze": "The University of Haifa: Dr Abigail Wood teaches ethnomusicology there — a candidate for identification with D017 (S58). Until the candidate is confirmed there are no events in the tree at this place, see Q153"}, {"id": "P77", "n": "Дача Лухнёвых за Иртышом", "h": "", "r": "Усть-Каменогорск, Восточно-Казахстанская область", "c": "Казахстан", "t": "дача", "la": 49.934743, "lo": 82.554787, "z": "Дачу показал Савва 15.08.2026 на карте — ПРИМЕРНО, по памяти. Сходится с описанием, которое он давал раньше: за Иртышом, «через главный мост 10 минут, налево после главной и потом первый или второй поворот направо, около горы». Названия дачного общества он не помнит — его и надо выяснить, чтобы дойти до списков садоводов", "ne": "The Lukhnevs' dacha across the Irtysh", "re": "Ust-Kamenogorsk, East Kazakhstan Region", "ce": "Kazakhstan", "ze": "Savva showed the dacha on the map on 15 August 2026 — APPROXIMATELY, from memory. It fits the description he gave earlier: across the Irtysh, \"ten minutes over the main bridge, left after the main road and then the first or second turning to the right, near the hill\". He does not remember the name of the dacha association — and that is what has to be found out in order to get to the lists of allotment holders"}, {"id": "P78", "n": "Гараж Николая Николаевича", "h": "", "r": "Усть-Каменогорск, Восточно-Казахстанская область", "c": "Казахстан", "t": "гараж", "la": 49.980313, "lo": 82.590128, "z": "Гаражный кооператив, где стоял гараж деда — точку показал Савва 15.08.2026 на карте. Название кооператива не помнит. Около километра к северо-востоку от дома на Добролюбова, 43", "ne": "Nikolai Nikolayevich's garage", "re": "Ust-Kamenogorsk, East Kazakhstan Region", "ce": "Kazakhstan", "ze": "The garage cooperative where Grandfather's garage stood — Savva showed the spot on the map on 15 August 2026. He does not remember the name of the cooperative. About a kilometre north-east of the house at 43 Dobrolyubova Street"}, {"id": "P79", "n": "Кургоминская волость", "h": "Кургоминская волость Шенкурского уезда Архангельской губ.; в XVI–XVIII вв. Кургоминская боярщина, Нижняя треть Подвинской четверти Важского уезда", "r": "Виноградовский район, Архангельская область", "c": "Россия", "t": "волость", "la": 62.642384, "lo": 43.50375, "z": "Административная рамка второго, шенкурского гнезда фамилии. Центр — д. Большая Зиновьевская (Кургомень); на 1905 восемь сельских обществ: Верхнеборецкое, Заостровское, Кургоминское, Нижнеборецкое, Селецкое, Топецкое, Троицкое, Тулгасское; 17,1 тыс. жителей на 1.01.1928. В 1929 волость вошла в Березниковский (ныне Виноградовский) район — тот же, где стоят Горличевская и Горлышевская (P33, Q91). Отсюда четверо Лухнёвых Первой мировой — LU020, LU021, LU022, LU023 (S62). ГЛАВНОЕ ДЛЯ РОДА: до 1784 года это Нижняя треть ПОДВИНСКОЙ четверти Важского уезда, а Верхотоемская волость с родовым гнездом — Средняя треть той же Подвинской четверти того же уезда (РГАДА ф. 350 оп. 1 д. 46, 1716 г.). То есть шенкурский и верхнетоемский кусты Лухнёвых сидят в одной податной единице, а не в разных губерниях. Координаты по д. Кургомень.", "ne": "Kurgomen volost", "he": "Kurgomen volost (rural district), Shenkursk uyezd (county), Arkhangelsk governorate; in the 16th–18th centuries the Kurgomen boyarshchina, Lower Third of the Podvinye chetvert (quarter) of Vaga uyezd", "re": "Vinogradovsky District, Arkhangelsk Region", "ce": "Russia", "ze": "The administrative frame of the second, Shenkursk nest of the surname. Its centre was the village of Bolshaya Zinovyevskaya (Kurgomen); in 1905 it held eight rural communities — Verkhneboretskoye, Zaostrovskoye, Kurgominskoye, Nizhneboretskoye, Seletskoye, Topetskoye, Troitskoye and Tulgasskoye — and 17,100 inhabitants as of 1 January 1928. In 1929 the volost was absorbed into Berezniki (now Vinogradovsky) district, the same one that contains Gorlichevskaya and Gorlyshevskaya (P33, Q91). Four Lukhnevs of the First World War came from here: LU020, LU021, LU022 and LU023 (S62). THE KEY POINT FOR THE FAMILY: until 1784 this was the Lower Third of the PODVINYE chetvert (quarter) of Vaga uyezd (county), while Verkhnyaya Toyma volost with the ancestral nest was the Middle Third of the same Podvinye chetvert of the same uyezd (RGADA (Russian State Archive of Ancient Acts), f. 350, op. 1, d. 46, 1716). That is, the Shenkursk and Verkhnyaya Toyma branches of the Lukhnevs sat inside one and the same tax district, not in different governorates. The coordinates are those of the village of Kurgomen."}, {"id": "P80", "n": "Сельцо", "h": "д. Сельцо, Селецкое сельское общество Кургоминской волости Шенкурского уезда", "r": "Заостровское с/п, Виноградовский район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.48539, "lo": 43.778828, "z": "Место рождения Ивана (LU022) и Василия Павловича (LU023) Лухнёвых, солдат Первой мировой из Кургоминской волости (P79). В карточках потерь одного из них место записано «Общ.-Сельцо» — это не другая деревня, а сокращение «общество Сельцо», то есть Селецкое сельское общество; поэтому оба отнесены сюда. Стоит в 5 км от д. Горлышевской (Селецкий с/с), где документально сидят ещё двое Лухнёвых, см. Q91. В XVII–XVIII вв. Селецкая волость — Подвинская четверть Важского уезда (перечневая книга итогов переписи 1678 г., РГАДА ф. 350 оп. 1 д. 51), та же четверть, что и Верхотоемская.", "ne": "Seltso", "he": "the village of Seltso, Seletskoye rural community, Kurgomen volost, Shenkursk uyezd", "re": "Zaostrovskoye rural settlement, Vinogradovsky District, Arkhangelsk Region", "ce": "Russia", "ze": "The birthplace of Ivan (LU022) and Vasily Pavlovich (LU023) Lukhnev, First World War soldiers from Kurgomen volost (rural district) (P79). On the casualty cards of one of them the place is written \"Obshch.-Seltso\" — not a different village but an abbreviation of \"the Seltso obshchestvo\", the Seltso rural community; both men are therefore placed here. It stands 5 km from the village of Gorlyshevskaya (Seletsky village soviet), where two more Lukhnevs are documented, see Q91. In the seventeenth and eighteenth centuries Seletskaya volost belonged to the Podvinye chetvert (quarter) of Vaga uyezd (county) — the summary book of the results of the 1678 census, RGADA (Russian State Archive of Ancient Acts), f. 350, op. 1, d. 51 — the same quarter as Verkhnyaya Toyma."}, {"id": "P82", "n": "Пэмпхилл (Pamphill)", "h": "Пэмпхилл, Дорсет", "r": "Дорсет", "c": "Великобритания", "t": "село", "la": 50.8075, "lo": -2.0169, "z": "Деревня под Уимборном; школа Pamphill CE First School, где в 1990-е учительствовала Дуня Вуд (S70). Рядом усадьба Кингстон-Лейси", "ne": "Pamphill", "he": "Pamphill, Dorset", "re": "Dorset", "ce": "United Kingdom", "ze": "A village near Wimborne; Pamphill CE First School, where Dunja Wood taught in the 1990s (S70). The Kingston Lacy estate is nearby"}];

function trPeriod(y,u){
  const now=u==='сейчас';
  if(y&&now)return tr('pFrom',y);
  if(y&&u)return y===u?y:y+'–'+u;
  if(y)return y;
  if(now)return tr('pNow');
  return u?tr('pUntil',u):'';
}

      gRoute=L.layerGroup().addTo(map);

const upTo=p=>p.by==null||p.by<=year;
const livedTo=s=>s.y==null||s.y<=year;
// Люди места на выбранный год: родившиеся, умершие и жившие — по одному разу
// каждый, даже если человек и родился здесь, и потом сюда вернулся.
function atPlace(id){
  const seen=new Map();
  (AT[id]||[]).filter(upTo).forEach(p=>seen.set(p.id,p));
  (LIVED[id]||[]).filter(livedTo).forEach(s=>{
    if(!seen.has(s.id))seen.set(s.id,{id:s.id,n:s.n,ne:s.ne,y:'',by:s.y})});
  return [...seen.values()];
}

function radius(n){return Math.min(26,5+Math.sqrt(n)*4.2)}

function draw(){
  gBirth.clearLayers();gMove.clearLayers();gRoute.clearLayers();
  PLACES.forEach(pl=>{
    const n=atPlace(pl.id).length;
    if(!n)return;
    L.circleMarker([pl.la,pl.lo],{radius:radius(n),color:'#fff',weight:2,
      fillColor:VAR.birth,fillOpacity:.8})
     .on('click',()=>openPlace(pl.id))
     .bindTooltip(esc(TX(pl,'n'))+' · '+tr('peopleAt',n),{direction:'top'})
     .addTo(gBirth);
  });
  MOVES.forEach(m=>{
    if(m.y!=null&&m.y>year)return;
    const a=PL[m.f],b=PL[m.t];if(!a||!b)return;
    L.polyline([[a.la,a.lo],[b.la,b.lo]],{color:VAR.move,weight:1+Math.min(4,m.n),
      opacity:.75}).addTo(gMove);
  });
  ROUTES.forEach(r=>{
    // ползунок обрезает и путь: отрезки, начавшиеся позже выбранного года,
    // ещё не случились. Шаги без года остаются — иначе старые записи,
    // где известен только порядок, пропали бы с карты совсем.
    const steps=r.pts.filter(s=>s.y==null||s.y<=year);
    const pts=steps.map(s=>PL[s.p]).filter(Boolean).map(p=>[p.la,p.lo]);
    if(pts.length<2)return;
    L.polyline(pts,{color:VAR.route,weight:2.5,opacity:.9,dashArray:'6 5'})
     .bindTooltip('<b>'+esc(TX(r,'n'))+'</b><br>'+steps.map(s=>{
        const w=trPeriod(s.y==null?'':String(s.y),s.u);
        return (w?'<span class="pr" style="display:inline">'+esc(w)+'</span> ':'')+
               esc(TX(PL[s.p],'n')||s.p);
      }).join('<br>'),{direction:'top'})
     .addTo(gRoute);
  });
  renderPlaces();
}

function openPlace(id){
  sel=id;
  const pl=PL[id],panel=document.getElementById('panel');
  const here=atPlace(id),
        born=here.filter(p=>p.bp===id),
        died=here.filter(p=>p.dp===id),
        lived=(LIVED[id]||[]).filter(livedTo);
  const link=p=>'<a href="index.html#'+encodeURIComponent(p.id)+'">'+esc(TX(p,'n'))+'</a>'+
               (p.y?' <span class="pr" style="display:inline">'+esc(p.y)+'</span>':'');
  // у жившего вместо годов жизни — годы, которые он провёл именно здесь
  const lnk=s=>'<a href="index.html#'+encodeURIComponent(s.id)+'">'+esc(TX(s,'n'))+'</a>'+
    ' <span class="pr" style="display:inline">'+
    esc([trPeriod(s.y==null?'':String(s.y),s.u),
         s.t==='жительство'?'':trEvt(s.t)].filter(Boolean).join(' · '))+'</span>';
  panel.innerHTML='<button id="close">×</button><h2>'+esc(TX(pl,'n'))+'</h2>'+
    '<div class="pid">'+esc(pl.id)+(pl.t?' · '+esc(trKind(pl.t)):'')+'</div><dl>'+
    (pl.h?'<dt>'+tr('historical')+'</dt><dd>'+esc(TX(pl,'h'))+'</dd>':'')+
    ((pl.r||pl.c)?'<dt>'+tr('region')+'</dt><dd>'+
      esc([TX(pl,'r'),TX(pl,'c')].filter(Boolean).join(', '))+'</dd>':'')+
    (born.length?'<dt>'+tr('bornHere')+'</dt><dd>'+born.map(link).join('<br>')+'</dd>':'')+
    (lived.length?'<dt>'+tr('livedHere')+'</dt><dd>'+lived.map(lnk).join('<br>')+'</dd>':'')+
    (died.length?'<dt>'+tr('diedHere')+'</dt><dd>'+died.map(link).join('<br>')+'</dd>':'')+
    (pl.z?'<dt>'+tr('note')+'</dt><dd>'+esc(TX(pl,'z'))+'</dd>':'')+'</dl>';
  panel.classList.add('on');
  panel.querySelector('#close').onclick=()=>{panel.classList.remove('on');sel=null;renderPlaces()};
  map.panTo([pl.la,pl.lo]);
  renderPlaces();
  history.replaceState(null,'','#'+encodeURIComponent(id));
}

function renderPlaces(){
  const rows=PLACES.map(pl=>({pl,n:atPlace(pl.id).length}))
                   .filter(x=>x.n)
                   .sort((a,b)=>b.n-a.n||TX(a.pl,'n').localeCompare(TX(b.pl,'n')));
  document.getElementById('plist').innerHTML=rows.map(({pl,n})=>
    '<button type="button" class="pit" data-id="'+esc(pl.id)+'"'+
    (pl.id===sel?' aria-current="true"':'')+'><span class="pc">'+n+'</span>'+
    '<span class="pn">'+esc(TX(pl,'n'))+'</span><span class="pr">'+
    esc([TX(pl,'r'),TX(pl,'c')].filter(Boolean).join(', '))+'</span></button>').join('');
  document.querySelectorAll('#plist .pit').forEach(b=>b.onclick=()=>openPlace(b.dataset.id));
}

function relabel(){
  document.documentElement.lang=LANG;
  document.title=tr('docTitle');
  document.getElementById('lang').value=LANG;
  document.getElementById('h1').innerHTML=tr('title');
  document.getElementById('sub').textContent=tr('sub',PEOPLE.length,PLACES.length);
  document.getElementById('lgLegend').textContent=tr('legend');
  document.getElementById('lgPlaces').textContent=tr('places');
  [['Birth','births'],['Move','moves'],['Route','routes']].forEach(([sfx,key])=>{
    document.getElementById('lb'+sfx).textContent=tr(key);
    document.getElementById('lg'+sfx).textContent=tr(key);
  });
  document.getElementById('treelink').textContent=tr('tree');
  const nc=document.getElementById('nocoords');
  if(nc&&SKIPPED.length)nc.textContent=tr('noCoords',SKIPPED.map(s=>TX(s,'n')).join(', '));
  yearLabel();
  if(sel)openPlace(sel); else renderPlaces();
}
function yearLabel(){
  document.getElementById('yr').textContent=year>=YMAX?tr('all'):tr('byYear',year);
}

const rng=document.getElementById('range');
rng.min=YMIN;rng.max=YMAX;rng.value=YMAX;
rng.oninput=e=>{year=+e.target.value;yearLabel();draw()};
[['births',gBirth],['moves',gMove],['routes',gRoute]].forEach(([k,g])=>{
  const b=document.getElementById('t_'+k);
  b.setAttribute('aria-pressed',show[k]);
  b.onclick=()=>{show[k]=!show[k];b.setAttribute('aria-pressed',show[k]);
    show[k]?g.addTo(map):map.removeLayer(g)};
});
document.getElementById('lang').onchange=e=>{
  LANG=e.target.value;localStorage.setItem(LSKEY,LANG);relabel();draw()};
const hh=()=>document.documentElement.style.setProperty('--hh',
  document.querySelector('header').offsetHeight+'px');
addEventListener('resize',()=>{hh();map.invalidateSize()});
hh();

relabel();
draw();
if(PLACES.length){
  // отступы несимметричные: слева легенда, справа карточка места —
  // иначе крайние точки уезжают под панели
  const b=L.latLngBounds(PLACES.map(p=>[p.la,p.lo]));
  const wide=innerWidth>820;
  map.fitBounds(b,{paddingTopLeft:[wide?300:20,30],
                   paddingBottomRight:[wide?330:20,30],maxZoom:6});
}
const want=decodeURIComponent(location.hash.replace(/^#/,''));
if(want&&PL[want])openPlace(want);

</script></body></html>
