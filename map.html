  if(labelL){map.removeLayer(labelL);labelL=null}
  map.setMaxZoom(b.max);
  tileL=L.tileLayer(b.u,{attribution:b.a,maxZoom:b.max}).addTo(map);
  if(b.ref)labelL=L.tileLayer(b.ref,{pane:'labels',maxZoom:b.max}).addTo(map);
  if(map.getZoom()>b.max)map.setZoom(b.max);
  document.querySelectorAll('.bmi').forEach(el=>
    el.setAttribute('aria-checked',String(el.dataset.bm===b.k)));
  syncAddr();
}

const gBirth=L.layerGroup().addTo(map),gMove=L.layerGroup().addTo(map),
      gRoute=L.layerGroup().addTo(map),gAddr=L.layerGroup();

// Ниже этого приближения адрес показывать нечестно: ромб дома и кружок города
// сливаются в одну кляксу, и карта врёт, будто это два соседних населённых
// пункта. Слой добавляется на карту сам, когда до него дозумили.
const ZADDR=11;
const isAddr=p=>!!p.a;
const ADDRICON=L.divIcon({className:'apw',html:'<i class="apin"></i>',
                          iconSize:[12,12],iconAnchor:[6,6]});
function syncAddr(){
  const near=map.getZoom()>=ZADDR, on=show.addrs&&near;
  if(on&&!map.hasLayer(gAddr))gAddr.addTo(map);
  if(!on&&map.hasLayer(gAddr))map.removeLayer(gAddr);
  const b=$('t_addrs');
  if(b)b.classList.toggle('far',show.addrs&&!near);
}
map.on('zoomend',()=>{syncAddr();if(who)drawRoute()});

// ── отбор: время, ветка, страна, вид события ────────────────────────
// Год у записи бывает неизвестен. Он и раньше не был поводом её прятать —
// «шаги без года остаются, иначе старые записи, где известен только порядок,
// пропали бы с карты совсем», — и это правило пережило появление окна лет.
function inTime(y){
  if(y==null||y==='')return true;
  y=+y;
  return ymode==='window' ? (y>=year-WIN&&y<=year+WIN) : y<=year;
}
// Отрезок — не точка: «жил в Мальмё с 1934 по 1983» обязан попадать в окно
// 1950±10, хотя ни один его КОНЕЦ туда не попадает.
function spanIn(y,u){
  if(y==null&&!u)return true;
  const a=y==null?null:+y,
        b=u==='сейчас'?Infinity:(/^\d+$/.test(u||'')?+u:a);
  if(a==null)return inTime(u&&/^\d+$/.test(u)?+u:null);
  if(ymode!=='window')return a<=year;
  return a<=year+WIN&&(b==null?a:b)>=year-WIN;
}
const kindOK=t=>F.kinds.has(t);
const branchOK=o=>!F.branch||o.b===F.branch;
const placeOK=pl=>!F.country||pl.c===F.country;
const filterCount=()=>(F.branch?1:0)+(F.country?1:0)+(F.kinds.size<KINDS.length?1:0);

// Люди места на выбранный срок: родившиеся, умершие и жившие — по одному разу
// каждый, даже если человек и родился здесь, и потом сюда вернулся.
function atPlace(id){
  const seen=new Map();
  if(!PL[id]||!placeOK(PL[id]))return [];
  (AT[id]||[]).forEach(({p,role})=>{
    if(!branchOK(p))return;
    if(!kindOK(role==='b'?'рождение':'смерть'))return;
    if(!inTime(role==='b'?p.by:(p.dy==null?p.by:p.dy)))return;
    if(!seen.has(p.id))seen.set(p.id,p);
  });
  (LIVED[id]||[]).forEach(s=>{
    if(!branchOK(s)||!kindOK(s.t)||!spanIn(s.y,s.u))return;
    if(!seen.has(s.id))seen.set(s.id,{id:s.id,n:s.n,ne:s.ne,y:'',by:s.y});
  });
  return [...seen.values()];
}
// Шаги маршрута, прошедшие отбор по времени и виду события.
const stepsOf=r=>r.pts.filter(s=>kindOK(s.t)&&spanIn(s.y,s.u));

function radius(n){return Math.min(26,5+Math.sqrt(n)*4.2)}

// ── расстояние пути ──────────────────────────────────────────────────
// Считается здесь, а не в питоне: координаты уже в браузере, а результат
// зависит от того, какие шаги прошли фильтр, — в сборке этого знать нельзя.
function km(a,b){
  const R=6371,d=x=>x*Math.PI/180;
  const dla=d(b.la-a.la),dlo=d(b.lo-a.lo);
  const h=Math.sin(dla/2)**2+Math.cos(d(a.la))*Math.cos(d(b.la))*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}

// ── рисование ────────────────────────────────────────────────────────
function draw(){
  gBirth.clearLayers();gMove.clearLayers();gAddr.clearLayers();
  PLACES.forEach(pl=>{
    const n=atPlace(pl.id).length;
    if(!n)return;
    // адрес — марка постоянного размера: числом людей дом не растёт,
    // а кружок в 26 пикселей накрыл бы весь квартал
    if(isAddr(pl)){
      L.marker([pl.la,pl.lo],{icon:ADDRICON,keyboard:false})
       .on('click',()=>openPlace(pl.id))
       .bindTooltip(esc(TX(pl,'n'))+' · '+tr('peopleAt',n),{direction:'top'})
       .addTo(gAddr);
      return;
    }
    L.circleMarker([pl.la,pl.lo],{radius:radius(n),color:'#fff',weight:2,
      fillColor:C.birth,fillOpacity:.8})
     .on('click',()=>openPlace(pl.id))
     .bindTooltip(esc(TX(pl,'n'))+' · '+tr('peopleAt',n),{direction:'top'})
     .addTo(gBirth);
  });
  MOVES.forEach(m=>{
    if(!inTime(m.y))return;
    const a=PL[m.f],b=PL[m.t];if(!a||!b)return;
    if(!placeOK(a)&&!placeOK(b))return;
    if(F.branch&&m.b!==F.branch)return;
    L.polyline([[a.la,a.lo],[b.la,b.lo]],{color:C.move,weight:1+Math.min(4,m.n),
      opacity:.75}).addTo(gMove);
  });
  drawRoute();
  renderPlaces();
  renderHist();
}

function drawRoute(){
  gRoute.clearLayers();
  // Выбран человек — на карте только он. Прятать остальных, а не гасить:
  // тридцать бледных линий поверх одной яркой — это по-прежнему тридцать линий.
  const list=who?(RT[who]?[RT[who]]:[]):ROUTES;
  list.forEach(r=>{
    if(!who&&F.branch&&r.b!==F.branch)return;
    const steps=stepsOf(r);
    const pts=steps.map(s=>PL[s.p]).filter(Boolean);
    if(pts.length<2)return;
    const ll=pts.map(p=>[p.la,p.lo]);
    // Пока человек не выбран, путей на карте тридцать один, и в полную силу
    // они закрывают собой всё остальное: карта читалась как моток ниток.
    // Поэтому общий вид — бледная подсказка «здесь кто-то ходил», а разбирать
    // конкретный путь идут через выбор человека. Белая подложка под линией
    // ставится только выбранному: на спутнике и на рельефе зелёный иначе
    // теряется в листве, а тридцать одна белая подложка — это снова моток.
    if(who)L.polyline(ll,{color:'#fff',weight:6,opacity:.85}).addTo(gRoute);
    L.polyline(ll,{color:C.route,weight:who?3:1.6,opacity:who?.95:.42,
                   dashArray:who?null:'5 6'})
     .bindTooltip('<b>'+esc(TX(r,'n'))+'</b><br>'+steps.map(s=>{
        const w=trPeriod(s.y==null?'':String(s.y),s.u);
        return (w?'<span class="pr" style="display:inline">'+esc(w)+'</span> ':'')+
               esc(TX(PL[s.p],'n')||s.p);
      }).join('<br>'),{direction:'top'})
     .on('click',()=>openPerson(r.id))
     .addTo(gRoute);
    if(!who)return;
    // Стрелки на серединах отрезков. Угол берётся в ЭКРАННЫХ координатах, а не
    // из азимута: на мелком масштабе проекция заметно кривит линию, и стрелка,
    // повёрнутая «по географии», смотрит мимо своего же отрезка. Поэтому слой
    // перерисовывается на zoomend.
    for(let i=0;i<pts.length-1;i++){
      const a=map.latLngToLayerPoint([pts[i].la,pts[i].lo]),
            b=map.latLngToLayerPoint([pts[i+1].la,pts[i+1].lo]);
      if(Math.hypot(b.x-a.x,b.y-a.y)<26)continue;
      const deg=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI+90;
      L.marker(map.layerPointToLatLng(L.point((a.x+b.x)/2,(a.y+b.y)/2)),{
        icon:L.divIcon({className:'arww',iconSize:[10,9],iconAnchor:[5,4.5],
          html:'<i class="arwi" style="transform:rotate('+deg.toFixed(1)+'deg)"></i>'}),
        keyboard:false,interactive:false}).addTo(gRoute);
    }
    steps.forEach((s,i)=>{
      const p=PL[s.p];if(!p)return;
      const cls=s.t==='рождение'?' b':(s.t==='смерть'?' d':'');
      L.marker([p.la,p.lo],{icon:L.divIcon({className:'stpw',iconSize:[19,19],
          iconAnchor:[9.5,9.5],
          html:'<i class="stpi'+cls+'"><span>'+(i+1)+'</span></i>'}),
        zIndexOffset:400})
       .on('click',()=>openPlace(s.p))
       .bindTooltip((i+1)+'. '+esc(TX(p,'n'))+
         (trPeriod(s.y==null?'':String(s.y),s.u)?' · '+esc(trPeriod(s.y==null?'':String(s.y),s.u)):'')+
         ' · '+esc(trEvt(s.t)),{direction:'top'})
       .addTo(gRoute);
    });
  });
}

// ── карточка места ───────────────────────────────────────────────────
function openPlace(id){
  if(!PL[id])return;
  sel=id;
  const pl=PL[id],panel=$('panel');
  const here=atPlace(id),
        born=here.filter(p=>p.bp===id),
        died=here.filter(p=>p.dp===id),
        lived=(LIVED[id]||[]).filter(s=>branchOK(s)&&kindOK(s.t)&&spanIn(s.y,s.u));
  // «путь на карте» стоит у каждого, чей маршрут вообще существует: из карточки
  // места это самый короткий путь к рассказу про человека
  const way=i=>RT[i]?'<br><a class="wayto" href="#p='+encodeURIComponent(i)+
    '" data-who="'+esc(i)+'">'+tr('wayOn')+' →</a>':'';
  const link=p=>'<a href="index.html#'+encodeURIComponent(p.id)+'">'+esc(TX(p,'n'))+'</a>'+
               (p.y?' <span class="pr" style="display:inline">'+esc(p.y)+'</span>':'')+way(p.id);
  // у жившего вместо годов жизни — годы, которые он провёл именно здесь
  const lnk=s=>'<a href="index.html#'+encodeURIComponent(s.id)+'">'+esc(TX(s,'n'))+'</a>'+
    ' <span class="pr" style="display:inline">'+
    esc([trPeriod(s.y==null?'':String(s.y),s.u),
         s.t==='жительство'?'':trEvt(s.t)].filter(Boolean).join(' · '))+'</span>'+way(s.id);
  panel.innerHTML='<button id="close" aria-label="×">×</button><h2>'+esc(TX(pl,'n'))+'</h2>'+
    '<div class="pid">'+esc(pl.id)+(pl.t?' · '+esc(trKind(pl.t)):'')+'</div><dl>'+
    (pl.h?'<dt>'+tr('historical')+'</dt><dd>'+esc(TX(pl,'h'))+'</dd>':'')+
    ((pl.r||pl.c)?'<dt>'+tr('region')+'</dt><dd>'+
      esc([TX(pl,'r'),TX(pl,'c')].filter(Boolean).join(', '))+'</dd>':'')+
    (born.length?'<dt>'+tr('bornHere')+'</dt><dd>'+born.map(link).join('<br>')+'</dd>':'')+
    (lived.length?'<dt>'+tr('livedHere')+'</dt><dd>'+lived.map(lnk).join('<br>')+'</dd>':'')+
    (died.length?'<dt>'+tr('diedHere')+'</dt><dd>'+died.map(link).join('<br>')+'</dd>':'')+
    (pl.z?'<dt>'+tr('note')+'</dt><dd>'+esc(TX(pl,'z'))+'</dd>':'')+'</dl>';
  panel.classList.add('on');panel.classList.remove('min');
  $('close').onclick=()=>{panel.classList.remove('on');sel=null;renderPlaces();writeHash()};
  panel.querySelectorAll('[data-who]').forEach(a=>a.onclick=e=>{
    e.preventDefault();openPerson(a.dataset.who)});
  // на адрес нельзя просто перелететь: с общего вида его слой выключен,
  // и человек кликнул бы по списку в пустоту
  if(isAddr(pl)&&map.getZoom()<ZADDR)map.setView([pl.la,pl.lo],Math.min(15,map.getMaxZoom()));
  else map.panTo([pl.la,pl.lo]);
  syncAddr();
  renderPlaces();
  writeHash();
}

// ── режим «путь одного человека» ─────────────────────────────────────
function openPerson(id){
  const r=RT[id];
  if(!r){                                  // маршрута нет — показываем место
    const p=PPL[id];
    if(p&&(p.bp||p.dp))openPlace(p.bp||p.dp);
    return;
  }
  who=id;stopPlay();
  $('route').classList.add('on');
  renderRoute();
  layout();          // шапка выросла на строку пути — карта обязана это узнать
  drawRoute();
  fitRoute();
  writeHash();
}
function closePerson(){
  who=null;stopPlay();
  $('route').classList.remove('on');
  layout();drawRoute();writeHash();
}
function fitRoute(){
  const r=RT[who];if(!r)return;
  const pts=stepsOf(r).map(s=>PL[s.p]).filter(Boolean);
  if(!pts.length){fitAll();return}
  const wide=innerWidth>820;
  map.fitBounds(L.latLngBounds(pts.map(p=>[p.la,p.lo])),
    {paddingTopLeft:[wide?300:20,30],paddingBottomRight:[wide?330:20,40],
     maxZoom:Math.min(9,map.getMaxZoom()),animate:!booting});
}
function renderRoute(){
  const r=RT[who];if(!r)return;
  const steps=stepsOf(r),pts=steps.map(s=>PL[s.p]).filter(Boolean);
  $('rname').innerHTML=esc(TX(r,'n'))+(r.y?'<span class="yy">'+esc(r.y)+'</span>':'');
  $('strip').innerHTML=steps.map((s,i)=>{
    const p=PL[s.p],w=trPeriod(s.y==null?'':String(s.y),s.u);
    return '<button type="button" class="stpc" data-stop="'+esc(s.p)+'">'+
      '<span class="n">'+(i+1)+'</span>'+
      (w?'<span class="y">'+esc(w)+'</span>':'')+
      '<span>'+esc(TX(p,'n')||s.p)+'</span></button>';
  }).join('');
  $('strip').querySelectorAll('.stpc').forEach(b=>b.onclick=()=>openPlace(b.dataset.stop));
  // Отрезок из одной точки — не путь, а год и фильтр видов события могут
  // срезать его до нуля. Сказать об этом честно дешевле, чем показать
  // «0 стран · 0 км» и оставить человека гадать, сломалось или так и надо.
  if(pts.length<2){$('rstat').textContent=tr('outOfRange');return}
  let d=0;
  for(let i=0;i<pts.length-1;i++)d+=km(pts[i],pts[i+1]);
  const cs=new Set(pts.map(p=>p.c).filter(Boolean));
  $('rstat').textContent=tr('stat',tr('countries',cs.size),
    Math.round(d).toLocaleString(LANG==='ru'?'ru-RU':'en-GB'),r.y||'');
}

// ── прогон лет ───────────────────────────────────────────────────────
function stopPlay(){
  if(playing){clearInterval(playing);playing=null}
  const b=$('play');
  if(b){b.setAttribute('aria-pressed','false');b.textContent='▶ '+tr('play')}
}
function startPlay(){
  let from=YMIN,to=YMAX;
  if(who){
    const ys=stepsOf(RT[who]).map(s=>s.y).filter(y=>y!=null);
    if(ys.length){from=Math.min(...ys);to=Math.max(...ys)}
  }
  // Кому движение мешает, тот выключил его в системе — карта обязана услышать
  // и показать итог сразу, а не гонять двенадцать секунд анимации.
  if(CALM){year=to;setYear();return}
  year=from;setYear();
  const span=Math.max(1,to-from),step=Math.max(1,Math.round(span/110));
  const b=$('play');b.setAttribute('aria-pressed','true');b.textContent='❚❚ '+tr('pause');
  playing=setInterval(()=>{
    year=Math.min(to,year+step);
    setYear();
    if(year>=to)stopPlay();
  },120);
}
function setYear(){
  $('range').value=year;yearLabel();draw();
}
function yearLabel(){
  $('yr').textContent=ymode==='window'?tr('window',year)
    :(year>=YMAX?tr('all'):tr('byYear',year));
}
// Гистограмма событий по десятилетиям. Двадцать столбиков вместо подписи
// «данные с 1854 по 2026»: видно, что до 1900 года на карте почти пусто.
function renderHist(){
  const box=$('hist');if(!box)return;
  const n=22,lo=YMIN,hi=YMAX,w=Math.max(1,(hi-lo)/n),b=new Array(n).fill(0);
  const put=y=>{if(y==null||y==='')return;
    const i=Math.min(n-1,Math.max(0,Math.floor((+y-lo)/w)));b[i]++};
  PEOPLE.forEach(p=>{if(branchOK(p))put(p.by)});
  ROUTES.forEach(r=>{if(!F.branch||r.b===F.branch)r.pts.forEach(s=>{if(kindOK(s.t))put(s.y)})});
  const mx=Math.max(1,...b);
  box.innerHTML=b.map((v,i)=>{
    const y0=lo+i*w,on=ymode==='window'
      ? (y0+w>=year-WIN&&y0<=year+WIN) : y0<=year;
    return '<i class="'+(on?'on':'')+'" style="height:'+
      Math.max(1,Math.round(v/mx*13))+'px"></i>';
  }).join('');
}

// ── список мест ──────────────────────────────────────────────────────
function renderPlaces(){
  // atPlace() не из дешёвых, а вызывался он на место трижды за перерисовку:
  // в списке, в счётчике и в подписи под заголовком. Считаем один раз.
  const rows=PLACES.map(pl=>({pl,at:atPlace(pl.id)}))
                   .map(x=>({...x,n:x.at.length}))
                   .filter(x=>x.n)
                   .sort((a,b)=>b.n-a.n||TX(a.pl,'n').localeCompare(TX(b.pl,'n')));
  const item=({pl,n})=>
    '<button type="button" class="pit" data-id="'+esc(pl.id)+'"'+
    (pl.id===sel?' aria-current="true"':'')+'><span class="pc">'+n+'</span>'+
    '<span class="pn">'+esc(TX(pl,'n'))+'</span><span class="pr">'+
    esc([TX(pl,'r'),TX(pl,'c')].filter(Boolean).join(', '))+'</span></button>';
  $('plist').innerHTML=rows.filter(x=>!isAddr(x.pl)).map(item).join('');
  // список адресов — та же карта словами: слой на общем виде выключен,
  // и без списка адрес нельзя было бы ни увидеть, ни открыть
  const addrs=rows.filter(x=>isAddr(x.pl));
  const box=$('abox');
  if(box){
    box.style.display=addrs.length?'':'none';
    $('alist').innerHTML=addrs.map(item).join('');
  }
  document.querySelectorAll('#side .pit').forEach(b=>b.onclick=()=>openPlace(b.dataset.id));
  $('sub').textContent=tr('sub',
    new Set(rows.flatMap(x=>x.at.map(p=>p.id))).size,rows.length);
}

// ── поиск: люди и места в одной строке ───────────────────────────────
// Индекс людей приходит готовым из сборки (PIDX): он собран той же
// нормализацией и включает английские написания — набравший «Lukhnev» и
// набравший «Лухнев» обязаны найти одного человека. Индекс мест считается
// здесь: он короткий и целиком лежит в PLACES.
const PLIDX={};
PLACES.forEach(p=>{PLIDX[p.id]=nrm([p.id,p.n,p.ne,p.h,p.he,p.r,p.re,p.c,p.ce]
  .filter(Boolean).join(' '))});
function searchHits(q){
  const terms=nrm(q).split(/\s+/).filter(Boolean);
  if(!terms.length)return [];
  const ok=i=>terms.every(t=>i.indexOf(t)>=0);
  const out=[];
  PLACES.forEach(p=>{if(ok(PLIDX[p.id]))out.push({kind:'place',id:p.id,
    t:TX(p,'n'),m:[TX(p,'r'),TX(p,'c')].filter(Boolean).join(', ')})});
  Object.keys(PIDX).forEach(id=>{if(ok(PIDX[id])){const p=PPL[id];if(!p)return;
    out.push({kind:'person',id,t:TX(p,'n'),
      m:[p.y,TX(p,'b'),RT[id]?tr('routes'):''].filter(Boolean).join(' · ')})}});
  // человек вперёд места: набирают чаще фамилию, а совпадений по местам больше
  out.sort((a,b)=>(a.kind===b.kind?0:(a.kind==='person'?-1:1))||a.t.localeCompare(b.t));
  return out.slice(0,40);
}
function renderSug(){
  const q=$('q').value.trim(),box=$('sug');
  if(!q){box.classList.remove('on');box.innerHTML='';return}
  const hits=searchHits(q);
  box.innerHTML=hits.length?hits.map(h=>
    '<button type="button" class="sg" data-kind="'+h.kind+'" data-id="'+esc(h.id)+'">'+
    '<span class="k">'+(h.kind==='place'?tr('sgPlace'):tr('sgPerson'))+'</span>'+
    '<span class="t">'+esc(h.t)+'</span>'+
    (h.m?'<span class="m">'+esc(h.m)+'</span>':'')+'</button>').join('')
    :'<div class="none">'+tr('nothing')+'</div>';
  box.classList.add('on');
  box.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{
    box.classList.remove('on');$('q').value='';
    if(b.dataset.kind==='place')openPlace(b.dataset.id);else openPerson(b.dataset.id);
  });
}

// ── адрес страницы ───────────────────────────────────────────────────
// Старый вид хеша — голый id места (#P02) — остаётся рабочим: он разослан
// в письмах и лежит в закладках. Новый вид узнаётся по знаку «=».
function writeHash(){
  const q=[];
  if(who)q.push('p='+encodeURIComponent(who));
  if(sel)q.push('pl='+encodeURIComponent(sel));
  if(year<YMAX||ymode==='window')q.push('y='+year+(ymode==='window'?'w':''));
  if(baseKey!=='paper')q.push('bm='+baseKey);
  const off=Object.keys(show).filter(k=>!show[k]);
  if(off.length)q.push('off='+off.join(','));
  history.replaceState(null,'',q.length?'#'+q.join('&'):location.pathname+location.search);
}
// Разбирает адрес и включает всё, что не двигает вид: год, слои, подложку.
// Открытие человека и места оставлено вызывающему — иначе подгонка под маршрут
// сталкивалась с общей подгонкой «весь свет», обе анимированные, и побеждала
// та, что успела первой. Выглядело это как «диплинк на человека не работает»,
// хотя маршрут рисовался правильно, просто поверх него оставался вид на полмира.
function readHash(){
  const raw=location.hash.replace(/^#/,'');
  if(!raw)return null;
  if(raw.indexOf('=')<0){const id=decodeURIComponent(raw);return PL[id]?{pl:id}:null}
  const q={};raw.split('&').forEach(kv=>{const i=kv.indexOf('=');
    if(i>0)q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))});
  if(q.bm)setBase(q.bm,false);
  const off=new Set((q.off||'').split(',').filter(Boolean));
  Object.keys(show).forEach(k=>setLayer(k,!off.has(k)));
  if(q.y){const m=/^(\d+)(w?)$/.exec(q.y);
    if(m){year=Math.min(YMAX,Math.max(YMIN,+m[1]));ymode=m[2]?'window':'upto';
      $('range').value=year;$('wmode').setAttribute('aria-pressed',String(ymode==='window'));
      yearLabel()}}
  draw();
  return q;
}

// ── подписи ──────────────────────────────────────────────────────────
function relabel(){
  document.documentElement.lang=LANG;
  document.title=tr('docTitle');
  $('lang').value=LANG;
  $('h1').innerHTML=tr('title');
  $('lgLegend').textContent=tr('legend');
  $('lgPlaces').textContent=tr('places');
  const ah=$('hAddr'),an=$('anote');
  if(ah)ah.textContent=tr('addrs');
  if(an)an.textContent=tr('addrHint');
  [['Birth','births'],['Move','moves'],['Route','routes'],
   ['Addr','addrs']].forEach(([sfx,key])=>{
    $('lb'+sfx).textContent=tr(key);
    $('lg'+sfx).textContent=tr(key);
  });
  ['tree','stories','photos'].forEach(k=>{const a=$(k+'link');if(a)a.textContent=tr(k)});
  const nc=$('nocoords');
  if(nc&&SKIPPED.length)nc.textContent=tr('noCoords',SKIPPED.map(s=>TX(s,'n')).join(', '));
  // поиск
  $('q').placeholder=tr('search');$('q').setAttribute('aria-label',tr('searchLab'));
  // подложки
  $('bmbtn').textContent=tr('base');$('bmbtn').setAttribute('aria-label',tr('baseLab'));
  document.querySelectorAll('.bmi').forEach(el=>{
    const k=el.dataset.bm;
    el.innerHTML=esc(tr('bases')[k])+'<span class="m">'+esc(tr('baseNotes')[k])+'</span>'});
  // фильтры
  $('fbtn').firstChild.nodeValue=tr('filters');
  $('lbBranch').textContent=tr('branch');
  $('lbCountry').textContent=tr('country');
  $('lbKinds').textContent=tr('kinds');
  $('freset').textContent=tr('reset');
  fillSelect($('fbranch'),BRANCHES,'anyBranch',F.branch);
  fillSelect($('fcountry'),COUNTRIES,'anyCountry',F.country);
  document.querySelectorAll('#fkinds .chip').forEach(b=>
    b.textContent=trKindLab(b.dataset.kind));
  // время
  $('play').textContent=(playing?'❚❚ '+tr('pause'):'▶ '+tr('play'));
  $('play').setAttribute('aria-label',tr('playLab'));
  $('wmode').textContent=tr('win');$('wmode').setAttribute('aria-label',tr('winLab'));
  $('range').setAttribute('aria-label',tr('playLab'));
  $('fitbtn').textContent=tr('fit');$('fitbtn').setAttribute('aria-label',tr('fitLab'));
  $('linkbtn').textContent=tr('link');$('linkbtn').setAttribute('aria-label',tr('linkLab'));
  $('rclose').setAttribute('aria-label',tr('closeRoute'));
  $('rlab').textContent=tr('routeOf');
  document.querySelectorAll('.fold').forEach(b=>b.setAttribute('aria-label',
    $(b.dataset.fold).classList.contains('min')?tr('unfold'):tr('fold')));
  yearLabel();
  if(who)renderRoute();
  if(sel)openPlace(sel); else renderPlaces();
}
// Значение фильтра остаётся РУССКИМ — это ключ данных; переводится только
// подпись в списке (тот же приём, что в make_html.py).
function fillSelect(el,pairs,anyKey,cur){
  el.innerHTML='<option value="">'+esc(tr(anyKey))+'</option>'+
    pairs.map(([ru,en])=>'<option value="'+esc(ru)+'"'+(ru===cur?' selected':'')+'>'+
      esc(LANG==='en'&&en?en:ru)+'</option>').join('');
}

// ── проводка ─────────────────────────────────────────────────────────
function setLayer(k,on){
  show[k]=on;
  const b=$('t_'+k),l=$('lg_'+k);
  if(b)b.setAttribute('aria-pressed',String(on));
  if(l)l.setAttribute('aria-pressed',String(on));
  const g={births:gBirth,moves:gMove,routes:gRoute,addrs:gAddr}[k];
  if(k==='addrs')syncAddr();
  else on?g.addTo(map):map.removeLayer(g);
}
function toggleLayer(k){setLayer(k,!show[k]);writeHash()}
['births','moves','routes','addrs'].forEach(k=>{
  $('t_'+k).setAttribute('aria-pressed',String(show[k]));
  $('lg_'+k).setAttribute('aria-pressed',String(show[k]));
  $('t_'+k).onclick=()=>toggleLayer(k);
  $('lg_'+k).onclick=()=>toggleLayer(k);
});
syncAddr();

const rng=$('range');
rng.min=YMIN;rng.max=YMAX;rng.value=YMAX;
rng.oninput=e=>{stopPlay();year=+e.target.value;yearLabel();draw()};
rng.onchange=writeHash;
$('play').onclick=()=>playing?stopPlay():startPlay();
$('wmode').onclick=e=>{ymode=ymode==='window'?'upto':'window';
  e.currentTarget.setAttribute('aria-pressed',String(ymode==='window'));
  yearLabel();draw();writeHash()};
$('fitbtn').onclick=()=>{who?fitRoute():fitAll()};
$('linkbtn').onclick=async e=>{
  writeHash();
  try{await navigator.clipboard.writeText(location.href);
    const b=e.currentTarget,was=b.textContent;b.textContent=tr('linkDone');
    setTimeout(()=>{b.textContent=was},1400);}catch(_){}
};

$('bmbtn').onclick=e=>{e.stopPropagation();$('bmmenu').classList.toggle('on')};
document.querySelectorAll('.bmi').forEach(el=>el.onclick=()=>{
  setBase(el.dataset.bm,true);$('bmmenu').classList.remove('on');writeHash()});

$('fbtn').onclick=e=>{const on=$('filters').classList.toggle('on');
  e.currentTarget.setAttribute('aria-pressed',String(on));layout()};
$('fbranch').onchange=e=>{F.branch=e.target.value;afterFilter()};
$('fcountry').onchange=e=>{F.country=e.target.value;afterFilter()};
$('freset').onclick=()=>{F={branch:'',country:'',kinds:new Set(KINDS)};
  $('fbranch').value='';$('fcountry').value='';
  document.querySelectorAll('#fkinds .chip').forEach(b=>b.setAttribute('aria-pressed','true'));
  afterFilter()};
document.querySelectorAll('#fkinds .chip').forEach(b=>b.onclick=()=>{
  const k=b.dataset.kind;
  F.kinds.has(k)?F.kinds.delete(k):F.kinds.add(k);
  b.setAttribute('aria-pressed',String(F.kinds.has(k)));
  afterFilter()});
function afterFilter(){
  const n=filterCount(),c=$('fcount');
  c.textContent=n?' '+n:'';c.style.display=n?'':'none';
  draw();if(who)renderRoute();
}

$('q').oninput=renderSug;
$('q').onkeydown=e=>{
  if(e.key==='Escape'){$('q').value='';$('sug').classList.remove('on')}
  if(e.key==='Enter'){const f=$('sug').querySelector('.sg');if(f){e.preventDefault();f.click()}}
};
document.addEventListener('click',e=>{
  if(!e.target.closest('#qwrap'))$('sug').classList.remove('on');
  if(!e.target.closest('#bmwrap'))$('bmmenu').classList.remove('on');
});
document.querySelectorAll('.fold').forEach(b=>b.onclick=()=>{
  const box=$(b.dataset.fold);
  const min=box.classList.toggle('min');
  b.textContent=min?'▣':'▤';
  b.setAttribute('aria-label',min?tr('unfold'):tr('fold'));
});
$('rclose').onclick=closePerson;

$('lang').onchange=e=>{
  LANG=e.target.value;localStorage.setItem(LSKEY,LANG);relabel();draw()};
const hh=()=>document.documentElement.style.setProperty('--hh',
  document.querySelector('header').offsetHeight+'px');
// Высота шапки — не украшение: от неё считается верх #map. Меняется она в трёх
// местах (фильтры, строка пути, поворот телефона), и всюду за ней обязан идти
// invalidateSize, иначе Leaflet продолжает считать карту прежнего размера и
// fitBounds промахивается ровно на выросшую строку.
const layout=()=>{hh();map.invalidateSize({animate:false})};
addEventListener('resize',layout);
addEventListener('hashchange',()=>applyState(readHash()));

function fitAll(){
  const vis=PLACES.filter(p=>placeOK(p));
  if(!vis.length)return;
  // отступы несимметричные: слева легенда, справа карточка места —
  // иначе крайние точки уезжают под панели
  const wide=innerWidth>820;
  map.fitBounds(L.latLngBounds(vis.map(p=>[p.la,p.lo])),
    {paddingTopLeft:[wide?300:20,30],paddingBottomRight:[wide?330:20,30],
     maxZoom:6,animate:!booting});
}

// Одно применение адреса на двоих: загрузка страницы и чужая ссылка,
// вставленная в уже открытую вкладку. Раньше второй случай понимал только
// старый формат «#P02», и ссылка на человека в открытой вкладке молчала.
function applyState(q){
  q=q||{};
  const w=q.p&&RT[q.p];
  if(!w&&who)closePerson();
  if(!q.pl&&sel){sel=null;$('panel').classList.remove('on')}
  if(w)openPerson(q.p);
  else fitAll();
  if(q.pl&&PL[q.pl])openPlace(q.pl);
}
setBase(baseKey,false);
relabel();
draw();
hh();
applyState(readHash());
booting=false;

</script></body></html>
