<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<title>Карта рода Лухнёвых</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
:root{--paper:#EDEDE9;--card:#FBFBF8;--ink:#1B1B1A;--soft:#6E6E68;--rail:#C0392B;
--stamp:#2C4A6E;--rule:#CFCFC8;
--birth:#2a78d6;--move:#eb6834;--route:#1baf7a;
--serif:Georgia,"PT Serif","Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:11px 16px 9px;border-bottom:1px solid var(--rule);position:relative;z-index:500;
background:var(--paper)}
h1{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
h1 em{font-style:normal;color:var(--rail)}
.sub{font-size:11px;color:var(--soft);font-family:var(--mono);margin-top:2px}
#langrow{position:absolute;top:10px;right:14px}
#lang{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--rule);
background:var(--card);color:inherit;border-radius:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.chip{padding:5px 9px;border:1px solid var(--rule);background:transparent;border-radius:2px;
font-size:12.5px;color:var(--ink);white-space:nowrap;text-decoration:none;display:inline-block}
.chip[aria-pressed=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.sep{width:1px;height:18px;background:var(--rule);margin:0 2px}
#slider{display:flex;align-items:center;gap:7px}
#yr{font-family:var(--mono);font-size:11px;color:var(--soft);min-width:74px}
input[type=range]{width:190px;accent-color:var(--stamp)}
#map{position:absolute;left:0;right:0;bottom:0;top:var(--hh,116px);background:var(--paper)}
.leaflet-container{background:var(--paper);font-family:var(--sans)}
/* легенда и список мест — они же «текстовая версия» карты */
#side{position:absolute;left:14px;bottom:14px;width:264px;max-height:calc(100% - 150px);
overflow:auto;border:1.5px solid var(--ink);background:var(--card);border-radius:2px;
z-index:600;box-shadow:0 4px 20px rgba(0,0,0,.12)}
#side h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin:0;padding:10px 12px 6px;border-bottom:1px solid var(--rule)}
.lg{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12.5px}
.sw{width:22px;height:0;flex:none;border-top:3px solid}
.sw.dot{height:11px;width:11px;border:2px solid;border-radius:50%;border-top-width:2px}
.sw.dash{border-top-style:dashed}
.pit{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px;
border-bottom:1px solid var(--rule);line-height:1.3}
.pit:hover,.pit:focus-visible{background:#fff}
.pn{font-family:var(--serif);font-size:13px}
.pc{float:right;font-family:var(--mono);font-size:10px;color:var(--soft)}
.pr{display:block;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
#panel{position:absolute;right:14px;bottom:14px;width:296px;max-height:calc(100% - 150px);
overflow:auto;border:1.5px solid var(--ink);background:var(--card);padding:14px 15px;
border-radius:2px;z-index:600;box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
#panel.on{display:block}
#panel h2{font-family:var(--serif);font-size:16px;font-weight:400;margin:0 0 2px;line-height:1.25}
#panel .pid{font-family:var(--mono);font-size:10px;color:var(--soft)}
#close{position:absolute;top:8px;right:9px;border:0;background:none;font-size:17px;color:var(--soft)}
#panel dl{margin:12px 0 0;font-size:12.5px}
#panel dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin-top:10px}
#panel dd{margin:2px 0 0;line-height:1.45}
#panel a{color:var(--stamp)}
.note{padding:8px 12px;font-size:11px;color:var(--soft);line-height:1.35}
@media (max-width:820px){#side{left:6px;right:6px;width:auto;max-height:32%}
#panel{right:6px;left:6px;width:auto;bottom:auto;top:calc(var(--hh,116px) + 8px);max-height:40%}}
</style></head><body>

, "c": "Россия", "t": "село", "la": 54.84889, "lo": 55.45, "z": "Село Султанаево Кушнаренковского р-на Башкортостана, башк./тат. «Солтанай». Заселено татарами в 1714 или 1719. Координаты уточнены по Википедии 12.08.2026 — прежние (55.12, 55.32) были угаданы по центру района. СЮДА ЖЕ СЛИТО бывшее место P26 «Султанай»: это одно и то же село, а не два (закрывает Q63)"}, {"id": "P13", "n": "Уфа", "h": "", "r": "Башкортостан", "c": "Россия", "t": "город", "la": 54.7388, "lo": 55.9721, "z": ""}, {"id": "P14", "n": "Куянково", "h": "д. Куянково", "r": "Параньгинский район, Марий Эл", "c": "Россия", "t": "село", "la": 56.768043, "lo": 49.472172, "z": "Деревня Куянково Параньгинского р-на Марий Эл, в 8 км северо-восточнее Параньги, в устье рек Лаж и Ноля. В XVIII в. входила в Параньгинскую волость. Координаты уточнены по Википедии 12.08.2026 — прежние (56.62, 49.53) были угаданы по центру района"}, {"id": "P15", "n": "Новинка", "h": "д. Новинка", "r": "Киришский район, Ленинградская область", "c": "Россия", "t": "село", "la": 59.45, "lo": 32.02, "z": "Точных координат деревни не нашёл — это приблизительный центр Киришского района"}, {"id": "P16", "n": "Калининград", "h": "", "r": "Калининградская область", "c": "Россия", "t": "город", "la": 54.7104, "lo": 20.4522, "z": ""}, {"id": "P17", "n": "Москва", "h": "", "r": "", "c": "Россия", "t": "город", "la": 55.7558, "lo": 37.6173, "z": ""}, {"id": "P18", "n": "Железнодорожный (мкр Балашихи)", "h": "г. Железнодорожный", "r": "Московская область", "c": "Россия", "t": "город", "la": 55.7444, "lo": 38.0075, "z": "До 2015 — самостоятельный город Железнодорожный, с 2015 — микрорайон в составе Балашихи. Марк (L090) род. в 2019, то есть уже в мкр Железнодорожный г. Балашиха; Алексей (L089) род. в 2014 в самой Балашихе (P32) — это разные места. Со слов Саввы, 11.08.2026"}, {"id": "P19", "n": "Дананг", "h": "", "r": "Đà Nẵng", "c": "Вьетнам", "t": "город", "la": 16.0678, "lo": 108.2208, "z": ""}, {"id": "P20", "n": "Сурабая", "h": "", "r": "Восточная Ява", "c": "Индонезия", "t": "город", "la": -7.2575, "lo": 112.7521, "z": ""}, {"id": "P21", "n": "Куала-Лумпур", "h": "", "r": "", "c": "Малайзия", "t": "город", "la": 3.139, "lo": 101.6869, "z": ""}, {"id": "P22", "n": "Тбилиси", "h": "", "r": "", "c": "Грузия", "t": "город", "la": 41.7151, "lo": 44.8271, "z": ""}, {"id": "P23", "n": "Колпино", "h": "", "r": "Санкт-Петербург", "c": "Россия", "t": "город", "la": 59.75, "lo": 30.5833, "z": "Район Санкт-Петербурга"}, {"id": "P24", "n": "Шингак-Куль", "h": "", "r": "Чишминский район, Башкортостан", "c": "Россия", "t": "село", "la": 54.3861, "lo": 55.21, "z": "Родина Руфины (KH002). Подтверждено по Википедии 11.08.2026: село Шингак-Куль (башк. Шөңгәккүл), Шингак-Кульский сельсовет Чишминского р-на, 27 км от Чишмов, есть ж/д станция. Национальный состав — татары и русские, что сходится с линией Хасановых. Савва называл «Шингаккуль» — то же место. Мои прежние координаты (54.55, 55.13) были угаданы и оказались неверны. Дополнено 12.08.2026: село основано только в 1884 при строительстве Самаро-Златоустовской ж/д (Башкирская энциклопедия) — значит предки Хасановых до 1884 жили где-то ещё, это отдельный вопрос"}, {"id": "P25", "n": "Усть-Каменогорск", "h": "", "r": "Восточно-Казахстанская область", "c": "Казахстан", "t": "город", "la": 49.9481, "lo": 82.628, "z": ""}, {"id": "P27", "n": "Чусовое", "h": "Старо-Шайтанский Завод (до 1941), Шайтанский завод, Шайтанка", "r": "Шалинский район, Свердловская область", "c": "Россия", "t": "село", "la": 57.42, "lo": 59.1, "z": "Место рождения кандидата S001 (Сарафанов Поливект Нестерович). Координаты приблизительные. 12.08.2026 разобран разнобой написаний: «с. Чусовое», «Старо-Шайтанский с/с», «с. Старо-Шайтанск», «Старо-Шейтанское», «з-д Шайтанка» в документах на S001 — это один и тот же населённый пункт. Село основано в 1709–1721, заселено СТАРООБРЯДЦАМИ из центральной России; Шайтанский железоделательный завод основан Акинфием Демидовым в 1727, с 1769 у Саввы Яковлева, закрыт в 1905. Старошайтанский сельсовет образован в 1934, имя Чусовое село получило указом от 07.03.1941. Практический вывод для поиска: метрики искать в ГАСО, и учитывать, что село старообрядческое — значит возможны раскольнические книги отдельно от приходских."}, {"id": "P28", "n": "Фатьяновская", "h": "д. Фатьяновская", "r": "Афанасьевское с/п, Верхнетоемский район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.34189, "lo": 44.17883, "z": "РОДОВОЕ ГНЕЗДО Лухнёвых, место рождения L005 по документам. Координаты уточнены по Википедии 12.08.2026 (прежние 62.23/45.03 были угаданы): 62°20′31″ с.ш., 44°10′44″ в.д., ~44 км к северо-западу от с. Верхняя Тойма, население 30 чел. (2010). ЛОВУШКА: в том же Верхнетоемском районе есть ВТОРАЯ д. Фатьяновская — Двинского с/п, 61.974334/45.596328, население 0. Наша — Афанасьевская. До 1918 это Афанасьевская волость Сольвычегодского уезда ВОЛОГОДСКОЙ губернии, а не Архангельской Историческая принадлежность уточнена 12.08.2026 (S42): до 1924 года это Сольвычегодский уезд ВОЛОГОДСКОЙ губернии, поэтому ревизии и метрики лежат в ГАВО (Вологда), а не в архангельских архивах."}, {"id": "P29", "n": "Вантяновная", "h": "д. Вантяновная", "r": "Верхнетоемский район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.23, "lo": 45.03, "z": "Оттуда Лухнёв Павел Иванович (уб. 28.07.1941), см. Q76. РАСХОЖДЕНИЕ: в списке селений Афанасьевского сельсовета (архивный фонд № 48, перепись 1939) деревни с таким названием нет, зато в донесениях ОБД встречается «д. Вантяновный Верхне-Тоемского р-на». Возможно искажение писаря или соседний сельсовет. Не удаляю, но названию верить нельзя — сверять по спискам населённых мест"}, {"id": "P30", "n": "Кондратовская", "h": "д. Кондратовская", "r": "Афанасьевский с/с, Верхнетоемский район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.33964, "lo": 44.18506, "z": "Место рождения L055 по документам «Памяти народа», где записано как «Кондратьево». ИСПРАВЛЕНО 12.08.2026: деревня называется Кондратовская и стоит в 300–400 м от Фатьяновской. Вероятное место жительства L007 Историческая принадлежность уточнена 12.08.2026 (S42): до 1924 года это Сольвычегодский уезд ВОЛОГОДСКОЙ губернии, поэтому ревизии и метрики лежат в ГАВО (Вологда), а не в архангельских архивах."}, {"id": "P31", "n": "Афанасьевский сельсовет", "h": "Афанасьевская волость (в XVIII в. «Афанасьевская бояршина»), Сольвычегодский уезд, Вологодская губерния", "r": "Верхнетоемский район, Архангельская область", "c": "Россия", "t": "сельсовет", "la": 62.34189, "lo": 44.17883, "z": "Административная рамка родового гнезда. По переписи 1939 в сельсовет входили 17 селений: Автомоновская, Алексеевская, Бараниха, Верхоиковская, Власьевская (конец), Власьевская Горка, Вознесенское (село), Кондратовская, Копытовская и другие. Приход — Нововыставочный Вознесенский (с. Вознесенское). До 1918 — Афанасьевская волость Сольвычегодского уезда Вологодской губ.; крестьяне были удельными, то есть принадлежали царской семье, до 1861. МЕТРИКИ: ГААО ф. 29 оп. 23 д. 241 и оп. 28 т. 2 д. 670. РЕВИЗСКИЕ СКАЗКИ «Афанасьевской боярщины»: ГААО ф. 1015 оп. 4. ПОХОЗЯЙСТВЕННЫЕ КНИГИ: архив Верхнетоемского округа, ф. 48. ЛОВУШКА-ОМОНИМ: вторая Афанасьевская волость есть в Шенкурском уезде — не путать Историческая принадлежность уточнена 12.08.2026 (S42): до 1924 года это Сольвычегодский уезд ВОЛОГОДСКОЙ губернии, поэтому ревизии и метрики лежат в ГАВО (Вологда), а не в архангельских архивах."}, {"id": "P32", "n": "Балашиха", "h": "", "r": "Московская область", "c": "Россия", "t": "город", "la": 55.7963, "lo": 37.9384, "z": "Место рождения L089 (2014). Железнодорожный (P18) в 2014 был ещё отдельным городом и вошёл в состав Балашихи только в 2015 — поэтому это два разных места, а не одно"}, {"id": "P33", "n": "Горличевская", "h": "д. Горличевская, Кицкое общество Кицко-Воскресенской волости Шенкурского уезда Архангельской губ.", "r": "Кицкий с/с, Березниковский (ныне Виноградовский) район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.5717, "lo": 42.9336, "z": "Место рождения и жительства LU002 Лухнева Власия Семёновича. ЛОВУШКА, установлена 12.08.2026: по переписи 1939 в Березниковском (Виноградовском) районе ОДНОВРЕМЕННО существовали ДВЕ деревни, различающиеся одной буквой — Горличевская (Кицкий с/с, ныне Верхняя Кица, 62.5717/42.9336) и Горлишевская (Селецкий с/с, ныне Горлышевская, 62.50198/43.73522, 65 км к ЮВ от Березника). Путаница древняя: в «Списке населённых мест Архангельской губернии» 1859/1861 запись так и называется — «Горличевская или Горлишевская». Книга памяти пишет у Власия «дер. Горличевская», что буквально указывает на Верхнюю Кицу, и координаты поставлены по ней; но в Горлишевской документально сидят ещё два Лухнёва (Фёдор Степанович 1918, Яков Васильевич 1917), поэтому уверенность НИЗКАЯ и вопрос открыт, см. Q91. Прежние координаты (62.87/42.71) были поставлены по Березнику — это райцентр, а не деревня, и ни одной из двух не соответствуют. И главное: деревня относилась не к Верхнетоемью, а к ШЕНКУРСКОМУ уезду (два заголовка ГААО называют это прямо), Кицкий сельсовет вошёл в Березниковский район только в 1929 г."}, {"id": "P34", "n": "Шенкурск", "h": "", "r": "Архангельская область", "c": "Россия", "t": "город", "la": 62.1064, "lo": 42.8994, "z": "Место рождения LU001 Якова Павловича Лухнёва по базе С. В. Волкова. ВАЖНО: Шенкурский уезд — это Архангельская губерния, а родовое гнездо Фатьяновская до 1918 относилось к Сольвычегодскому уезду ВОЛОГОДСКОЙ губернии. Разные губернии. Полнотекстовый поиск по каталогу ГААО даёт 4 дела с фамилией Лухнев, и все они шенкурские — то есть это, похоже, отдельный куст фамилии"}, {"id": "P35", "n": "Херсон", "h": "", "r": "Херсонская область", "c": "Украина", "t": "город", "la": 46.6354, "lo": 32.6169, "z": "Место расстрела LU001 Якова Павловича Лухнёва 4 декабря 1920"}, {"id": "P36", "n": "Мальмё", "h": "Malmö", "r": "Сконе", "c": "Швеция", "t": "город", "la": 55.605, "lo": 13.0038, "z": ", "c": "Россия", "t": "город", "la": 55.1477, "lo": 37.477, "z": "Последний гарнизон и последнее место жительства LU013 Николая Фёдоровича Лухнёва: служил здесь, работал в в/ч 43038 до 1993 года, умер в 2006. Отсюда же надо искать его дочь Н. Н. Логунову"}, {"id": "P46", "n": "Одесса", "h": "", "r": "Одесская область", "c": "Украина", "t": "город", "la": 46.4825, "lo": 30.7233, "z": "После Победы сюда направлен LU013 Николай Фёдорович Лухнёв — разминировал ставку Г. К. Жукова, демобилизован 31.07.1946"}, {"id": "P47", "n": "Умба", "h": "пос. Лесной, Терский район, Мурманская область", "r": "Терский район, Мурманская область", "c": "Россия", "t": "посёлок", "la": 66.6833, "lo": 34.35, "z": "Умбская средняя школа в пос. Лесной: LU013 Николай Фёдорович Лухнёв окончил её 14 июня 1941 года, за восемь дней до войны. Значит семья уехала из Верхнетоемского района на Кольский полуостров ещё до войны"}, {"id": "P48", "n": "Ростов-на-Дону", "h": "", "r": "Ростовская область", "c": "Россия", "t": "город", "la": 47.2357, "lo": 39.7015, "z": "Место рождения D010 Раисы Леонидовны Даниловой (1904) по профилю Geni. Значит семья Леонида Прокофьевича Данилова в начале века жила на Дону, а не в Закарпатье"}, {"id": "P49", "n": "Иршанск", "h": "", "r": "Житомирская область", "c": "Украина", "t": "посёлок", "la": 50.6392, "lo": 28.5567, "z": "Место смерти D010 Раисы Леонидовны Ризен по профилю Geni (1986). Год смерти спорный — на семейном листе стоит «199.», см. Q123"}, {"id": "P50", "n": "Хямеэнлинна", "h": "Тавастгус, Великое княжество Финляндское", "r": "Канта-Хяме", "c": "Финляндия", "t": "город", "la": 60.9959, "lo": 24.4643, "z": "Лагеря интернированных Хермола и Хеннола под Тавастгусом (Хямеэнлинна), где весной–летом 1920 года содержался LU001 поручик Яков Павлович Лухнёв после падения Северной области"}, {"id": "P51", "n": "Франция", "h": "", "r": "", "c": "Франция", "t": "страна", "la": 46.6034, "lo": 1.8883, "z": "4 сентября 1920 года LU001 Яков Павлович Лухнёв убыл во Францию из финского лагеря — и оттуда вернулся воевать в Крым, где через три месяца был расстрелян"}, {"id": "P52", "n": "Германия", "h": "Германская империя / Веймарская республика", "r": "", "c": "Германия", "t": "страна", "la": 51.1657, "lo": 10.4515, "z": "Куда до революции уехал учиться Семён Леонидович Данилов (D008) — со слов Юлии Николаевны, 13.08.2026. Обратно родители его не пустили: началась война, потом революция"}, {"id": "P53", "n": "Коряжма", "h": "", "r": "Архангельская область", "c": "Россия", "t": "город", "la": 61.3125, "lo": 47.1653, "z": "Город линии Загребельных–Костиных: там учительствовала Татьяна Алексеевна Загребельная (L037), там же в 2002 году жили её дочь Лариса Костина и внучка Юля. Отсюда же Лариса Иванова, автор страницы Алексея Дмитриевича на «Бессмертном полку»"}, {"id": "P54", "n": "Красноборск", "h": "", "r": "Красноборский район, Архангельская область", "c": "Россия", "t": "село", "la": 61.5606, "lo": 45.9264, "z": "Родина Евдокии Фёдоровны Лухнёвой (L002), крестьянки — со слов Юлии Николаевны, 13.08.2026. Красноборск стоит на Северной Двине ниже Верхней Тоймы, то есть невеста была взята из соседнего уезда"}, {"id": "P56", "n": "Темрюк", "h": "Темрюкъ, Кубанская область, Таманский отдел", "r": "Краснодарский край", "c": "Россия", "t": "город", "la": 45.2769, "lo": 37.3894, "z": "Адрес на двух дореволюционных открытках 1914 года, присланных Леониду Прокофьевичу Данилову (D002) его учениками: «г. Темрюкъ Кубанской области, Е.В.Б. Леониду Прокофьевичу Данилову». Первая известная точка жительства ветви Даниловых, и она в Кубанской области, а не на Украине"}, {"id": "P59", "n": "Рыбачий", "h": "полуостров Рыбачий, Мурманская обл.", "r": "Мурманская область", "c": "Россия", "t": "полуостров", "la": 69.7333, "lo": 32.5, "z": "Место гибели LU007 Лухнёва Виталия Александровича 21.05.1942, 23-й укреплённый район 14-й армии. В базе его фамилия искажена как «Лухцев» — обычным поиском не находится"}, {"id": "P60", "n": "Миргород", "h": "г. Миргород, // иначе Евпатория, где L004 погиб, но не родился, не попала бы на карту
PEOPLE.forEach(p=>{if(p.bp)AT[p.bp].push(p);if(p.dp&&p.dp!==p.bp)AT[p.dp].push(p)});

const I18N={
 ru:{title:'Карта рода <em>Лухнёвых</em>',docTitle:'Карта рода Лухнёвых',
  sub:(n,m)=>`${n} человек с известным местом · ${m} мест на карте`,
  births:'Люди на местах',moves:'Род → ребёнок',routes:'Путь человека',
  legend:'Слои',places:'Места',byYear:y=>`по ${y} год`,all:'все годы',
  tree:'Дерево',bornHere:'Родились здесь',diedHere:'Умерли здесь',livedHere:'Жили здесь',
  evt:{'жительство':'жил(а)','переезд':'переезд','служба':'служба','работа':'работа',
       'учёба':'учёба','эмиграция':'эмиграция','прочее':'прочее'},
  historical:'Раньше называлось',region:'Регион',note:'Примечание',
  noCoords:n=>`Без координат, на карте не показаны: ${n}`,
  peopleAt:n=>`${n} чел.`,openInTree:'Открыть в дереве',
  pFrom:y=>`с ${y}`,pUntil:y=>`по ${y}`,pNow:'сейчас'},
 en:{title:'Lukhnev Family <em>Map</em>',docTitle:'Lukhnev Family Map',
  sub:(n,m)=>`${n} people with a known place · ${m} places mapped`,
  births:'People by place',moves:'Parent → child',routes:'Life route',
  legend:'Layers',places:'Places',byYear:y=>`up to ${y}`,all:'all years',
  tree:'Tree',bornHere:'Born here',diedHere:'Died here',livedHere:'Lived here',
  evt:{'жительство':'lived','переезд':'moved','служба':'service','работа':'work',
       'учёба':'studies','эмиграция':'emigration','прочее':'other'},
  historical:'Formerly',region:'Region',note:'Note',
  noCoords:n=>`No coordinates, not shown: ${n}`,
  peopleAt:n=>`${n} people`,openInTree:'Open in tree',
  pFrom:y=>`from ${y}`,pUntil:y=>`until ${y}`,pNow:'present'},
};
const LSKEY='familytree-lang';
let LANG=localStorage.getItem(LSKEY)||((navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en');
const tr=(k,...a)=>{const v=(I18N[LANG]||I18N.ru)[k];return typeof v==='function'?v(...a):v};
const trEvt=t=>{const d=(I18N[LANG]||I18N.ru).evt;return (d&&d[t])||t};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// «2012–2021», «с 2012», «2026» — отрезок словами текущего языка
function trPeriod(y,u){
  const now=u==='сейчас';
  if(y&&now)return tr('pFrom',y);
  if(y&&u)return y===u?y:y+'–'+u;
  if(y)return y;
  if(now)return tr('pNow');
  return u?tr('pUntil',u):'';
}

const map=L.map('map',{zoomControl:true,worldCopyJump:true}).setView([52,25],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19
}).addTo(map);

let year=YMAX,show={births:true,moves:true,routes:true},sel=null;
const gBirth=L.layerGroup().addTo(map),gMove=L.layerGroup().addTo(map),
      gRoute=L.layerGroup().addTo(map);

const upTo=p=>p.by==null||p.by<=year;
const livedTo=s=>s.y==null||s.y<=year;
// Люди места на выбранный год: родившиеся, умершие и жившие — по одному разу
// каждый, даже если человек и родился здесь, и потом сюда вернулся.
function atPlace(id){
  const seen=new Map();
  (AT[id]||[]).filter(upTo).forEach(p=>seen.set(p.id,p));
  (LIVED[id]||[]).filter(livedTo).forEach(s=>{
    if(!seen.has(s.id))seen.set(s.id,{id:s.id,n:s.n,y:'',by:s.y})});
  return [...seen.values()];
}

function radius(n){return Math.min(26,5+Math.sqrt(n)*4.2)}

function draw(){
  gBirth.clearLayers();gMove.clearLayers();gRoute.clearLayers();
  PLACES.forEach(pl=>{
    const n=atPlace(pl.id).length;
    if(!n)return;
    L.circleMarker([pl.la,pl.lo],{radius:radius(n),color:'#fff',weight:2,
      fillColor:VAR.birth,fillOpacity:.8})
     .on('click',()=>openPlace(pl.id))
     .bindTooltip(esc(pl.n)+' · '+tr('peopleAt',n),{direction:'top'})
     .addTo(gBirth);
  });
  MOVES.forEach(m=>{
    if(m.y!=null&&m.y>year)return;
    const a=PL[m.f],b=PL[m.t];if(!a||!b)return;
    L.polyline([[a.la,a.lo],[b.la,b.lo]],{color:VAR.move,weight:1+Math.min(4,m.n),
      opacity:.75}).addTo(gMove);
  });
  ROUTES.forEach(r=>{
    // ползунок обрезает и путь: отрезки, начавшиеся позже выбранного года,
    // ещё не случились. Шаги без года остаются — иначе старые записи,
    // где известен только порядок, пропали бы с карты совсем.
    const steps=r.pts.filter(s=>s.y==null||s.y<=year);
    const pts=steps.map(s=>PL[s.p]).filter(Boolean).map(p=>[p.la,p.lo]);
    if(pts.length<2)return;
    L.polyline(pts,{color:VAR.route,weight:2.5,opacity:.9,dashArray:'6 5'})
     .bindTooltip('<b>'+esc(r.n)+'</b><br>'+steps.map(s=>{
        const w=trPeriod(s.y==null?'':String(s.y),s.u);
        return (w?'<span class="pr" style="display:inline">'+esc(w)+'</span> ':'')+
               esc((PL[s.p]||{}).n||s.p);
      }).join('<br>'),{direction:'top'})
     .addTo(gRoute);
  });
  renderPlaces();
}

function openPlace(id){
  sel=id;
  const pl=PL[id],panel=document.getElementById('panel');
  const here=atPlace(id),
        born=here.filter(p=>p.bp===id),
        died=here.filter(p=>p.dp===id),
        lived=(LIVED[id]||[]).filter(livedTo);
  const link=p=>'<a href="index.html#'+encodeURIComponent(p.id)+'">'+esc(p.n)+'</a>'+
               (p.y?' <span class="pr" style="display:inline">'+esc(p.y)+'</span>':'');
  // у жившего вместо годов жизни — годы, которые он провёл именно здесь
  const lnk=s=>'<a href="index.html#'+encodeURIComponent(s.id)+'">'+esc(s.n)+'</a>'+
    ' <span class="pr" style="display:inline">'+
    esc([trPeriod(s.y==null?'':String(s.y),s.u),
         s.t==='жительство'?'':trEvt(s.t)].filter(Boolean).join(' · '))+'</span>';
  panel.innerHTML='<button id="close">×</button><h2>'+esc(pl.n)+'</h2>'+
    '<div class="pid">'+esc(pl.id)+(pl.t?' · '+esc(pl.t):'')+'</div><dl>'+
    (pl.h?'<dt>'+tr('historical')+'</dt><dd>'+esc(pl.h)+'</dd>':'')+
    ((pl.r||pl.c)?'<dt>'+tr('region')+'</dt><dd>'+esc([pl.r,pl.c].filter(Boolean).join(', '))+'</dd>':'')+
    (born.length?'<dt>'+tr('bornHere')+'</dt><dd>'+born.map(link).join('<br>')+'</dd>':'')+
    (lived.length?'<dt>'+tr('livedHere')+'</dt><dd>'+lived.map(lnk).join('<br>')+'</dd>':'')+
    (died.length?'<dt>'+tr('diedHere')+'</dt><dd>'+died.map(link).join('<br>')+'</dd>':'')+
    (pl.z?'<dt>'+tr('note')+'</dt><dd>'+esc(pl.z)+'</dd>':'')+'</dl>';
  panel.classList.add('on');
  panel.querySelector('#close').onclick=()=>{panel.classList.remove('on');sel=null;renderPlaces()};
  map.panTo([pl.la,pl.lo]);
  renderPlaces();
  history.replaceState(null,'','#'+encodeURIComponent(id));
}

function renderPlaces(){
  const rows=PLACES.map(pl=>({pl,n:atPlace(pl.id).length}))
                   .filter(x=>x.n).sort((a,b)=>b.n-a.n||a.pl.n.localeCompare(b.pl.n));
  document.getElementById('plist').innerHTML=rows.map(({pl,n})=>
    '<button type="button" class="pit" data-id="'+esc(pl.id)+'"'+
    (pl.id===sel?' aria-current="true"':'')+'><span class="pc">'+n+'</span>'+
    '<span class="pn">'+esc(pl.n)+'</span><span class="pr">'+
    esc([pl.r,pl.c].filter(Boolean).join(', '))+'</span></button>').join('');
  document.querySelectorAll('#plist .pit').forEach(b=>b.onclick=()=>openPlace(b.dataset.id));
}

function relabel(){
  document.documentElement.lang=LANG;
  document.title=tr('docTitle');
  document.getElementById('lang').value=LANG;
  document.getElementById('h1').innerHTML=tr('title');
  document.getElementById('sub').textContent=tr('sub',PEOPLE.length,PLACES.length);
  document.getElementById('lgLegend').textContent=tr('legend');
  document.getElementById('lgPlaces').textContent=tr('places');
  [['Birth','births'],['Move','moves'],['Route','routes']].forEach(([sfx,key])=>{
    document.getElementById('lb'+sfx).textContent=tr(key);
    document.getElementById('lg'+sfx).textContent=tr(key);
  });
  document.getElementById('treelink').textContent=tr('tree');
  const nc=document.getElementById('nocoords');
  if(nc&&SKIPPED.length)nc.textContent=tr('noCoords',SKIPPED.join(', '));
  yearLabel();
  if(sel)openPlace(sel); else renderPlaces();
}
function yearLabel(){
  document.getElementById('yr').textContent=year>=YMAX?tr('all'):tr('byYear',year);
}

const rng=document.getElementById('range');
rng.min=YMIN;rng.max=YMAX;rng.value=YMAX;
rng.oninput=e=>{year=+e.target.value;yearLabel();draw()};
[['births',gBirth],['moves',gMove],['routes',gRoute]].forEach(([k,g])=>{
  const b=document.getElementById('t_'+k);
  b.setAttribute('aria-pressed',show[k]);
  b.onclick=()=>{show[k]=!show[k];b.setAttribute('aria-pressed',show[k]);
    show[k]?g.addTo(map):map.removeLayer(g)};
});
document.getElementById('lang').onchange=e=>{
  LANG=e.target.value;localStorage.setItem(LSKEY,LANG);relabel();draw()};
const hh=()=>document.documentElement.style.setProperty('--hh',
  document.querySelector('header').offsetHeight+'px');
addEventListener('resize',()=>{hh();map.invalidateSize()});
hh();

relabel();
draw();
if(PLACES.length){
  // отступы несимметричные: слева легенда, справа карточка места —
  // иначе крайние точки уезжают под панели
  const b=L.latLngBounds(PLACES.map(p=>[p.la,p.lo]));
  const wide=innerWidth>820;
  map.fitBounds(b,{paddingTopLeft:[wide?300:20,30],
                   paddingBottomRight:[wide?330:20,30],maxZoom:6});
}
const want=decodeURIComponent(location.hash.replace(/^#/,''));
if(want&&PL[want])openPlace(want);

</script></body></html>
