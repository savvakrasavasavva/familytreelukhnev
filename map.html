 side took him here; they flew from St Petersburg and stayed in two hotels at Abu Soma (S80). This was ten months before the family left for Vietnam."}, {"id": "P118", "n": "Данмор-Ист (Dunmore East)", "h": "", "r": "графство Уотерфорд, Мунстер", "c": "Ирландия", "t": "посёлок", "la": 52.14884, "lo": -6.994731, "z": "Рыбацкий посёлок на побережье Уотерфорда, регистрационный округ Вудстаун. Здесь 8 февраля 1912 года родилась Элси Дина Хетерингтон (D013) — по гражданской записи о рождении № 277 (S84). Её отец (H001) служил здесь священником Церкви Ирландии. МЕСТО ЗАМЕНИЛО ГРИНВИЧ: до 18.08.2026 в дереве стояло рождение в лондонском Гринвиче по индексу GRO, и это оказалось чужой записью — разбор в карточке D013", "ne": "Dunmore East", "re": "County Waterford, Munster", "ce": "Ireland", "ze": "A fishing village on the Waterford coast, in the Woodstown registration district. Here, on 8 February 1912, Elsie Deena Hetherington (D013) was born — by civil birth record no. 277 (S84). Her father (H001) served here as a Church of Ireland clergyman. THIS PLACE REPLACED GREENWICH: until 18 August 2026 the tree carried a birth in Greenwich, London, from the GRO index, and that turned out to be someone else's record — the analysis is in the card D013"}, {"id": "P119", "n": "Борнмут (Bournemouth)", "h": "", "r": "Дорсет", "c": "Великобритания", "t": "город", "la": 50.7192, "lo": -1.8808, "z": "Здесь Семён Данилов (D008) познакомился с Элси (D013) — приезжал в языковую школу подтягивать английский и сошёлся с друзьями её родителей (S85). Со слов её зятя Роя Вуда (D016), август 2026. Борнмут в тридцати километрах от Пула (P05), где Элси прожила потом всю вторую половину жизни, — то есть знакомство случилось в её краях, а не в его", "ne": "Bournemouth", "re": "Dorset", "ce": "United Kingdom", "ze": "This is where Semyon Danilov (D008) met Elsie (D013) - he came to a language school to improve his English and fell in with friends of her parents (S85). As told by her son-in-law Roy Wood (D016), August 2026. Bournemouth also confirmed in print: her parents were living in Bournemouth West (Kilnerath, Erpingham Road) from at least 1930, and her father died in the Poole district in 1936 (S93, S97)"}, {"id": "P120", "n": "Арильд (Arild)", "h": "", "r": "Хёганес, Сконе", "c": "Швеция", "t": "посёлок", "la": 56.273819, "lo": 12.57211, "z": "Приморская деревня на полуострове Куллен, куда Семён Данилов (D008) ездил писать маслом — по словам его зятя Роя (S85), он писал Арильд особенно много. Это не случайное место у моря: с 1850-х годов Арильд был шведской художественной колонией, скандинавским аналогом Скагена, — на постоялый двор «Мор Циллы» ездили писать около полусотни известных художников ради «особенно сильного летнего света на Куллаберге». Значит домашний художник, каким его показала проверка шведских аукционов (S71), писал там же, где профессионалы", "ne": "Arild", "re": "Dorset", "ce": "Sweden", "ze": "A seaside village on the Kullen peninsula where Semyon Danilov (D008) went to paint in oils — according to his son-in-law Roy (S85), he painted Arild especially often. It is not a chance spot by the sea: from the 1850s Arild was a Swedish artists' colony, the Scandinavian counterpart of Skagen — some fifty well-known painters went to the \"Mor Cilla\" inn to work, for the sake of the \"especially strong summer light on the Kullaberg\". So the domestic painter that the sweep of the Swedish auction houses showed him to be (S71) painted in the same place as the professionals"}, {"id": "P121", "n": "Чешир (Cheshire)", "h": "", "r": "Чешир", "c": "Великобритания", "t": "графство", "la": 53.2, "lo": -2.5, "z": "Графство на северо-западе Англии. Здесь 16.12.1875 родился Леонард Эдвин Ховард Генри (H001), отец Элси — то есть английская линия Henry начинается не в Ирландии, а в Англии. Точное селение неизвестно: школьный ролл Rathmines School пишет только «in Cheshire» (S86). Координаты — центр графства, не место рождения", "ne": "Cheshire", "re": "Cheshire", "ce": "United Kingdom", "ze": "A county in north-west England. Leonard Edwin Howard Henry (H001), Elsie's father, was born here on 16 December 1875 — which means the English Henry line begins in England, not in Ireland. The exact town or village is unknown: the Rathmines School roll records only \"in Cheshire\" (S86). The coordinates are the centre of the county, not the birthplace."}, {"id": "P122", "n": "Ньюпорт (Newport)", "h": "", "r": "графство Типперэри, Мунстер", "c": "Ирландия", "t": "город", "la": 52.7069, "lo": -8.4053, "z": "Городок в графстве Типперэри, приход диоцеза Кашел. Леонард Эдвин Ховард Генри (H001) был здесь настоятелем (Incumbent) с 1915 года, адрес — St. John's Rectory; с 1920-го к приходу присоединён Киллоскалли (Killoscully). Так записано в Crockford's Clerical Directory 1921 (S86)", "ne": "Newport", "re": "County Tipperary, Munster", "ce": "Ireland", "ze": "A small town in County Tipperary, a parish of the diocese of Cashel. Leonard Edwin Howard Henry (H001) was Incumbent here from 1915, at St John's Rectory; from 1920 the parish of Killoscully was joined to it. So it stands in Crockford's Clerical Directory for 1921 (S86)."}, {"id": "P123", "n": "Дублин (Dublin)", "h": "", "r": "графство Дублин, Ленстер", "c": "Ирландия", "t": "город", "la": 53.3498, "lo": -6.2603, "z": "Здесь учился Леонард Эдвин Ховард Генри (H001), отец Элси: школа Rathmines School и Trinity College Dublin, B.A. 1899, M.A. 1902 (S86). Тот же школьный ролл связывает с Дублином и его отца Джона Уильяма (H003) — правда, строка в этом месте оборвана OCR, поэтому «Dublin» у отца читается как место жительства с оговоркой", "ne": "Dublin", "re": "County Dublin, Leinster", "ce": "Ireland", "ze": "Where Leonard Edwin Howard Henry (H001), Elsie's father, was educated: Rathmines School and Trinity College Dublin, B.A. 1899, M.A. 1902 (S86). The same school roll also ties his father John William (H003) to Dublin — though the line breaks off there in the scanned text, so \"Dublin\" is read as his place of residence with that reservation."}, {"id": "P124", "n": "Миасс", "h": "", "r": "Челябинская область", "c": "Россия", "t": "город", "la": 55.0455, "lo": 60.1084, "z": "Здесь Александр Николаевич (L015) учился в геолого-разведочном техникуме Министерства цветной металлургии СССР с августа 1955 по февраль 1958. Адрес техникума по печатному объявлению — Пушкинская, 54", "ne": "Miass", "re": "Chelyabinsk oblast", "ce": "Russia", "ze": "This is where Alexander Nikolayevich (L015) studied at the geological prospecting technical school of the USSR Ministry of Non-Ferrous Metallurgy from August 1955 to February 1958. The address of the school, from the printed announcement, was 54 Pushkinskaya Street"}, {"id": "P125", "n": "Вишнёвогорск", "h": "", "r": "Каслинский район, Челябинская область", "c": "Россия", "t": "посёлок", "la": 55.9761, "lo": 60.6572, "z": "Редкометальное месторождение — тантал, ниобий, цирконий. Сюда Александр Николаевич (L015) собирался на производственную практику из Миасса: «в 200-х км от Миасса к северу… близ Каслей, знаменитого чугунолитейного завода, где отливаются художественные отливки» (S87)", "ne": "Vishnevogorsk", "re": "Kasli district, Chelyabinsk region", "ce": "Russia", "ze": "A rare-metal deposit - tantalum, niobium, zirconium. Alexander Nikolayevich (L015) was to come here from Miass for a work placement: \"200 km north of Miass... near Kasli, the famous iron foundry where the art castings are made\" (S87)"}, {"id": "P126", "n": "Таргын", "h": "", "r": "Уланский район, Восточно-Казахстанская область", "c": "Казахстан", "t": "посёлок", "la": 49.9, "lo": 82.1, "z": "Посёлок, где стояла контора геологической экспедиции: отсюда Александр Николаевич (L015) писал матери и брату с летней практики (S87). Работа была засекречена — отчёт сдан в спецчасть, само место работы тоже под грифом. Точка ПРИБЛИЗИТЕЛЬНАЯ: из письма известно только название посёлка и что до Усть-Каменогорска добирались «проскоком»", "ne": "Targyn", "re": "Ulan district, East Kazakhstan region", "ce": "Kazakhstan", "ze": "The settlement where the office of a geological expedition stood: from here Alexander Nikolayevich (L015) wrote to his mother and brother during a summer placement (S87). The work was secret - the report was handed in to the security section, and the place of work was classified too. The point is APPROXIMATE: the letter gives only the name of the settlement and the fact that they got to Ust-Kamenogorsk \"in a dash\""}, {"id": "P127", "n": "Поставы", "h": "", "r": "Витебская область", "c": "Беларусь", "t": "город", "la": 55.1167, "lo": 26.8333, "z": "Отсюда идут первые солдатские письма Николая Николаевича (L013) 1952 года — начало срочной службы", "ne": "Postavy", "re": "Vitebsk region", "ce": "Belarus", "ze": "The first soldier's letters of Nikolai Nikolayevich (L013), of 1952, come from here - the beginning of his conscript service"}, {"id": "P128", "n": "Польша", "h": "", "r": "", "c": "Польша", "t": "страна", "la": 51.9194, "lo": 19.1451, "z": "Северная группа войск: здесь Николай Николаевич (L013) дослуживал срочную и откуда писал брату в 1955 году. Полевая почта 63210 «В» — по адресу на почтовой карточке (S87). Конкретный гарнизон неизвестен, точка — центр страны", "ne": "Poland", "ce": "Poland", "ze": "The Northern Group of Forces: here Nikolai Nikolayevich (L013) served out his conscript term and from here he wrote to his brother in 1955. Field post 63210 \"V\" - from the address on a postcard (S87). The particular garrison is unknown; the point is the centre of the country"}, {"id": "P130", "n": "Камбоджа", "h": "", "r": "", "c": "Камбоджа", "t": "страна", "la": 12.5657, "lo": 104.991, "z": "Поездка семьи в апреле 2025 года: электронные визы одобрены 23 апреля сразу пятерым — Савве (L027), Руфине (KH002), Юлии Николаевне (L021), Марку (L090) и Алексею (L089) (S91). Конкретный город в переписке не назван, точка — центр страны", "ne": "Cambodia", "ce": "Cambodia", "ze": "A family trip in April 2025: electronic visas were approved on 23 April for five people at once - Savva (L027), Rufina (KH002), Yulia Nikolayevna (L021), Mark (L090) and Aleksei (L089) (S91). No particular town is named in the correspondence; the point is the centre of the country"}, {"id": "P131", "n": "Гонконг", "h": "", "r": "", "c": "Китай", "t": "город", "la": 22.3193, "lo": 114.1694, "z": "Поездка в мае 2026 года: бронь отеля Mira Moon, торт подан 24 мая — в день рождения Саввы (S91)", "ne": "Hong Kong", "ce": "China", "ze": "A trip in May 2026: a booking at the Mira Moon hotel, with a cake served on 24 May - Savva's birthday (S91)"}, {"id": "P132", "n": "Введенская начальная школа (Темрюк)", "h": "", "r": "Краснодарский край", "c": "Россия", "t": "школа", "la": 45.2769, "lo": 37.3894, "z": "Школа в Темрюке, которой Антонина Леонидовна (L009) заведовала две недели марта 1929 года — первая руководящая должность в её бумагах (S59). Точка приблизительная, по центру города: адрес школы в справке не указан", "a": 1, "ne": "Vvedenskaya Primary School (Temryuk)", "re": "Krasnodar Krai", "ce": "Russia", "ze": "A school in Temryuk which Antonina Leonidovna (L009) headed for two weeks in March 1929 - the first post of authority in her papers (S59). The point is approximate, at the centre of the town: the school's address is not given in the certificate"}, {"id": "P133", "n": "Ясли консервной фабрики № 8 (Темрюк)", "h": "", "r": "Краснодарский край", "c": "Россия", "t": "детский сад", "la": 45.2769, "lo": 37.3894, "z": "Ясли при консервной фабрике № 8 в Темрюке: здесь Антонина Леонидовна (L009) была сестрой-руководительницей с 5 сентября по 2 октября 1929 года — первый в её пути выход из школьной системы в заводскую (S59). Точка приблизительная, по центру города", "a": 1, "ne": "Nursery of Cannery No. 8 (Temryuk)", "re": "Krasnodar Krai", "ce": "Russia", "ze": "The nursery attached to cannery no. 8 in Temryuk: here Antonina Leonidovna (L009) was senior nurse-supervisor from 5 September to 2 October 1929 - the first move in her path out of the school system and into the factory one (S59). The point is approximate, at the centre of the town"}, {"id": "P134", "n": "Фёрнесс-Вейл (Furness Vale)", "h": "Furness Vale, township Yeardsley-cum-Whaley, приход Taxal, графство Чешир", "r": "Дербишир (High Peak); до 1936 — Чешир", "c": "Великобритания", "t": "селение", "la": 53.3495, "lo": -1.995, "z": "Селение на границе Чешира и Дербишира между Нью-Миллс и Уэйли-Бридж. Здесь 4 января 1874 года родился Уильям Эрнест Чарльз Генри (H004), а 16 декабря 1875-го — его брат Леонард Эдвин Ховард Генри (H001), отец Элси. Школьный ролл Rathmines для первого называет селение, для второго только графство (S93); до 1936 года Фёрнесс-Вейл числился в ЧЕШИРЕ, потом передан в Дербишир. Регистрационный округ рождений — Chapel-en-le-Frith. Уверенность средняя: координаты по селению, не по дому. ОТСЮДА ПОИСКОВЫЙ ХОД: свидетельства о рождении обоих братьев и переписи 1871 и 1881 брать по Chapel-en-le-Frith, а не по Чеширу вообще и не по Дублину", "ne": "Furness Vale", "he": "Furness Vale, township of Yeardsley-cum-Whaley, parish of Taxal, county of Cheshire", "re": "Derbyshire (High Peak); until 1936, Cheshire", "ce": "United Kingdom", "ze": "A village on the Cheshire-Derbyshire border between New Mills and Whaley Bridge. Here William Ernest Charles Henry (H004) was born on 4 January 1874, and his brother Leonard Edwin Howard Henry (H001), Elsie's father, on 16 December 1875. The Rathmines school roll names the village for the first and only the county for the second (S93); until 1936 Furness Vale belonged to CHESHIRE, after which it passed to Derbyshire. The registration district for births is Chapel-en-le-Frith. Confidence is medium: the coordinates are for the village, not for the house. HENCE THE SEARCH MOVE: the birth certificates of both brothers and the censuses of 1871 and 1881 are to be taken by Chapel-en-le-Frith, not by Cheshire at large and not by Dublin"}, {"id": "P135", "n": "Ардмейл (Ardmayle)", "h": "Ardmayle, диоцез Кашел", "r": "графство Типперэри, Мунстер", "c": "Ирландия", "t": "приход", "la": 52.5636, "lo": -7.9022, "z": "Приход в графстве Типперэри. The Clergy List 1906 даёт «Ardmayle Rectory, Cashel, co. Tipperary» как адрес Леонарда Эдвина Ховарда Генри (H001) — этим заполняется часть пустого отрезка 1903–1906 между двумя его сроками в Данмор-Исте (Q186, S93). Уверенность средняя: печать даёт адрес, а не назначение, — он мог жить в ректории Ардмейла, служа в другом приходе", "ne": "Ardmayle", "he": "Ardmayle, diocese of Cashel", "re": "County Tipperary, Munster", "ce": "Ireland", "ze": "A parish in County Tipperary. The Clergy List 1906 gives \"Ardmayle Rectory, Cashel, co. Tipperary\" as the address of Leonard Edwin Howard Henry (H001) - which fills part of the empty stretch of 1903-1906 between his two terms at Dunmore East (Q186, S93). Confidence is medium: the print gives an address, not an appointment - he could have lived in the Ardmayle rectory while serving another parish"}, {"id": "P136", "n": "Палласгрин (Pallasgreen)", "h": "Grean / Pallasgrean, приход диоцеза Эмли", "r": "графство Лимерик, Мунстер", "c": "Ирландия", "t": "посёлок", "la": 52.5583, "lo": -8.3556, "z": "Приход Грин (Grean) диоцеза Эмли. Леонард Эдвин Ховард Генри (H001) был здесь НАСТОЯТЕЛЕМ в 1912–1915 годах — это тот самый отрезок, который OCR школьного ролла отдавал огрызком «Rector of Crean, Co […] 1912-15». Никакого прихода «Crean» не существует ни в одном графстве; «Grean Rectory, Pallasgrean, Co. Limerick» стоит в Crockford's, а в 1915 году в списке местных секретарей напечатано «Pallasgrean: Mrs. Henry, Grean Rectory» — то есть здесь же жила его жена (H002). Сюда семья переехала из Данмор-Иста в год рождения Элси (S98)", "ne": "Pallasgreen", "he": "Grean / Pallasgrean, a parish of the diocese of Emly", "re": "County Limerick, Munster", "ce": "Ireland", "ze": "The parish of Grean in the diocese of Emly. Leonard Edwin Howard Henry (H001) was RECTOR here in 1912-1915 - the very stretch that the OCR of the school roll rendered as the fragment \"Rector of Crean, Co [...] 1912-15\". No parish called \"Crean\" exists in any county; \"Grean Rectory, Pallasgrean, Co. Limerick\" stands in Crockford's, and in 1915 a list of local secretaries prints \"Pallasgrean: Mrs. Henry, Grean Rectory\" - that is, his wife (H002) lived here too. The family moved here from Dunmore East in the year Elsie was born (S98)"}, {"id": "P138", "n": "Кристчёрч (Christchurch)", "h": "", "r": "Гемпшир (ныне Дорсет)", "c": "Великобритания", "t": "город", "la": 50.735, "lo": -1.78, "z": "Регистрационный округ, в котором во 2 квартале 1904 года зарегистрирован брак Леонарда Генри (H001) и Эллен Элизабет Паттерсон (H002): GRO 2b/1485 (S97). Округ охватывал Кристчёрч, Хайклифф, Саутборн и Боскомб — восточную половину нынешнего Борнмута. ОТСЮДА ВАЖНЫЙ ВЫВОД: семья невесты жила здесь ЕЩЁ ДО ИРЛАНДИИ, значит возвращение Генри в Борнмут в двадцатые — возвращение к её родне, а не переезд на новое место, и смерть её в госпитале Боскомба в 1945 году — смерть дома", "ne": "Christchurch", "re": "Hampshire (now Dorset)", "ce": "United Kingdom", "ze": "The registration district in which the marriage of Leonard Henry (H001) and Ellen Elizabeth Patterson (H002) was registered in the 2nd quarter of 1904: GRO 2b/1485 (S97). The district covered Christchurch, Highcliffe, Southbourne and Boscombe - the eastern half of present-day Bournemouth. HENCE AN IMPORTANT CONCLUSION: the bride's family was living here BEFORE IRELAND, so the Henrys' return to Bournemouth in the 1920s was a return to her kin, not a move to a new place, and her death in the Boscombe hospital in 1945 was a death at home"}, {"id": "P139", "n": "Хейфилд (Hayfield)", "h": "регистрационный округ Hayfield", "r": "Чешир / Дербишир", "c": "Великобритания", "t": "округ", "la": 53.377, "lo": -1.945, "z": "Регистрационный округ, в котором в 1 квартале 1876 года зарегистрировано рождение «Henry, Leonard» — GRO 7b/824, единственный Леонард Генри во всей Англии и Уэльсе за 1875–1877, и квартал ложится на 16 декабря 1875 года (S97). Округ лежал на границе двух графств и включал чеширские township-и Дисли, Таксал, Кеттлшульм и Ярдсли-кум-Уэйли, то есть и Фёрнесс-Вейл (P134). Индекс печатает только «Leonard», без Edwin и Howard: так регистрировали сплошь и рядом, остальные имена добавляли при крещении. Точное селение и занятие отца назовёт само свидетельство", "ne": "Hayfield", "he": "Hayfield registration district", "re": "Cheshire / Derbyshire", "ce": "United Kingdom", "ze": "The registration district in which the birth of \"Henry, Leonard\" was registered in the 1st quarter of 1876 - GRO 7b/824, the only Leonard Henry in the whole of England and Wales for 1875-1877, and the quarter falls on 16 December 1875 (S97). The district lay across the boundary of two counties and included the Cheshire townships of Disley, Taxal, Kettleshulme and Yeardsley-cum-Whaley, that is Furness Vale too (P134). The index prints only \"Leonard\", without Edwin and Howard: registrations were made that way all the time, the other names being added at baptism. The exact village and the father's occupation will come from the certificate itself"}, {"id": "P140", "n": "Вознесенское", "h": "с. Вознесенское, центр Афанасьевской волости; Нововыставочный Вознесенский приход", "r": "Афанасьевское сельское поселение, Верхнетоемский район, Архангельская область", "c": "Россия", "t": "село", "la": 62.32611, "lo": 44.22694, "z": "Административный центр ТОГО ЖЕ сельсовета, где стоят Фатьяновская, Кондратовская и Першинская, — 8–10 км от родовой деревни. Здесь похоронен Дмитрий Ефимович (L001): «похоронен в Вознесенске» со слов Юлии Николаевны означает погост своего волостного села, а не город Вознесенск Николаевской области, как думали (Q127). Название подтверждается и военными документами: уроженец Фатьяновской записан в ОБД по адресу «Вознесенское п/о, к/з „Победа“» — то есть это было и почтовое отделение всего куста", "ne": "Voznesenskoye", "he": "the selo of Voznesenskoye, centre of Afanasyevskaya volost; the Novovystavochny Voznesensky parish", "re": "Afanasyevskoye rural settlement, Verkhnyaya Toyma district, Arkhangelsk region", "ce": "Russia", "ze": "The administrative centre of THE SAME rural district in which Fatyanovskaya, Kondratovskaya and Pershinskaya stand - 8-10 km from the ancestral village. Dmitry Yefimovich (L001) is buried here: \"buried at Voznesensk\", as told by Yulia Nikolayevna, means the churchyard of his own volost centre and not the town of Voznesensk in Mykolaiv oblast, as had been thought (Q127). The name is confirmed by military documents as well: a native of Fatyanovskaya is entered in the OBD database with the address \"Voznesenskoye post office, Pobeda collective farm\" - so Voznesenskoye was also the post office of the whole nest"}, {"id": "P141", "n": "Валенсия (Валентия), остров", "h": "Valencia Island, диоцез Ардферт и Ахаду", "r": "графство Керри, Мунстер", "c": "Ирландия", "t": "остров", "la": 51.92, "lo": -10.33, "z": "Викариатство Леонарда Эдвина Ховарда Генри (H001) в 1905–1906 годах — тот самый «[?] Island, Co. Kerry», который OCR школьного ролла отдавал огрызком (Q186). В печати остров пишется через «c»: Crockford's 1921 даёт «Valencia Is. 1905-06 : Dunmore E. 1906-», The Clergy List 1910 отзывается на точную фразу «Valencia Island, Co. Kerry, 1905-6» и не отзывается ни на «Valentia», ни на другие островные приходы Керри. Инкумбент Валентии Александр Делап умер 3 мая 1906 года — викариатство ложится ровно в его последний год", "ne": "Valencia (Valentia) Island", "he": "Valencia Island, diocese of Ardfert and Aghadoe", "re": "County Kerry, Munster", "ce": "Ireland", "ze": "The curacy of Leonard Edwin Howard Henry (H001) in 1905-1906 - the very \"[?] Island, Co. Kerry\" that the OCR of the school roll rendered as a fragment (Q186). In print the island is spelled with a \"c\": Crockford's 1921 gives \"Valencia Is. 1905-06 : Dunmore E. 1906-\", and The Clergy List 1910 responds to the exact phrase \"Valencia Island, Co. Kerry, 1905-6\" and does not respond to \"Valentia\" or to the other island parishes of Kerry. The incumbent of Valencia, Alexander Delap, died on 3 May 1906 - the curacy falls exactly in his last year"}, {"id": "P142", "n": "Полярный", "h": "", "r": "Мурманская область", "c": "Россия", "t": "город", "la": 69.1989, "lo": 33.4506, "z": "База разведывательного отряда разведотдела штаба Северного флота. Место выбытия Константина Васильевича Лухнёва, погибшего 2 августа 1941 года при возвращении десанта с мыса Пикшуев (Q202)", "ne": "Polyarny", "re": "Murmansk region", "ce": "Russia", "ze": "The base of the reconnaissance detachment of the intelligence department of the Northern Fleet staff. The place of loss of Konstantin Vasilyevich Lukhnev, killed on 2 August 1941 while the landing party was returning from Cape Pikshuyev (Q202)"}, {"id": "P143", "n": "Артёмовский", "h": "", "r": "Свердловская область", "c": "Россия", "t": "город", "la": 57.3486, "lo": 61.8931, "z": "Город на востоке Свердловской области, до 1938 года посёлок Егоршино; районный центр, при нём районная газета «Артемовский рабочий». Появился в дереве по двум вырезкам этой газеты за ноябрь и декабрь 1968 года с карикатурами за подписью «Рис. А. Лухнева» — единственный след Александра Николаевича (L015) между Восточным Казахстаном 1959 года и Харьковом (S117).", "ne": "Artyomovsky", "re": "Sverdlovsk oblast", "ce": "Russia", "ze": "A town in the east of Sverdlovsk oblast, until 1938 the settlement of Yegorshino; a district centre with its own district newspaper, \"Artyomovsky Rabochy\". It entered the tree through two cuttings from that newspaper of November and December 1968 with cartoons signed \"Drawn by A. Lukhnev\" — the only trace of Alexander Nikolayevich (L015) between East Kazakhstan in 1959 and Kharkiv (S117)."}, {"id": "P144", "n": "Зыряновск", "h": "Зыряновск (с 2019 — Алтай)", "r": "Восточно-Казахстанская область", "c": "Казахстан", "t": "город", "la": 49.7275, "lo": 84.2711, "z": "Горняцкий город на Бухтарме, центр свинцово-цинковой добычи Рудного Алтая; с 2019 года называется Алтай. В дереве — по письму Александра Николаевича (L015) от 2 октября 1959 года: «Вчера был в Зыряновске» (S116). Сам он жил и работал не в городе, а в партии поблизости: в Зыряновск ездил и там же покупал книги. Важен не сам по себе — это первая точка семьи в Восточном Казахстане, на шесть лет раньше усть-каменогорского периода старшего брата (Q121).", "ne": "Zyryanovsk", "he": "Zyryanovsk (since 2019 Altai)", "re": "East Kazakhstan Region", "ce": "Kazakhstan", "ze": "A mining town on the Bukhtarma, the centre of lead and zinc extraction in the Rudny Altai; since 2019 it has been called Altai. It is in the tree through Alexander Nikolayevich's (L015) letter of 2 October 1959: \"Yesterday I was in Zyryanovsk\" (S116). He himself lived and worked not in the town but with a field party nearby: he went into Zyryanovsk and bought books there. He matters not in himself — this is the family's first point in East Kazakhstan, six years earlier than his elder brother's Ust-Kamenogorsk period (Q121)."}, {"id": "P145", "n": "Улица Клочковская, Харьков", "h": "", "r": "Харьковская область", "c": "Украина", "t": "улица", "la": 50.0045, "lo": 36.2287, "z": "Довоенный харьковский адрес семьи Лухнёвых. Со слов Саввы 22.08.2026: «д. Саша тоже родился в Харькове, жили они тогда на Клочковской» (S118). Тот же адрес держится в семье и позже: конверт письма из Постав со штемпелем 12 августа 1952 года надписан бабушке Евдокии Семёновне (D006) на Клочковскую, 24, кв. 2 (S64). Номер дома для 1938–1939 годов при этом не подтверждён — совпадение с квартирой бабушки правдоподобно, но не доказано; координаты поставлены по дому 24 и означают отрезок улицы, а не установленное жильё.", "a": 1, "ne": "Klochkovska Street, Kharkiv", "re": "Kharkiv Oblast", "ce": "Ukraine", "ze": "The pre-war Kharkiv address of the Lukhnev family. As told by Savva on 22 August 2026: \"Uncle Sasha was also born in Kharkiv; they were living on Klochkovska then\" (S118). The same address holds in the family later too: the envelope of a letter from Postavy, postmarked 12 August 1952, is addressed to his grandmother Yevdokia Semyonovna (D006) at Klochkovska 24, flat 2 (S64). The house number for 1938–1939 is nevertheless unconfirmed — a coincidence with the grandmother's flat is plausible but not proved; the coordinates are set on house 24 and mean a stretch of the street rather than an established dwelling."}, {"id": "P146", "n": "Лениногорск", "h": "Лениногорск (ныне Риддер)", "r": "Восточно-Казахстанская область", "c": "Казахстан", "t": "город", "la": 50.3486, "lo": 83.5117, "z": "Рудный город на Алтае, до 1941 и снова с 2002 года — Риддер. В дереве по устному свидетельству Саввы 22.08.2026: там жила Васса, одна из сестёр его прабабушки Екатерины Николаевны Трубниковой (TR002), «тоже барак» (S118).", "ne": "Leninogorsk", "he": "Leninogorsk (today Ridder)", "re": "East Kazakhstan Region", "ce": "Kazakhstan", "ze": "A mining town in the Altai, called Ridder until 1941 and again from 2002. It is in the tree on Savva's oral testimony of 22 August 2026: Vassa, one of the sisters of his great-grandmother Yekaterina Nikolayevna Trubnikova (TR002), lived there, \"also a barrack\" (S118)."}, {"id": "P147", "n": "Алма-Ата", "h": "Алма-Ата (ныне Алматы)", "r": "Алматинская область", "c": "Казахстан", "t": "город", "la": 43.238, "lo": 76.8829, "z": "В дереве по устному свидетельству Саввы 22.08.2026: там жила Анна, сестра его прабабушки Екатерины Николаевны Трубниковой (TR002), в замужестве Душевина — в последние годы в микрорайоне Орбита-4, до того «где-то в бараке в центре»; Савва был у неё в детстве в гостях (S118).", "ne": "Alma-Ata", "he": "Alma-Ata (today Almaty)", "re": "Almaty oblast", "ce": "Kazakhstan", "ze": "It is in the tree on Savva's oral testimony of 22 August 2026: Anna, a sister of his great-grandmother Yekaterina Nikolayevna Trubnikova (TR002), married name Dushevina, lived there — in her last years in the Orbita-4 microdistrict, before that \"somewhere in a barrack in the centre\"; Savva visited her as a child (S118)."}, {"id": "P149", "n": "Мендяново", "h": "д. Мендяново Белебеевского уезда Уфимской губернии", "r": "Альшеевский район, Башкортостан", "c": "Россия", "t": "село", "la": 53.915, "lo": 54.7711, "z": "Родина Магиры Авзаловны Хасановой (KH005) — первая точная точка на карте у всей хасановской линии. Центр Мендяновского сельсовета Альшеевского района, стоит на речке Манатман, притоке Дёмы. Село ТАТАРСКОЕ: по переписи 2002 года 81 % жителей татары. Население 180 человек в 1795-м, 1227 на пике в 1920-м, 412 в 2010-м. Заведено 22.08.2026 по паспортным данным, переданным роднёй Хасановых (S119).\nКАНТОННЫЙ АДРЕС XIX ВЕКА, найден 23.08.2026 в «Яндекс Архиве» (S121). Метрическая книга 1862 года — ОГАОО, фонд 173, опись 12, дело 423 — описывает жителя так: «Хайрулла Абдулманиев, БАШКИРЕЦ, Оренбургская губерния, Белебейский уезд, 22 КАНТОН, 4-я ЮРТА, деревня Мендяново». То есть село стояло в башкирской кантонной системе и его жителей в 1862 году записывали башкирами, а нынешний татарский состав — результат позднейшего учёта; для поиска это значит, что ревизии и метрики надо заказывать по кантону и юрте, а не по волости. ФОНД НАЗВАН ВЕРНО ТОЛЬКО 23.08.2026 (S123): ОГАОО ф. 173 — это ОРЕНБУРГСКАЯ ДУХОВНАЯ КОНСИСТОРИЯ, православная, а не «магометанское духовное собрание», как здесь стояло сутки. Запись 1862 года по Мендянову — из ЦЕРКОВНОЙ книги, и по контексту это КРЕЩЕНИЕ: двадцатилетний магометанин Хайрулла Абдулманиев получает имя Андрей. Мусульманские метрики самого села лежат в другом месте — Национальный архив Республики Башкортостан, фонд И-295 (Оренбургское магометанское духовное собрание), 71 262 дела за 1790–1923. Ревизские сказки — ОГАОО ф. 98 (Оренбургская казённая палата), описи 1 и 2 оцифрованы полностью и открыты бесплатно. В «Списке населённых мест по сведениям 1870 года» — деревня Белебеевского уезда Уфимской губернии.\nСЕЛО РАСПИСАНО ПОИМЁННО. «Память народа» знает по Мендянову 242 записи военного времени и 132 фамилии: Гилязовы (14), Исламовы (9), Ситдиковы (8), Валиахметовы, Зинатуллины, Мухтаровы, Гизатуллины, Лутфуллины, Насыровы, Мирсаитовы, Каримовы, Хазиевы. Фамилия ХАСАНОВ селу чужая — на все 242 записи один человек. Полный список фамилий — в Q211, он же список кандидатов на девичью фамилию Магиры.\nГДЕ ЛЕЖАТ ДОКУМЕНТЫ: отдел ЗАГС Альшеевского района — 452120, с. Раевский, Советская площадь, 3; подворные карточки переписи 1917 года по Белебеевскому уезду — basharchive.ru, фонд Р-473 опись 1; обзор всех 111 деревень района с архивными ссылками — тема ВГД forum.vgd.ru/3942/106538. См. Q108 и Q211", "ne": "Mendyanovo", "he": "the village of Mendyanovo, Belebey district, Ufa governorate", "re": "Alsheyevsky district, Bashkortostan", "ce": "Russia", "ze": "The birthplace of Magira Avzalovna Khasanova (KH005) — the first exact point on the map for the whole Khasanov line. The seat of the Mendyanovo village soviet, Alsheyevsky district; it stands on the river Manatman, a tributary of the Dyoma. The village is TATAR: 81% of its inhabitants were Tatars in the 2002 census. The population was 180 in 1795, 1,227 at its peak in 1920, and 412 in 2010. Entered on 22 August 2026 from the passport details passed on by the Khasanov relatives (S119).\nTHE 19th-CENTURY CANTON ADDRESS, found on 23 August 2026 in the \"Yandex Archive\" (S121). A parish register of 1862 — OGAOO, fond 173, opis 12, delo 423 — describes an inhabitant thus: \"Khayrulla Abdulmaniyev, BASHKIR, Orenburg governorate, Belebey district, 22nd CANTON, 4th YURT, village of Mendyanovo\". So the village stood within the Bashkir canton system and its inhabitants were recorded as Bashkirs in 1862, while the present Tatar composition is the result of later registration; for the search this means that the revisions (poll-tax censuses) and parish registers must be ordered by canton and yurt, not by volost (rural district). THE FOND WAS NAMED CORRECTLY ONLY ON 23 AUGUST 2026 (S123): OGAOO f. 173 is the ORENBURG SPIRITUAL CONSISTORY, an Orthodox body, not the \"Mohammedan Spiritual Assembly\" as stood here for a day. The 1862 entry for Mendyanovo comes from a CHURCH register, and by its context it is a BAPTISM: a twenty-year-old Mohammedan, Khayrulla Abdulmaniyev, receives the name Andrey. The Muslim parish registers of the village itself lie elsewhere — the National Archive of the Republic of Bashkortostan, fond I-295 (the Orenburg Mohammedan Spiritual Assembly), 71,262 dela for 1790–1923. The revision tales are in OGAOO f. 98 (the Orenburg Treasury Chamber); inventories 1 and 2 have been fully digitised and are open free of charge. In the \"List of Populated Places by the Data of 1870\" it appears as a village of the Belebey district of Ufa governorate.\nTHE VILLAGE HAS BEEN LISTED NAME BY NAME. \"Pamyat Naroda\" (Memory of the People) knows 242 wartime records and 132 surnames for Mendyanovo: Gilyazov (14), Islamov (9), Sitdikov (8), Valiakhmetov, Zinatullin, Mukhtarov, Gizatullin, Lutfullin, Nasyrov, Mirsaitov, Karimov, Khaziyev. The surname KHASANOV is foreign to the village — one man in all 242 records. The full list of surnames is in Q211, and it is also the list of candidates for Magira's maiden name.\nWHERE THE DOCUMENTS ARE: the registry office of the Alsheyevsky district — 452120, selo Rayevsky, Sovetskaya Square 3; the household cards of the 1917 census for the Belebey district — basharchive.ru, fond R-473, opis 1; a survey of all 111 villages of the district with archival references — the VGD forum thread forum.vgd.ru/3942/106538. See Q108 and Q211"}, {"id": "P150", "n": "Вроцлав", "h": "", "r": "Нижнесилезское воеводство", "c": "Польша", "t": "город", "la": 51.1079, "lo": 17.0385, "z": "Гарнизон Северной группы войск, где Николай Николаевич (L013) дослуживал срочную. До 1945 года немецкий Бреслау. В дереве по трём независимым надписям на обороте солдатских карточек его однополчан: «гор. Вроцлав. 29.3.53 г.» и «г. Вроцлав. Польша. 29.07-1954 г.» (S120), плюс его собственное письмо от 21 июня 1953 года с шапкой «Привет с Запада!» (S64). Раньше в дереве стояла одна «Польша» без города и с 1955 годом; теперь известно, что во Вроцлаве он был уже В МАРТЕ 1953-го.", "ne": "Wrocław", "re": "Lower Silesian Voivodeship", "ce": "Poland", "ze": "A garrison of the Northern Group of Forces where Nikolai Nikolayevich (L013) served out his conscript term. Until 1945 the German Breslau. It is in the tree through three independent inscriptions on the backs of his fellow soldiers' photographs: \"Wrocław, 29.3.53\" and \"Wrocław, Poland, 29.07.1954\" (S120), plus his own letter of 21 June 1953 headed \"Greetings from the West!\" (S64). The tree previously carried a bare \"Poland\" with no town and the year 1955; it is now known that he was in Wrocław as early as MARCH 1953."}, {"id": "P151", "n": "Старая Васильевка", "h": "Старая Васильевка (башк. Иҫке Васильевка)", "r": "Мендяновский сельсовет, Альшеевский район, Башкортостан", "c": "Россия", "t": "село", "la": 53.8801, "lo": 54.7797, "z": "Родина Фанура Хасанова (KH004), названа роднёй 23.08.2026 (S122). И это главное, что она даёт: Старая Васильевка входит в ТОТ ЖЕ МЕНДЯНОВСКИЙ СЕЛЬСОВЕТ, что и Мендяново (P149), где родилась его жена Магира, и стоит от него в трёх километрах. То есть Фанур и Магира — не люди, познакомившиеся на стройке в Салавате, а соседи по сельсовету; их записи о рождении 1941 и 1946 годов лежат в одних и тех же книгах одного и того же сельсовета. ПРО САМО СЕЛО: основано 29 августа 1746 года тептярями на башкирской земле по записи Уфимской провинциальной канцелярии, названо по имени первопоселенца Василия. Татарское: 86 % по переписи 2002 года, жители мусульмане-сунниты, в селе мечеть. Население 595 человек в 1897-м, 301 в 2002-м, 266 в 2010-м. От райцентра Раевского 33 км. В военных базах пишется «Васильево» и «Старо-Васильев.» — по этим написаниям и искать СЕЛО РАСПИСАНО ПОИМЁННО, 23.08.2026 (S123): в «Памяти народа» по нему 205 записей и 101 фамилия — Набиуллины (11), Азметовы (8), Сираевы (7), Валиуллины и Булатовы (по 6), Нагимовы, Гусамовы. ХАСАНОВЫХ ДВОЕ, а не один, как я записал накануне по одному написанию: «Ханиф Мух.» 1901 (вернулся с войны) и Хаирнас Мухамадиярович 1910 (пропал без вести в декабре 1941). ИСКАТЬ НАДО ПО ЧЕТЫРЁМ НАПИСАНИЯМ: «васильевка», «старо-васильевка», «ст.-васильевка», «васильево» — они дают разные выборки. Метрики мечети — Национальный архив Республики Башкортостан, ф. И-295; ревизские сказки — ОГАОО ф. 98, описи 1 и 2 оцифрованы и открыты.", "ne": "Staraya Vasilyevka", "he": "Staraya Vasilyevka (Bashkir Иҫке Васильевка)", "re": "Mendyanovo village soviet, Alsheyevsky district, Bashkortostan", "ce": "Russia", "ze": "The birthplace of Fanur Khasanov (KH004), named by the family on 23 August 2026 (S122). And this is the main thing it gives: Staraya Vasilyevka belongs to THE SAME MENDYANOVO VILLAGE SOVIET as Mendyanovo (P149), where his wife Magira was born, and stands three kilometres from it. That is, Fanur and Magira were not people who met on a building site in Salavat but neighbours within one village soviet; their birth records of 1941 and 1946 lie in the same books of the same village soviet. ABOUT THE VILLAGE ITSELF: it was founded on 29 August 1746 by Teptyars on Bashkir land under a deed of the Ufa provincial chancellery, and named after its first settler, Vasily. It is Tatar: 86% in the 2002 census; the inhabitants are Sunni Muslims and there is a mosque in the village. The population was 595 in 1897, 301 in 2002 and 266 in 2010. It is 33 km from the district centre, Rayevsky. In the war databases it is written \"Vasilyevo\" and \"Staro-Vasilyev.\" — those are the spellings to search by. THE VILLAGE HAS BEEN LISTED NAME BY NAME, 23 August 2026 (S123): \"Pamyat Naroda\" holds 205 records and 101 surnames for it — Nabiullin (11), Azmetov (8), Sirayev (7), Valiullin and Bulatov (6 each), Nagimov, Gusamov. THERE ARE TWO KHASANOVS, not one as I recorded the day before from a single spelling: \"Khanif Mukh.\" 1901 (returned from the war) and Khairnas Mukhamadiyarovich 1910 (missing since December 1941). THE SEARCH MUST GO BY FOUR SPELLINGS: \"vasilyevka\", \"staro-vasilyevka\", \"st.-vasilyevka\", \"vasilyevo\" — they give different sets. The mosque registers are in the National Archive of the Republic of Bashkortostan, f. I-295; the revision tales are in OGAOO f. 98, inventories 1 and 2 digitised and open."}, {"id": "P152", "n": "Нура (участок), Белорецкий район", "h": "уч. Нура, Белорецкий район, БАССР", "r": "Нурский сельсовет, Белорецкий район, Башкортостан", "c": "Россия", "t": "посёлок", "la": 54.0461, "lo": 58.3284, "z": "Место рождения Фидариса Хасанова (KH007), август 1969 — по его свидетельству о рождении, где стоит дословно «уч. Нура, Белорецкий район, БАССР» (S124). «Участок» здесь не адрес, а тип поселения: рабочий посёлок при лесозаготовке или железной дороге на речке Нуре, в Нурском сельсовете, рядом с селом Отнурок, километрах в четырнадцати к северо-западу от Белорецка. Координаты приблизительные: под именем «Нура» в сельсовете значится несколько точек, и какая из них тот самый участок, по документу не определить. ЧТО ЭТО ЗА МЕСТО ДЛЯ СЕМЬИ: не корни, а работа. В «Памяти народа» по Нуре 75 записей военного времени, и состав их смешанный — Андреевы, Юшкевичи, Лязины, Егоровы вперемешку с Суфияровыми и Давлетшиными, то есть посёлок пришлый. Хасановы Белорецкого района (38 записей) гнездятся совсем в других сёлах — Серменево, Татлы, Манышта, Субхангулово. Значит Фанур с Магирой приехали сюда с Альшеевского района на заработки и через год-два уехали дальше, в Шингак-Куль", "ne": "Nura (uchastok), Beloretsky district", "he": "uch. Nura, Beloretsky district, Bashkir ASSR", "re": "Nura village soviet, Beloretsky district, Bashkortostan", "ce": "Russia", "ze": "The birthplace of Fidaris Khasanov (KH007), August 1969 — from his birth certificate, which says verbatim \"uch. Nura, Beloretsky district, Bashkir ASSR\" (S124). \"Uchastok\" here is not an address but a type of settlement: a workers' settlement attached to logging or to the railway, on the river Nura, in the Nura village soviet, next to the village of Otnurok, some fourteen kilometres north-west of Beloretsk. The coordinates are approximate: several points in the village soviet go by the name \"Nura\", and which of them is that settlement cannot be determined from the document. WHAT THIS PLACE MEANT FOR THE FAMILY: not roots but work. \"Pamyat Naroda\" holds 75 wartime records for Nura, and their composition is mixed — Andreyev, Yushkevich, Lyazin, Yegorov interleaved with Sufiyarov and Davletshin, that is, an incomers' settlement. The Khasanovs of the Beloretsky district (38 records) cluster in quite other villages — Sermenevo, Tatly, Manyshta, Subkhangulovo. So Fanur and Magira came here from the Alsheyevsky district to earn, and a year or two later moved on, to Shingak-Kul"}, {"id": "P154", "n": "Митвайда (Mittweida)", "h": "", "r": "Саксония", "c": "Германия", "t": "город", "la": 50.9861, "lo": 12.9797, "z": "ГДЕ СЕМЁН ДАНИЛОВ (D008) УЧИЛСЯ И ЖИЛ В 1925–1929 ГОДАХ. Установлено 25.08.2026 по его собственным открыткам домой (S128): «Lindenhöhe-Mittweida i. Sa., 12.6.25», «Лауэнхайн, 16.1.26» и «Лауэнхайн, 15.6.28» (Лауэнхайн — район самой Митвайды), а на открытке из Айзенаха от 11.9.27 стоит обратный адрес отправителя: «Abs. S. Danilof, Mittweida i/Sa., …strasse 28». Из Митвайды же он ездил на каникулах — «Саксонская Швейцария» и Дрезден в августе 1927, Айзенах и Вартбург в сентябре 1927, Гармиш в июле 1929; и открытки он слал местные — замок Крибштайн и Гаррасфельзен у Лихтенвальде, оба в получасе от города. ПОЧЕМУ ЭТО ГОРОД, А НЕ ТОЧКА НА КАРТЕ: в Митвайде было ТЕХНИКУМ — знаменитая инженерная школа, куда в 1920-е съезжались со всей Европы. К середине двадцатых там училось 2300 человек, и временами больше половины были иностранцами. Это ровно то образование, о котором зять Рой говорил «инженерное дело» и из-за которого в Швеции Семёна звали «Eng.» — и теперь у догадки есть адрес. Студенческие дела и выпускные свидетельства с 1865 года лежат в Hochschularchiv mit Kustodie при Hochschule Mittweida: Leisniger Str. 7, 09648 Mittweida, archiv@hs-mittweida.de, +49 3727 58-1306, заведующая Karoline Pernt. См. Q221", "ne": "Mittweida", "re": "Saxony", "ce": "Germany", "ze": "WHERE SEMYON DANILOV (D008) STUDIED AND LIVED IN 1925–1929. Established on 25 August 2026 from his own postcards home (S128): \"Lindenhöhe-Mittweida i. Sa., 12.6.25\", \"Lauenhain, 16.1.26\" and \"Lauenhain, 15.6.28\" (Lauenhain is a district of Mittweida itself), while a postcard from Eisenach of 11 September 1927 carries the sender's return address: \"Abs. S. Danilof, Mittweida i/Sa., …strasse 28\". It was from Mittweida that he travelled in the holidays — \"Saxon Switzerland\" and Dresden in August 1927, Eisenach and the Wartburg in September 1927, Garmisch in July 1929; and the postcards he sent were local ones — Kriebstein Castle and the Harrasfelsen near Lichtenwalde, both half an hour from the town. WHY THIS IS A TOWN AND NOT JUST A POINT ON THE MAP: Mittweida had a TECHNIKUM — a celebrated engineering school to which people came in the 1920s from all over Europe. By the mid-1920s 2,300 students were enrolled there and at times more than half were foreigners. This is exactly the education that his son-in-law Roy called \"engineering\" and because of which Semyon was known in Sweden as \"Eng.\" — and now the conjecture has an address. Student files and graduation certificates from 1865 onwards are kept at the Hochschularchiv mit Kustodie of Hochschule Mittweida: Leisniger Str. 7, 09648 Mittweida, archiv@hs-mittweida.de, +49 3727 58-1306, head Karoline Pernt. See Q221"}, {"id": "P155", "n": "Хемниц (Chemnitz)", "h": "", "r": "Саксония", "c": "Германия", "t": "город", "la": 50.8278, "lo": 12.9214, "z": "Открытка Семёна Данилова (D008) матери в Темрюк: «Chemnitz, 10.6.28», штемпель прибытия «ТЕМРЮК КУБАН. ОКР. 18.7.28» (S128). Вторая — «Chemnitz 13.3.29», со школьной прогулки и с приписками пяти немецких однокашников. Хемниц в тридцати километрах от Митвайды, где он учился, так что это соседний город, а не переезд", "ne": "Chemnitz", "re": "Saxony", "ce": "Germany", "ze": "A postcard from Semyon Danilov (D008) to his mother in Temryuk: \"Chemnitz, 10.6.28\", with the arrival postmark \"TEMRYUK KUBAN OKRUG 18.7.28\" (S128). A second one — \"Chemnitz 13.3.29\", from a school outing and with notes added by five German fellow students. Chemnitz is thirty kilometres from Mittweida, where he was studying, so this is a neighbouring town rather than a move"}, {"id": "P156", "n": "Стамбул", "h": "Константинополь", "r": "", "c": "Турция", "t": "город", "la": 41.0082, "lo": 28.9784, "z": "Куда Семён Данилов (D008) вышел из России. 23 июня 1920 года консульство Нидерландов в Константинополе, взявшее на себя защиту русских интересов после того как имперские консульства перестали существовать, выдало ему проездное свидетельство № 1576 (S129). Это за пять месяцев до врангелевской эвакуации Крыма — значит он ушёл не с ноябрьским исходом, а раньше и сам по себе.", "ne": "Istanbul", "he": "Constantinople", "ce": "Turkey", "ze": "Where Semyon Danilov (D008) came out of Russia. On 23 June 1920 the Netherlands consulate in Constantinople, which had taken on the protection of Russian interests after the imperial consulates ceased to exist, issued him travel certificate no. 1576 (S129). That is five months before Wrangel's evacuation of the Crimea — so he left not with the November exodus but earlier and on his own."}, {"id": "P157", "n": "Марсель", "h": "", "r": "Буш-дю-Рон", "c": "Франция", "t": "город", "la": 43.2965, "lo": 5.3698, "z": "Первый западный город, где Семён Данилов (D008) осел и работал. 1 апреля 1921 года мэрия Марселя внесла его в реестр иностранцев: Registre 590, № 251, прибыл в коммуну в феврале 1921, профессия — marin, моряк, в Л'Эстаке (S130). Л'Эстак — рабочий приморский квартал на северо-западе Марселя, порт и заводы; в формуляре к профессии приписан адрес «Gare 27b[?]», номер читается неуверенно. Отбытие из коммуны отмечено на обороте 1 октября 1921 — за три дня до парижской визы.", "ne": "Marseille", "re": "Bouches-du-Rhône", "ce": "France", "ze": "The first western city where Semyon Danilov (D008) settled and worked. On 1 April 1921 the Marseille city hall entered him in the register of foreigners: Registre 590, no. 251, arrived in the commune in February 1921, profession marin, seaman, at l'Estaque (S130). L'Estaque is a working-class seaside quarter in the north-west of Marseille, with a harbour and factories; the form adds to the profession an address, \"Gare 27b[?]\", the number being uncertain. Departure from the commune is noted on the reverse as 1 October 1921 — three days before the Paris visa."}, {"id": "P158", "n": "Париж", "h": "", "r": "Иль-де-Франс", "c": "Франция", "t": "город", "la": 48.8566, "lo": 2.3522, "z": "Октябрь 1921: в Париже Семён Данилов (D008) получил сразу две отметки в константинопольское свидетельство — визу русского генерального консульства № 5008 «pour Allemagne» от 4 октября 1921 и визу префектуры полиции № 14296 в Германию, «aller et retour», того же 4 октября (S129). Русское генеральное консульство в Париже — учреждение старой России: Франция признавала его до 1924 года.", "ne": "Paris", "re": "Île-de-France", "ce": "France", "ze": "October 1921: in Paris Semyon Danilov (D008) received two entries at once in his Constantinople certificate — a visa from the Russian consulate-general, no. 5008, \"pour Allemagne\", of 4 October 1921, and a visa from the prefecture of police, no. 14296, for Germany, \"aller et retour\", of the same 4 October (S129). The Russian consulate-general in Paris was an institution of the old Russia: France recognised it until 1924."}, {"id": "P159", "n": "Берлин", "h": "", "r": "", "c": "Германия", "t": "город", "la": 52.52, "lo": 13.405, "z": "Берлин Семёна Данилова (D008) — не легенда об учёбе до революции, а документированный отрезок 1921–1923. 30 декабря 1921 «Русская делегация в Германии» заверяет здесь немецкий перевод его темрюкского аттестата, № 833 (S131); 2 июня 1922 французское консульство в Берлине разрешает ему вернуться в Париж; 5 марта 1923 то же консульство даёт визу во Францию; и той же весной, 20 марта 1923, аттестат проходит через прусское министерство науки, искусства и народного просвещения (S129, S131). Есть и вычеркнутая отметка — разрешение проехать в Верхнюю Силезию.", "ne": "Berlin", "ce": "Germany", "ze": "Semyon Danilov's (D008) Berlin is not the legend of study before the revolution but a documented period, 1921–1923. On 30 December 1921 \"the Russian Delegation in Germany\" certifies here the German translation of his Temryuk school certificate, no. 833 (S131); on 2 June 1922 the French consulate in Berlin allows him to return to Paris; on 5 March 1923 the same consulate gives him a visa for France; and that same spring, on 20 March 1923, the certificate passes through the Prussian ministry of science, art and popular education (S129, S131). There is also a crossed-out entry — permission to travel to Upper Silesia."}, {"id": "P160", "n": "Камбре (Cambrai)", "h": "", "r": "Нор", "c": "Франция", "t": "город", "la": 50.1767, "lo": 3.235, "z": "На обороте марсельского формуляра Семёна Данилова (D008) стоит штамп «VILLE DE CAMBRAI — CONTRÔLE DES ÉTRANGERS, Vu à l'arrivée le 2 Août 1922» (S130). Отметки об убытии нет. Камбре в 1922 году — разорённый войной город на восстановлении, куда шла рабочая сила со всей Европы.", "ne": "Cambrai", "re": "Nord", "ce": "France", "ze": "On the reverse of Semyon Danilov's (D008) Marseille form there is a stamp: \"VILLE DE CAMBRAI — CONTRÔLE DES ÉTRANGERS, Vu à l'arrivée le 2 Août 1922\" (S130). There is no departure entry. Cambrai in 1922 was a town ruined by the war and under reconstruction, to which labour came from all over Europe."}, {"id": "P161", "n": "Лондон", "h": "", "r": "", "c": "Великобритания", "t": "город", "la": 51.5074, "lo": -0.1278, "z": "Август 1952: «Получив твою маленькую весточку, из Лондона от 24.8.» — пишет мать Семёну (S132). Почту она при этом шлёт ему в Мальмё. То есть в Лондоне он был проездом, а не жил там. Прежде считалось, что в Англию он не приезжал ни разу — со слов зятя Роя Вуда (S85); открытка 1952 года этому противоречит, и противоречие пока не разобрано.", "ne": "London", "ce": "United Kingdom", "ze": "August 1952: \"Having received your little note, from London of 24.8.\" — his mother writes to Semyon (S132). She nevertheless sends her post to him in Malmö. So he was in London in passing, not living there. It was previously held that he never once came to England — from his son-in-law Roy Wood (S85); the 1952 postcard contradicts this, and the contradiction has not yet been resolved."}, {"id": "P162", "n": "Фридхемсторгет, 22 (Мальмё)", "h": "", "r": "Сконе", "c": "Швеция", "t": "адрес", "la": 55.5975, "lo": 12.9722, "z": "Адрес Семёна Данилова (D008) в Мальмё, написанный рукой его матери на двух конвертах: «Фридхемсторгет 22 / Freidhemstorget 22» (её орфография; по-шведски Fridhemstorget), 17 сентября 1950 и 10 сентября 1952 (S132). Это первый его точный шведский адрес вообще, и он превращает запросы в Malmö stadsarkiv и в фонд SUK из поиска по фамилии в выписку по адресу — см. Q117 и Q118. Fridhemstorget лежит в районе Ribersborg/Fridhem на западе Мальмё; оба конверта проштемпелёваны «Avhämtas å postanstalten MALMÖ 5, Ribersborgsvägen 13» — то есть письма выдавали в почтовом отделении Мальмё-5 на Рибербсборгсвеген.", "a": 1, "ne": "Fridhemstorget 22 (Malmö)", "re": "Skåne", "ce": "Sweden", "ze": "Semyon Danilov's (D008) address in Malmö, written in his mother's hand on two envelopes: \"Фридхемсторгет 22 / Freidhemstorget 22\" (her spelling; in Swedish Fridhemstorget), 17 September 1950 and 10 September 1952 (S132). It is his first exact Swedish address of any kind, and it turns the enquiries to Malmö stadsarkiv and to the SUK collection from a search by surname into an extract by address — see Q117 and Q118. Fridhemstorget lies in the Ribersborg/Fridhem area in the west of Malmö; both envelopes are stamped \"Avhämtas å postanstalten MALMÖ 5, Ribersborgsvägen 13\" — that is, the letters were handed out at the Malmö 5 post office on Ribersborgsvägen."}, {"id": "P163", "n": "Копенгаген", "h": "", "r": "", "c": "Дания", "t": "город", "la": 55.6761, "lo": 12.5683, "z": "Дания в биографии Семёна Данилова (D008) появилась 26.08.2026, с двумя его открытками матери в Темрюк: «Копенгаген, 8.2.31» на виде замка Розенборг и «Копенгаген, 26.7.31» на виде Королевского театра (S134). Это закрывает часть провала между Хемницем марта 1929 и Мальмё 1933-34: в 1931 году он полгода с лишним держится в Копенгагене. И это меняет чтение его переезда в Швецию: не прыжок из Германии, а движение по Скандинавии — Копенгаген и Мальмё стоят по разные стороны Эресунна, между ними два часа парома.", "ne": "Copenhagen", "ce": "Denmark", "ze": "Denmark appeared in Semyon Danilov's (D008) biography on 26 August 2026, with two of his postcards to his mother in Temryuk: \"Copenhagen, 8.2.31\" on a view of Rosenborg Castle and \"Copenhagen, 26.7.31\" on a view of the Royal Theatre (S134). This closes part of the gap between Chemnitz in March 1929 and Malmö in 1933–34: in 1931 he stays in Copenhagen for more than half a year. And it changes how his move to Sweden reads: not a leap out of Germany but a movement across Scandinavia — Copenhagen and Malmö stand on opposite sides of the Öresund, two hours apart by ferry."}, {"id": "P164", "n": "Гамбург", "h": "", "r": "", "c": "Германия", "t": "город", "la": 53.5511, "lo": 9.9937, "z": "Через Гамбург Семён Данилов (D008) ездил из Швеции и обратно. Две его открытки матери на Клочковскую (S134): 29 августа 1934 — «Как раз ожидаю поезд в „Мальмё“. Через ½ часа буду в дороге, а сегодня вечером, надеюсь, в „Мальмё“ дома»; и 28 декабря 1934, авиапочтой, с новогодними пожеланиями. Обе с видами гамбургского порта. Гамбург — ближайший к Мальмё крупный немецкий порт и узел, через который шло сообщение со Скандинавией.", "ne": "Hamburg", "ce": "Germany", "ze": "Semyon Danilov (D008) travelled to and from Sweden through Hamburg. Two of his postcards to his mother on Klochkovska (S134): 29 August 1934 — \"I am just waiting for the train to 'Malmö'. In half an hour I shall be on my way, and this evening, I hope, at home in 'Malmö'\"; and 28 December 1934, by air mail, with New Year wishes. Both carry views of the Hamburg docks. Hamburg is the nearest large German port to Malmö and the junction through which traffic with Scandinavia ran."}, {"id": "P165", "n": "Кёльн", "h": "", "r": "", "c": "Германия", "t": "город", "la": 50.9375, "lo": 6.9603, "z": "«Кёльн, 3.5.52. Милая Мамулька, проездом через Кёльн» — открытка Семёна Данилова (D008) матери в Харьков (S134). На виде набережной Рейна ещё стоят руины: Гросс-Санкт-Мартин без кровли, разбитые дома вдоль Франкенверфта. Открытку мать не выбросила, а через полтора месяца надписала с оборота своему внуку Николаю (L013) и отправила уже как поздравительную — 21 июня 1952 из Харькова.", "ne": "Cologne", "ce": "Germany", "ze": "Cologne, 3.5.52. Dear Mama, passing through Cologne — a postcard from Semyon Danilov (D008) to his mother in Kharkiv (S134). On the view of the Rhine embankment the ruins are still standing: Gross St Martin without its roof, shattered houses along the Frankenwerft. His mother did not throw the card away but a month and a half later wrote on the back of it to her grandson Nikolai (L013) and sent it on as a greetings card — 21 June 1952, from Kharkiv."}, {"id": "P166", "n": "Кохель-ам-Зе (Kochel am See)", "h": "", "r": "Бавария", "c": "Германия", "t": "село", "la": 47.6597, "lo": 11.3667, "z": "«Kochel a. See, 19.7.36. Из страны гор, пива, тёплой страны, юга Германии — Баварии шлю всем Вам свой сердечный привет» — открытка Семёна Данилова (D008) матери в Харьков, с видом Урфельда на Вальхензее (S134). Марка «Weltkongress für Freizeit und Erholung, Hamburg 1936», гашение с олимпийскими кольцами «Olympische Spiele Berlin 1.–16. August 1936». То есть в июле 1936 года он путешествует по нацистской Германии как турист, за две недели до Олимпиады. На полях приписка: «Мой адрес старый. Через неделю я — снова дома».", "ne": "Kochel am See", "re": "Bavaria", "ce": "Germany", "ze": "Kochel a. See, 19.7.36. From the land of mountains and beer, the warm land, the south of Germany — Bavaria — I send you all my warm greetings — a postcard from Semyon Danilov (D008) to his mother in Kharkiv, with a view of Urfeld on the Walchensee (S134). The stamp is \"Weltkongress für Freizeit und Erholung, Hamburg 1936\", the cancellation bears the Olympic rings, \"Olympische Spiele Berlin 1.–16. August 1936\". So in July 1936 he is travelling in Nazi Germany as a tourist, a fortnight before the Olympics. In the margin he adds: \"My address is the old one. In a week I shall be home again.\""}, {"id": "P167", "n": "Белозёрское", "h": "", "r": "Донецкая область", "c": "Украина", "t": "город", "la": 48.4022, "lo": 37.0428, "z": "Обратный адрес Александра Николаевича Лухнёва (L015) на открытке матери в Усть-Каменогорск: «г. Белозёрск[ое], Донецк[ой], Маяковского 29, 5» (S134). Открытка напечатана 1 ноября 1970 года, значит отправлена не раньше 1971-го. Это заполняет часть провала между Артёмовским 1968 года и Харьковом: между ними он жил в донецком шахтёрском городке. ЧТЕНИЕ НЕ ОКОНЧАТЕЛЬНОЕ: название написано скорописью и обрывается, область читается как «Донецкой»; тот же почерк мог дать и «Белозерск» Вологодской области, но вместе с областью это маловероятно. Белозёрское — город с 1966 года в Добропольском районе, шахты «Белозёрская» и «Новодонецкая».", "ne": "Belozyorskoye", "re": "Donetsk oblast", "ce": "Ukraine", "ze": "Alexander Nikolayevich Lukhnev's (L015) return address on a postcard to his mother in Ust-Kamenogorsk: \"Belozyorsk[oye], Donetsk [region], Mayakovsky Street 29, flat 5\" (S134). The card was printed on 1 November 1970, so it was sent no earlier than 1971. This fills part of the gap between Artyomovsky in 1968 and Kharkiv: between them he lived in a Donbas mining town. THE READING IS NOT FINAL: the name is written in a running hand and breaks off, and the region reads as \"Donetsk\"; the same hand could also have given \"Belozersk\" in Vologda oblast, but together with the region that is unlikely. Belozyorskoye has been a town since 1966, in the Dobropillya district, with the Belozyorska and Novodonetska mines."}, {"id": "P169", "n": "Приход Мальмё Санкт-Петри (Malmö S:t Petri)", "h": "Malmö Sankt Petri församling", "r": "Мальмёхюс лен", "c": "Швеция", "t": "приход", "la": 55.606, "lo": 12.999, "z": "Городской приход в центре Мальмё. Здесь 27 сентября 1946 года родился Ян Рагнар Леонид Данилов (D014) — единственный сын Семёна Данилова от первого брака (S137). Приходские книги Мальмё лежат не в Riksarkivet, а в MALMÖ STADSARKIV — это отдельный городской архив.", "ne": "Malmö S:t Petri parish", "he": "Malmö Sankt Petri församling", "re": "Malmöhus County", "ce": "Sweden", "ze": "A city-centre parish of Malmö. Here, on 27 September 1946, Jan Ragnar Leonid Daniloff (D014) was born — Semyon Danilov's only son by his first marriage (S137). The Malmö parish books are held not in the Riksarkivet but in the MALMÖ STADSARKIV, a separate city archive."}, {"id": "P170", "n": "Эстерханинге (Österhaninge)", "h": "Österhaninge socken", "r": "Стокгольмский лен", "c": "Швеция", "t": "приход", "la": 59.167, "lo": 18.133, "z": "Приход к югу от Стокгольма, ныне в коммуне Ханинге. В 1947–1951 годах здесь в подворной книге записан двор, где жили Бронислава Данилова, урождённая Баволик (BW001), её второй муж Гжегож Здзислав Новак (NW001) и её сын от Семёна — Ян (D014). Шифр: Österhaninge AIIa:21 (1947–1951), Bild 300 / Sida 821 (S137).", "ne": "Österhaninge", "he": "Österhaninge socken", "re": "Stockholm County", "ce": "Sweden", "ze": "A parish south of Stockholm, today in Haninge municipality. Its household register for 1947–1951 records the household in which lived Bronisława Danilova née Bawolik (BW001), her second husband Grzegorz Zdzisław Nowak (NW001), and her son by Semyon, Jan (D014). Reference: Österhaninge AIIa:21 (1947–1951), Bild 300 / Sida 821 (S137)."}, {"id": "P171", "n": "Линчёпинг (Linköping)", "h": "", "r": "Эстергётланд", "c": "Швеция", "t": "город", "la": 58.4109, "lo": 15.6216, "z": "Город в Эстергётланде. Сюда переехала польская половина семьи: Ян (D014) числится по адресу Пильгатан 2 в переписи 1970 и 1971 годов, а отчим Гжегож Новак (NW001) умер здесь в 2006 году, живя в районе Шеггеторп. ВАЖНО ДЛЯ ПОИСКА: опись наследства заводят по месту прописки на момент смерти, поэтому дело Яна 1974 года надо искать в LINKÖPINGS TINGSRÄTT (фонд Landsarkivet i Vadstena), а не в Мальмё, как предполагалось в Q87 до 27.08.2026.", "ne": "Linköping", "re": "Östergötland", "ce": "Sweden", "ze": "A city in Östergötland. This is where the Polish half of the family moved: Jan (D014) is listed at Pilgatan 2 in the censuses of 1970 and 1971, and his stepfather Grzegorz Nowak (NW001) died here in 2006 while living in the Skäggetorp district. IMPORTANT FOR THE SEARCH: a probate inventory is opened where the person was registered at death, so Jan's 1974 inventory must be sought in the LINKÖPINGS TINGSRÄTT (held at Landsarkivet i Vadstena), not in Malmö as Q87 assumed before 27.08.2026."}, {"id": "P172", "n": "Пильгатан, 2 (Линчёпинг)", "h": "Pilgatan 2, 582 63 Linköping", "r": "Эстергётланд", "c": "Швеция", "t": "адрес", "la": 58.405, "lo": 15.63, "z": "Адрес Яна Рагнара Леонида Данилова (D014) в переписи населения Швеции 1970 года; там же он зарегистрирован и на 1971 год, то есть это постоянное жильё, а не временная отметка. Приход — Linköpings S:t Lars. Семейное положение в переписи: «ogift man», неженат (S137).", "a": 1, "ne": "Pilgatan 2 (Linköping)", "he": "Pilgatan 2, 582 63 Linköping", "re": "Östergötland", "ce": "Sweden", "ze": "The address of Jan Ragnar Leonid Daniloff (D014) in the Swedish population census of 1970; he is registered there for 1971 as well, so this was a settled home and not a temporary entry. The parish is Linköpings S:t Lars. Marital status in the census: \"ogift man\", unmarried (S137)."}, {"id": "P173", "n": "Повсин (Powsin)", "h": "Powsin", "r": "Мазовецкое воеводство", "c": "Польша", "t": "село", "la": 52.133, "lo": 21.09, "z": "Село под Варшавой, ныне часть городского района Вилянув. Место рождения Брониславы Леокадии Баволик (BW001) — так записано в списке польских рабочих завода Круппа в Магдебурге (S138). Совпадает с приходской книгой Эстерханинге по дате 20.04.1920.", "ne": "Powsin", "he": "Powsin", "re": "Masovian Voivodeship", "ce": "Poland", "ze": "A village south of Warsaw, today part of the Wilanów district of the city. The birthplace of Bronisława Leokadia Bawolik (BW001), as recorded in the list of Polish workers at the Krupp works in Magdeburg (S138). It agrees with the Österhaninge parish register on the date 20.04.1920."}, {"id": "P174", "n": "Магдебург-Букау (Magdeburg-Buckau)", "h": "Magdeburg-Buckau", "r": "Саксония-Анхальт", "c": "Германия", "t": "город", "la": 52.105, "lo": 11.64, "z": "Южный промышленный район Магдебурга. Здесь стоял завод Fried. Krupp-Grusonwerk A.G., куда была угнана Бронислава Баволик (BW001): по послевоенному списку она числится на работах с 3 мая по 22 июня 1943 года (S138). Отсюда — а не из лагеря — начинается её путь на запад, закончившийся в Мальмё.", "ne": "Magdeburg-Buckau", "he": "Magdeburg-Buckau", "re": "Saxony-Anhalt", "ce": "Germany", "ze": "The southern industrial district of Magdeburg. Here stood the Fried. Krupp-Grusonwerk A.G., to which Bronisława Bawolik (BW001) was deported: the post-war list records her at work from 3 May to 22 June 1943 (S138). It is from here — not from a camp — that her road west begins, the road that ended in Malmö."}, {"id": "P175", "n": "Лиманова (Limanowa)", "h": "Limanowa", "r": "Малопольское воеводство", "c": "Польша", "t": "город", "la": 49.705, "lo": 20.423, "z": "Городок в Малопольше, к юго-востоку от Кракова. Место рождения Гжегожа Здзислава Новака (NW001), отчима Яна Данилова: анкета Международной службы розыска, графа 5 — «LIMANOWA, POLEN» (S141).", "ne": "Limanowa", "he": "Limanowa", "re": "Lesser Poland Voivodeship", "ce": "Poland", "ze": "A small town in Lesser Poland, south-east of Kraków. Birthplace of Grzegorz Zdzisław Nowak (NW001), stepfather of Jan Daniloff: International Tracing Service questionnaire, field 5 — \"LIMANOWA, POLEN\" (S141)."}, {"id": "P176", "n": "Старый Сонч (Stary Sącz)", "h": "Alt Sandez", "r": "Малопольское воеводство", "c": "Польша", "t": "город", "la": 49.561, "lo": 20.635, "z": "Городок над Дунайцем в повяте Новы-Сонч. Здесь жила семья Новаков: последний адрес Марии Эльжбеты Новак перед арестом — ул. Мейска, 27 (в немецком документе «Miejska Gasse 27, Alt Sandez»), здесь её арестовало гестапо 15.10.1944, сюда же она и сын Гжегож (NW001) вернулись и жили до середины июля 1945 (S141, S142).", "ne": "Stary Sącz", "he": "Alt Sandez", "re": "Lesser Poland Voivodeship", "ce": "Poland", "ze": "A small town on the Dunajec in Nowy Sącz county. The Nowak family lived here: the last address of Maria Elisabeth Nowak before her arrest was 27 Miejska Street (given in the German document as \"Miejska Gasse 27, Alt Sandez\"); the Gestapo arrested her here on 15 October 1944, and here she and her son Grzegorz (NW001) returned and lived until mid-July 1945 (S141, S142)."}, {"id": "P177", "n": "Новы-Сонч (Nowy Sącz)", "h": "Neu Sandez", "r": "Малопольское воеводство", "c": "Польша", "t": "город", "la": 49.625, "lo": 20.697, "z": "Уездный город. В его тюрьме сидели оба Новака: Гжегож Здзислав (NW001) с 16.02.1941 и его мать Мария Эльжбета с 15.10.1944 — она освобождена через шесть недель, он в конце марта 1941 бежал с этапа (S141, S142).", "ne": "Nowy Sącz", "he": "Neu Sandez", "re": "Lesser Poland Voivodeship", "ce": "Poland", "ze": "A county town. Both Nowaks were held in its prison: Grzegorz Zdzisław (NW001) from 16 February 1941 and his mother Maria Elisabeth from 15 October 1944 — she was released after six weeks, he escaped from a transport at the end of March 1941 (S141, S142)."}, {"id": "P178", "n": "Кобыле-Гродек (Kobyle-Gródek)", "h": "", "r": "Малопольское воеводство", "c": "Польша", "t": "село", "la": 49.71, "lo": 20.61, "z": "Село в повяте Новы-Сонч (гмина Хелмец). Здесь 16 февраля 1941 года гестапо арестовало Гжегожа Здзислава Новака (NW001) — анкета Международной службы розыска, графа 13 (S141). Координаты приблизительные, по гмине.", "ne": "Kobyle-Gródek", "re": "Lesser Poland Voivodeship", "ce": "Poland", "ze": "A village in Nowy Sącz county (Chełmiec commune). Here, on 16 February 1941, the Gestapo arrested Grzegorz Zdzisław Nowak (NW001) — International Tracing Service questionnaire, field 13 (S141). The coordinates are approximate, taken from the commune."}, {"id": "P179", "n": "Краков (Kraków)", "h": "Krakau", "r": "Малопольское воеводство", "c": "Польша", "t": "город", "la": 50.0647, "lo": 19.945, "z": "Место рождения Марии Эльжбеты Новак, урождённой Строхальм (NW002), 10.09.1898 (S142). Рядом же, между Краковом и лагерем, в конце марта 1941 бежал с этапа её сын Гжегож (S141).", "ne": "Kraków", "he": "Krakau", "re": "Lesser Poland Voivodeship", "ce": "Poland", "ze": "Birthplace of Maria Elisabeth Nowak, née Strohalm (NW002), on 10 September 1898 (S142). Nearby, between Kraków and the camp, her son Grzegorz escaped from a transport at the end of March 1941 (S141)."}, {"id": "P180", "n": "Гданьск (Gdańsk)", "h": "Danzig", "r": "Поморское воеводство", "c": "Польша", "t": "город", "la": 54.352, "lo": 18.6466, "z": "Через Гданьск польская половина семьи ушла в Швецию: Мария Эльжбета Новак (NW002) жила здесь с августа 1945 по ноябрь 1946, её сын Гжегож (NW001) — в районе Вжещ до 16.11.1946, и 20 ноября 1946 года оба уплыли углевозом в Швецию (S141, S142).", "ne": "Gdańsk", "he": "Danzig", "re": "Pomeranian Voivodeship", "ce": "Poland", "ze": "The Polish half of the family left for Sweden through Gdańsk: Maria Elisabeth Nowak (NW002) lived here from August 1945 to November 1946, her son Grzegorz (NW001) in the Wrzeszcz district until 16 November 1946, and on 20 November 1946 both sailed to Sweden on a coal ship (S141, S142)."}, {"id": "P181", "n": "Ландскруна (Landskrona)", "h": "", "r": "Сконе", "c": "Швеция", "t": "город", "la": 55.87, "lo": 12.83, "z": "Портовый город в Сконе. Здесь в карантине для прибывших из Польши сидел до 6 января 1947 года Гжегож Здзислав Новак (NW001) — анкета МСР, графа 14 (S141).", "ne": "Landskrona", "re": "Skåne", "ce": "Sweden", "ze": "A port town in Skåne. Grzegorz Zdzisław Nowak (NW001) was held here in quarantine for arrivals from Poland until 6 January 1947 — ITS questionnaire, field 14 (S141)."}, {"id": "P182", "n": "Треллеборг (Trelleborg)", "h": "", "r": "Сконе", "c": "Швеция", "t": "город", "la": 55.3753, "lo": 13.1569, "z": "Паромный город на юге Швеции. Второй пункт после карантина в Ландскруне у Гжегожа Новака (NW001), начало 1947 года (S141).", "ne": "Trelleborg", "re": "Skåne", "ce": "Sweden", "ze": "A ferry town in southern Sweden. The second stop for Grzegorz Nowak (NW001) after the quarantine in Landskrona, early 1947 (S141)."}, {"id": "P183", "n": "Лунд (Lund)", "h": "", "r": "Сконе", "c": "Швеция", "t": "город", "la": 55.7047, "lo": 13.191, "z": "Университетский город в 18 км от Мальмё. Гжегож Новак (NW001) жил здесь с 1947 года по 23 декабря 1948 (S141) — то есть в то самое время и в том же лене, где Бронислава (BW001) растила годовалого Яна.", "ne": "Lund", "re": "Skåne", "ce": "Sweden", "ze": "A university town 18 km from Malmö. Grzegorz Nowak (NW001) lived here from 1947 until 23 December 1948 (S141) — that is, at the very time and in the very county where Bronisława (BW001) was raising the one-year-old Jan."}, {"id": "P184", "n": "Стокгольм (Stockholm)", "h": "", "r": "Стокгольмский лен", "c": "Швеция", "t": "город", "la": 59.3293, "lo": 18.0686, "z": "12 февраля 1949 года здесь Гжегож Здзислав Новак (NW001) и Бронислава, урождённая Баволик (BW001), заключили брак — его собственноручная анкета МСР, графа 11в (S141). Он жил в Стокгольме до августа 1955 года, потом семья перебралась в Линчёпинг.", "ne": "Stockholm", "re": "Stockholm County", "ce": "Sweden", "ze": "On 12 February 1949 Grzegorz Zdzisław Nowak (NW001) and Bronisława, née Bawolik (BW001), married here — his own handwritten ITS questionnaire, field 11c (S141). He lived in Stockholm until August 1955, after which the family moved to Linköping."}, {"id": "P185", "n": "Стурегатан, 31 (Сундбюберг)", "h": "Sturegatan 31/III, Sundbyberg", "r": "Стокгольмский лен", "c": "Швеция", "t": "адрес", "la": 59.361, "lo": 17.971, "z": "Адрес Марии Эльжбеты Новак (NW002) в ноябре 1965 года — по анкете МСР и письму её адвоката (S142). С какого года она там жила, документы не говорят.", "a": 1, "ne": "Sturegatan 31 (Sundbyberg)", "he": "Sturegatan 31/III, Sundbyberg", "re": "Stockholm County", "ce": "Sweden", "ze": "The address of Maria Elisabeth Nowak (NW002) in November 1965, from the ITS questionnaire and her lawyer's letter (S142). From what year she lived there, the documents do not say."}, {"id": "P187", "n": "Озеро Рингшён (Ringsjön), дача «Даниловка»", "h": "", "r": "Сконе", "c": "Швеция", "t": "озеро", "la": 55.87, "lo": 13.53, "z": "Загородный дом Семёна Данилова (D008), который он сам зовёт «Даниловкой»: «У меня есть маленькая избушка на берегу озера. Это около 60 километров от Мальмё» (8.10.73, S149). Озеро он называет и переводит сам: «озеро (Ringsjö = „Круглое озеро“ — на самом же деле оно больше походит на восьмёрку)» — и это верно, Рингшён в Сконе состоит из сцепленных плёсов (Западный, Восточный и Сэтофтасён). КООРДИНАТЫ — ЭТО СЕРЕДИНА ОЗЕРА, А НЕ ДОМ: где именно на берегу стояла «Даниловка», в письмах не сказано. Расстояние по дороге от Мальмё около 50-60 км, что сходится с его «около 60»", "ne": "Lake Ringsjön, the \"Danilovka\" dacha", "re": "Skåne", "ce": "Sweden", "ze": "The country house of Semyon Danilov (D008), which he himself calls \"Danilovka\": \"I have a little hut on the shore of a lake. It is about 60 kilometres from Malmö\" (8 October 1973, S149). He names and translates the lake himself: \"the lake (Ringsjö = 'Round Lake' — though in fact it looks more like a figure of eight)\" — and he is right: Ringsjön in Skåne consists of linked basins (Western, Eastern and Sätoftasjön). THE COORDINATES ARE THE MIDDLE OF THE LAKE, NOT THE HOUSE: where exactly on the shore \"Danilovka\" stood is not said in the letters. The road distance from Malmö is about 50-60 km, which agrees with his \"about 60\""}, {"id": "P188", "n": "Вулиця Гвардійців-Залізничників (бывшая Усовская), Харьков", "h": "Усовская ул., г. Харьковъ", "r": "Харьковская область", "c": "Украина", "t": "улица", "la": 49.9836833, "lo": 36.1994806, "z": "Адрес с печатной визитной карточки Леонида Прокофьевича Данилова (D002): «Харьковъ, Усовская ул. 49» (S151, KD0516). УЛИЦА ОПОЗНАНА 02.09.2026 (S160). Усовская названа по жившему на ней купцу Дмитрию Лаврентьевичу Усу, торговавшему мукой; С 1968 ГОДА ОНА НОСИТ ИМЯ ГВАРДЕЙЦЕВ ЖЕЛЕЗНОДОРОЖНИКОВ — в честь 1-й гвардейской Варшавской железнодорожной бригады, сформированной в Харькове в 1941 году. Это Холодногорская сторона: Новобаварский район, местность Карповка, рядом железнодорожные мастерские; в путеводителе 1881 года улица числится по 3-й части, 6-му участку, встык с Холодногорской. Координаты поставлены по дому 49, который на этой улице существует и сегодня (OpenStreetMap, 49.9836833/36.1994806, индекс 61093). ОГОВОРКА ТА ЖЕ, ЧТО И ПО КЛОЧКОВСКОЙ (P145): нумерация домов за сто лет менялась, и точка означает отрезок улицы у нынешнего дома 49, а не доказанное жильё. Что улица та самая — надёжно; что дом тот самый — нет.", "a": 1, "ne": "Hvardiitsiv-Zaliznychnykiv Street (formerly Usovskaya), Kharkiv", "he": "Usovskaya St, the city of Kharkov", "re": "Kharkiv Oblast", "ce": "Ukraine", "ze": "The address on the printed visiting card of Leonid Prokofyevich Danilov (D002): \"Kharkiv, Usovskaya St. 49\" (S151, KD0516). THE STREET WAS IDENTIFIED ON 2 September 2026 (S160). Usovskaya was named after the merchant Dmitry Lavrentyevich Us, a flour trader who lived on it; SINCE 1968 IT HAS BORNE THE NAME OF THE RAILWAY GUARDSMEN, in honour of the 1st Guards Warsaw Railway Brigade formed in Kharkiv in 1941. This is the Kholodna Hora side of the city: today's Novobavarskyi district, the Karpivka locality, next to the railway workshops; the 1881 guidebook lists the street in the 3rd part, 6th precinct, adjoining Kholodnogorskaya. The coordinates are placed on house 49, which still exists on this street today (OpenStreetMap, 49.9836833/36.1994806, postcode 61093). THE SAME CAVEAT AS FOR KLOCHKOVSKA (P145): house numbering has changed over a hundred years, and the point marks the stretch of street by today's house 49, not a proven dwelling. That the street is the right one is reliable; that the house is, is not."}, {"id": "P189", "n": "Архангельск", "h": "губернский город Архангельской губернии", "r": "", "c": "Россия", "t": "город", "la": 64.5393, "lo": 40.5169, "z": "", "ne": "Arkhangelsk", "he": "the capital of Arkhangelsk governorate", "ce": "Russia"}, {"id": "P192", "n": "Кабаты", "h": "Kabaty, деревня прихода св. Эльжбеты в Повсине; ныне городской район Варшавы", "r": "", "c": "Польша", "t": "деревня", "la": 52.129, "lo": 21.06, "z": "", "ne": "Kabaty", "he": "Kabaty, a village of the parish of St Elizabeth in Powsin; now a district of Warsaw", "ce": "Poland"}, {"id": "P193", "n": "Путинцево", "h": "Зыряновский район, Восточно-Казахстанская область", "r": "", "c": "Казахстан", "t": "село", "la function plural(n,one,few,many){
  const a=Math.abs(n)%100,b=a%10;
  if(a>10&&a<20)return many;
  if(b>1&&b<5)return few;
  return b===1?one:many;
}
