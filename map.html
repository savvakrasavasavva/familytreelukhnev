ked that their biography not be published"}, {"id": "P67", "n": "Керчь", "h": "", "r": "Крым", "c": "", "t": "город", "la": 45.3531, "lo": 36.4715, "z": "Керченская детская трудовая колония имени Томского, где Антонина Леонидовна (L009) работала воспитательницей 06.03.1928–08.01.1929 (S59)", "ne": "Kerch", "re": "Crimea", "ze": "The Kerch children's labour colony named after Tomsky, where Antonina Leonidovna (L009) worked as a carer from 6 March 1928 to 8 January 1929 (S59)"}, {"id": "P68", "n": "Таманская", "h": "", "r": "Темрюкский район, Краснодарский край", "c": "Россия", "t": "станица", "la": 45.2117, "lo": 36.7175, "z": "Детский дом имени павших таманцев: Антонина Леонидовна (L009) работала там воспитательницей 16.10.1925–25.10.1926 (S59)", "ne": "Tamanskaya", "re": "Temryuk District, Krasnodar Krai", "ce": "Russia", "ze": "The children's home named after the fallen Taman men: Antonina Leonidovna (L009) worked there as a carer from 16 October 1925 to 25 October 1926 (S59)"}, {"id": "P69", "n": "Фонталовская", "h": "", "r": "Темрюкский район, Краснодарский край", "c": "Россия", "t": "станица", "la": 45.3392, "lo": 36.9214, "z": "Школа I ступени, где Антонина Леонидовна (L009) две недели ноября 1926 замещала учительницу Мартынову (S59)", "ne": "Fontalovskaya", "re": "Temryuk District, Krasnodar Krai", "ce": "Russia", "ze": "The first-stage school where Antonina Leonidovna (L009) stood in for the teacher Martynova for two weeks in November 1926 (S59)"}, {"id": "P70", "n": "Курчанская", "h": "", "r": "Темрюкский район, Краснодарский край", "c": "Россия", "t": "станица", "la": 45.2825, "lo": 37.4867, "z": "Детясли колхоза «Памяти 21»: Антонина Леонидовна (L009) была там медсестрой лето 1930 (S59)", "ne": "Kurchanskaya", "re": "Temryuk District, Krasnodar Krai", "ce": "Russia", "ze": "The crèche of the \"Pamyati 21\" (In Memory of the 21) collective farm: Antonina Leonidovna (L009) was a nurse there in the summer of 1930 (S59)"}, {"id": "P71", "n": "Понежукай", "h": "", "r": "Теучежский район, Адыгея", "c": "Россия", "t": "аул", "la": 44.7592, "lo": 39.1039, "z": "Центр Псекупского (Понежукайского) района Адыгейской автономной области: оттуда шли назначения Антонине Леонидовне (L009) в 1930–1931 (S59)", "ne": "Ponezhukay", "re": "Teuchezhsky District, Adygea", "ce": "Russia", "ze": "The centre of Psekupsky (Ponezhukaysky) District of the Adyghe Autonomous Region: this is where the appointments issued to Antonina Leonidovna (L009) in 1930–1931 came from (S59)"}, {"id": "P72", "n": "Красногвардейское", "h": "", "r": "Красногвардейский район, Адыгея", "c": "Россия", "t": "село", "la": 45.0417, "lo": 39.25, "z": "Отдел народного образования, переведший Антонину Леонидовну (L009) заведующей школой в октябре 1931 (S59)", "ne": "Krasnogvardeyskoye", "re": "Krasnogvardeysky District, Adygea", "ce": "Russia", "ze": "The department of public education that transferred Antonina Leonidovna (L009) to be head of a school in October 1931 (S59)"}, {"id": "P75", "n": "Поспелиха", "h": "", "r": "Поспелихинский район, Алтайский край", "c": "Россия", "t": "село", "la": 51.9553, "lo": 81.8261, "z": "Место рождения Лидии Сергеевны Трубниковой (L017) 16.03.1937 по свидетельству о рождении (S60). Новая для рода география — Алтай", "ne": "Pospelikha", "re": "Pospelikha District, Altai Krai", "ce": "Russia", "ze": "Birthplace of Lidia Sergeyevna Trubnikova (L017), 16 March 1937, according to her birth certificate (S60). New geography for the family — the Altai"}, {"id": "P76", "n": "Хайфа", "h": "", "r": "Хайфский округ", "c": "Израиль", "t": "город", "la": 32.794, "lo": 34.9896, "z": "Университетский город. Кто из родни здесь работает — в приватном слое: человек попросил не публиковать свою биографию", "ne": "Haifa", "re": "Haifa District", "ce": "Israel", "ze": "A university city. Which of the family works here is in the private layer: the person asked that their biography not be published"}, {"id": "P77", "n": "Дача Лухнёвых за Иртышом", "h": "", "r": "Усть-Каменогорск, Восточно-Казахстанская область", "c": "Казахстан", "t": "дача", "la": 49.934743, "lo": 82.554787, "z": "Дачу показал Савва 15.08.2026 на карте — ПРИМЕРНО, по памяти. Сходится с описанием, которое он давал раньше: за Иртышом, «через главный мост 10 минут, налево после главной и потом первый или второй поворот направо, около горы». Названия дачного общества он не помнит — его и надо выяснить, чтобы дойти до списков садоводов", "a": 1, "ne": "The Lukhnevs' dacha across the Irtysh", "re": "Ust-Kamenogorsk, East Kazakhstan oblast", "ce": "Kazakhstan", "ze": "Savva showed the dacha on the map on 15 August 2026 — APPROXIMATELY, from memory. It fits the description he gave earlier: across the Irtysh, \"ten minutes over the main bridge, left after the main road and then the first or second turning to the right, near the hill\". He does not remember the name of the dacha association — and that is what has to be found out in order to get to the lists of allotment holders"}, {"id": "P78", "n": "Гараж Николая Николаевича", "h": "", "r": "Усть-Каменогорск, Восточно-Казахстанская область", "c": "Казахстан", "t": "гараж", "la": 49.980313, "lo": 82.590128, "z": "Гаражный кооператив, где стоял гараж деда — точку показал Савва 15.08.2026 на карте. Название кооператива не помнит. Около километра к северо-востоку от дома на Добролюбова, 43", "a": 1, "ne": "Nikolai Nikolayevich's garage", "re": "Ust-Kamenogorsk, East Kazakhstan oblast", "ce": "Kazakhstan", "ze": "The garage cooperative where Grandfather's garage stood — Savva showed the spot on the map on 15 August 2026. He does not remember the name of the cooperative. About a kilometre north-east of the house at 43 Dobrolyubova Street"}, {"id": "P79", "n": "Кургоминская волость", "h": "Кургоминская волость Шенкурского уезда Архангельской губ.; в XVI–XVIII вв. Кургоминская боярщина, Нижняя треть Подвинской четверти Важского уезда", "r": "Виноградовский район, Архангельская область", "c": "Россия", "t": "волость", "la": 62.642384, "lo": 43.50375, "z": "Административная рамка второго, шенкурского гнезда фамилии. Центр — д. Большая Зиновьевская (Кургомень); на 1905 восемь сельских обществ: Верхнеборецкое, Заостровское, Кургоминское, Нижнеборецкое, Селецкое, Топецкое, Троицкое, Тулгасское; 17,1 тыс. жителей на 1.01.1928. В 1929 волость вошла в Березниковский (ныне Виноградовский) район — тот же, где стоят Горличевская и Горлышевская (P33, Q91). Отсюда четверо Лухнёвых Первой мировой — LU020, LU021, LU022, LU023 (S62). ГЛАВНОЕ ДЛЯ РОДА: до 1784 года это Нижняя треть ПОДВИНСКОЙ четверти Важского уезда, а Верхотоемская волость с родовым гнездом — Средняя треть той же Подвинской четверти того же уезда (РГАДА ф. 350 оп. 1 д. 46, 1716 г.). То есть шенкурский и верхнетоемский кусты Лухнёвых сидят в одной податной единице, а не в разных губерниях. Координаты по д. Кургомень.", "ne": "Kurgomen volost", "he": "Kurgomen volost (rural district), Shenkursk uyezd (county), Arkhangelsk governorate; in the 16th–18th centuries the Kurgomen boyarshchina, Lower Third of the Podvinye chetvert (quarter) of Vaga uyezd", "re": "Vinogradovsky District, Arkhangelsk Region", "ce": "Russia", "ze": "The administrative frame of the second, Shenkursk nest of the surname. Its centre was the village of Bolshaya Zinovyevskaya (Kurgomen); in 1905 it held eight rural communities — Verkhneboretskoye, Zaostrovskoye, Kurgominskoye, Nizhneboretskoye, Seletskoye, Topetskoye, Troitskoye and Tulgasskoye — and 17,100 inhabitants as of 1 January 1928. In 1929 the volost was absorbed into Berezniki (now Vinogradovsky) district, the same one that contains Gorlichevskaya and Gorlyshevskaya (P33, Q91). Four Lukhnevs of the First World War came from here: LU020, LU021, LU022 and LU023 (S62). THE KEY POINT FOR THE FAMILY: until 1784 this was the Lower Third of the PODVINYE chetvert (quarter) of Vaga uyezd (county), while Verkhnyaya Toyma volost with the ancestral nest was the Middle Third of the same Podvinye chetvert of the same uyezd (RGADA (Russian State Archive of Ancient Acts), f. 350, op. 1, d. 46, 1716). That is, the Shenkursk and Verkhnyaya Toyma branches of the Lukhnevs sat inside one and the same tax district, not in different governorates. The coordinates are those of the village of Kurgomen."}, {"id": "P80", "n": "Сельцо", "h": "д. Сельцо, Селецкое сельское общество Кургоминской волости Шенкурского уезда", "r": "Заостровское с/п, Виноградовский район, Архангельская область", "c": "Россия", "t": "деревня", "la": 62.48539, "lo": 43.778828, "z": "Место рождения Ивана (LU022) и Василия Павловича (LU023) Лухнёвых, солдат Первой мировой из Кургоминской волости (P79). В карточках потерь одного из них место записано «Общ.-Сельцо» — это не другая деревня, а сокращение «общество Сельцо», то есть Селецкое сельское общество; поэтому оба отнесены сюда. Стоит в 5 км от д. Горлышевской (Селецкий с/с), где документально сидят ещё двое Лухнёвых, см. Q91. В XVII–XVIII вв. Селецкая волость — Подвинская четверть Важского уезда (перечневая книга итогов переписи 1678 г., РГАДА ф. 350 оп. 1 д. 51), та же четверть, что и Верхотоемская.", "ne": "Seltso", "he": "the village of Seltso, Seletskoye rural community, Kurgomen volost, Shenkursk uyezd", "re": "Zaostrovskoye rural settlement, Vinogradovsky District, Arkhangelsk Region", "ce": "Russia", "ze": "The birthplace of Ivan (LU022) and Vasily Pavlovich (LU023) Lukhnev, First World War soldiers from Kurgomen volost (rural district) (P79). On the casualty cards of one of them the place is written \"Obshch.-Seltso\" — not a different village but an abbreviation of \"the Seltso obshchestvo\", the Seltso rural community; both men are therefore placed here. It stands 5 km from the village of Gorlyshevskaya (Seletsky village soviet), where two more Lukhnevs are documented, see Q91. In the seventeenth and eighteenth centuries Seletskaya volost belonged to the Podvinye chetvert (quarter) of Vaga uyezd (county) — the summary book of the results of the 1678 census, RGADA (Russian State Archive of Ancient Acts), f. 350, op. 1, d. 51 — the same quarter as Verkhnyaya Toyma."}, {"id": "P82", "n": "Пэмпхилл (Pamphill)", "h": "Пэмпхилл, Дорсет", "r": "Дорсет", "c": "Великобритания", "t": "село", "la": 50.8075, "lo": -2.0169, "z": "Деревня под Уимборном; школа Pamphill CE First School, где в 1990-е учительствовала Дуня Вуд (S70). Рядом усадьба Кингстон-Лейси", "ne": "Pamphill", "he": "Pamphill, Dorset", "re": "Dorset", "ce": "United Kingdom", "ze": "A village near Wimborne; Pamphill CE First School, where Dunja Wood taught in the 1990s (S70). The Kingston Lacy estate is nearby"}, {"id": "P83", "n": "Переулок Желябова, 27", "h": "", "r": "Калининград, Калининградская область", "c": "Россия", "t": "дом", "la": 54.726862, "lo": 20.499055, "z": "Дом, где Савва (L027) жил с рождения в 1995 году с матерью Юлией Николаевной (L021), а с 2008 — и с дедом Николаем Николаевичем (L013); переехали на Воейкова в 9 классе Саввы. Со слов Саввы 18.08.2026. ТОЧКА ПОСТАВЛЕНА НА ПЕРЕУЛОК, А НЕ НА ДОМ: в OpenStreetMap дом 27 отдельным объектом не значится, координаты — середина переулка Желябова в районе Хуфен. Дом надо показать на карте самому (Q168)", "a": 1, "ne": "27 Zhelyabova Lane", "re": "Kaliningrad, Kaliningrad oblast", "ce": "Russia", "ze": "The house where Savva (L027) lived from his birth in 1995 with his mother Yulia Nikolayevna (L021), and from 2008 with his grandfather Nikolai Nikolayevich (L013) as well; they moved to Voyeykova Street when Savva was in the 9th form. As told by Savva, 18 August 2026. THE POINT IS SET ON THE LANE, NOT ON THE HOUSE: house 27 does not appear as a separate object in OpenStreetMap, and the coordinates are the middle of Zhelyabova Lane in the Hufen area. The house needs to be shown on the map by hand (Q168)"}, {"id": "P84", "n": "Улица Фёдора Воейкова, 11", "h": "", "r": "Калининград, Калининградская область", "c": "Россия", "t": "дом", "la": 54.745529, "lo": 20.495133, "z": "Второй калининградский адрес семьи: переехали, когда Савва (L027) пошёл в 9 класс, то есть около 2009 года. Здесь же жил дед Николай Николаевич (L013) до смерти в 2024. Со слов Саввы 18.08.2026. Координаты — на сам дом 11 по улице Фёдора Воейкова (Ленинградский район), OpenStreetMap, 18.08.2026", "a": 1, "ne": "11 Fyodor Voyeykov Street", "re": "Kaliningrad, Kaliningrad oblast", "ce": "Russia", "ze": "The family's second Kaliningrad address: they moved when Savva (L027) started the 9th form, that is, around 2009. His grandfather Nikolai Nikolayevich (L013) also lived here until his death in 2024. As told by Savva, 18 August 2026. The coordinates are on house 11 on Fyodor Voyeykov Street itself (Leningradsky district), OpenStreetMap, 18 August 2026"}, {"id": "P85", "n": "Школа № 7 (ул. Горького, 66)", "h": "", "r": "Калининград, Калининградская область", "c": "Россия", "t": "школа", "la": 54.729198, "lo": 20.51172, "z": "МАОУ СОШ № 7 города Калининграда, ул. Горького, 66 (236029). Савва (L027) отучился здесь с 1 по 11 класс, кроме первой половины 8-го, которую провёл в кадетском корпусе (P88). Адрес и ОГРН 1023901001530 — из открытых реестров, координаты OpenStreetMap, 18.08.2026", "a": 1, "ne": "School no. 7 (66 Gorky Street)", "re": "Kaliningrad, Kaliningrad oblast", "ce": "Russia", "ze": "Kaliningrad Municipal Autonomous Educational Institution Secondary School no. 7, 66 Gorky Street (236029). Savva (L027) studied here from the 1st to the 11th form, apart from the first half of the 8th, which he spent at the cadet corps (P88). The address and the state registration number 1023901001530 come from open registers; coordinates from OpenStreetMap, 18 August 2026"}, {"id": "P86", "n": "Детский сад № 102 (Калужский пер., 7)", "h": "", "r": "Калининград, Калининградская область", "c": "Россия", "t": "детский сад", "la": 54.727545, "lo": 20.497155, "z": "МАДОУ ЦРР «Детский сад № 102», Калужский переулок, 7 (236022) — по открытым справочникам, 18.08.2026. Савва (L027) ходил сюда до школы. Сад и дом на Желябова стоят в одном квартале района Хуфен, метрах в двухстах друг от друга. ТОЧКА ПОСТАВЛЕНА НА ПЕРЕУЛОК: дом 7 отдельным объектом в OpenStreetMap не значится", "a": 1, "ne": "Kindergarten no. 102 (7 Kaluzhsky Lane)", "re": "Kaliningrad, Kaliningrad oblast", "ce": "Russia", "ze": "Municipal Autonomous Preschool Educational Institution, Child Development Centre \"Kindergarten no. 102\", 7 Kaluzhsky Lane (236022) — from open directories, 18 August 2026. Savva (L027) attended it before school. The kindergarten and the house on Zhelyabova stand in the same block of the Hufen area, some two hundred metres apart. THE POINT IS SET ON THE LANE: house 7 does not appear as a separate object in OpenStreetMap"}, {"id": "P87", "n": "Музыкальная школа им. Р. М. Глиэра (ул. Огарёва, 22)", "h": "", "r": "Калининград, Калининградская область", "c": "Россия", "t": "музыкальная школа", "la": 54.718229, "lo": 20.469249, "z": "МАУ ДО «Детская музыкальная школа имени Р. М. Глиэра», основана в 1946. Савва (L027) занимался здесь с трёх лет до 10 класса — параллельно с общеобразовательной школой. У школы ДВА ЗДАНИЯ: ул. Огарёва, 22 (вилла Йоахим в Амалиенау — на неё и поставлена точка) и ул. Минина и Пожарского, 4. В каком из них он учился, не уточнено (Q168). Координаты OpenStreetMap, 18.08.2026", "a": 1, "ne": "R. M. Glière Music School (22 Ogaryov Street)", "re": "Kaliningrad, Kaliningrad oblast", "ce": "Russia", "ze": "Municipal Autonomous Institution of Supplementary Education \"R. M. Glière Children's Music School\", founded 1946. Savva (L027) studied here from the age of three until the 10th form, alongside his general school. The school has TWO BUILDINGS: 22 Ogaryov Street (the Joachim villa in Amalienau — the point is set on this one) and 4 Minin and Pozharsky Street. Which of them he attended has not been clarified (Q168). Coordinates from OpenStreetMap, 18 August 2026"}, {"id": "P88", "n": "Кадетский морской корпус Андрея Первозванного (пер. Желябова, 9)", "h": "", "r": "Калининград, Калининградская область", "c": "Россия", "t": "школа", "la": 54.726828, "lo": 20.498839, "z": "Кадетская школа-интернат «Кадетский морской корпус Андрея Первозванного», пер. Желябова, 9 (236022). Савва (L027) проучился здесь первую половину 8 класса. СОВПАДЕНИЕ, КОТОРОЕ СТОИТ ЗАМЕТИТЬ: корпус стоит в том же переулке Желябова, что и дом семьи (P83), — через несколько домов. Адрес и координаты по открытым справочникам и OpenStreetMap, 18.08.2026", "a": 1, "ne": "Andrew the First-Called Naval Cadet Corps (9 Zhelyabova Lane)", "re": "Kaliningrad, Kaliningrad oblast", "ce": "Russia", "ze": "The Andrew the First-Called Naval Cadet Corps boarding school, 9 Zhelyabova Lane (236022). Savva (L027) spent the first half of the 8th form here. A COINCIDENCE WORTH NOTING: the corps stands in the same Zhelyabova Lane as the family house (P83), a few doors away. Address and coordinates from open directories and OpenStreetMap, 18 August 2026"}, {"id": "P89", "n": "МГУПИ, ныне корпус РТУ МИРЭА (ул. Стромынка, 20)", "h": "Московский государственный университет приборостроения и информатики", "r": "Москва", "c": "Россия", "t": "университет", "la": 55.79385, "lo": 37.699946, "z": "Ул. Стромынка, 20, район Сокольники — то самое здание «около Преображенской площади», куда Савва (L027) поступил в 2012 на прикладную математику. При поступлении вуз назывался МГУПИ; приказом Минобрнауки от 09.06.2014 № 646 МГУПИ присоединён к МИРЭА, так что учиться он начал в одном вузе, а заканчивал уже в другом — ныне это корпус Института кибербезопасности и цифровых технологий РТУ МИРЭА. Координаты OpenStreetMap, 18.08.2026", "a": 1, "ne": "MGUPI, today a building of RTU MIREA (20 Stromynka Street)", "he": "Moscow State University of Instrument Engineering and Computer Science", "re": "Moscow", "ce": "Russia", "ze": "20 Stromynka Street, the Sokolniki district — the very building \"near Preobrazhenskaya Square\" where Savva (L027) enrolled in 2012 to read applied mathematics. When he entered, the institution was called MGUPI; by order of the Ministry of Education and Science of 9 June 2014 no. 646 MGUPI was merged into MIREA, so he began his studies at one university and finished at another — today it is a building of the Institute of Cybersecurity and Digital Technologies of RTU MIREA. Coordinates from OpenStreetMap, 18 August 2026"}, {"id": "P90", "n": "РУДН, главное здание (ул. Миклухо-Маклая, 6)", "h": "", "r": "Москва", "c": "Россия", "t": "университет", "la": 55.652144, "lo": 37.499186, "z": "Российский университет дружбы народов, главное здание, ул. Миклухо-Маклая, 6. Савва (L027) учился здесь два года по направлению «фундаментальная информатика». Координаты OpenStreetMap, 18.08.2026", "a": 1, "ne": "RUDN, main building (6 Miklukho-Maklaya Street)", "re": "Moscow", "ce": "Russia", "ze": "Peoples' Friendship University of Russia, main building, 6 Miklukho-Maklaya Street. Savva (L027) studied here for two years in the programme \"fundamental informatics\". Coordinates from OpenStreetMap, 18 August 2026"}, {"id": "P91", "n": "РТУ МИРЭА (просп. Вернадского, 78)", "h": "", "r": "Москва", "c": "Россия", "t": "университет", "la": 55.669896, "lo": 37.480536, "z": "Главный корпус РТУ МИРЭА у метро «Юго-Западная» — тот самый «уже на Юго-Западной». Савва (L027) прошёл здесь аспирантуру по системному анализу. Координаты OpenStreetMap, 18.08.2026", "a": 1, "ne": "RTU MIREA (78 Vernadsky Avenue)", "re": "Moscow", "ce": "Russia", "ze": "The main building of RTU MIREA by the Yugo-Zapadnaya metro station — the very \"already at Yugo-Zapadnaya\". Savva (L027) took his postgraduate studies here in systems analysis. Coordinates from OpenStreetMap, 18 August 2026"}, {"id": "P92", "n": "Улица Добролюбова, 43", "h": "", "r": "Усть-Каменогорск, Восточно-Казахстанская область", "c": "Казахстан", "t": "дом", "la": 49.973565, "lo": 82.58158, "z": "Дом Николая Николаевича (L013) и Лидии Сергеевны (L017) с 1965 года: здесь родилась и выросла Юлия Николаевна (L021), отсюда дед уехал в Калининград после смерти жены в 2008. Раньше адрес жил только в заметке к отрезку жизни; теперь это место, потому что рядом стоят дача за Иртышом (P77) и гараж (P78) — весь усть-каменогорский узел виден на карте разом. Дом показал Савва на карте 15.08.2026; прежде в дереве стоял номер 48, названный по памяти и оказавшийся неверным", "a": 1, "ne": "43 Dobrolyubova Street", "re": "Ust-Kamenogorsk, East Kazakhstan oblast", "ce": "Kazakhstan", "ze": "The home of Nikolai Nikolayevich (L013) and Lidia Sergeyevna (L017) from 1965: here Yulia Nikolayevna (L021) was born and grew up, and from here the grandfather left for Kaliningrad after his wife's death in 2008. The address previously lived only in the note to a period of his life; now it is a place, because the dacha beyond the Irtysh (P77) and the garage (P78) stand beside it — the whole Ust-Kamenogorsk cluster can be seen on the map at once. The house was shown on the map by Savva on 15 August 2026; the tree previously carried number 48, given from memory and proved wrong"}, {"id": "P93", "n": "Улица Андрея Белого, 2", "h": "", "r": "Железнодорожный, Балашиха, Московская область", "c": "Россия", "t": "дом", "la": 55.742434, "lo": 38.004904, "z": "Квартира 210 — дом, где Савва (L027) жил с сыновьями и Руфиной (KH002) до отъезда из России. Оба свидетельства о регистрации по месту пребывания (S76) выписаны на этот адрес, срок в обоих — до 25.04.2029, то есть регистрация жива до сих пор, хотя семья уехала в 2022. Отсюда до садика «ЮНЭК» (P94) полтора километра, до школы «Берёзка» (P95) — километр: оба ребёнка учились рядом с домом", "a": 1, "ne": "2 Andrey Bely Street", "re": "Zheleznodorozhny, Balashikha, Moscow oblast", "ce": "Russia", "ze": "Flat 210 — the house where Savva (L027) lived with his sons and Rufina (KH002) before leaving Russia. Both certificates of registration by place of stay (S76) are made out to this address, and the term in both runs to 25 April 2029, so the registration is still live although the famil
