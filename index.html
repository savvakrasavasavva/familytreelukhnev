<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Родословная Лухнёвых</title>
<meta name="description" content="Родословная рода Лухнёвых, 1854–2005, 146 человек.">
<style>
*{box-sizing:border-box}
:root{--paper:#EDEDE9;--card:#FBFBF8;--ink:#1B1B1A;--soft:#6E6E68;--rail:#C0392B;
--stamp:#2C4A6E;--rule:#CFCFC8;
--serif:Georgia,"PT Serif","Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:11px 16px 9px;border-bottom:1px solid var(--rule);position:relative;z-index:30;background:var(--paper)}
h1{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
h1 em{font-style:normal;color:var(--rail)}
.sub{font-size:11px;color:var(--soft);font-family:var(--mono);margin-top:2px}
#langrow{position:absolute;top:10px;right:14px;z-index:31}
#lang{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--rule);
background:var(--card);color:inherit;border-radius:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px}
input[type=search]{font:inherit;padding:5px 9px;border:1px solid var(--rule);background:var(--card);
border-radius:2px;min-width:170px;flex:0 1 230px}
input:focus,button:focus-visible{outline:2px solid var(--stamp);outline-offset:1px}
.chip{padding:5px 9px;border:1px solid var(--rule);background:transparent;border-radius:2px;
font-size:12.5px;color:var(--soft);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.chip.plain{color:var(--ink)}
a.chip{text-decoration:none;display:inline-block}
#hits{display:inline-flex;align-items:center;gap:4px}
.hn{font-family:var(--mono);font-size:11px;color:var(--soft);min-width:52px;text-align:center}
.sep{width:1px;height:18px;background:var(--rule);margin:0 2px}
#stage{position:absolute;left:0;right:0;bottom:0;top:var(--hh,110px);overflow:auto;cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:relative;transform-origin:0 0}
#wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.gband{position:absolute;left:0;height:1px;background:var(--rule);opacity:.6}
.glab{position:absolute;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
text-transform:uppercase;color:var(--soft);background:var(--paper);padding:1px 6px;
z-index:7;border:1px solid var(--rule);border-radius:2px;white-space:nowrap}
.card{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:1px;
padding:5px 8px;border:1.5px solid var(--ink);background:var(--card);border-radius:2px;
text-align:center;overflow:hidden}
.card:hover{background:#fff;z-index:5}
.card.low{border-style:dashed;border-color:var(--rail)}
.card.dl{border-width:2.5px;border-color:var(--stamp)}
.card.alive::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;
border-radius:50%;background:var(--stamp)}
.card[aria-current=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.card[aria-current=true] .yr{color:#C5D4E5}
.nm{font-family:var(--serif);font-size:12.5px;line-height:1.2}
.yr{font-family:var(--mono);font-size:10px;color:var(--soft)}
.card.dim{opacity:.16}
.tg{position:absolute;width:19px;height:19px;border:1.5px solid var(--rail);background:var(--paper);
border-radius:50%;font-size:11px;line-height:1;color:var(--rail);padding:0;font-family:var(--mono);z-index:6}
.tgc{position:absolute;font-family:var(--mono);font-size:9.5px;color:var(--soft);z-index:6;
background:var(--paper);padding:0 2px}
mark{background:#F6E58D;color:inherit;padding:0 1px}
#panel{position:fixed;right:14px;bottom:14px;width:300px;max-height:58vh;overflow:auto;
border:1.5px solid var(--ink);background:var(--card);padding:14px 15px;border-radius:2px;
z-index:40;box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
#panel.on{display:block}
#panel h2{font-family:var(--serif);font-size:16px;font-weight:400;margin:0 0 2px;line-height:1.25}
#panel .pid{font-family:var(--mono);font-size:10px;color:var(--soft)}
#close{position:absolute;top:8px;right:9px;border:0;background:none;font-size:17px;color:var(--soft)}
dl{margin:12px 0 0;font-size:12.5px}
dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin-top:10px}
dd{margin:2px 0 0;line-height:1.45}
#panel a{color:var(--stamp);cursor:pointer;border-bottom:1px dotted var(--stamp)}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;padding:2px 5px;
border:1px solid var(--rule);border-radius:2px;margin:5px 4px 0 0}
.tag.low{border-color:var(--rail);color:var(--rail)}
.tag.dl{border-color:var(--stamp);color:var(--stamp)}
/* ── панель фильтров ────────────────────────────────────────────── */
#filters{display:none;gap:14px 18px;flex-wrap:wrap;align-items:center;
margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule)}
#filters.on{display:flex}
.fg{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.flab{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin-right:2px}
select.f{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--rule);
background:var(--card);color:inherit;border-radius:2px;max-width:210px}
.chip.sm{font-size:11.5px;padding:4px 7px}
#fcount{font-family:var(--mono);font-size:10px;background:var(--stamp);color:#fff;
border-radius:9px;padding:1px 5px;margin-left:4px}
/* ── список найденных ───────────────────────────────────────────── */
#results{position:fixed;left:14px;bottom:14px;width:268px;max-height:56vh;overflow:auto;
border:1.5px solid var(--ink);background:var(--card);border-radius:2px;z-index:39;
box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
#results.on{display:block}
#results h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin:0;padding:10px 12px 6px;position:sticky;top:0;background:var(--card);
border-bottom:1px solid var(--rule)}
.rit{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px;
border-bottom:1px solid var(--rule);line-height:1.25}
.rit:hover,.rit:focus-visible{background:#fff}
.rit[aria-current=true]{background:var(--stamp);color:#fff}
.rit[aria-current=true] .ry{color:#C5D4E5}
.rnm{font-family:var(--serif);font-size:13px}
.ry{display:block;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
#rmore{padding:7px 12px;font-family:var(--mono);font-size:10px;color:var(--soft)}
#copy{margin-top:10px;font-size:11.5px}
@media (max-width:760px){#panel{right:6px;left:6px;width:auto;bottom:6px}
#results{left:6px;right:6px;width:auto;bottom:6px;max-height:38vh}
#langrow{position:static;display:flex;justify-content:flex-end;margin-bottom:6px}}
</style></head><body>

    <select id="lang" aria-label="Язык / Language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
  </div>
  <h1 id="h1">Родословная <em>Лухнёвых</em></h1>

    <button class="chip plain" id="zl">100%</button>
    <button class="chip plain" id="zin" aria-label="Увеличить">+</button>
    <button class="chip plain" id="anc" aria-pressed="false">Предки одного</button>
    <a class="chip plain" id="maplink" href="map.html">Карта</a>
  </div>
  <div id="filters">
    <div class="fg"><span class="flab" id="lbBranch">Ветка</span><select class="f" id="fbranch"></select></div>
    <div class="fg"><span class="flab" id="lbEra">Эпоха</span><span id="feras"></span></div>
    <div class="fg"><span class="flab" id="lbStatus">Статус</span><span id="fstatuses"></span></div>
    <div class="fg"><span class="flab" id="lbConf">Уверенность</span><span id="fconfs"></span></div>
    <div class="fg" id="fgcountry"><span class="flab" id="lbCountry">Страна</span><select class="f" id="fcountry"></select></div>
    <button class="chip plain" id="freset">Сбросить</button>
  </div>
</header>
<div id="stage"><div id="world"><svg id="wires"></svg></div></div>
<aside id="results"></aside>
<aside id="panel"></aside>

  (function down(i){((R[i]||{}).k||[]).forEach(c=>{if(!core.has(c)){core.add(c);down(c)}})})(id);

        const rel=(dir?par[id]:chi[id])||[];
        const v=rel.filter(x=>pos[x]&&vis.has(x)).map(centre);
        want[id]=v.length?v.reduce((a,b)=>a+b,0)/v.length:centre(id);
      });
      // слева направо: не даём налезать друг на друга
      let x=-1e9;
      ids.forEach(id=>{const w=pos[id].w;
        pos[id].x=Math.max(want[id]-w/2,x); x=pos[id].x+w+UG});
      // справа налево: стягиваем обратно, убирая лишние промежутки
      x=1e9;
      for(let i=ids.length-1;i>=0;i--){const id=ids[i],w=pos[id].w;
        pos[id].x=Math.min(pos[id].x,x-w-UG,Math.max(want[id]-w/2,pos[id].x));
        x=pos[id].x}
      for(let i=1;i<ids.length;i++){const a=ids[i-1],b=ids[i];
        pos[b].x=Math.max(pos[b].x,pos[a].x+pos[a].w+UG)}
      // если полосу всё-таки растащило — сжимаем к её центру
      const L0=pos[ids[0]].x, R0=pos[ids[ids.length-1]].x+pos[ids[ids.length-1]].w;
      const cap=tight[g]*1.4;
      if(R0-L0>cap){
        const k=cap/(R0-L0), c0=(L0+R0)/2;
        ids.forEach(id=>{pos[id].x=c0+(pos[id].x-c0)*k});
        for(let i=1;i<ids.length;i++){const a=ids[i-1],b=ids[i];
          pos[b].x=Math.max(pos[b].x,pos[a].x+pos[a].w+UG)}
      }
    });
  }
  let minx=1e9,maxx=-1e9;
  rows.forEach(ids=>ids.forEach(id=>{minx=Math.min(minx,pos[id].x);maxx=Math.max(maxx,pos[id].x+pos[id].w)}));
  rows.forEach((ids,g)=>ids.forEach(id=>{
    pos[id].x-=minx-40;
    pos[id].y=(flip?(U.maxg-g):g)*ROW+34;
  }));
  return {rows,w:maxx-minx+80,h:(U.maxg+1)*ROW+90};
}

function card(id){

  b.innerHTML='<span class="nm">'+esc(p.n).replace(/\n/g,'<br>')+'</span>'+

  b.onclick=e=>{e.stopPropagation();
    if(anc&&(R[id]||{}).p&&R[id].p.length&&id!==ancRoot){ancRoot=id;draw();return}
    if(!anc){selId=(selId===id)?null:id;selSet=selId?lineageOf(selId):null;paint()}
    show(id,b)};

}

function draw(){
  world.innerHTML='<svg id="wires"></svg>';
  const svg=document.getElementById('wires');
  if(anc){drawAnc(svg);return}
  const L=layout(), vis=visible();
  world.style.width=L.w+'px'; world.style.height=L.h+'px';
  svg.setAttribute('width',L.w); svg.setAttribute('height',L.h);
  // полосы поколений
  L.rows.forEach((ids,g)=>{
    if(!ids.length)return;
    const y=(flip?(U.maxg-g):g)*ROW+34;
    const b=document.createElement('div'); b.className='gband';
    b.style.top=(y-16)+'px'; b.style.width=L.w+'px'; world.appendChild(b);
    const t=document.createElement('div'); t.className='glab';
    t.textContent=tr('gen',g+1); t.style.top=(y-24)+'px'; t.style.left='6px';
    world.appendChild(t);
  });
  // линии
  const at={};
  L.rows.forEach(ids=>ids.forEach(id=>{
    const u=UN[id];
    u.m.forEach((mid,i)=>{at[mid]={x:pos[id].x+i*(CW+MG),y:pos[id].y}});
  }));
  const seen=new Set();
  U.edges.forEach(e=>{
    if(!at[e.c]||!at[e.a])return;
    if(!vis.has(U.unitOf[e.c]))return;
    const ax=at[e.a].x+CW/2, bx=e.b&&at[e.b]?at[e.b].x+CW/2:ax;
    const px=(ax+bx)/2, py=at[e.a].y+(flip?0:CH);
    const cx=at[e.c].x+CW/2, cy=at[e.c].y+(flip?CH:0);
    const my=(py+cy)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${px} ${py} L${px} ${my} L${cx} ${my} L${cx} ${cy}`);
    path.setAttribute('fill','none'); path.setAttribute('stroke','#C0392B');
    path.setAttribute('stroke-width','1.3'); path.setAttribute('opacity','.85');
    svg.appendChild(path);
    const k=e.a+'|'+(e.b||'');
    if(e.b&&at[e.b]&&!seen.has(k)){ seen.add(k);
      const m=document.createElementNS('http://www.w3.org/2000/svg','line');
      m.setAttribute('x1',ax);m.setAttribute('x2',bx);
      m.setAttribute('y1',at[e.a].y+CH/2);m.setAttribute('y2',at[e.a].y+CH/2);
      m.setAttribute('stroke','#C0392B');m.setAttribute('stroke-width','1.3');
      svg.appendChild(m);}
  });
  // карточки
  L.rows.forEach(ids=>ids.forEach(id=>{
    const u=UN[id];
    u.m.forEach((mid,i)=>{
      const c=card(mid);
      c.style.left=(pos[id].x+i*(CW+MG))+'px'; c.style.top=pos[id].y+'px';
      world.appendChild(c);
    });
    const kidsN=descCount(id);
    if(kidsN){
      const t=document.createElement('button'); t.className='tg'; t.type='button';
      t.textContent=hidden.has(id)?'+':'−';
      t.title=hidden.has(id)?tr('expandN',kidsN):tr('collapseBranch');
      t.style.left=(pos[id].x+pos[id].w/2-9.5)+'px';
      t.style.top=(pos[id].y+(flip?-24:CH+5))+'px';
      t.onclick=e=>{e.stopPropagation();
        hidden.has(id)?hidden.delete(id):hidden.add(id); draw()};
      world.appendChild(t);
      if(hidden.has(id)){
        const n=document.createElement('span'); n.className='tgc'; n.textContent=kidsN;
        n.style.left=(pos[id].x+pos[id].w/2+12)+'px';
        n.style.top=(pos[id].y+(flip?-22:CH+7))+'px'; world.appendChild(n);
      }
    }
  }));
  paint(); stickLabels();
}

function drawAnc(svg){
  const lv=[[ancRoot]], seenA=new Set([ancRoot]);
  for(let d=0;d<8;d++){
    const nx=[];
    lv[d].forEach(id=>((R[id]||{}).p||[]).forEach(p=>{if(!seenA.has(p)){seenA.add(p);nx.push(p)}}));
    if(!nx.length)break; lv.push(nx);
  }
  const at={}; let W=0;
  lv.forEach((ids,d)=>{
    const w=ids.length*CW+(ids.length-1)*UG; W=Math.max(W,w);
  });
  lv.forEach((ids,d)=>{
    const w=ids.length*CW+(ids.length-1)*UG, x0=(W-w)/2+40;
    ids.forEach((id,i)=>{at[id]={x:x0+i*(CW+UG),y:d*ROW+40}});
  });
  world.style.width=(W+80)+'px'; world.style.height=(lv.length*ROW+80)+'px';
  svg.setAttribute('width',W+80); svg.setAttribute('height',lv.length*ROW+80);
  lv.forEach(ids=>ids.forEach(id=>{
    ((R[id]||{}).p||[]).forEach(p=>{
      if(!at[p])return;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      const y1=at[id].y+CH,y2=at[p].y,my=(y1+y2)/2;
      path.setAttribute('d',`M${at[id].x+CW/2} ${y1} L${at[id].x+CW/2} ${my} L${at[p].x+CW/2} ${my} L${at[p].x+CW/2} ${y2}`);
      path.setAttribute('fill','none');path.setAttribute('stroke','#C0392B');path.setAttribute('stroke-width','1.3');
      svg.appendChild(path);});
  }));
  Object.keys(at).forEach(id=>{
    const c=card(id); c.style.left=at[id].x+'px'; c.style.top=at[id].y+'px'; world.appendChild(c);
  });
  const t=document.createElement('div'); t.className='glab';
  t.textContent=tr('ancestorsOf',((M[ancRoot]||{}).n||'').replace(/\n/g,' '));
  t.style.top='8px'; t.style.left='40px'; world.appendChild(t);
  paint();
}

let hits=[],hitIdx=0;
const terms=()=>nrm(F.q).split(/\s+/).filter(Boolean);
const anyFilter=()=>!!(F.branch||F.era||F.status||F.conf||F.country||F.line);
const searching=()=>terms().length>0||anyFilter();

// «1900-1950» — это диапазон годов рождения, а не два слова для поиска
const rangeOf=()=>{const m=/^(\d{4})\s*-\s*(\d{4})$/.exec(nrm(F.q).trim());
  return m?{lo:+m[1],hi:+m[2]}:null};

function passFilters(id){
  const p=M[id]||{};
  if(F.line&&!p.L)return false;
  if(F.branch&&p.b!==F.branch)return false;
  if(F.conf&&p.c!==F.conf)return false;
  if(F.status&&p.st!==F.status)return false;
  if(F.country&&p.co!==F.country)return false;
  if(F.era){
    if(F.era==='none')return p.by==null;
    if(p.by==null)return false;
    const e=ERAS.find(x=>x.k===F.era)||{};
    if(e.lo!=null&&p.by<e.lo)return false;
    if(e.hi!=null&&p.by>e.hi)return false;
  }
  return true;
}
function matchQuery(id){
  const r=rangeOf();
  const p=M[id]||{};
  if(r)return p.by!=null&&p.by>=r.lo&&p.by<=r.hi;
  const ts=terms();
  return !ts.length||ts.every(t=>(p.q||'').includes(t));
}
// подсветка совпадений: нормализация длину не меняет, поэтому позиции
// из нормализованной строки годятся для исходной
function hi(name){
  const ts=rangeOf()?[]:terms();
  const plain=()=>esc(name).replace(/\n/g,'<br>');
  if(!ts.length)return plain();
  const low=nrm(name),spans=[];
  ts.forEach(t=>{for(let i=low.indexOf(t);i>=0;i=low.indexOf(t,i+1))spans.push([i,i+t.length])});
  if(!spans.length)return plain();
  spans.sort((a,b)=>a[0]-b[0]);
  const m=[];
  spans.forEach(s=>{const last=m[m.length-1];
    if(last&&s[0]<=last[1])last[1]=Math.max(last[1],s[1]);else m.push(s.slice())});
  let out='',pos=0;
  m.forEach(([s,e])=>{out+=esc(name.slice(pos,s))+'<mark>'+esc(name.slice(s,e))+'</mark>';pos=e});
  return (out+esc(name.slice(pos))).replace(/\n/g,'<br>');
}

function paint(){
  hits=[];
  const on=searching();
  world.querySelectorAll('.card').forEach(c=>{
    const id=c.dataset.id,p=M[id]||{},nm=c.querySelector('.nm');
    nm.innerHTML=hi(p.n||'');
    const ok=passFilters(id)&&matchQuery(id);
    const okSel=anc||!selSet||selSet.has(id);
    c.classList.toggle('dim',!(ok&&okSel));
    if(ok&&okSel&&on)hits.push(c);
  });
  hits.sort((a,b)=>parseFloat(a.style.top)-parseFloat(b.style.top)||
                   parseFloat(a.style.left)-parseFloat(b.style.left));
  const box=document.getElementById('hits');
  box.style.display=on?'inline-flex':'none';
  if(on)box.querySelector('#hn').textContent=hits.length?
    tr('hitsOf',Math.min(hitIdx+1,hits.length),hits.length) : tr('hitsNone');
  renderResults();
  const n=[F.branch,F.era,F.status,F.conf,F.country].filter(Boolean).length+(F.line?1:0);
  const badge=document.getElementById('fcount');
  badge.textContent=n||'';badge.style.display=n?'':'none';
}

function renderResults(){
  const box=document.getElementById('results');
  if(!searching()||anc){box.classList.remove('on');box.innerHTML='';return}
  const ids=hits.map(c=>c.dataset.id),cap=60;
  let html='<h3>'+esc(tr('results',ids.length))+'</h3>';
  ids.slice(0,cap).forEach(id=>{const p=M[id]||{};
    html+='<button type="button" class="rit" data-id="'+id+'"'+
          (id===curId?' aria-current="true"':'')+'><span class="rnm">'+
          hi((p.n||'').replace(/\n/g,' '))+'</span><span class="ry">'+
          esc([p.y,p.b].filter(Boolean).join(' · '))+'</span></button>';});
  if(ids.length>cap)html+='<div id="rmore">'+esc(tr('more',ids.length-cap))+'</div>';
  box.innerHTML=html;box.classList.add('on');
  box.querySelectorAll('.rit').forEach(b=>b.onclick=()=>{
    hitIdx=ids.indexOf(b.dataset.id);
    const el=world.querySelector('.card[data-id="'+b.dataset.id+'"]');
    centerOn(el);show(b.dataset.id,el);});
}

// человек может быть внутри свёрнутой ветки — тогда карточки нет и поиск
// «ничего не нашёл» соврал бы: раскрываем и ищем ещё раз
function expandIfHiddenMatch(){
  if(!hidden.size||!searching())return false;
  const visibleIds=new Set([...world.querySelectorAll('.card')].map(c=>c.dataset.id));
  const missed=Object.keys(M).some(id=>!visibleIds.has(id)&&passFilters(id)&&matchQuery(id));
  if(missed){hidden.clear();draw();return true}
  return false;
}
function refilter(){
  hitIdx=0;paint();
  if(expandIfHiddenMatch())paint();
  syncHash();
  if(hits.length&&terms().length)centerOn(hits[0]);
}
function centerOn(el){
  if(!el)return;
  stage.scrollTo({left:el.offsetLeft*zoom-stage.clientWidth/2+74*zoom,
                  top:el.offsetTop*zoom-stage.clientHeight/2+27*zoom,behavior:'smooth'});
  world.querySelectorAll('.card[aria-current]').forEach(c=>c.removeAttribute('aria-current'));
  el.setAttribute('aria-current','true');
}
function jump(d){
  if(!hits.length)return;
  hitIdx=(hitIdx+d+hits.length)%hits.length;
  centerOn(hits[hitIdx]);
  document.getElementById('hn').textContent=tr('hitsOf',hitIdx+1,hits.length);
  show(hits[hitIdx].dataset.id,hits[hitIdx]);
}

function rels(id){
  const r=R[id]||{};let out='';

  if((r.s||[]).length)out+='<dt>'+tr('spouse')+'</dt><dd>'+r.s.map(lnk).join(', ')+'</dd>';
  if((r.k||[]).length)out+='<dt>'+tr('children')+'</dt><dd>'+r.k.map(lnk).join(', ')+'</dd>';
  return out;
}
function goto(id){

    '</h2><div class="pid">'+id+(p.y?' · '+p.y:'')+' · '+tr('gen',(p.g||0)+1)+'</div><div>'+
    (p.L?'<span class="tag dl">'+tr('directLine')+'</span>':'')+
    (p.c?'<span class="tag'+(p.c==='низкая'?' low':'')+'">'+esc(trConf(p.c))+'</span>':'')+
    (p.b?'<span class="tag">'+esc(p.b)+'</span>':'')+'</div><dl>'+
    (p.pb?'<dt>'+tr('born')+'</dt><dd>'+esc(p.pb)+'</dd>':'')+
    (p.pd?'<dt>'+tr('died')+'</dt><dd>'+esc(p.pd)+'</dd>':'')+
    (p.rt?'<dt>'+tr('route')+'</dt><dd>'+p.rt.map(esc).join(' → ')+'</dd>':'')+
    (p.f?'<dt>'+tr('source')+'</dt><dd>'+tr('frame')+' IMG_'+esc(p.f).replace(/;/g,', IMG_')+'</dd>':'')+
    (p.z?'<dt>'+tr('notes')+'</dt><dd>'+esc(p.z)+'</dd>':'')+rels(id)+'</dl>'+
    '<button class="chip plain" id="copy">'+tr('copy')+'</button>';
  panel.classList.add('on');
  panel.querySelector('#close').onclick=()=>{panel.classList.remove('on');
    curId=null;syncHash();
    if(selId){selId=null;selSet=null;paint()}};
  panel.querySelectorAll('a[data-go]').forEach(a=>a.onclick=()=>goto(a.dataset.go));
  const cp=panel.querySelector('#copy');
  cp.onclick=()=>{const u=location.origin+location.pathname+location.search+'#p='+id;
    const done=()=>{cp.textContent=tr('copied');setTimeout(()=>cp.textContent=tr('copy'),1600)};
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(u).then(done,()=>{});
    else{const ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);
      ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)}};
  document.querySelectorAll('#results .rit').forEach(b=>
    b.toggleAttribute('aria-current',b.dataset.id===id));
  syncHash();
}

// ── ссылка на человека и на поиск ─────────────────────────────────────
function syncHash(){
  const u=new URLSearchParams();
  if(F.q)u.set('q',F.q);
  if(F.branch)u.set('b',F.branch);
  if(F.era)u.set('era',F.era);
  if(F.status)u.set('st',F.status);
  if(F.conf)u.set('c',F.conf);
  if(F.country)u.set('co',F.country);
  if(F.line)u.set('line','1');
  if(curId)u.set('p',curId);
  const s=u.toString();
  history.replaceState(null,'',s?'#'+s:location.pathname+location.search);
}
function readHash(){
  const u=new URLSearchParams(location.hash.replace(/^#/,''));
  // короткая форма: #L027 — так ссылку проще диктовать по телефону
  const bare=location.hash.replace(/^#/,'');
  if(bare&&!bare.includes('=')) return M[bare]?bare:'';
  F.q=u.get('q')||'';F.branch=u.get('b')||'';F.era=u.get('era')||'';
  F.status=u.get('st')||'';F.conf=u.get('c')||'';F.country=u.get('co')||'';
  F.line=u.get('line')==='1';
  const p=u.get('p')||'';
  return M[p]?p:'';
}

document.getElementById('flip').onclick=()=>{flip=!flip;updateFlipLabel();draw()};
document.getElementById('col').onclick=()=>{
  U.units.forEach(u=>{if((U.childUnits[u.id]||[]).length&&u.g<=1)hidden.add(u.id)});draw()};
document.getElementById('exp').onclick=()=>{hidden.clear();draw()};
document.getElementById('anc').onclick=()=>{anc=!anc;
  document.getElementById('anc').setAttribute('aria-pressed',anc);
  updateAncLabel();draw();
  stage.scrollLeft=(world.scrollWidth*zoom-stage.clientWidth)/2};
function relabel(){
  document.documentElement.lang=LANG;
  document.title=tr('docTitle');
  document.getElementById('lang').value=LANG;
  document.getElementById('h1').innerHTML=tr('title');
  document.getElementById('sub').textContent=tr('sub',Object.keys(M).length,U.maxg+1);
  const q_=document.getElementById('q');
  q_.placeholder=tr('searchPh'); q_.setAttribute('aria-label',tr('searchLbl'));
  document.getElementById('hprev').setAttribute('aria-label',tr('prevLbl'));
  document.getElementById('hnext').setAttribute('aria-label',tr('nextLbl'));
  fline.childNodes[0].nodeValue=tr('mLine');
  fbtn.childNodes[0].nodeValue=tr('filters');
  document.getElementById('freset').textContent=tr('reset');
  document.getElementById('lbBranch').textContent=tr('fBranch');
  document.getElementById('lbEra').textContent=tr('fEra');
  document.getElementById('lbStatus').textContent=tr('fStatus');
  document.getElementById('lbConf').textContent=tr('fConf');
  document.getElementById('lbCountry').textContent=tr('fCountry');
  const ml=document.getElementById('maplink');
  if(ml)ml.textContent=tr('mapLink');
  buildFilters();
  document.getElementById('exp').textContent=tr('exp');
  document.getElementById('col').textContent=tr('col');
  document.getElementById('zout').setAttribute('aria-label',tr('zoomOutLbl'));
  document.getElementById('zin').setAttribute('aria-label',tr('zoomInLbl'));
  updateFlipLabel(); updateAncLabel();
}
document.getElementById('lang').onchange=e=>{
  LANG=e.target.value; localStorage.setItem(LSKEY,LANG);
  relabel(); draw();
  if(panel.classList.contains('on')&&curId){
    const el=world.querySelector('.card[data-id="'+curId+'"]');
    if(el)show(curId,el);
  }
};
let down=false,sx,sy,dx,dy;
function stickLabels(){
  const x=stage.scrollLeft/zoom+6;
  world.querySelectorAll('.glab').forEach(l=>l.style.left=x+'px');
}
stage.addEventListener('scroll',stickLabels);
stage.addEventListener('mousedown',e=>{if(e.target.closest('button'))return;
  down=true;stage.classList.add('drag');sx=e.pageX;sy=e.pageY;dx=stage.scrollLeft;dy=stage.scrollTop});
addEventListener('mouseup',()=>{down=false;stage.classList.remove('drag')});
addEventListener('mousemove',e=>{if(!down)return;e.preventDefault();
  stage.scrollLeft=dx-(e.pageX-sx);stage.scrollTop=dy-(e.pageY-sy)});
addEventListener('keydown',e=>{if(e.key==='Escape')panel.classList.remove('on')});
const hh=()=>document.documentElement.style.setProperty('--hh',
  document.querySelector('header').offsetHeight+'px');
addEventListener('resize',hh);hh();
const wanted=readHash();
relabel();
syncControls();
draw();
setZoom(Math.max(.5,Math.min(1,(stage.clientWidth-40)/world.offsetWidth)));
stage.scrollLeft=(world.offsetWidth*zoom-stage.clientWidth)/2;
stage.scrollTop=0;
if(anyFilter())document.getElementById('fbtn').click();
if(searching())refilter();
if(wanted)goto(wanted);

</script></body></html>
