    `Hello! Here is what I know about ${name}:\n\n\n`+
    `(years, places they lived and worked, names of children — whatever you `+
    `remember; photos and documents can be attached to this email)\n\n`+
    `Their card: ${url}\n`,
  conf:{'высокая':'high','средняя':'medium','низкая':'low'},
  evt:{'жительство':'lived','переезд':'moved','служба':'service','работа':'work',
       'учёба':'studies','эмиграция':'emigration','прочее':'other'},
 },
};
const LSKEY='familytree-lang';
let LANG=localStorage.getItem(LSKEY)||((navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en');
const tr=(k,...args)=>{const v=(I18N[LANG]||I18N.ru)[k];return typeof v==='function'?v(...args):v};
const trConf=c=>{const d=(I18N[LANG]||I18N.ru).conf;return (d&&d[c])||c};
const trEvt=t=>{const d=(I18N[LANG]||I18N.ru).evt;return (d&&d[t])||t};
// «2012–2021», «с 2012», «2026», «по 2021» — отрезок словами текущего языка
function trPeriod(y,u){
  const now=u==='сейчас';
  if(y&&now)return tr('pFrom',y);
  if(y&&u)return y===u?y:y+'–'+u;
  if(y)return y;
  if(now)return tr('pNow');
  return u?tr('pUntil',u):'';
}

// вся ветка человека: предки вверх до конца + потомки вниз до конца + супруги (для целых пар)
function lineageOf(id){
  const core=new Set([id]);
  (function up(i){((R[i]||{}).p||[]).forEach(p=>{if(!core.has(p)){core.add(p);up(p)}})})(id);
  (function down(i){((R[i]||{}).k||[]).forEach(c=>{if(!core.has(c)){core.add(c);down(c)}})})(id);
  const out=new Set(core);
  core.forEach(i=>((R[i]||{}).s||[]).forEach(sp=>out.add(sp)));
  return out;
}

// какие блоки скрыты (свёрнуты потомки)
function visible(){
  const out=new Set(U.units.map(u=>u.id));
  const kill=u=>{(U.childUnits[u]||[]).forEach(c=>{if(out.has(c)){out.delete(c);kill(c)}})};
  hidden.forEach(h=>kill(h));
  return out;
}
function descCount(uid){
  const seen=new Set(); const go=u=>(U.childUnits[u]||[]).forEach(c=>{if(!seen.has(c)){seen.add(c);go(c)}});
  go(uid); let n=0; seen.forEach(c=>n+=UN[c].m.length); return n;
}

const pos={};   // uid -> {x,y,w}
function layout(){
  const vis=visible();
  const rows=[];
  for(let g=0;g<=U.maxg;g++){
    const ids=(U.layers[String(g)]||[]).filter(i=>vis.has(i));
    rows.push(ids);
  }
  rows.forEach((ids,g)=>{
    let x=0;
    ids.forEach(id=>{pos[id]={x:x,y:0,w:uw(UN[id])};x+=uw(UN[id])+UG});
  });
  // подтягиваем блоки к середине связанных, но ширину полосы держим в узде
  const par={},chi={};
  Object.keys(U.childUnits).forEach(p=>{(U.childUnits[p]||[]).forEach(c=>{
    (chi[p]=chi[p]||[]).push(c);(par[c]=par[c]||[]).push(p)})});
  const centre=id=>pos[id].x+pos[id].w/2;
  const tight={};
  rows.forEach((ids,g)=>{tight[g]=ids.reduce((a,id)=>a+pos[id].w+UG,0)-UG});
  for(let pass=0;pass<18;pass++){
    const dir=pass%2===0;
    const seq=rows.map((r,i)=>i); if(!dir)seq.reverse();
    seq.forEach(g=>{
      const ids=rows[g]; if(!ids.length)return;
      const want={};
      ids.forEach(id=>{
        const rel=(dir?par[id]:chi[id])||[];
        const v=rel.filter(x=>pos[x]&&vis.has(x)).map(centre);
        want[id]=v.length?v.reduce((a,b)=>a+b,0)/v.length:centre(id);
      });
      // слева направо: не даём налезать друг на друга
      let x=-1e9;
      ids.forEach(id=>{const w=pos[id].w;
        pos[id].x=Math.max(want[id]-w/2,x); x=pos[id].x+w+UG});
      // справа налево: стягиваем обратно, убирая лишние промежутки
      x=1e9;
      for(let i=ids.length-1;i>=0;i--){const id=ids[i],w=pos[id].w;
        pos[id].x=Math.min(pos[id].x,x-w-UG,Math.max(want[id]-w/2,pos[id].x));
        x=pos[id].x}
      for(let i=1;i<ids.length;i++){const a=ids[i-1],b=ids[i];
        pos[b].x=Math.max(pos[b].x,pos[a].x+pos[a].w+UG)}
      // если полосу всё-таки растащило — сжимаем к её центру
      const L0=pos[ids[0]].x, R0=pos[ids[ids.length-1]].x+pos[ids[ids.length-1]].w;
      const cap=tight[g]*1.4;
      if(R0-L0>cap){
        const k=cap/(R0-L0), c0=(L0+R0)/2;
        ids.forEach(id=>{pos[id].x=c0+(pos[id].x-c0)*k});
        for(let i=1;i<ids.length;i++){const a=ids[i-1],b=ids[i];
          pos[b].x=Math.max(pos[b].x,pos[a].x+pos[a].w+UG)}
      }
    });
  }
  let minx=1e9,maxx=-1e9;
  rows.forEach(ids=>ids.forEach(id=>{minx=Math.min(minx,pos[id].x);maxx=Math.max(maxx,pos[id].x+pos[id].w)}));
  rows.forEach((ids,g)=>ids.forEach(id=>{
    pos[id].x-=minx-40;
    pos[id].y=(flip?(U.maxg-g):g)*ROW+34;
  }));
  return {rows,w:maxx-minx+80,h:(U.maxg+1)*ROW+90};
}

function card(id){
  const p=M[id]||{n:id,y:''};
  const b=document.createElement('button'); b.type='button'; b.dataset.id=id;
  b.className='card'+(p.c==='низкая'?' low':'')+(p.L?' dl':'')+(p.a?' alive':'')+((p.im&&p.im.length)?' haspic':'');
  b.style.width=CW+'px'; b.style.height=CH+'px';
  b.title=tr('cardTitle');
  b.innerHTML='<span class="nm">'+esc(p.n).replace(/\n/g,'<br>')+'</span>'+
              (p.y?'<span class="yr">'+p.y+'</span>':'');
  b.onclick=e=>{e.stopPropagation();
    if(anc&&(R[id]||{}).p&&R[id].p.length&&id!==ancRoot){ancRoot=id;draw();return}
    if(!anc){selId=(selId===id)?null:id;selSet=selId?lineageOf(selId):null;paint()}
    show(id,b)};
  return b;
}

function draw(){
  world.innerHTML='<svg id="wires"></svg>';
  const svg=document.getElementById('wires');
  if(anc){drawAnc(svg);return}
  const L=layout(), vis=visible();
  world.style.width=L.w+'px'; world.style.height=L.h+'px';
  svg.setAttribute('width',L.w); svg.setAttribute('height',L.h);
  // полосы поколений
  L.rows.forEach((ids,g)=>{
    if(!ids.length)return;
    const y=(flip?(U.maxg-g):g)*ROW+34;
    const b=document.createElement('div'); b.className='gband';
    b.style.top=(y-16)+'px'; b.style.width=L.w+'px'; world.appendChild(b);
    const t=document.createElement('div'); t.className='glab';
    t.textContent=tr('gen',g+1); t.style.top=(y-24)+'px'; t.style.left='6px';
    world.appendChild(t);
  });
  // линии
  const at={};
  L.rows.forEach(ids=>ids.forEach(id=>{
    const u=UN[id];
    u.m.forEach((mid,i)=>{at[mid]={x:pos[id].x+i*(CW+MG),y:pos[id].y}});
  }));
  const seen=new Set();
  U.edges.forEach(e=>{
    if(!at[e.c]||!at[e.a])return;
    if(!vis.has(U.unitOf[e.c]))return;
    const ax=at[e.a].x+CW/2, bx=e.b&&at[e.b]?at[e.b].x+CW/2:ax;
    const px=(ax+bx)/2, py=at[e.a].y+(flip?0:CH);
    const cx=at[e.c].x+CW/2, cy=at[e.c].y+(flip?CH:0);
    const my=(py+cy)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${px} ${py} L${px} ${my} L${cx} ${my} L${cx} ${cy}`);
    path.setAttribute('fill','none'); path.setAttribute('stroke','#C0392B');
    path.setAttribute('stroke-width','1.3'); path.setAttribute('opacity',e.d?'.6':'.85');
    if(e.d)path.setAttribute('stroke-dasharray','5 4');
    svg.appendChild(path);
    const k=e.a+'|'+(e.b||'');
    if(e.b&&at[e.b]&&!seen.has(k)){ seen.add(k);
      const m=document.createElementNS('http://www.w3.org/2000/svg','line');
      m.setAttribute('x1',ax);m.setAttribute('x2',bx);
      m.setAttribute('y1',at[e.a].y+CH/2);m.setAttribute('y2',at[e.a].y+CH/2);
      m.setAttribute('stroke','#C0392B');m.setAttribute('stroke-width','1.3');
      svg.appendChild(m);}
  });
  // карточки
  L.rows.forEach(ids=>ids.forEach(id=>{
    const u=UN[id];
    u.m.forEach((mid,i)=>{
      const c=card(mid);
      c.style.left=(pos[id].x+i*(CW+MG))+'px'; c.style.top=pos[id].y+'px';
      world.appendChild(c);
    });
    const kidsN=descCount(id);
    if(kidsN){
      const t=document.createElement('button'); t.className='tg'; t.type='button';
      t.textContent=hidden.has(id)?'+':'−';
      t.title=hidden.has(id)?tr('expandN',kidsN):tr('collapseBranch');
      t.style.left=(pos[id].x+pos[id].w/2-9.5)+'px';
      t.style.top=(pos[id].y+(flip?-24:CH+5))+'px';
      t.onclick=e=>{e.stopPropagation();
        hidden.has(id)?hidden.delete(id):hidden.add(id); draw()};
      world.appendChild(t);
      if(hidden.has(id)){
        const n=document.createElement('span'); n.className='tgc'; n.textContent=kidsN;
        n.style.left=(pos[id].x+pos[id].w/2+12)+'px';
        n.style.top=(pos[id].y+(flip?-22:CH+7))+'px'; world.appendChild(n);
      }
    }
  }));
  paint(); stickLabels();
}

function drawAnc(svg){
  const lv=[[ancRoot]], seenA=new Set([ancRoot]);
  for(let d=0;d<8;d++){
    const nx=[];
    lv[d].forEach(id=>((R[id]||{}).p||[]).forEach(p=>{if(!seenA.has(p)){seenA.add(p);nx.push(p)}}));
    if(!nx.length)break; lv.push(nx);
  }
  const at={}; let W=0;
  lv.forEach((ids,d)=>{
    const w=ids.length*CW+(ids.length-1)*UG; W=Math.max(W,w);
  });
  lv.forEach((ids,d)=>{
    const w=ids.length*CW+(ids.length-1)*UG, x0=(W-w)/2+40;
    ids.forEach((id,i)=>{at[id]={x:x0+i*(CW+UG),y:d*ROW+40}});
  });
  world.style.width=(W+80)+'px'; world.style.height=(lv.length*ROW+80)+'px';
  svg.setAttribute('width',W+80); svg.setAttribute('height',lv.length*ROW+80);
  lv.forEach(ids=>ids.forEach(id=>{
    ((R[id]||{}).p||[]).forEach(p=>{
      if(!at[p])return;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      const y1=at[id].y+CH,y2=at[p].y,my=(y1+y2)/2;
      path.setAttribute('d',`M${at[id].x+CW/2} ${y1} L${at[id].x+CW/2} ${my} L${at[p].x+CW/2} ${my} L${at[p].x+CW/2} ${y2}`);
      path.setAttribute('fill','none');path.setAttribute('stroke','#C0392B');path.setAttribute('stroke-width','1.3');
      svg.appendChild(path);});
  }));
  Object.keys(at).forEach(id=>{
    const c=card(id); c.style.left=at[id].x+'px'; c.style.top=at[id].y+'px'; world.appendChild(c);
  });
  const t=document.createElement('div'); t.className='glab';
  t.textContent=tr('ancestorsOf',((M[ancRoot]||{}).n||'').replace(/\n/g,' '));
  t.style.top='8px'; t.style.left='40px'; world.appendChild(t);
  paint();
}

let hits=[],hitIdx=0;
const terms=()=>nrm(F.q).split(/\s+/).filter(Boolean);
const anyFilter=()=>!!(F.branch||F.era||F.status||F.conf||F.country||F.line);
const searching=()=>terms().length>0||anyFilter();

// «1900-1950» — это диапазон годов рождения, а не два слова для поиска
const rangeOf=()=>{const m=/^(\d{4})\s*-\s*(\d{4})$/.exec(nrm(F.q).trim());
  return m?{lo:+m[1],hi:+m[2]}:null};

function passFilters(id){
  const p=M[id]||{};
  if(F.line&&!p.L)return false;
  if(F.branch&&p.b!==F.branch)return false;
  if(F.conf&&p.c!==F.conf)return false;
  if(F.status&&p.st!==F.status)return false;
  if(F.country&&p.co!==F.country)return false;
  if(F.era){
    if(F.era==='none')return p.by==null;
    if(p.by==null)return false;
    const e=ERAS.find(x=>x.k===F.era)||{};
    if(e.lo!=null&&p.by<e.lo)return false;
    if(e.hi!=null&&p.by>e.hi)return false;
  }
  return true;
}
function matchQuery(id){
  const r=rangeOf();
  const p=M[id]||{};
  if(r)return p.by!=null&&p.by>=r.lo&&p.by<=r.hi;
  const ts=terms();
  return !ts.length||ts.every(t=>(p.q||'').includes(t));
}
// подсветка совпадений: нормализация длину не меняет, поэтому позиции
// из нормализованной строки годятся для исходной
function hi(name){
  const ts=rangeOf()?[]:terms();
  const plain=()=>esc(name).replace(/\n/g,'<br>');
  if(!ts.length)return plain();
  const low=nrm(name),spans=[];
  ts.forEach(t=>{for(let i=low.indexOf(t);i>=0;i=low.indexOf(t,i+1))spans.push([i,i+t.length])});
  if(!spans.length)return plain();
  spans.sort((a,b)=>a[0]-b[0]);
  const m=[];
  spans.forEach(s=>{const last=m[m.length-1];
    if(last&&s[0]<=last[1])last[1]=Math.max(last[1],s[1]);else m.push(s.slice())});
  let out='',pos=0;
  m.forEach(([s,e])=>{out+=esc(name.slice(pos,s))+'<mark>'+esc(name.slice(s,e))+'</mark>';pos=e});
  return (out+esc(name.slice(pos))).replace(/\n/g,'<br>');
}

function paint(){
  hits=[];
  const on=searching();
  world.querySelectorAll('.card').forEach(c=>{
    const id=c.dataset.id,p=M[id]||{},nm=c.querySelector('.nm');
    nm.innerHTML=hi(p.n||'');
    const ok=passFilters(id)&&matchQuery(id);
    const okSel=anc||!selSet||selSet.has(id);
    c.classList.toggle('dim',!(ok&&okSel));
    if(ok&&okSel&&on)hits.push(c);
  });
  hits.sort((a,b)=>parseFloat(a.style.top)-parseFloat(b.style.top)||
                   parseFloat(a.style.left)-parseFloat(b.style.left));
  const box=document.getElementById('hits');
  box.style.display=on?'inline-flex':'none';
  if(on)box.querySelector('#hn').textContent=hits.length?
    tr('hitsOf',Math.min(hitIdx+1,hits.length),hits.length) : tr('hitsNone');
  renderResults();
  const n=[F.branch,F.era,F.status,F.conf,F.country].filter(Boolean).length+(F.line?1:0);
  const badge=document.getElementById('fcount');
  badge.textContent=n||'';badge.style.display=n?'':'none';
}

function renderResults(){
  const box=document.getElementById('results');
  if(!searching()||anc){box.classList.remove('on');box.innerHTML='';return}
  const ids=hits.map(c=>c.dataset.id),cap=60;
  let html='<h3>'+esc(tr('results',ids.length))+'</h3>';
  ids.slice(0,cap).forEach(id=>{const p=M[id]||{};
    html+='<button type="button" class="rit" data-id="'+id+'"'+
          (id===curId?' aria-current="true"':'')+'><span class="rnm">'+
          hi((p.n||'').replace(/\n/g,' '))+'</span><span class="ry">'+
          esc([p.y,p.b].filter(Boolean).join(' · '))+'</span></button>';});
  if(ids.length>cap)html+='<div id="rmore">'+esc(tr('more',ids.length-cap))+'</div>';
  box.innerHTML=html;box.classList.add('on');
  box.querySelectorAll('.rit').forEach(b=>b.onclick=()=>{
    hitIdx=ids.indexOf(b.dataset.id);
    const el=world.querySelector('.card[data-id="'+b.dataset.id+'"]');
    centerOn(el);show(b.dataset.id,el);});
}

// человек может быть внутри свёрнутой ветки — тогда карточки нет и поиск
// «ничего не нашёл» соврал бы: раскрываем и ищем ещё раз
function expandIfHiddenMatch(){
  if(!hidden.size||!searching())return false;
  const visibleIds=new Set([...world.querySelectorAll('.card')].map(c=>c.dataset.id));
  const missed=Object.keys(M).some(id=>!visibleIds.has(id)&&passFilters(id)&&matchQuery(id));
  if(missed){hidden.clear();draw();return true}
  return false;
}
function refilter(){
  hitIdx=0;paint();
  if(expandIfHiddenMatch())paint();
  syncHash();
  if(hits.length&&terms().length)centerOn(hits[0]);
}
function centerOn(el){
  if(!el)return;
  stage.scrollTo({left:el.offsetLeft*zoom-stage.clientWidth/2+74*zoom,
                  top:el.offsetTop*zoom-stage.clientHeight/2+27*zoom,behavior:'smooth'});
  world.querySelectorAll('.card[aria-current]').forEach(c=>c.removeAttribute('aria-current'));
  el.setAttribute('aria-current','true');
}
function jump(d){
  if(!hits.length)return;
  hitIdx=(hitIdx+d+hits.length)%hits.length;
  centerOn(hits[hitIdx]);
  document.getElementById('hn').textContent=tr('hitsOf',hitIdx+1,hits.length);
  show(hits[hitIdx].dataset.id,hits[hitIdx]);
}

// ── просмотр снимка во весь экран ───────────────────────────────────
// Отдельный слой поверх всего: миниатюры в карточке высотой 96px, а на
// документах — военный билет, оборот фотографии, открытки — надо читать текст.
let picList=[],picAt=0;
// ── «знаете больше — напишите» ────────────────────────────────────────
// Сайт статический: сохранять дополнение ему некуда. Поэтому кнопка не
// «отправляет», а открывает письмо с уже проставленной темой — из письма
// сразу видно, о КОМ речь, и не надо переспрашивать. Для телеграма тема не
// подставляется (формат ссылки не позволяет), поэтому имя и ссылку кладём
// в буфер обмена: человеку остаётся вставить.
function tellUs(id,p){
  const name=(p.n||'').replace(/\n/g,' ');
  const url=location.origin+location.pathname+'#p='+id;
  if(!TELL.m&&!TELL.tg)return '';
  let out='<div class="tell"><div class="tl">'+esc(tr('tellTitle'))+'</div><div class="tb">';
  if(TELL.m){
    // адрес собирается в браузере, а не лежит в разметке строкой: страницу
    // читают сборщики адресов, и почта из неё уходит в спам-базы за сутки
    const mail=TELL.m[0]+'@'+TELL.m[1];
    out+='<a class="chip" href="mailto:'+mail+'?subject='+
      encodeURIComponent(tr('tellSubj',name,id))+'&body='+
      encodeURIComponent(tr('tellBody',name,url))+'">'+esc(tr('tellMail'))+'</a>';
  }
  if(TELL.tg)out+='<a class="chip" id="telltg" href="'+esc(TELL.tg)+
    '" target="_blank" rel="noopener">'+esc(tr('tellTg'))+'</a>';
  return out+'</div></div>';
}

// ── заметка как журнал: заголовок, дата, текст ────────────────────────
// Абзац заметки почти всегда устроен одинаково: «ЗАГОЛОВОК КАПСОМ 13.08.2026
// (со слов такого-то): дальше сам текст». Читать это сплошняком тяжело —
// капс кричит, дата спотыкает посреди фразы. Разбираем абзац на три части
// и показываем заголовок отдельной строкой, дату — тихой пометкой при нём.
//
// Границу заголовка ищем по первой СТРОЧНОЙ букве: всё, что до неё, написано
// капсом, а значит задумывалось как заголовок. Правило простое и потому
// предсказуемое — там, где заголовка нет («В январе 1942 (9 лет) уберёг…»),
// первая строчная стоит сразу, и абзац остаётся обычным текстом.
const RXDATE=/\b\d{2}\.\d{2}\.\d{4}\b/;
const RXDATE_G=/\b\d{2}\.\d{2}\.\d{4}\b/g;
function noteHead(s){
  const i=s.search(/[а-яёa-z]/);
  if(i<0)return null;                       // весь абзац капсом — не заголовок
  // Режем не по букве, а по началу СЛОВА, в котором она нашлась. Иначе
  // «ПОДТВЕРЖДЁН Саввой» давало заголовок «ПОДТВЕРЖДЁН С», а «(со слов
  // Саввы)» теряло открывающую скобку.
  let j=i; while(j>0&&!/\s/.test(s[j-1]))j--;
  const head=s.slice(0,j), rest=s.slice(j);
  const words=head.trim().split(/\s+/).filter(Boolean);
  if(words.length<2||head.trim().length<10||head.length>140)return null;
  return {head:head.trim().replace(/[,:;.—–\-\s]+$/,''), rest:rest.trim()};
}
function noteHtml(z){
  return z.split(/;\s+(?=[А-ЯЁA-Z])/).map(x=>{
    const p=noteHead(x.trim());
    if(!p)return '<p>'+dateq(esc(x.trim()))+'</p>';
    const d=p.head.match(RXDATE);
    const head=(d?p.head.replace(RXDATE,''):p.head)
      .replace(/\s{2,}/g,' ').replace(/\s+([,)])/g,'$1').replace(/[,:;.—–\-\s]+$/,'');
    return '<p><span class="h">'+esc(head)+
      (d?'<span class="d">'+esc(d[0])+'</span>':'')+'</span>'+
      dateq(esc(p.rest))+'</p>';
  }).join('');
}
// Даты внутри текста не убираем — они и есть доказательная часть заметки, —
// но приглушаем, чтобы взгляд шёл по словам, а не спотыкался о цифры.
function dateq(s){return s.replace(RXDATE_G,'<span class="d">$&</span>')}

// В карточке лежит номер снимка в общей таблице PIX, а не сам снимок:
// один документ бывает привязан к пятерым, и вшивать его пять раз незачем.
// Строку тоже понимаем — на случай, если снимок не вшит и остался путём.
function psrc(m){return typeof m.s==='number'?(PIX[m.s]||''):(m.s||'')}
// Полный размер лежит файлом рядом со страницей, а не внутри неё: в плёнке
// показываем миниатюру, а тянем большой файл только когда снимок открыли.
function pfull(m){return typeof m.s==='number'?(PIXF[m.s]||PIX[m.s]||''):(m.s||'')}
function openPic(list,n){
  if(!list||!list.length)return;
  picList=list; picAt=n||0; drawPic();
  document.getElementById('lb').classList.add('on');
}
function drawPic(){
  const m=picList[picAt]; if(!m)return;
  const lb=document.getElementById('lb');
  const im=lb.querySelector('img');
  // пока грузится большой файл, показываем миниатюру — окно не мигает пустотой
  im.src=psrc(m);
  const full=pfull(m);
  if(full&&full!==im.src){const hi=new Image();hi.onload=()=>{if(picList[picAt]===m)im.src=full};hi.src=full}
  lb.querySelector('.cap').textContent=
    (m.c||'')+(picList.length>1?'   '+(picAt+1)+' / '+picList.length:'');
  lb.querySelectorAll('.nav').forEach(b=>b.style.display=picList.length>1?'':'none');
}
function stepPic(d){ if(!picList.length)return;
  picAt=(picAt+d+picList.length)%picList.length; drawPic(); }
function closePic(){ document.getElementById('lb').classList.remove('on'); }

function rels(id){
  const r=R[id]||{};let out='';
  const lnk=x=>'<a data-go="'+x+'">'+esc(((M[x]||{}).n||'').replace(/\n/g,' '))+'</a>';
  if((r.p||[]).length)out+='<dt>'+tr('parents')+'</dt><dd>'+r.p.map(lnk).join(', ')+'</dd>';
  if((r.s||[]).length)out+='<dt>'+tr('spouse')+'</dt><dd>'+r.s.map(lnk).join(', ')+'</dd>';
  if((r.k||[]).length)out+='<dt>'+tr('children')+'</dt><dd>'+r.k.map(lnk).join(', ')+'</dd>';
  return out;
}
function goto(id){
  hidden.clear(); draw();
  const t=world.querySelector('.card[data-id="'+id+'"]');
  if(!t)return;
  stage.scrollTo({left:t.offsetLeft*zoom-stage.clientWidth/2,
                  top:t.offsetTop*zoom-stage.clientHeight/2,behavior:'smooth'});
  show(id,t);
}
function show(id,btn){
  const p=M[id];if(!p)return;
  curId=id;
  world.querySelectorAll('.card[aria-current]').forEach(c=>c.removeAttribute('aria-current'));
  if(btn)btn.setAttribute('aria-current','true');
  panel.innerHTML='<button id="close">×</button><h2>'+esc((p.n||'').replace(/\n/g,' '))+
    '</h2><div class="pid">'+id+(p.y?' · '+p.y:'')+' · '+tr('gen',(p.g||0)+1)+'</div><div>'+
    (p.L?'<span class="tag dl">'+tr('directLine')+'</span>':'')+
    (p.c?'<span class="tag'+(p.c==='низкая'?' low':'')+'">'+esc(trConf(p.c))+'</span>':'')+
    (p.b?'<span class="tag">'+esc(p.b)+'</span>':'')+'</div>'+
    (p.im&&p.im.length?'<div class="gal">'+p.im.map((m,n)=>
      '<img src="'+esc(psrc(m))+'" alt="'+esc(m.c||'')+'" loading="lazy" data-pic="'+n+'"'+
      ' onerror="this.remove()">').join('')+'</div>'+
      '<a class="allpix" href="photos.html#'+esc(id)+'" target="_blank" rel="noopener">'+
      tr('allPhotos',p.im.length)+'</a>':'')+'<dl>'+
    (p.pb?'<dt>'+tr('born')+'</dt><dd>'+esc(p.pb)+(p.by?' · '+p.by:'')+'</dd>':'')+
    (p.pd?'<dt>'+tr('died')+'</dt><dd>'+esc(p.pd)+(p.dy?' · '+p.dy:'')+'</dd>':'')+
    (p.rt?'<dt>'+tr('route')+'</dt><dd><div class="rt">'+p.rt.map(s=>
      '<b>'+esc(trPeriod(s.y,s.u)||'—')+'</b><i>'+esc(s.p)+
      (s.t&&s.t!=='жительство'?' <em>'+esc(trEvt(s.t))+'</em>':'')+'</i>').join('')+
      '</div></dd>':'')+
    (p.sr&&p.sr.length?'<dt>'+tr('stories')+'</dt><dd>'+p.sr.map((s,n)=>
      '<div class="sto"><a class="h" href="stories.html#'+esc(s.i)+'" target="_blank" rel="noopener">'+
      esc(s.t)+'</a>'+
      ((s.k||s.yr)?'<div class="m">'+esc([s.k,s.yr].filter(Boolean).join(' · '))+'</div>':'')+
      (s.g?'<div class="g clip" id="g'+n+'">'+esc(s.g)+'</div>'+
        (s.g.length>240?'<button class="more" data-gist="g'+n+'">'+tr('expand')+'</button>':''):'')+
      '</div>').join('')+'</dd>':'')+
    (p.ct&&p.ct.length?'<dt>'+tr('contacts')+'</dt><dd><div class="ct">'+p.ct.map(c=>
      '<a href="'+esc(c.u)+'" target="_blank" rel="noopener noreferrer">'+esc(c.t)+'</a>'
      ).join('')+'</div></dd>':'')+
    (p.f&&!/photos\//.test(p.f)?'<dt>'+tr('source')+'</dt><dd>'+tr('frame')+' IMG_'+esc(p.f).replace(/;/g,', IMG_')+'</dd>':'')+
    (p.z?'<dt>'+tr('notes')+'</dt><dd><div class="nt clip" id="nt">'+
      noteHtml(p.z)+
      '</div><button class="more" data-note="1">'+tr('expand')+'</button></dd>':'')+
    (p.sc&&p.sc.length?'<dt>'+tr('sources')+'</dt><dd><div class="src">'+
      p.sc.map(sid=>'<button type="button" class="sid" data-src="'+esc(sid)+'">'+
        esc(sid)+'</button>').join('')+'</div><div class="srcx"></div></dd>':'')+
    rels(id)+'</dl>'+
    '<button class="chip plain" id="copy">'+tr('copy')+'</button>'+
    tellUs(id,p);
  panel.classList.add('on');
  panel.querySelector('#close').onclick=()=>{panel.classList.remove('on');
    curId=null;syncHash();
    if(selId){selId=null;selSet=null;paint()}};
  panel.querySelectorAll('a[data-go]').forEach(a=>a.onclick=()=>goto(a.dataset.go));
  // телеграм не умеет подставлять текст в ссылку, поэтому кладём имя и
  // ссылку в буфер: иначе в личку приходит «а это про кого?»
  // «S59» в карточке — код, за которым читатель ничего не видит. Клик
  // разворачивает описание источника прямо здесь, не уводя со страницы.
  const sx=panel.querySelector('.srcx');
  panel.querySelectorAll('.sid').forEach(b=>b.onclick=()=>{
    const s=SRC[b.dataset.src]; if(!s||!sx)return;
    const on=b.getAttribute('aria-pressed')==='true';
    panel.querySelectorAll('.sid').forEach(x=>x.setAttribute('aria-pressed','false'));
    if(on){sx.textContent='';return}
    b.setAttribute('aria-pressed','true');
    sx.innerHTML='<b>'+esc(b.dataset.src)+(s.k?' · '+esc(s.k):'')+'</b>'+esc(s.f)+
      (s.g?'<i>'+esc(tr('srcGives'))+': '+esc(s.g)+'</i>':'');
  });
  const tg=panel.querySelector('#telltg');
  if(tg)tg.onclick=()=>{
    const t=(p.n||'').replace(/\n/g,' ')+' ('+id+') — '+
      location.origin+location.pathname+'#p='+id;
    if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{});
    tg.textContent=tr('tellCopied');
    setTimeout(()=>tg.textContent=tr('tellTg'),2200);
  };
  // снимки: клик открывает во весь экран, стрелки листают внутри карточки
  panel.querySelectorAll('.gal img').forEach(im=>
    im.onclick=()=>openPic(p.im||[],+im.dataset.pic));
  // «развернуть» — и у выжимки истории, и у заметок; кнопка исчезает после клика
  panel.querySelectorAll('.more').forEach(b=>b.onclick=()=>{
    const t=b.dataset.note?panel.querySelector('#nt'):panel.querySelector('#'+b.dataset.gist);
    if(t)t.classList.remove('clip'); b.remove();});
  // если заметка и так короткая, кнопка не нужна
  const nt=panel.querySelector('#nt');
  if(nt&&nt.scrollHeight<=nt.clientHeight+2){
    nt.classList.remove('clip');
    const nb=panel.querySelector('.more[data-note]'); if(nb)nb.remove();
  }
  const cp=panel.querySelector('#copy');
  cp.onclick=()=>{const u=location.origin+location.pathname+location.search+'#p='+id;
    const done=()=>{cp.textContent=tr('copied');setTimeout(()=>cp.textContent=tr('copy'),1600)};
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(u).then(done,()=>{});
    else{const ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);
      ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)}};
  document.querySelectorAll('#results .rit').forEach(b=>
    b.toggleAttribute('aria-current',b.dataset.id===id));
  syncHash();
}

// ── ссылка на человека и на поиск ─────────────────────────────────────
function syncHash(){
  const u=new URLSearchParams();
  if(F.q)u.set('q',F.q);
  if(F.branch)u.set('b',F.branch);
  if(F.era)u.set('era',F.era);
  if(F.status)u.set('st',F.status);
  if(F.conf)u.set('c',F.conf);
  if(F.country)u.set('co',F.country);
  if(F.line)u.set('line','1');
  if(curId)u.set('p',curId);
  const s=u.toString();
  history.replaceState(null,'',s?'#'+s:location.pathname+location.search);
}
function readHash(){
  const u=new URLSearchParams(location.hash.replace(/^#/,''));
  // короткая форма: #L027 — так ссылку проще диктовать по телефону
  const bare=location.hash.replace(/^#/,'');
  if(bare&&!bare.includes('=')) return M[bare]?bare:'';
  F.q=u.get('q')||'';F.branch=u.get('b')||'';F.era=u.get('era')||'';
  F.status=u.get('st')||'';F.conf=u.get('c')||'';F.country=u.get('co')||'';
  F.line=u.get('line')==='1';
  const p=u.get('p')||'';
  return M[p]?p:'';
}
