<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Родословная Лухнёвых</title>
<meta name="description" content="Родословная рода Лухнёвых, 1854–2005, 215 человек.">
<style>
*{box-sizing:border-box}
:root{--paper:#EDEDE9;--card:#FBFBF8;--ink:#1B1B1A;--soft:#6E6E68;--rail:#C0392B;
--stamp:#2C4A6E;--rule:#CFCFC8;
--serif:Georgia,"PT Serif","Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:11px 16px 9px;border-bottom:1px solid var(--rule);position:relative;z-index:30;background:var(--paper)}
h1{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
h1 em{font-style:normal;color:var(--rail)}
.sub{font-size:11px;color:var(--soft);font-family:var(--mono);margin-top:2px}
#langrow{position:absolute;top:10px;right:14px;z-index:31}
#lang{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--rule);
background:var(--card);color:inherit;border-radius:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px}
input[type=search]{font:inherit;padding:5px 9px;border:1px solid var(--rule);background:var(--card);
border-radius:2px;min-width:170px;flex:0 1 230px}
input:focus,button:focus-visible{outline:2px solid var(--stamp);outline-offset:1px}
.chip{padding:5px 9px;border:1px solid var(--rule);background:transparent;border-radius:2px;
font-size:12.5px;color:var(--soft);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.chip.plain{color:var(--ink)}
a.chip{text-decoration:none;display:inline-block}
#hits{display:inline-flex;align-items:center;gap:4px}
.hn{font-family:var(--mono);font-size:11px;color:var(--soft);min-width:52px;text-align:center}
.sep{width:1px;height:18px;background:var(--rule);margin:0 2px}
#stage{position:absolute;left:0;right:0;bottom:0;top:var(--hh,110px);overflow:auto;cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:relative;transform-origin:0 0}
#wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.gband{position:absolute;left:0;height:1px;background:var(--rule);opacity:.6}
.glab{position:absolute;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
text-transform:uppercase;color:var(--soft);background:var(--paper);padding:1px 6px;
z-index:7;border:1px solid var(--rule);border-radius:2px;white-space:nowrap}
.card{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:1px;
padding:5px 8px;border:1.5px solid var(--ink);background:var(--card);border-radius:2px;
text-align:center;overflow:hidden}
.card:hover{background:#fff;z-index:5}
.card.low{border-style:dashed;border-color:var(--rail)}
.card.dl{border-width:2.5px;border-color:var(--stamp)}
.card.alive::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;
border-radius:50%;background:var(--stamp)}
.card[aria-current=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.card[aria-current=true] .yr{color:#C5D4E5}
.nm{font-family:var(--serif);font-size:12.5px;line-height:1.2}
.yr{font-family:var(--mono);font-size:10px;color:var(--soft)}
.card.dim{opacity:.16}
.tg{position:absolute;width:19px;height:19px;border:1.5px solid var(--rail);background:var(--paper);
border-radius:50%;font-size:11px;line-height:1;color:var(--rail);padding:0;font-family:var(--mono);z-index:6}
.tgc{position:absolute;font-family:var(--mono);font-size:9.5px;color:var(--soft);z-index:6;
background:var(--paper);padding:0 2px}
mark{background:#F6E58D;color:inherit;padding:0 1px}
#panel{position:fixed;right:14px;bottom:14px;width:372px;max-height:72vh;overflow:auto;
border:1.5px solid var(--ink);background:var(--card);padding:14px 15px;border-radius:2px;
z-index:40;box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
#panel.on{display:block}
#panel h2{font-family:var(--serif);font-size:16px;font-weight:400;margin:0 0 2px;line-height:1.25}
#panel .pid{font-family:var(--mono);font-size:10px;color:var(--soft)}
#close{position:absolute;top:8px;right:9px;border:0;background:none;font-size:17px;color:var(--soft)}
dl{margin:12px 0 0;font-size:12.5px}
dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin-top:10px}
dd{margin:2px 0 0;line-height:1.45}
/* путь — таблица «когда · где», годы моноширинным в свою колонку:
   отрезки читаются сверху вниз как столбик, а не как сплошная строка */
.rt{display:grid;grid-template-columns:auto 1fr;gap:1px 9px;margin-top:3px}
.rt b{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--soft);
white-space:nowrap;padding-top:1px}
.rt i{font-style:normal}
.rt em{font-style:normal;color:var(--soft);font-size:10.5px}
/* связь — кнопки, а не текст: по ним кликают, а не переписывают руками */
.ct{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ct a{display:inline-block;padding:3px 8px;border:1px solid var(--rule);border-radius:2px;
font-size:11.5px;text-decoration:none;color:var(--stamp);border-bottom:1px solid var(--rule)}
.ct a:hover,.ct a:focus-visible{border-color:var(--stamp);background:#fff}
#panel a{color:var(--stamp);cursor:pointer;border-bottom:1px dotted var(--stamp)}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;padding:2px 5px;
border:1px solid var(--rule);border-radius:2px;margin:5px 4px 0 0}
.tag.low{border-color:var(--rail);color:var(--rail)}
.tag.dl{border-color:var(--stamp);color:var(--stamp)}
/* ── снимки и документы в карточке ──────────────────────────────────
   Плёнка миниатюр под именем. Файлы лежат в photos/ рядом с docs/, а не
   внутри неё: каталог не публикуется (см. .gitignore), поэтому при открытии
   страницы откуда-то ещё картинки просто не загрузятся — и тогда onerror
   убирает миниатюру, чтобы в карточке не висел битый значок. */
.gal{display:flex;gap:6px;overflow-x:auto;margin:10px -2px 0;padding:2px}
.gal img{height:96px;width:auto;border:1px solid var(--rule);border-radius:2px;
cursor:zoom-in;background:#fff;flex:0 0 auto}
.gal img:hover{border-color:var(--stamp)}
.gal.empty{display:none}
#lb{position:fixed;inset:0;background:rgba(15,15,14,.93);z-index:90;display:none;
align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:82vh;object-fit:contain;background:#fff}
#lb .cap{color:#EDEDE9;font-size:12.5px;max-width:70ch;text-align:center;line-height:1.5}
#lb .nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:none;
color:#fff;font-size:26px;opacity:.45;cursor:pointer}
#lb .nav:hover{opacity:1}
#lb .prev{left:0}#lb .next{right:0}
#lb .x{position:absolute;top:12px;right:16px;border:0;background:none;color:#fff;
font-size:26px;opacity:.6;cursor:pointer}
#lb .x:hover{opacity:1}
/* ── истории: заголовок плюс начало выжимки ─────────────────────── */
.sto{margin-top:7px;padding-left:9px;border-left:2px solid var(--rule)}
.sto:first-child{margin-top:3px}
.sto .h{display:block;font-size:12.5px}
.sto .m{font-family:var(--mono);font-size:9.5px;color:var(--soft);letter-spacing:.05em}
.sto .g{margin-top:2px;font-size:11.5px;color:#3B3B38;line-height:1.5}
.sto .g.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sto .more{font-family:var(--mono);font-size:9.5px;color:var(--soft);cursor:pointer;
border:0;background:none;padding:2px 0 0}
.sto .more:hover{color:var(--stamp)}
/* заметки — абзацами, а не сплошной простынёй: они складываются из правок
   разных дней через «; », и без разбивки читать их невозможно */
.nt p{margin:0 0 7px;line-height:1.5}
.nt p:last-child{margin-bottom:0}
.nt.clip{max-height:8.4em;overflow:hidden;position:relative}
.nt.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;
background:linear-gradient(to bottom,rgba(251,251,248,0),var(--card))}
/* маркер на карточке дерева: у человека есть снимок */
.card.haspic::before{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;
border:1px solid var(--stamp);border-radius:1px}
/* ── панель фильтров ────────────────────────────────────────────── */
#filters{display:none;gap:14px 18px;flex-wrap:wrap;align-items:center;
margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule)}
#filters.on{display:flex}
.fg{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.flab{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin-right:2px}
select.f{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--rule);
background:var(--card);color:inherit;border-radius:2px;max-width:210px}
.chip.sm{font-size:11.5px;padding:4px 7px}
#fcount{font-family:var(--mono);font-size:10px;background:var(--stamp);color:#fff;
border-radius:9px;padding:1px 5px;margin-left:4px}
/* ── список найденных ───────────────────────────────────────────── */
#results{position:fixed;left:14px;bottom:14px;width:268px;max-height:56vh;overflow:auto;
border:1.5px solid var(--ink);background:var(--card);border-radius:2px;z-index:39;
box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
#results.on{display:block}
#results h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin:0;padding:10px 12px 6px;position:sticky;top:0;background:var(--card);
border-bottom:1px solid var(--rule)}
.rit{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px;
border-bottom:1px solid var(--rule);line-height:1.25}
.rit:hover,.rit:focus-visible{background:#fff}
.rit[aria-current=true]{background:var(--stamp);color:#fff}
.rit[aria-current=true] .ry{color:#C5D4E5}
.rnm{font-family:var(--serif);font-size:13px}
.ry{display:block;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
#rmore{padding:7px 12px;font-family:var(--mono);font-size:10px;color:var(--soft)}
#copy{margin-top:10px;font-size:11.5px}
@media (max-width:760px){#panel{right:6px;left:6px;width:auto;bottom:6px}
#results{left:6px;right:6px;width:auto;bottom:6px;max-height:38vh}
#langrow{position:static;display:flex;justify-content:flex-end;margin-bottom:6px}}
</style></head><body>

  <div class="bar">
    <input type="search" id="q" placeholder="Фамилия, имя, место или год" aria-label="Поиск">

<script>

9.08.2026 по написаниям Danilow и Danilov, имена Semen, Simeon, Simon: 27 записей, годы рождения 1910–1928, ни одного 1898. Через немецкую систему перемещённых лиц не проходил. Искать путь в Англию иначе: британская натурализация (National Archives, серия HO 334), польские формирования Андерса, торговый флот.; FamilySearch (английские записи, точный поиск по фамилии Daniloff) — 8 записей, ни одной подходящей (S14). Смерти Семёна в Англии нет ни в GRO/FreeBMD, ни в FamilySearch, ни в Find a Grave — три независимых источника. Год смерти 1983 и место считать НЕУСТАНОВЛЕННЫМИ. Arolsen, проверено 09.08.2026: запрос «Danilow Semen» даёт 27 персон, годы рождения 1910, 1911, 1912, 1913, 1918, 1927, 1928 — 1898 отсутствует полностью; В каталоге Национального архива Великобритании (Discovery) фамилия Daniloff даёт 4 записи, все посторонние. Свидетельства о натурализации не найдено. Проверено 11.08.2026 (S17); ГОД СМЕРТИ ПОДТВЕРЖДЁН 12.08.2026, и искали не в той стране: Simon Daniloff, род. 24.05.1898, ум. 01.12.1983, погребение урны 18.01.1984 на кладбище Limhamns kyrkogård в Мальмё, ШВЕЦИЯ, квартал «Minneslunden» (безымянная роща праха), отделение 900 — именной плиты нет (S24). Это единственный Daniloff во всей шведской базе погребений. Вот почему его смерти нет ни в GRO, ни в FreeBMD, ни в Find a Grave: он умер не в Англии. Стоявший в дереве 1983 оказался верным. Косвенное подтверждение — сын Jan Ragnar Leonid Daniloff род. 1946 в приходе Malmö Sankt Petri. НЕ ПРОВЕРЕНО: отчества и места рождения в записи о погребении нет, шведское свидетельство о смерти не заказано; НАЙДЕНА КАРТОЧКА ПОГРЕБЕНИЯ 12.08.2026 (S32): Daniloff, Simon, род. 24.05.1898, ум. 01.12.1983, погребён 18.01.1984, Limhamns kyrkogård в Мальмё, минненслунд «Minneslunden», отделение 900. Единственный Daniloff во всей базе шведских погребений. Практический итог отрицательный: минненслунд — безымянная роща праха, именной плиты и семейного участка нет, и в служебных данных записи с ним не связан никто (otherBuried пустое) — значит через могилу ни первую жену, ни шведскую родню не найти. Следующий шаг — выписка из гравбока у Malmö kyrkogårdsförvaltning с полями «beställare» и «anhörig» (кто заказывал похороны и кто родственник); ВОПРОС Q48 ЗАКРЫТ СЕМЕЙНЫМ РАССКАЗОМ, 13.08.2026 (со слов Юлии Николаевны, L021 — она внучка его сестры). Дословно: «В Швеции жил бабушкин брат Сеня, он уехал учиться в Германию ещё до всего, а потом война, революция… вот ему родители и писали, мол, подожди пока возвращаться. Знал семь языков, много ездил по работе по Европе и северной Африке, вот как-то с Диной и познакомился». «Бабушка» здесь — Антонина Леонидовна (L009), его родная сестра; «Дина» — Элси ДИНА Генри (D013). ЭТО ОБЪЯСНЯЕТ ВСЕ ПУСТЫЕ ПОИСКИ СРАЗУ: он не был ни военнопленным, ни беженцем, ни солдатом армии Андерса — он уехал студентом ДО революции и просто не вернулся, потому что родители сами велели ждать. Поэтому его и нет ни в Arolsen Archives, ни в списках перемещённых лиц, ни в британской натурализации: мы искали человека той судьбы, которой у него не было. Семь языков и разъезды по Европе и Северной Африке объясняют и Англию, и Швецию, и то, как советский подданный оказался женат на англичанке. ОГОВОРКА: это семейное предание в третьей передаче, а не документ. Проверяется по студенческим спискам германских университетов 1914–1917 и по делу в шведском архиве SUK (Q117), где должна стоять дата и обстоятельства приезда; ЖИВОЙ БРИТАНСКИЙ DANILOFF НАЙДЕН 13.08.2026 в реестре директоров Companies House — единственный на всю Британию: LEX DANILOFF, дата рождения май 1985, национальность БРИТАНСКАЯ, страна проживания Англия, адрес для корреспонденции 13 Costead Manor Road, Brentwood, Essex, CM14 4XU, директор с 21.09.2022. Второй Daniloff в реестре — Hans Morten Daniloff, май 1967, норвежец, живёт в Норвегии (это отдельная норвежская линия Даниловых, известная с 1800-х, к нам отношения не имеет). ПОЧЕМУ LEX ВАЖЕН: по нашей линии британских Daniloff быть не должно — дети Евдокии носят фа ов раненым, выжил под трупами, выполз и написал жене записку карандашом из блокнота, передав через другого раненого. Записку принесла девочка лет семи; соседка Поддубная перехватила её и отдала с задержкой. Жена побежала в степь со свёртком, но тела уже не нашла — трупы свозили телегами ко рву."}, {"i": "ST17", "t": "«Мамуленьке от её сына Коли» — солдатская карточка 1952 года", "k": "надпись на фотографии", "yr": "1952", "g": "Дословно: «4 августа 1952 г. Мамуленьке от её сына Коли». На лице — гимнастёрка с погонами и бритая наголо голова: служба. Ему 19 лет. Мать, кому адресовано, — Антонина Леонидовна (L009), к тому времени уже десять лет вдова расстрелянного мужа. Любопытная деталь: и эта надпись, и та, что брату в 1949, датированы ОДНИМ И ТЕМ ЖЕ ДНЁМ — 4 августа. Дважды подряд это вряд ли случайность, похоже, 4 августа было для него особенной датой, возможно днём рождения. Проверять по документам, а не по этой догадке"}, {"i": "ST27", "t": "Искала мужа в степи по записке", "k": "воспоминания", "yr": "2026", "g": "Об Антонине Леонидовне в архиве стоят две фразы, и обе стоят целой биографии: она говорила по-немецки — дочь учителя, выросшая в семье, где это было нормой (её отец Леонид Прокофьевич преподавал, см. ST21), — и «после расстрела мужа искала его в степи по записке». Мужа, Николая Дмитриевича, взяли и расстреляли; последняя его собственная подпись, какая у нас есть, — «28/X-38 г., г. Харьков» на обороте фотокарточки (ST18). Кто-то передал ей записку с указанием места, и она пошла искать. Осталась вдовой с четырьмя детьми: Елена 1924, Николай 1933, Павел 1935, Александр 1938. Прожила до 1997 года — то есть переживла мужа на пятьдесят пять лет. В 1952 году сын прислал ей из армии карточку с подписью «Мамуленьке от её сына Коли» (ST17)"}, {"i": "ST31", "t": "Учитель немецкого без аттестата: путь Леонида Прокофьевича от Темрюка до Миргорода", "k": "документ", "yr": "1914", "g": "Человек без свидетельства об окончании среднего учебного заведения стал преподава   expandN:n=>`expand ${n} descendants`, collapseBranch:'collapse branch',
  ancestorsOf:name=>`ancestors of: ${name} — click anyone to build their ancestors`,
  parents:'Parents', spouse:'Spouse', children:'Children',
  source:'Source', notes:'Notes', frame:'frame',
  directLine:'direct line',
  conf:{'высокая':'high','средняя':'medium','низкая':'low'},
  evt:{'жительство':'lived','переезд':'moved','служба':'service','работа':'work',
       'учёба':'studies','эмиграция':'emigration','прочее':'other'},
 },
};
const LSKEY='familytree-lang';
let LANG=localStorage.getItem(LSKEY)||((navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en');
const tr=(k,...args)=>{const v=(I18N[LANG]||I18N.ru)[k];return typeof v==='function'?v(...args):v};
const trConf=c=>{const d=(I18N[LANG]||I18N.ru).conf;return (d&&d[c])||c};
const trEvt=t=>{const d=(I18N[LANG]||I18N.ru).evt;return (d&&d[t])||t};
// «2012–2021», «с 2012», «2026», «по 2021» — отрезок словами текущего языка
function trPeriod(y,u){
  const now=u==='сейчас';
  if(y&&now)return tr('pFrom',y);
  if(y&&u)return y===u?y:y+'–'+u;
  if(y)return y;
  if(now)return tr('pNow');
  return u?tr('pUntil',u):'';
}

// вся ветка человека: предки вверх до конца + потомки вниз до конца + супруги (для целых пар)
function lineageOf(id){
  const core=new Set([id]);
  (function up(i){((R[i]||{}).p||[]).forEach(p=>{if(!core.has(p)){core.add(p);up(p)}})})(id);
  (function down(i){((R[i]||{}).k||[]).forEach(c=>{if(!core.has(c)){core.add(c);down(c)}})})(id);
  const out=new Set(core);
  core.forEach(i=>((R[i]||{}).s||[]).forEach(sp=>out.add(sp)));
  return out;
}

// какие блоки скрыты (свёрнуты потомки)
function visible(){
  const out=new Set(U.units.map(u=>u.id));
  const kill=u=>{(U.childUnits[u]||[]).forEach(c=>{if(out.has(c)){out.delete(c);kill(c)}})};
  hidden.forEach(h=>kill(h));
  return out;
}
function descCount(uid){
  const seen=new Set(); const go=u=>(U.childUnits[u]||[]).forEach(c=>{if(!seen.has(c)){seen.add(c);go(c)}});
  go(uid); let n=0; seen.forEach(c=>n+=UN[c].m.length); return n;
}

const pos={};   // uid -> {x,y,w}
function layout(){
  const vis=visible();
  const rows=[];
  for(let g=0;g<=U.maxg;g++){
    const ids=(U.layers[String(g)]||[]).filter(i=>vis.has(i));
    rows.push(ids);
  }
  rows.forEach((ids,g)=>{
    let x=0;
    ids.forEach(id=>{pos[id]={x:x,y:0,w:uw(UN[id])};x+=uw(UN[id])+UG});
  });
  // подтягиваем блоки к середине связанных, но ширину полосы держим в узде
  const par={},chi={};
  Object.keys(U.childUnits).forEach(p=>{(U.childUnits[p]||[]).forEach(c=>{
    (chi[p]=chi[p]||[]).push(c);(par[c]=par[c]||[]).push(p)})});
  const centre=id=>pos[id].x+pos[id].w/2;
  const tight={};
  rows.forEach((ids,g)=>{tight[g]=ids.reduce((a,id)=>a+pos[id].w+UG,0)-UG});
  for(let pass=0;pass<18;pass++){
    const dir=pass%2===0;
    const seq=rows.map((r,i)=>i); if(!dir)seq.reverse();
    seq.forEach(g=>{
      const ids=rows[g]; if(!ids.length)return;
      const want={};
      ids.forEach(id=>{
        const rel=(dir?par[id]:chi[id])||[];
        const v=rel.filter(x=>pos[x]&&vis.has(x)).map(centre);
        want[id]=v.length?v.reduce((a,b)=>a+b,0)/v.length:centre(id);
      });
      // слева направо: не даём налезать друг на друга
      let x=-1e9;
      ids.forEach(id=>{const w=pos[id].w;
        pos[id].x=Math.max(want[id]-w/2,x); x=pos[id].x+w+UG});
      // справа налево: стягиваем обратно, убирая лишние промежутки
      x=1e9;
      for(let i=ids.length-1;i>=0;i--){const id=ids[i],w=pos[id].w;
        pos[id].x=Math.min(pos[id].x,x-w-UG,Math.max(want[id]-w/2,pos[id].x));
        x=pos[id].x}
      for(let i=1;i<ids.length;i++){const a=ids[i-1],b=ids[i];
        pos[b].x=Math.max(pos[b].x,pos[a].x+pos[a].w+UG)}
      // если полосу всё-таки растащило — сжимаем к её центру
      const L0=pos[ids[0]].x, R0=pos[ids[ids.length-1]].x+pos[ids[ids.length-1]].w;
      const cap=tight[g]*1.4;
      if(R0-L0>cap){
        const k=cap/(R0-L0), c0=(L0+R0)/2;
        ids.forEach(id=>{pos[id].x=c0+(pos[id].x-c0)*k});
        for(let i=1;i<ids.length;i++){const a=ids[i-1],b=ids[i];
          pos[b].x=Math.max(pos[b].x,pos[a].x+pos[a].w+UG)}
      }
    });
  }
  let minx=1e9,maxx=-1e9;
  rows.forEach(ids=>ids.forEach(id=>{minx=Math.min(minx,pos[id].x);maxx=Math.max(maxx,pos[id].x+pos[id].w)}));
  rows.forEach((ids,g)=>ids.forEach(id=>{
    pos[id].x-=minx-40;
    pos[id].y=(flip?(U.maxg-g):g)*ROW+34;
  }));
  return {rows,w:maxx-minx+80,h:(U.maxg+1)*ROW+90};
}

function card(id){
  const p=M[id]||{n:id,y:''};
  const b=document.createElement('button'); b.type='button'; b.dataset.id=id;
  b.className='card'+(p.c==='низкая'?' low':'')+(p.L?' dl':'')+(p.a?' alive':'')+((p.im&&p.im.length)?' haspic':'');
  b.style.width=CW+'px'; b.style.height=CH+'px';
  b.title=tr('cardTitle');
  b.innerHTML='<span class="nm">'+esc(p.n).replace(/\n/g,'<br>')+'</span>'+
              (p.y?'<span class="yr">'+p.y+'</span>':'');
  b.onclick=e=>{e.stopPropagation();
    if(anc&&(R[id]||{}).p&&R[id].p.length&&id!==ancRoot){ancRoot=id;draw();return}
    if(!anc){selId=(selId===id)?null:id;selSet=selId?lineageOf(selId):null;paint()}
    show(id,b)};
  return b;
}

function draw(){
  world.innerHTML='<svg id="wires"></svg>';
  const svg=document.getElementById('wires');
  if(anc){drawAnc(svg);return}
  const L=layout(), vis=visible();
  world.style.width=L.w+'px'; world.style.height=L.h+'px';
  svg.setAttribute('width',L.w); svg.setAttribute('height',L.h);
  // полосы поколений
  L.rows.forEach((ids,g)=>{
    if(!ids.length)return;
    const y=(flip?(U.maxg-g):g)*ROW+34;
    const b=document.createElement('div'); b.className='gband';
    b.style.top=(y-16)+'px'; b.style.width=L.w+'px'; world.appendChild(b);
    const t=document.createElement('div'); t.className='glab';
    t.textContent=tr('gen',g+1); t.style.top=(y-24)+'px'; t.style.left='6px';
    world.appendChild(t);
  });
  // линии
  const at={};
  L.rows.forEach(ids=>ids.forEach(id=>{
    const u=UN[id];
    u.m.forEach((mid,i)=>{at[mid]={x:pos[id].x+i*(CW+MG),y:pos[id].y}});
  }));
  const seen=new Set();
  U.edges.forEach(e=>{
    if(!at[e.c]||!at[e.a])return;
    if(!vis.has(U.unitOf[e.c]))return;
    const ax=at[e.a].x+CW/2, bx=e.b&&at[e.b]?at[e.b].x+CW/2:ax;
    const px=(ax+bx)/2, py=at[e.a].y+(flip?0:CH);
    const cx=at[e.c].x+CW/2, cy=at[e.c].y+(flip?CH:0);
    const my=(py+cy)/2;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${px} ${py} L${px} ${my} L${cx} ${my} L${cx} ${cy}`);
    path.setAttribute('fill','none'); path.setAttribute('stroke','#C0392B');
    path.setAttribute('stroke-width','1.3'); path.setAttribute('opacity',e.d?'.6':'.85');
    if(e.d)path.setAttribute('stroke-dasharray','5 4');
    svg.appendChild(path);
    const k=e.a+'|'+(e.b||'');
    if(e.b&&at[e.b]&&!seen.has(k)){ seen.add(k);
      const m=document.createElementNS('http://www.w3.org/2000/svg','line');
      m.setAttribute('x1',ax);m.setAttribute('x2',bx);
      m.setAttribute('y1',at[e.a].y+CH/2);m.setAttribute('y2',at[e.a].y+CH/2);
      m.setAttribute('stroke','#C0392B');m.setAttribute('stroke-width','1.3');
      svg.appendChild(m);}
  });
  // карточки
  L.rows.forEach(ids=>ids.forEach(id=>{
    const u=UN[id];
    u.m.forEach((mid,i)=>{
      const c=card(mid);
      c.style.left=(pos[id].x+i*(CW+MG))+'px'; c.style.top=pos[id].y+'px';
      world.appendChild(c);
    });
    const kidsN=descCount(id);
    if(kidsN){
      const t=document.createElement('button'); t.className='tg'; t.type='button';
      t.textContent=hidden.has(id)?'+':'−';
      t.title=hidden.has(id)?tr('expandN',kidsN):tr('collapseBranch');
      t.style.left=(pos[id].x+pos[id].w/2-9.5)+'px';
      t.style.top=(pos[id].y+(flip?-24:CH+5))+'px';
      t.onclick=e=>{e.stopPropagation();
        hidden.has(id)?hidden.delete(id):hidden.add(id); draw()};
      world.appendChild(t);
      if(hidden.has(id)){
        const n=document.createElement('span'); n.className='tgc'; n.textContent=kidsN;
        n.style.left=(pos[id].x+pos[id].w/2+12)+'px';
        n.style.top=(pos[id].y+(flip?-22:CH+7))+'px'; world.appendChild(n);
      }
    }
  }));
  paint(); stickLabels();
}

function drawAnc(svg){
  const lv=[[ancRoot]], seenA=new Set([ancRoot]);
  for(let d=0;d<8;d++){
    const nx=[];
    lv[d].forEach(id=>((R[id]||{}).p||[]).forEach(p=>{if(!seenA.has(p)){seenA.add(p);nx.push(p)}}));
    if(!nx.length)break; lv.push(nx);
  }
  const at={}; let W=0;
  lv.forEach((ids,d)=>{
    const w=ids.length*CW+(ids.length-1)*UG; W=Math.max(W,w);
  });
  lv.forEach((ids,d)=>{
    const w=ids.length*CW+(ids.length-1)*UG, x0=(W-w)/2+40;
    ids.forEach((id,i)=>{at[id]={x:x0+i*(CW+UG),y:d*ROW+40}});
  });
  world.style.width=(W+80)+'px'; world.style.height=(lv.length*ROW+80)+'px';
  svg.setAttribute('width',W+80); svg.setAttribute('height',lv.length*ROW+80);
  lv.forEach(ids=>ids.forEach(id=>{
    ((R[id]||{}).p||[]).forEach(p=>{
      if(!at[p])return;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      const y1=at[id].y+CH,y2=at[p].y,my=(y1+y2)/2;
      path.setAttribute('d',`M${at[id].x+CW/2} ${y1} L${at[id].x+CW/2} ${my} L${at[p].x+CW/2} ${my} L${at[p].x+CW/2} ${y2}`);
      path.setAttribute('fill','none');path.setAttribute('stroke','#C0392B');path.setAttribute('stroke-width','1.3');
      svg.appendChild(path);});
  }));
  Object.keys(at).forEach(id=>{
    const c=card(id); c.style.left=at[id].x+'px'; c.style.top=at[id].y+'px'; world.appendChild(c);
  });
  const t=document.createElement('div'); t.className='glab';
  t.textContent=tr('ancestorsOf',((M[ancRoot]||{}).n||'').replace(/\n/g,' '));
  t.style.top='8px'; t.style.left='40px'; world.appendChild(t);
  paint();
}

let hits=[],hitIdx=0;
const terms=()=>nrm(F.q).split(/\s+/).filter(Boolean);
const anyFilter=()=>!!(F.branch||F.era||F.status||F.conf||F.country||F.line);
const searching=()=>terms().length>0||anyFilter();

// «1900-1950» — это диапазон годов рождения, а не два слова для поиска
const rangeOf=()=>{const m=/^(\d{4})\s*-\s*(\d{4})$/.exec(nrm(F.q).trim());
  return m?{lo:+m[1],hi:+m[2]}:null};

function passFilters(id){
  const p=M[id]||{};
  if(F.line&&!p.L)return false;
  if(F.branch&&p.b!==F.branch)return false;
  if(F.conf&&p.c!==F.conf)return false;
  if(F.status&&p.st!==F.status)return false;
  if(F.country&&p.co!==F.country)return false;
  if(F.era){
    if(F.era==='none')return p.by==null;
    if(p.by==null)return false;
    const e=ERAS.find(x=>x.k===F.era)||{};
    if(e.lo!=null&&p.by<e.lo)return false;
    if(e.hi!=null&&p.by>e.hi)return false;
  }
  return true;
}
function matchQuery(id){
  const r=rangeOf();
  const p=M[id]||{};
  if(r)return p.by!=null&&p.by>=r.lo&&p.by<=r.hi;
  const ts=terms();
  return !ts.length||ts.every(t=>(p.q||'').includes(t));
}
// подсветка совпадений: нормализация длину не меняет, поэтому позиции
// из нормализованной строки годятся для исходной
function hi(name){
  const ts=rangeOf()?[]:terms();
  const plain=()=>esc(name).replace(/\n/g,'<br>');
  if(!ts.length)return plain();
  const low=nrm(name),spans=[];
  ts.forEach(t=>{for(let i=low.indexOf(t);i>=0;i=low.indexOf(t,i+1))spans.push([i,i+t.length])});
  if(!spans.length)return plain();
  spans.sort((a,b)=>a[0]-b[0]);
  const m=[];
  spans.forEach(s=>{const last=m[m.length-1];
    if(last&&s[0]<=last[1])last[1]=Math.max(last[1],s[1]);else m.push(s.slice())});
  let out='',pos=0;
  m.forEach(([s,e])=>{out+=esc(name.slice(pos,s))+'<mark>'+esc(name.slice(s,e))+'</mark>';pos=e});
  return (out+esc(name.slice(pos))).replace(/\n/g,'<br>');
}

function paint(){
  hits=[];
  const on=searching();
  world.querySelectorAll('.card').forEach(c=>{
    const id=c.dataset.id,p=M[id]||{},nm=c.querySelector('.nm');
    nm.innerHTML=hi(p.n||'');
    const ok=passFilters(id)&&matchQuery(id);
    const okSel=anc||!selSet||selSet.has(id);
    c.classList.toggle('dim',!(ok&&okSel));
    if(ok&&okSel&&on)hits.push(c);
  });
  hits.sort((a,b)=>parseFloat(a.style.top)-parseFloat(b.style.top)||
                   parseFloat(a.style.left)-parseFloat(b.style.left));
  const box=document.getElementById('hits');
  box.style.display=on?'inline-flex':'none';
  if(on)box.querySelector('#hn').textContent=hits.length?
    tr('hitsOf',Math.min(hitIdx+1,hits.length),hits.length) : tr('hitsNone');
  renderResults();
  const n=[F.branch,F.era,F.status,F.conf,F.country].filter(Boolean).length+(F.line?1:0);
  const badge=document.getElementById('fcount');
  badge.textContent=n||'';badge.style.display=n?'':'none';
}

function renderResults(){
  const box=document.getElementById('results');
  if(!searching()||anc){box.classList.remove('on');box.innerHTML='';return}
  const ids=hits.map(c=>c.dataset.id),cap=60;
  let html='<h3>'+esc(tr('results',ids.length))+'</h3>';
  ids.slice(0,cap).forEach(id=>{const p=M[id]||{};
    html+='<button type="button" class="rit" data-id="'+id+'"'+
          (id===curId?' aria-current="true"':'')+'><span class="rnm">'+
          hi((p.n||'').replace(/\n/g,' '))+'</span><span class="ry">'+
          esc([p.y,p.b].filter(Boolean).join(' · '))+'</span></button>';});
  if(ids.length>cap)html+='<div id="rmore">'+esc(tr('more',ids.length-cap))+'</div>';
  box.innerHTML=html;box.classList.add('on');
  box.querySelectorAll('.rit').forEach(b=>b.onclick=()=>{
    hitIdx=ids.indexOf(b.dataset.id);
    const el=world.querySelector('.card[data-id="'+b.dataset.id+'"]');
    centerOn(el);show(b.dataset.id,el);});
}

// человек может быть внутри свёрнутой ветки — тогда карточки нет и поиск
// «ничего не нашёл» соврал бы: раскрываем и ищем ещё раз
function expandIfHiddenMatch(){
  if(!hidden.size||!searching())return false;
  const visibleIds=new Set([...world.querySelectorAll('.card')].map(c=>c.dataset.id));
  const missed=Object.keys(M).some(id=>!visibleIds.has(id)&&passFilters(id)&&matchQuery(id));
  if(missed){hidden.clear();draw();return true}
  return false;
}
function refilter(){
  hitIdx=0;paint();
  if(expandIfHiddenMatch())paint();
  syncHash();
  if(hits.length&&terms().length)centerOn(hits[0]);
}
function centerOn(el){
  if(!el)return;
  stage.scrollTo({left:el.offsetLeft*zoom-stage.clientWidth/2+74*zoom,
                  top:el.offsetTop*zoom-stage.clientHeight/2+27*zoom,behavior:'smooth'});
  world.querySelectorAll('.card[aria-current]').forEach(c=>c.removeAttribute('aria-current'));
  el.setAttribute('aria-current','true');
}
function jump(d){
  if(!hits.length)return;
  hitIdx=(hitIdx+d+hits.length)%hits.length;
  centerOn(hits[hitIdx]);
  document.getElementById('hn').textContent=tr('hitsOf',hitIdx+1,hits.length);
  show(hits[hitIdx].dataset.id,hits[hitIdx]);
}

// ── просмотр снимка во весь экран ───────────────────────────────────

function openPic(list,n){

function stepPic(d){ if(!picList.length)return;

function rels(id){

      '<img src="'+esc(m.s)+'" alt="'+esc(m.c||'')+'" loading="lazy" data-pic="'+n+'"'+
      ' onerror="this.remove()">').join('')+'</div>':'')+'<dl>'+
    (p.pb?'<dt>'+tr('born')+'</dt><dd>'+esc(p.pb)+(p.by?' · '+p.by:'')+'</dd>':'')+
    (p.pd?'<dt>'+tr('died')+'</dt><dd>'+esc(p.pd)+(p.dy?' · '+p.dy:'')+'</dd>':'')+

      '<b>'+esc(trPeriod(s.y,s.u)||'—')+'</b><i>'+esc(s.p)+

      '<div class="sto"><a class="h" href="stories.html#'+esc(s.i)+'" target="_blank" rel="noopener">'+
      esc(s.t)+'</a>'+
      ((s.k||s.yr)?'<div class="m">'+esc([s.k,s.yr].filter(Boolean).join(' · '))+'</div>':'')+
      (s.g?'<div class="g clip" id="g'+n+'">'+esc(s.g)+'</div>'+
        (s.g.length>240?'<button class="more" data-gist="g'+n+'">'+tr('expand')+'</button>':''):'')+
      '</div>').join('')+'</dd>':'')+
    (p.ct&&p.ct.length?'<dt>'+tr('contacts')+'</dt><dd><div class="ct">'+p.ct.map(c=>
      '<a href="'+esc(c.u)+'" target="_blank" rel="noopener noreferrer">'+esc(c.t)+'</a>'
      ).join('')+'</div></dd>':'')+
    (p.f&&!/photos\//.test(p.f)?'<dt>'+tr('source')+'</dt><dd>'+tr('frame')+' IMG_'+esc(p.f).replace(/;/g,', IMG_')+'</dd>':'')+
    (p.z?'<dt>'+tr('notes')+'</dt><dd><div class="nt clip" id="nt">'+
      p.z.split(/;\s+(?=[А-ЯЁA-Z])/).map(x=>'<p>'+esc(x.trim())+'</p>').join('')+
      '</div><button class="more" data-note="1">'+tr('expand')+'</button></dd>':'')+
    rels(id)+'</dl>'+
    '<button class="chip plain" id="copy">'+tr('copy')+'</button>';
  panel.classList.add('on');
  panel.querySelector('#close').onclick=()=>{panel.classList.remove('on');
    curId=null;syncHash();
    if(selId){selId=null;selSet=null;paint()}};
  panel.querySelectorAll('a[data-go]').forEach(a=>a.onclick=()=>goto(a.dataset.go));
  // снимки: клик открывает во весь экран, стрелки листают внутри карточки
  panel.querySelectorAll('.gal img').forEach(im=>
    im.onclick=()=>openPic(p.im||[],+im.dataset.pic));
  // «развернуть» — и у выжимки истории, и у заметок; кнопка исчезает после клика
  panel.querySelectorAll('.more').forEach(b=>b.onclick=()=>{
    const t=b.dataset.note?panel.querySelector('#nt'):panel.querySelector('#'+b.dataset.gist);
    if(t)t.classList.remove('clip'); b.remove();});
  // если заметка и так короткая, кнопка не нужна
  const nt=panel.querySelector('#nt');
  if(nt&&nt.scrollHeight<=nt.clientHeight+2){
    nt.classList.remove('clip');
    const nb=panel.querySelector('.more[data-note]'); if(nb)nb.remove();
  }
  const cp=panel.querySelector('#copy');
  cp.onclick=()=>{const u=location.origin+location.pathname+location.search+'#p='+id;
    const done=()=>{cp.textContent=tr('copied');setTimeout(()=>cp.textContent=tr('copy'),1600)};
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(u).then(done,()=>{});
    else{const ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);
      ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)}};
  document.querySelectorAll('#results .rit').forEach(b=>
    b.toggleAttribute('aria-current',b.dataset.id===id));
  syncHash();
}

function setZoom(z){zoom=Math.min(1.5,Math.max(.25,z));world.style.transform='scale('+zoom+')';
  document.getElementById('zl').textContent=Math.round(zoom*100)+'%'}

// лайтбокс: закрытие, листание мышью и с клавиатуры
(function(){

  lb.querySelector('.prev').onclick=e=>{e.stopPropagation();stepPic(-1)};
  lb.querySelector('.next').onclick=e=>{e.stopPropagation();stepPic(1)};

})();

// ── фильтры: группы независимы, между собой пересекаются ──────────────
function chipRow(host,values,key,labels){
  document.getElementById(host).innerHTML=values.map(v=>
    '<button type="button" class="chip sm" data-k="'+esc(key)+'" data-v="'+esc(v)+'" '+
    'aria-pressed="'+(F[key]===v)+'">'+esc(labels(v))+'</button>').join('');
}
function buildFilters(){
  const sel=(id,list,anyLabel,key)=>{
    const s=document.getElementById(id);
    s.innerHTML='<option value="">'+esc(anyLabel)+'</option>'+
      list.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
    s.value=F[key]||'';
  };
  sel('fbranch',U.branches||[],tr('any'),'branch');
  const cs=U.countries||[];
  document.getElementById('fgcountry').style.display=cs.length?'':'none';
  sel('fcountry',cs,tr('any'),'country');
  chipRow('feras',ERAS.map(e=>e.k),'era',v=>tr('era')[v]);
  chipRow('fstatuses',STATUSES,'status',v=>tr('status')[v]);
  chipRow('fconfs',CONFS,'conf',v=>v?trConf(v):tr('anyC'));
  document.querySelectorAll('#filters .chip[data-k]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    F[k]=F[k]===b.dataset.v?'':b.dataset.v;
    document.querySelectorAll('#filters .chip[data-k="'+k+'"]').forEach(x=>
      x.setAttribute('aria-pressed',F[k]===x.dataset.v));
    refilter();
  });
}
document.getElementById('fbranch').onchange=e=>{F.branch=e.target.value;refilter()};
document.getElementById('fcountry').onchange=e=>{F.country=e.target.value;refilter()};
const fline=document.getElementById('fline');
fline.onclick=()=>{F.line=!F.line;fline.setAttribute('aria-pressed',F.line);refilter()};
const fbtn=document.getElementById('fbtn');
fbtn.onclick=()=>{const box=document.getElementById('filters');
  const on=box.classList.toggle('on');fbtn.setAttribute('aria-pressed',on);hh()};
document.getElementById('freset').onclick=()=>{
  Object.assign(F,{q:'',branch:'',era:'',status:'',conf:'',country:'',line:false});
  syncControls();refilter()};

function syncControls(){
  qi.value=F.q;
  document.getElementById('fbranch').value=F.branch;
  document.getElementById('fcountry').value=F.country;
  fline.setAttribute('aria-pressed',F.line);
  document.querySelectorAll('#filters .chip[data-k]').forEach(x=>
    x.setAttribute('aria-pressed',F[x.dataset.k]===x.dataset.v));
}

// ── ссылка на человека и на поиск ─────────────────────────────────────
function syncHash(){
  const u=new URLSearchParams();
  if(F.q)u.set('q',F.q);
  if(F.branch)u.set('b',F.branch);
  if(F.era)u.set('era',F.era);
  if(F.status)u.set('st',F.status);
  if(F.conf)u.set('c',F.conf);
  if(F.country)u.set('co',F.country);
  if(F.line)u.set('line','1');
  if(curId)u.set('p',curId);
  const s=u.toString();
  history.replaceState(null,'',s?'#'+s:location.pathname+location.search);
}
function readHash(){
  const u=new URLSearchParams(location.hash.replace(/^#/,''));
  // короткая форма: #L027 — так ссылку проще диктовать по телефону
  const bare=location.hash.replace(/^#/,'');
  if(bare&&!bare.includes('=')) return M[bare]?bare:'';
  F.q=u.get('q')||'';F.branch=u.get('b')||'';F.era=u.get('era')||'';
  F.status=u.get('st')||'';F.conf=u.get('c')||'';F.country=u.get('co')||'';
  F.line=u.get('line')==='1';
  const p=u.get('p')||'';
  return M[p]?p:'';
}
function updateFlipLabel(){document.getElementById('flip').textContent=flip?tr('flipOn'):tr('flipOff')}
function updateAncLabel(){document.getElementById('anc').textContent=anc?tr('ancOff'):tr('ancOn')}
document.getElementById('flip').onclick=()=>{flip=!flip;updateFlipLabel();draw()};
document.getElementById('col').onclick=()=>{
  U.units.forEach(u=>{if((U.childUnits[u.id]||[]).length&&u.g<=1)hidden.add(u.id)});draw()};
document.getElementById('exp').onclick=()=>{hidden.clear();draw()};
document.getElementById('anc').onclick=()=>{anc=!anc;
  document.getElementById('anc').setAttribute('aria-pressed',anc);

  document.documentElement.lang=LANG;

  document.getElementById('lang').value=LANG;

  document.getElementById('hprev').setAttribute('aria-label',tr('prevLbl'));
  document.getElementById('hnext').setAttribute('aria-label',tr('nextLbl'));
  fline.childNodes[0].nodeValue=tr('mLine');
  fbtn.childNodes[0].nodeValue=tr('filters');
  document.getElementById('freset').textContent=tr('reset');
  document.getElementById('lbBranch').textContent=tr('fBranch');
  document.getElementById('lbEra').textContent=tr('fEra');
  document.getElementById('lbStatus').textContent=tr('fStatus');
  document.getElementById('lbConf').textContent=tr('fConf');
  document.getElementById('lbCountry').textContent=tr('fCountry');
  const ml=document.getElementById('maplink');

  if(sl)sl.textContent=tr('stories');

  document.getElementById('zout').setAttribute('aria-label',tr('zoomOutLbl'));
  document.getElementById('zin').setAttribute('aria-label',tr('zoomInLbl'));
  updateFlipLabel(); updateAncLabel();
}
document.getElementById('lang').onchange=e=>{
  LANG=e.target.value; localStorage.setItem(LSKEY,LANG);

    const el=world.querySelector('.card[data-id="'+curId+'"]');

  }
};
let down=false,sx,sy,dx,dy;
function stickLabels(){
  const x=stage.scrollLeft/zoom+6;
  world.querySelectorAll('.glab').forEach(l=>l.style.left=x+'px');
}
stage.addEventListener('scroll',stickLabels);
stage.addEventListener('mousedown',e=>{if(e.target.closest('button'))return;
  down=true;stage.classList.add('drag');sx=e.pageX;sy=e.pageY;dx=stage.scrollLeft;dy=stage.scrollTop});
addEventListener('mouseup',()=>{down=false;stage.classList.remove('drag')});
addEventListener('mousemove',e=>{if(!down)return;e.preventDefault();
  stage.scrollLeft=dx-(e.pageX-sx);stage.scrollTop=dy-(e.pageY-sy)});
addEventListener('keydown',e=>{if(e.key==='Escape')panel.classList.remove('on')});
const hh=()=>document.documentElement.style.setProperty('--hh',
  document.querySelector('header').offsetHeight+'px');
addEventListener('resize',hh);hh();

relabel();
syncControls();
draw();
setZoom(Math.max(.5,Math.min(1,(stage.clientWidth-40)/world.offsetWidth)));
stage.scrollLeft=(world.offsetWidth*zoom-stage.clientWidth)/2;
stage.scrollTop=0;

if(searching())refilter();
