<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Родословная Лухнёвых</title>
<meta name="description" content="Родословная рода Лухнёвых, 1854–2005, 216 человек.">
<style>
*{box-sizing:border-box}
:root{--paper:#EDEDE9;--card:#FBFBF8;--ink:#1B1B1A;--soft:#6E6E68;--rail:#C0392B;
--stamp:#2C4A6E;--rule:#CFCFC8;
--serif:Georgia,"PT Serif","Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:11px 16px 9px;border-bottom:1px solid var(--rule);position:relative;z-index:30;background:var(--paper)}
h1{font-family:var(--serif);font-size:18px;font-weight:400;margin:0}
h1 em{font-style:normal;color:var(--rail)}
.sub{font-size:11px;color:var(--soft);font-family:var(--mono);margin-top:2px}
#langrow{position:absolute;top:10px;right:14px;z-index:31}
#lang{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--rule);
background:var(--card);color:inherit;border-radius:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px}
input[type=search]{font:inherit;padding:5px 9px;border:1px solid var(--rule);background:var(--card);
border-radius:2px;min-width:170px;flex:0 1 230px}
input:focus,button:focus-visible{outline:2px solid var(--stamp);outline-offset:1px}
.chip{padding:5px 9px;border:1px solid var(--rule);background:transparent;border-radius:2px;
font-size:12.5px;color:var(--soft);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.chip.plain{color:var(--ink)}
a.chip{text-decoration:none;display:inline-block}
#hits{display:inline-flex;align-items:center;gap:4px}
.hn{font-family:var(--mono);font-size:11px;color:var(--soft);min-width:52px;text-align:center}
.sep{width:1px;height:18px;background:var(--rule);margin:0 2px}
#stage{position:absolute;left:0;right:0;bottom:0;top:var(--hh,110px);overflow:auto;cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:relative;transform-origin:0 0}
#wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.gband{position:absolute;left:0;height:1px;background:var(--rule);opacity:.6}
.glab{position:absolute;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
text-transform:uppercase;color:var(--soft);background:var(--paper);padding:1px 6px;
z-index:7;border:1px solid var(--rule);border-radius:2px;white-space:nowrap}
.card{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:1px;
padding:5px 8px;border:1.5px solid var(--ink);background:var(--card);border-radius:2px;
text-align:center;overflow:hidden}
.card:hover{background:#fff;z-index:5}
.card.low{border-style:dashed;border-color:var(--rail)}
.card.dl{border-width:2.5px;border-color:var(--stamp)}
.card.alive::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;
border-radius:50%;background:var(--stamp)}
.card[aria-current=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.card[aria-current=true] .yr{color:#C5D4E5}
.nm{font-family:var(--serif);font-size:12.5px;line-height:1.2}
.yr{font-family:var(--mono);font-size:10px;color:var(--soft)}
.card.dim{opacity:.16}
.tg{position:absolute;width:19px;height:19px;border:1.5px solid var(--rail);background:var(--paper);
border-radius:50%;font-size:11px;line-height:1;color:var(--rail);padding:0;font-family:var(--mono);z-index:6}
.tgc{position:absolute;font-family:var(--mono);font-size:9.5px;color:var(--soft);z-index:6;
background:var(--paper);padding:0 2px}
mark{background:#F6E58D;color:inherit;padding:0 1px}
#panel{position:fixed;right:14px;bottom:14px;width:372px;max-height:72vh;overflow:auto;
border:1.5px solid var(--ink);background:var(--card);padding:14px 15px;border-radius:2px;
z-index:40;box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
#panel.on{display:block}
#panel h2{font-family:var(--serif);font-size:16px;font-weight:400;margin:0 0 2px;line-height:1.25}
#panel .pid{font-family:var(--mono);font-size:10px;color:var(--soft)}
#close{position:absolute;top:8px;right:9px;border:0;background:none;font-size:17px;color:var(--soft)}
dl{margin:12px 0 0;font-size:12.5px}
dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin-top:10px}
dd{margin:2px 0 0;line-height:1.45}
/* путь — таблица «когда · где», годы моноширинным в свою колонку:
   отрезки читаются сверху вниз как столбик, а не как сплошная строка */
.rt{display:grid;grid-template-columns:auto 1fr;gap:1px 9px;margin-top:3px}
.rt b{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--soft);
white-space:nowrap;padding-top:1px}
.rt i{font-style:normal}
.rt em{font-style:normal;color:var(--soft);font-size:10.5px}
/* связь — кнопки, а не текст: по ним кликают, а не переписывают руками */
.ct{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ct a{display:inline-block;padding:3px 8px;border:1px solid var(--rule);border-radius:2px;
font-size:11.5px;text-decoration:none;color:var(--stamp);border-bottom:1px solid var(--rule)}
.ct a:hover,.ct a:focus-visible{border-color:var(--stamp);background:#fff}
#panel a{color:var(--stamp);cursor:pointer;border-bottom:1px dotted var(--stamp)}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;padding:2px 5px;
border:1px solid var(--rule);border-radius:2px;margin:5px 4px 0 0}
.tag.low{border-color:var(--rail);color:var(--rail)}
.tag.dl{border-color:var(--stamp);color:var(--stamp)}
/* ── снимки и документы в карточке ──────────────────────────────────
   Плёнка миниатюр под именем. Файлы лежат в photos/ рядом с docs/, а не
   внутри неё: каталог не публикуется (см. .gitignore), поэтому при открытии
   страницы откуда-то ещё картинки просто не загрузятся — и тогда onerror
   убирает миниатюру, чтобы в карточке не висел битый значок. */
.gal{display:flex;gap:6px;overflow-x:auto;margin:10px -2px 0;padding:2px}
.gal img{height:96px;width:auto;border:1px solid var(--rule);border-radius:2px;
cursor:zoom-in;background:#fff;flex:0 0 auto}
.gal img:hover{border-color:var(--stamp)}
.gal.empty{display:none}
#lb{position:fixed;inset:0;background:rgba(15,15,14,.93);z-index:90;display:none;
align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:82vh;object-fit:contain;background:#fff}
#lb .cap{color:#EDEDE9;font-size:12.5px;max-width:70ch;text-align:center;line-height:1.5}
#lb .nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:none;
color:#fff;font-size:26px;opacity:.45;cursor:pointer}
#lb .nav:hover{opacity:1}
#lb .prev{left:0}#lb .next{right:0}
#lb .x{position:absolute;top:12px;right:16px;border:0;background:none;color:#fff;
font-size:26px;opacity:.6;cursor:pointer}
#lb .x:hover{opacity:1}
/* ── истории: заголовок плюс начало выжимки ─────────────────────── */
.sto{margin-top:7px;padding-left:9px;border-left:2px solid var(--rule)}
.sto:first-child{margin-top:3px}
.sto .h{display:block;font-size:12.5px}
.sto .m{font-family:var(--mono);font-size:9.5px;color:var(--soft);letter-spacing:.05em}
.sto .g{margin-top:2px;font-size:11.5px;color:#3B3B38;line-height:1.5}
.sto .g.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sto .more{font-family:var(--mono);font-size:9.5px;color:var(--soft);cursor:pointer;
border:0;background:none;padding:2px 0 0}
.sto .more:hover{color:var(--stamp)}
/* заметки — абзацами, а не сплошной простынёй: они складываются из правок
   разных дней через «; », и без разбивки читать их невозможно */
.nt p{margin:0 0 9px;line-height:1.5}
.nt p:last-child{margin-bottom:0}
/* Заметка — исследовательский журнал: абзац обычно начинается заголовком
   капсом и датой проверки («ГОД СМЕРТИ ПОДТВЕРЖДЁН 12.08.2026, и искали не в
   той стране…»). Капс посреди текста читается как крик, а дата посреди фразы
   спотыкает. Поэтому заголовок выносится отдельной строкой, а дата уходит
   в тихую пометку рядом с ним — сам текст заметки при этом не меняется. */
.nt .h{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
color:var(--stamp);line-height:1.35;margin-bottom:2px}
.nt .d{font-family:var(--mono);font-size:9.5px;color:var(--soft);white-space:nowrap}
.nt .h .d{margin-left:5px}
.nt.clip{max-height:8.4em;overflow:hidden;position:relative}
.nt.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;
background:linear-gradient(to bottom,rgba(251,251,248,0),var(--card))}
/* откуда известно: коды источников, разворачивающиеся в описание */
.src{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.sid{font-family:var(--mono);font-size:10px;padding:3px 7px;border:1px solid var(--rule);
background:transparent;border-radius:2px;color:var(--stamp);letter-spacing:.04em}
.sid:hover{border-color:var(--stamp);background:#fff}
.sid[aria-pressed=true]{background:var(--stamp);border-color:var(--stamp);color:#fff}
.srcx:not(:empty){margin-top:7px;padding:8px 10px;border-left:2px solid var(--stamp);
background:rgba(44,74,110,.04);font-size:11.5px;line-height:1.5;color:#3B3B38}
.srcx b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
color:var(--stamp);margin-bottom:3px;font-weight:400}
.srcx i{display:block;font-style:normal;color:var(--soft);margin-top:5px;font-size:11px}
/* «знаете больше — напишите». Сайт ничего не собирает сам: кнопка открывает
   письмо или мессенджер. Стоит внизу карточки — после того, как человек
   прочитал, что мы про его родственника знаем, и увидел, чего не хватает. */
.tell{margin-top:14px;padding-top:11px;border-top:1px dashed var(--rule)}
.tell .tl{font-size:12px;color:var(--soft);margin-bottom:6px;line-height:1.4}
.tell .tb{display:flex;flex-wrap:wrap;gap:6px}
.tell a.chip{color:var(--stamp);border-color:var(--rule);text-decoration:none}
.tell a.chip:hover{border-color:var(--stamp);background:#fff}
/* «все снимки» — уводит на отдельную страницу, где кадры лежат по человеку
   и грузятся лениво; в карточке остаются только миниатюры */
.allpix{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:9.5px;
letter-spacing:.05em;color:var(--stamp);text-decoration:none;border-bottom:1px dotted var(--stamp)}
/* маркер на карточке дерева: у человека есть снимок */
.card.haspic::before{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;
border:1px solid var(--stamp);border-radius:1px}
/* ── первый экран ───────────────────────────────────────────────────
   Раньше страница открывалась полотном из двухсот карточек — на телефоне
   это стена нечитаемых прямоугольников, и человек не понимает, что от него
   хотят. Один экран с тремя понятными входами, показывается один раз. */
#hello{position:fixed;inset:0;background:rgba(27,27,26,.55);z-index:70;
display:none;align-items:center;justify-content:center;padding:20px}
#hello.on{display:flex}
#hello .hb{background:var(--card);border:1.5px solid var(--ink);border-radius:2px;
padding:22px 24px;width:100%;max-width:430px;box-shadow:0 8px 34px rgba(0,0,0,.2)}
#hello h2{font-family:var(--serif);font-size:19px;font-weight:400;margin:0 0 8px}
#hello p{margin:0 0 16px;font-size:13.5px;line-height:1.55;color:#3B3B38}
#hello .hx{display:flex;flex-wrap:wrap;gap:7px}
#hello .chip{padding:7px 12px;font-size:13px}
/* ── шапка на телефоне ──────────────────────────────────────────────
   Двенадцать кнопок в три ряда съедали пол-экрана. На узком экране
   остаются поиск, прямая линия, фильтры и «Вид»; остальное — под «Вид». */
#vbtn{display:none}
#viewgrp{display:contents}
@media (max-width:760px){
  #vbtn{display:inline-block}
  #viewgrp{display:none}
  #viewgrp.on{display:flex;flex-wrap:wrap;gap:6px;width:100%;margin-top:2px}
  .bar .sep{display:none}
}
/* ── легенда ────────────────────────────────────────────────────────
   Пунктирная красная рамка, толстая синяя, точка, квадратик — это язык,
   понятный только тому, кто его придумал. Без расшифровки догадка на
   полотне читается ровно как факт, а таких людей в дереве треть. */
#legend{display:none;gap:10px 22px;flex-wrap:wrap;align-items:center;
margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule)}
#legend.on{display:flex}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft)}
.lg .sw{width:26px;height:15px;border:1.5px solid var(--ink);background:var(--card);
border-radius:2px;position:relative;flex:0 0 auto}
.lg .sw.low{border-style:dashed;border-color:var(--rail)}
.lg .sw.dl{border-width:2.5px;border-color:var(--stamp)}
.lg .sw.alive::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;
border-radius:50%;background:var(--stamp)}
.lg .sw.haspic::before{content:"";position:absolute;top:2px;left:2px;width:5px;height:5px;
border:1px solid var(--stamp);border-radius:1px}
.lg .sw.tg{width:19px;height:19px;border:1.5px solid var(--rail);border-radius:50%;
color:var(--rail);font-family:var(--mono);font-size:10px;line-height:16px;text-align:center}
/* ── панель фильтров ────────────────────────────────────────────── */
#filters{display:none;gap:14px 18px;flex-wrap:wrap;align-items:center;
margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule)}
#filters.on{display:flex}
.fg{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.flab{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin-right:2px}
select.f{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--rule);
background:var(--card);color:inherit;border-radius:2px;max-width:210px}
.chip.sm{font-size:11.5px;padding:4px 7px}
#fcount{font-family:var(--mono);font-size:10px;background:var(--stamp);color:#fff;
border-radius:9px;padding:1px 5px;margin-left:4px}
/* ── список найденных ───────────────────────────────────────────── */
#results{position:fixed;left:14px;bottom:14px;width:268px;max-height:56vh;overflow:auto;
border:1.5px solid var(--ink);background:var(--card);border-radius:2px;z-index:39;
box-shadow:0 4px 20px rgba(0,0,0,.12);display:none}
#results.on{display:block}
#results h3{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
color:var(--soft);margin:0;padding:10px 12px 6px;position:sticky;top:0;background:var(--card);
border-bottom:1px solid var(--rule)}
.rit{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px;
border-bottom:1px solid var(--rule);line-height:1.25}
.rit:hover,.rit:focus-visible{background:#fff}
.rit[aria-current=true]{background:var(--stamp);color:#fff}
.rit[aria-current=true] .ry{color:#C5D4E5}
.rnm{font-family:var(--serif);font-size:13px}
.ry{display:block;font-family:var(--mono);font-size:9.5px;color:var(--soft)}
#rmore{padding:7px 12px;font-family:var(--mono);font-size:10px;color:var(--soft)}
#copy{margin-top:10px;font-size:11.5px}
@media (max-width:760px){#panel{right:6px;left:6px;width:auto;bottom:6px}
#results{left:6px;right:6px;width:auto;bottom:6px;max-height:38vh}
#langrow{position:static;display:flex;justify-content:flex-end;margin-bottom:6px}}
</style></head><body>
<header>
  <div id="langrow">
    <select id="lang" aria-label="Язык / Language">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
  </div>
  <h1 id="h1">Родословная <em>Лухнёвых</em></h1>
  <div class="sub" id="sub">216 человек · 8 поколений · 1854—2005</div>
  <div class="bar">
    <input type="search" id="q" placeholder="Фамилия, имя, место или год" aria-label="Поиск">
    <span id="hits" style="display:none"><button class="chip plain" id="hprev" aria-label="Предыдущее">‹</button><span id="hn" class="hn"></span><button class="chip plain" id="hnext" aria-label="Следующее">›</button></span>
    <button class="chip" id="fline" aria-pressed="false">Прямая линия</button>
    <button class="chip" id="fbtn" aria-pressed="false">Фильтры<span id="fcount" style="display:none"></span></button>
    <button class="chip plain" id="vbtn" aria-pressed="false">Вид</button>
    <button class="chip plain" id="legbtn" aria-pressed="false" aria-label="Что значат рамки и точки">?</button>
    <a class="chip plain" id="photoslink" href="photos.html">Снимки</a>
    <a class="chip plain" id="storieslink" href="stories.html">Истории</a>
    <a class="chip plain" id="maplink" href="map.html">Карта</a>
    <span id="viewgrp">
    <span class="sep"></span>
    <button class="chip plain" id="exp">Раскрыть всё</button>
    <button class="chip plain" id="col">Свернуть</button>
    <button class="chip plain" id="flip">Старшие снизу</button>
    <span class="sep"></span>
    <button class="chip plain" id="zout" aria-label="Уменьшить">−</button>
    <button class="chip plain" id="zl">100%</button>
    <button class="chip plain" id="zin" aria-label="Увеличить">+</button>
    <button class="chip plain" id="anc" aria-pressed="false">Предки одного</button>
    </span>
  </div>
  <div id="legend"></div>
  <div id="filters">
    <div class="fg"><span class="flab" id="lbBranch">Ветка</span><select class="f" id="fbranch"></select></div>
    <div class="fg"><span class="flab" id="lbEra">Эпоха</span><span id="feras"></span></div>
    <div class="fg"><span class="flab" id="lbStatus">Статус</span><span id="fstatuses"></span></div>
    <div class="fg"><span class="flab" id="lbConf">Уверенность</span><span id="fconfs"></span></div>
    <div class="fg" id="fgcountry"><span class="flab" id="lbCountry">Страна</span><select class="f" id="fcountry"></select></div>
    <button class="chip plain" id="freset">Сбросить</button>
  </div>
</header>
<div id="stage"><div id="world"><svg id="wires"></svg></div></div>
<aside id="results"></aside>
<aside id="panel"></aside>
<div id="lb">
  <button class="x" aria-label="Закрыть">×</button>
  <button class="nav prev" aria-label="Предыдущий">‹</button>
  <img alt="">
  <div class="cap"></div>
  <button class="nav next" aria-label="Следующий">›</button>
</div>
<div id="hello"><div class="hb">
  <h2 id="hetitle">Родословная Лухнёвых</h2>
  <p id="hetext"></p>
  <div class="hx">
    <button class="chip" id="hself">Найти себя</button>
    <button class="chip plain" id="hline">Прямая линия</button>
    <button class="chip plain" id="hall">Смотреть всё</button>
  </div>

<script>

л в деревне, возил почту на лошадке Рыжка. Похоронен в Вознесенске». ПИСАРЬ В ЛЕСНИЧЕСТВЕ. Не пахарь — грамотный человек на службе. И это встаёт в один ряд с находкой из ревизской сказки 1762 года, где в той же Афанасьевской боярщине записано: «афонасьевской боярщины крестьянин Иван Лухнев руку приложил» — вместо неграмотного старосты, за него. Грамотность в роду держалась двести лет, от Ивана, подписавшегося за старосту, до Дмитрия, писавшего бумаги в лесничестве, и дальше до его внучки Татьяны Алексеевны, о методике которой область печатала брошюры. ВОЙНА. Ушёл в 1914 году сорока лет от роду, вернулся в 1919-м — то есть прошёл и мировую, и то, что за ней. Вернулся ФЕЛЬДФЕБЕЛЕМ: это старший унтер-офицерский чин, выше него у нижних чинов ничего нет. И с ГЕОРГИЕВСКИМ КРЕСТОМ — награда солдатская, за личную храбрость, её не давали за выслугу. ПОСЛЕ. Вернулся в деревню и возил почту. Лошадь звали Рыжка — единственная деталь этой жизни, которая не про службу и не про войну, и единственная, которую внуки запомнили дословно. ЧТО ОСТАЛОСЬ СПОРНЫМ. Год смерти: у Юлии Николаевны 1924, на схеме 1927 (Q128). И где похоронен — «Вознесенск» может быть и местным Вознесенским погостом, и городом на Украине (Q127). Ни то, ни другое в дерево не проставлено."}, {"i": "ST39", "t": "Род документирован с 1762 года: Лухнёвы в вологодских ревизиях", "k": "архив", "yr": "1762", "g": "Ключ, которого не хватало год: Верхнетоемский район до 1924 года — Афанасьевская волость (в XVIII веке «Афанасьевская бояршина») СОЛЬВЫЧЕГОДСКОГО уезда ВОЛОГОДСКОЙ губернии. Значит ревизские сказки и метрики родовых деревень лежат в ГАВО (Вологда), а не в архангельских архивах, по которым мы ходили. Лухнёвы в этих самых деревнях значатся с 1762 года. III ревизия 1762 (ГАВО ф.388 оп.1 д.8445): «Иван Симанов сын Лухнев вдов, у него дети в последнюю ревизию написанные Иван, Ларион, Иван же» и «Осип Аверкиев сын Лухнев»; там же «афонасьевской боярщины крестьянин Иван Лухнев руку приложил» вместо неграмотного старо хневу». Его маршрут — Устюг и Сольвычегодск, Пермь и Чердынь, Чаронда — ложится на единую систему поморских хлебных складов, снабжавших Сибирь. НАСКОЛЬКО РЕДКА ФАМИЛИЯ: в Ономастиконе Веселовского, где собраны имена и прозвища XV–XVII веков по всей Московии, основа «Лухн» встречается РОВНО ОДИН РАЗ — и это он."}], "sc": ["S13"], "im": [{"s": 0, "c": "Писарь, фельдфебель и лошадка Рыжка: Дмитрий Ефимович Лухнёв"}], "L": 1}, "L002": {"n": "Лухнёва Евдокия Фёдоровна", "y": "1868–1950", "c": "высокая", "f": "0910;0911", "z": "Жена L001. Девичья фамилия неизвестна; РОДИНА УСТАНОВЛЕНА 13.08.2026 (со слов Юлии Николаевны): «Жена его Евдокия Фёдоровна, 1868–1950, крестьянка из Красноборска». Красноборск стоит на Северной Двине ниже Верхней Тоймы — то есть невесту взяли из соседнего уезда, а не из своей волости. Девичья фамилия по-прежнему неизвестна, но теперь известно, где её искать: метрики Красноборска, ГАВО или архангельские фонды; МЕТРИКУ 1868 ГОДА ИСКАЛ 13.08.2026, НЕ НАЙДЕНА — отрицательный результат, чтобы не искать заново. В оцифровке «Яндекс Архива» вологодский корпус по Красноборску есть, но не тот: ревизия 1782 года (ГАВО ф.388 оп.1а д.36, ф.388 оп.9 д.19 и д.28, ф.496 оп.1 д.3545 и д.3547) и метрики 1916 года (ф.496 оп.59 д.271). Между ними — пусто, а нужен 1868-й. Зато прояснился административный расклад, по которому её и надо заказывать: Красноборская округа делилась на волости, и в оцифрованных делах видны Черевковская волость, Шангальский приход, Юрьев-на-Волоку, село Пермогорское. Ещё ограничение: искать её метрику по фамилии нельзя, потому что девичья фамилия и есть то, что мы ищем; заходить придётся по имени, году и приходу — то есть просматривать дело целиком. Заказывать в ГАВО, фонд 496 (Вологодская духовная консистория), красноборские приходы, 1868 год, см. Q132", "b": "Лухнёвы", "s": "нет", "a": 0, "g": 2, "st": "dead", "by": 1868, "q": "l002 лухнева евдокия федоровна лухневы 1868 1950 красноборск, красноборский район, архангельская область, россия ж , {"p": "Керчь, Крым", "t": "работа", "y": "1928", "u": "1929"}, {"p": "Темрюк, Краснодарский край, Россия", "t": "работа", "y": "1929", "u": ""}, {"p": "Темрюк, Краснодарский край, Россия", "t": "работа", "y": "1929", "u": ""}, {"p": "Кашпур (Большой и Малый), Псекупский район, Адыгейская авт. область, Россия", "t": "работа", "y": "1930", "u": ""}, {"p": "Курчанская, Темрюкский район, Краснодарский край, Россия", "t": "работа", "y": "1930", "u": ""}, {"p": "Красное Село (Красносельский с/с), Псекупский район, Адыгейская авт. область, Россия", "t": "работа", "y": "1930", "u": "1931"}, {"p": "Красногвардейское, Красногвардейский район, Адыгея, Россия", "t": "работа", "y": "1931", "u": ""}, {"p": "Темрюк, Краснодарский край, Россия", "t": "работа", "y": "", "u": ""}, {"p": "Харьков, Харьковская область, Украина", "t": "работа", "y": "1937", "u": "1938"}, {"p": "Евпатория, Крым", "t": "переезд", "y": "1961", "u": ""}], "sr": [{"i": "ST01", "t": "«Рыжий кот против фрау Босс, или Сквозь мутные стёкла времени»", "k": "роман", "yr": "2011", "g": "Документально-художественный роман евпаторийского журналиста о гибели Николая Дмитриевича Лухнёва в январе 1942 года. Написан в октябре 2010, вышел в мае 2011 коллекционным тиражом 50 экземпляров. Это развёрнутая версия газетных очерков «Свидетельство Неизвестного» (21.11.2002) и «Вдогонку за памятью» (~2005), которые в сети найти не удалось. Что рассказано в романе. Николай Дмитриевич — начальник УВСР, военно-строительной организации в Евпатории. В харьковский Военстрой был прислан рядовым инженером, быстро стал начальником строительства крупного объекта — «батьке в то время не было и тридцати». Оттуда откомандирован в Караганду, затем переведён в Евпаторию: сдал квартиру в Харькове и перевёз семью. УВСР строило хранилище горюче-смазочных материалов и расширяло евпаторийский аэродром, имело самый большой гараж в городе. Особый отдел УВСР его «разрабатывал». Жена Тоня (Антонина Леонидовна, L009) сносно говорила по-немецки и этим отбила первый обыск. Гибель. Задержан полицейскими на улице Средней, отбился и бежал, ранен в грудь. Выдан соседкой Поддубной в обмен на освобождение её мужа. Уведён в колонне через Каменные ворота и Интернациональную в сторону Пересыпи, дальше степью мимо вокзала на Красную горку. В колонне узнал соседского мальчишку Костю Майданюка — назвался ему «Андреем Петровичем» и уговорил дать свистом сигнал к массовому побегу. Мальчик свистнул и был убит очередью. Расстрел вела айнзатцгруппа «Д» Отто Олендорфа с участием гарнизона и полиции. Лухнёв упал в ров раненым, выжил под трупами, выполз и написал жене записку карандашом из блокнота, передав через другого раненого. Записку принесла девочка лет семи; соседка Поддубная перехватила её и отдала с задержкой. Жена побежала в степь со свёртком, но тела уже не нашла — трупы свозили телегами ко рву."}, {"i": "ST17", "t": "«Мамуленьке от её сына Коли» — солдатская карточка 1952 года", "k": "надпись на фотографии", "yr": "1952", "g": "Дословно: «4 августа 1952 г. Мамуленьке от её сына Коли». На лице — гимнастёрка с погонами и бритая наголо голова: служба. Ему 19 лет. Мать, кому адресовано, — Антонина Леонидовна (L009), к тому времени уже десять лет вдова расстрелянного мужа. Любопытная деталь: и эта надпись, и та, что брату в 1949, датированы ОДНИМ И ТЕМ ЖЕ ДНЁМ — 4 августа. Дважды подряд это вряд ли случайность, похоже, 4 августа было для него особенной датой, возможно днём рождения. Проверять по документам, а не по этой догадке"}, {"i": "ST27", "t": "Искала мужа в степи по записке", "k": "воспоминания", "yr": "2026", "g": "Об Антонине Леонидовне в архиве стоят две фразы, и обе стоят целой биографии: она говорила по-немецки — дочь учителя, выросшая в семье, где это было нормой (её отец Леонид Прокофьевич преподавал, см. ST21), — и «после расстрела мужа искала его в степи по записке». Мужа, Николая Дмитриевича, взяли и расстреляли; последняя его собственная подпись, какая у нас есть, — «28/X-38 г., г. Харьков» на обороте фотокарточки (ST18). Кто-то передал ей записку с указанием места, и она пошла искать. Осталась вдовой с четырьмя детьми: Елена 1924, Николай 1933, Павел 1935, Александр 1938. Прожила до 1997 года — то есть переживла мужа на пятьдесят пять лет. В 1952 году сын прислал ей из армии карточку с подписью «Мамуленьке от её сына Коли» (ST17)"}, {"i": "ST31", "t": "Учитель немецкого без аттестата: путь Леонида Прокофьевича от Темрюка до Миргорода", "k": "документ", "yr": "1914", "g": "Человек без свидетельства об окончании среднего учебного заведения стал преподавателем гимназии — и разрешение на это дал лично император. 22 декабря 1907 года Высочайшим повелением «и. об. преподавателя нѣмецкаго языка Нижне-Чирскаго реальнаго училища Леонида Данилова» допустили к испытанию на звание учителя гимназии «без представленія свидѣтельства об окончаніи курса средняго учебнаго заведенія». Самоучка, знавший язык. Дальше по документам складывается вся дорога: Темрюк, где в 1902 году заведено его личное дело в Дирекции народных училищ Кубанской области и где в 1896–1906 годах рождались шестеро его детей; Нижне-Чирское реальное училище на Дону к 1907-му; частная мужская гимназия Денченко в Харькове, откуда он ушёл по собственному прошению 8 апреля 1912 года; и с 1913/14 учебного года — МИРГОРОДСКАЯ МУЖСКАЯ ГИМНАЗИЯ, где он значится в справочниках три года подряд. Гимназия была молодая, открыта в 1910-м взамен частной и росла по классу в год, так что в 1914-м седьмой класс был выпускным — из него ему и написал ученик Перевозский: «не могу забыть Вашего милаго отношенія къ нашему классу». И здесь же ответ на давний вопрос, откуда в семье языки: их отец преподавал немецкий. Сын Семён знал семь языков и уехал учиться в Германию, дочь Антонина говорила по-немецки"}, {"i": "ST32", "t": "Аттестат 1920 года: латынь, логика и политэкономия в бывшей женской гимназии", "k": "документ", "yr": "1920", "g": "Удостоверение № 388 от 9 июня 1920 года: гражданка Данилова Антонина Леонидовна с 1 сентября 1919 по 15 июня 1920 обучалась в Единой трудовой школе II ступени № 2 города Темрюка — «бывш. женск. гимназ.» — и прослушала программу восьмого класса по восьми предметам: русский язык, математика, физика, латинский язык, французский язык, логика, гигиена и политическая экономия. Восьмой класс женской гимназии был педагогическим: он и давал право учить детей. Отсюда понятно, откуда взялись сорок лет её работы воспитательницей и учительницей — и, возможно, тот немецкий язык, которым она владела (отец, Леонид Прокофьевич, преподавал немецкий в Миргородской гимназии)."}, {"i": "ST33", "t": "Керченская детская трудовая колония имени Томского: год работы и штамп биржи труда", "k": "документ", "yr": "1928", "g": "Два документа с разницей в полгода. Первый — направление Керченского отдела народного образования № 2590 от июля 1928: «Керч. ОНО при сем направляет на должность воспитательницы вверенной Вам трудколонии тов. Данилову». Второй — справка № 650 от 10 января 1929: она состояла воспитательницей Керченской детской трудовой колонии имени ТОМСКОГО с 6 марта 1928 по 8 января 1929. Поверх справки стоит штамп «Керчстрахкасса. Записан на пособие по безработице» — уйдя из колонии, она сразу встала на учёт. Бланк исполкома двуязычный: слева русский, справа крымскотатарский АРАБИЦЕЙ — Крымская АССР ещё не перевела язык на латиницу. И отдельная мелочь для архивного поиска: в справке 1929 года делопроизводитель записал её отчество «Леонардовне» вместо «Леонидовне»."}, {"i": "ST34", "t": "Заведывающая Введенской школой: две недели марта и справка через четыре месяца", "k": "документ", "yr": "1929", "g": "Справка № 5б, выданная в Темрюке 2 июля 1929 года: «Дана сия Даниловой А. Л. в том, что она действительно была ЗАВЕДЫВАЮЩЕЙ въ Введенской школе с 1-го марта по 15 мар[та], что подписью и приложением печати удостоверяется». Это единственная её руководящая должность до 1931 года — и всего две недели. Дата выдачи объясняет, зачем справка понадобилась: в те же дни, 3 июля 1929 года, она нотариально заверила и своё старое удостоверение о работе в Темрюкском детдоме. Человек собирал дела для нового места."}, {"i": "ST35", "t": "Харьков 1937–1938: детинтернат военных строителей, где сходятся муж и жена", "k": "документ", "yr": "1938", "g": "Справка № 3-1/108-01 от 8 января 1938 года на бланке «УВСР № 150 СКО Харьковского военного округа, г. Харьков, пл. Дзержинского, бывш. дом Кооперации»: товарищ ЛУХНЕВА А. Л. работала в Управлении участка военно-строительных работ № 150 в должности воспитательницы детинтерната с 7 марта по 1 июля 1937 года и с 1 сентября 1937 по 5 января 1938 года и уволена в связи с ЛИКВИДАЦИЕЙ детинтерната. Эта бумага независимо подтверждает то, что до сих пор держалось на газетном очерке: её муж Николай Дмитриевич (L004) был военным строителем, и в дереве у него стоит харьковское жительство с 1938 года. Теперь видно, что оба были в одной военно-строительной системе одного города, и она — при детях этой части."}, {"i": "ST36", "t": "4 августа 1961: сдала жилплощадь в Евпатории — и это дата отъезда из Крыма", "k": "документ", "yr": "1961", "g": "Справка № 1-09 от 4 августа 1961 года: «Выдана гр-ке ЛУХНЕВОЙ Антонине Леонидовне в том, что она сдала занимаемую ею жилплощадь ОКХ г. Евпатории. Справка выдана для предъявления по новому месту жительства». Одна строка — а закрывает целый переезд: семья ушла из Крыма в августе 1961 года. До сих пор восточноказахстанский период был известен только со слов: сын Николай Николаевич (L013) жил в Усть-Каменогорске «с 1965 года точно». Теперь у отъезда есть бумажная дата, и она на четыре года раньше — мать снялась с места в 1961."}, {"i": "ST38", "t": "Круг замкнулся: уехала из Евпатории в 1961, умерла в Усть-Каменогорске в 1997", "k": "документ", "yr": "1997", "g": "Свидетельство о смерти на бланке уже независимого Казахстана: Лухнева Антонина Леонидовна умерла 10 июля 1997 года в возрасте 97 лет в городе Усть-Каменогорске, причина — атеросклероз, запись акта № 2208. Вместе со справкой 1961 года о сдаче евпаторийской жилплощади это замыкает её маршрут: в 61-м она снялась с места в Крыму «по новому месту жительства», а последние годы прожила там, куда уехала, — рядом с сыном в Восточном Казахстане. В дереве у неё до сих пор не было ни даты, ни места смерти, только год. Рядом — свидетельство о смерти сватьи: Трубникова Екатерина Николаевна умерла 18 июля 1993 года в том же Усть-Каменогорске, в возрасте 84 лет. Две бабушки одной семьи, ушедшие в одном городе с разницей в четыре года."}], "sc": ["S59", "S60"], "im": [{"s": 5, "c": "Аттестат 1920 года: латынь, логика и политэкономия в бывшей женской гимназии"}, {"s": 6, "c": ""}, {"s": 7, "c": ""}, {"s": 8, "c": ""}, {"s": 9, "c": ""}, {"s": 10, "c": "«Мамуленьке от её сына Коли» — солдатская карточка 1952 года"}, {"s": 11, "c": "«Мамуленьке от её сына Коли» — солдатская карточка 1952 года"}, {"s": 4, "c": "Искала мужа в степи по записке"}, {"s": 12, "c": "Керченская детская трудовая колония имени Томского: год работы и штамп биржи труда"}, {"s": 13, "c": "Керченская детская трудовая колония имени Томского: год работы и штамп биржи труда"}, {"s": 14, "c": "Заведывающая Введенской школой: две недели марта и справка через четыре месяца"}, {"s": 15, "c": "Харьков 1937–1938: детинтернат военных строителей, где сходятся муж и жена"}, {"s": 16, "c": "4 августа 1961: сдала жилплощадь в Евпатории — и это дата отъезда из Крыма"}, {"s": 17, "c": "Круг замкнулся: уехала из Евпатории в 1961, умерла в Усть-Каменогорске в 1997"}, {"s": 18, "c": "Круг замкнулся: уехала из Евпатории в 1961, умерла в Усть-Каменогорске в 1997"}], "L": 1}, "ME002": {"n": "Мехнин Прокопий Арефьевич", "y": "1900", "c": "низкая", "f": "", "z": "НЕ ПРИВЯЗАН К ДЕРЕВУ, РОДСТВО НЕ УСТАНОВЛЕНО. Мехнин из с. Солдатово Больше-Нарымского (ныне Катон-Карагайского) района Восточно-Казахстанской обл. Источник: S39, карточка проверена мной лично 12.08.2026. Арестован 24.07.1930, приговор 5 лет ИТЛ; реабилитирован 27.10.1989. В карточке район назван Катон-Карагайским ( ерева через api.php?action=opensearch, 12.08.2026", "f": "«Открытый список» (ru.openlist.wiki), СПЛОШНОЙ обход по всем 59 фамилиям дерева через api.php?action=opensearch, 12.08.2026", "g": "11 685 карточек по 55 фамилиям. Главное: Лухнёвых во всей базе репрессированных ровно двое — Яков Павлович 1892 (LU001) и Власий Семёнович 1913 (LU002, д. Горличевская Березниковского р-на, новая для нас локация фамилии). Остальное — массив однофамильцев по частым фамилиям (Семёнов, Фёдоров, Хасанов и т.п. упираются в предел выдачи 500), для отбора нужны место и отчество"}, "S23": {"k": "База данных", "h": "С", "f": "С. В. Волков, «Участники Белого движения в России», буква Л, с. 398 PDF, swolkov.org, 12.08.2026", "g": "Полная биография LU001 Лухнёва Якова Павловича: род. 6 авг. 1892 в Шенкурске, 5-й Финляндский стрелковый полк, 12-й Северный стрелковый полк, лагеря в Финляндии, Франция, 4-й Марковский полк, плен 30.10.1920, расстрелян 4.12.1920 в Херсоне. Во всей базе Белого движения только два Лухнёва ДОПОЛНЕНО 12.08.2026: в алфавитном указателе этой базы значится не только Лухнев (буква Л), но и МЕХНИН (буква М) — вторая редкая северная фамилия из нашего дерева, см. Q96; Мелихов и Миловидов там тоже есть, но эти фамилии слишком частые, чтобы что-то значить. Указатель перечисляет фамилии, а не персоналии, сами статьи в сеть не выложены — нужен запрос автору или печатные тома, см. Q98. И РАСХОЖДЕНИЕ: здесь местом расстрела назван Херсон, а в крымских списках (S37) — Джанкой, при одной и той же дате 04.12.1920; разбор в Q99."}, "S24": {"k": "База данных", "h": "svenskagravar.se — шведский реестр погребений, 12.08.2026", "f": "svenskagravar.se — шведский реестр погребений, 12.08.2026", "g": "Simon Daniloff (D008): род. 24.05.1898, ум. 01.12.1983, погребение урны 18.01.1984, кладбище Limhamns kyrkogård в Мальмё, квартал Minneslunden, отделение 900. Единственный Daniloff в Швеции. Объясняет, почему смерти нет в английских реестрах"}, "S25": {"k": "Публикация", "h": "«Электронная кни
