Уэльса 1858–1996, сканы страниц (probatesearch.service.gov.uk), 12.08.2026", "f": "Национальный календарь завещаний Англии и Уэльса 1858–1996, сканы страниц (probatesearch.service.gov.uk), 12.08.2026", "g": "Точная дата смерти D013 Элси — 24 марта 1985; дом Kilnerath, 11 Erpingham Rd, Бранксом, Пул; завещание утверждено в Винчестере 12.07.1985, наследство £92 425, запись 8552412489K. Запись за 1945 г. дала ИМЯ её матери H002 — Ellen Elizabeth Henry, вдова, ум. 06.04.1945 в госпитале Боскомба, всё наследство (£10 449) получила незамужняя Элси. «Hetherington» — третье личное имя Элси, а не девичья фамилия: девичья Henry, как и записано"}, "S34": {"k": "Архив", "h": "Госархив Республики Марий Эл, ф.305 оп.4 «Метрические книги мечетей Уржумского уезда Вятской губ., Царевококшайского уезда Казанской губ.», 70 ед", "f": "Госархив Республики Марий Эл, ф.305 оп.4 «Метрические книги мечетей Уржумского уезда Вятской губ., Царевококшайского уезда Казанской губ.», 70 ед. хр., 1829–1918", "g": "Адреса дел по д. Куянково — то, чего требовал Q49: д.10 (старый шифр оп.7 д.6) 1872–1879, 62 л.; д.11 (оп.7 д.10) 1-я мечеть 1887–1899, 109 л.; д.12 (оп.7 д.11) 2-я мечеть 1887–1899, 83 л. Рождение Сибгая (1877) должно быть в первом деле, его брак — во втором или третьем, а в записи о браке называется отец жениха. ВАЖНО: метрик по Куянково за 1900–1918 в фонде нет вовсе, то есть записи о рождении Габидуллы 1904 г. не существует — отцовство Сибгая по ней подтвердить нельзя. Все книги на татарском арабским письмом, нужен специалист"}, "S35": {"k": "Архив", "h": "Каталог ГААО и 24 муниципальных архивов Архангельской обл", "f": "Каталог ГААО и 24 муниципальных архивов Архангельской обл. (archives.dvinaland.ru), сплошной обход по фамилии Лухнев в пяти написаниях, 12.08.2026", "g": "Всего 4 дела на фамилию. Ф.Р-1890 Оп.2 Д.107 — личное дело лишенца «Лухнев Алексей Осипович», 30.05.1930–28.10.1934, 10 л., и фонд Р-1890 это ВЕРХНЕТОЕМСКИЙ райисполком, то есть наш родовой район, а дело советское, а не дореволюционное. Ф.55 Оп.1 Д.2464 — личное дело Павла Дмитриевича Лухнева, 1915, 17 л., фонд почтово-телеграфного округа, уезд не назван. Шенкурских дел на самом деле два: Ф.29 Оп.4 т.3 Д.1059 и Ф.4 Оп.3 Д.80. Попутно собраны адреса: метрики Нововыставочного Вознесенского прихода Ф.29 Оп.23 Д.196–200 и Д.241 (оцифрованы), ЗАГС Афанасьевской волости 1919–1925 Ф.Р-6083 Оп.8 (9 дел), ревизские сказки Афанасьевской боярщины Ф.1015 Оп.4 (оцифровано все 35 дел). В каталог внесено около 7% заголовков дел — ненайденное не значит несуществующее"}, "S36": {"k": "База данных", "h": "Базы ГАКК по Кубани (kubangenealogy.ucoz.ru, сводки Горбоносова, 159 274 строки, девять xlsx), 12.08.2026", "f": "Базы ГАКК по Кубани (kubangenealogy.ucoz.ru, сводки Горбоносова, 159 274 строки, девять xlsx), 12.08.2026", "g": "Кубанская ветвь, отрицательные результаты: Топчиев НЕТ среди первых жителей ст. Собер-Оашской 1864 г. (список именной и полный, 35 записей, проверены все написания названия); ни одного Топчия с именем Дорофей и ни одного с отчеством Дорофеевич во всех девяти базах; Решетниковых нет ни в одной из станиц, где жили Топчии. Кубанские Решетниковы кучкуются в предгорьях Закубанья (Пшехская, Белореченская, Ахтырская) и помечены «иногородние», то есть не черноморские казаки. Базы покрывают лишь часть фондов ГАКК — отсутствие в них не равно отсутствию в архиве"}, "S37": {"k": "Публикация", "h": "«Списки расстрелянных в Крыму в 1920-1921 гг.», ria1914.info — публикация списков по архивам СБУ (Л", "f": "«Списки расстрелянных в Крыму в 1920-1921 гг.», ria1914.info — публикация списков по архивам СБУ (Л. М. Абраменко). Страница скачана целиком и проверена мной: 343 056 знаков, ВСЕ 38 разделов, 12.08.2026", "g": "LU001 Лухнёв Яков Павлович — «Список I расстрелянных 4 декабря 1920 г. в г. Джанкое», дословно: «Лухнев Яков Павлович, 1892 г. р., уроженец Архангельской губернии, поручик». По странице прогнаны 59 фамилий дерева: из редких совпали только ЛУХНЁВ и МЕХНИН, оба в джанкойском списке. Даниловых, Топчиев, Ризенов, Дружининых, Мелиховых, Колпаковых, Сарафановых, Решетниковых нет; Ивановы, Фёдоровы, Семёновы, Белые, Лысовы, Агафоновы встречаются, но фамилии слишком частые, чтобы что-то значить. ВАЖНО: одиннадцать евпаторийских списков проверены — никого из рода там нет, хотя семья позже осела именно в Евпатории. Отдельная находка: по всем 38 разделам ровно 8 уроженцев Архангельской губернии, и все восемь в одном джанкойском списке (Калинин, Кутчиев, Лежев, Лухнев, Мартынов, Мехнин, Морозов, Сибирцев) — группа земляков-северян. Личных страниц ни у кого из восьмерых нет, ссылки красные. Источник по этим фамилиям исчерпан"}, "S38": {"k": "База данных", "h": "«Память народа» / «Подвиг народа», выборка по фамилии Истомин и месту рождения Верхне-Тоемский, 11–12.08.2026", "f": "«Память народа» / «Подвиг народа», выборка по фамилии Истомин и месту рождения Верхне-Тоемский, 11–12.08.2026. Часть выборки (47 документов) сделана в браузере, ядро перепроверено мной через API «Подвига народа» — entity «Человек Картотека» и «Человек Юбилейная Картотека», поле f23 (место рождения)", "g": "ГНЕЗДО ИСТОМИНЫХ — д. Кондратовская Афанасьевского с/с, та же деревня, откуда L012 Парасковья Ивановна Истомина и где родилась L055 Валентина Владимировна (в её документе деревня записана как «Кондратьево» — это одно и то же селение). Мной подтверждены лично, с местом рождения в карточке: Фёдор Иванович 1905 (сержант), Николай Александрович 1908, Иван Петрович 1917 (ст. лейтенант), Николай Семёнович 1926 (юбилейная 1985), Анатолий Михайлович 1922, Василий Петрович 1915 (гв. майор, но деревня в карточке не названа — только район). В ОБД «Мемориал» выборка по месту рождения даёт из Истоминых только Николая Александровича 1908. Павел Фёдорович 1905 и Андрей Васильевич 1909 (Фатьяновская) в моей проверке не всплыли — они из браузерной выборки «Памяти народа», которая скриптом не проверяется из-за капчи, и подтверждены слабее"}, "S39": {"k": "База данных", "h": "«Открытый список», сплошная выборка по фамилии Мехнин, 13.08.2026 — все восемь карточек открыты и сверены мной лично через api.php и action=raw", "f": "«Открытый список», сплошная выборка по фамилии Мехнин, 13.08.2026 — все восемь карточек открыты и сверены мной лично через api.php и action=raw", "g": "ГНЕЗДО МЕХНИНЫХ — с. Солдатово Больше-Нарымского (ныне Катон-Карагайского) района Восточно-Казахстанской обл.: братья Евсей Арефьевич 1896 (начальник охраны колхоза, арест 04.11.1937, тройка УНКВД по ВКО 19.11.1937 — ВМН, реабилитирован 19.03.1957) и Прокопий Арефьевич 1900 (арест 24.07.1930, 5 лет ИТЛ, реабилитирован 27.10.1989). Отчества дают их отца — Арефия Мехнина. Это тот же регион, где жили наши Лухнёвы (Усть-Каменогорск), поэтому родство L078 вероятно, но не доказано. ВТОРОЙ КЛАСТЕР — Зауралье, Курганская обл.: Павел Иванович 1896 и Павел Иванович 1898 из с. Марайское Мостовского р-на, Степан Иванович 1897 из с. Марайское Мокроусовского р-на, Тимофей Васильевич 1913 из с. Терсюкское Шатровского р-на — вероятная прародина до переселения в Казахстан. ВАЖНАЯ ОТМЕНА: Мехнин Алексей Васильевич 1901 из джанкойского расстрельного списка — уроженец «г. Кемь Архангельской губернии», то есть Поморье (ныне Карелия), ~600 км от гнезда Лухнёвых. К нашему роду он отношения не имеет, и версия про «две северные фамилии рода в одном списке» снята. Персоной в дерево он не заведён сознательно — человека, про которого документально известно, что он не родня, в дереве держать незачем"}, "S40": {"k": "База данных", "h": "Реестр наследственных дел Федеральной нотариальной палаты (notariat.ru → «Найти наследственное дело»), сплошной обход всей русской части дерева, 12.08", "f": "Реестр наследственных дел Федеральной нотариальной палаты (notariat.ru → «Найти наследственное дело»), сплошной обход всей русской части дерева, 12.08.2026. Запрос делался программно, POST на notariat.ru/api/probate-cases, поле name = «Фамилия Имя Отчество», даты пустые; по фамилии одной, без имени, реестр не ищет вовсе. Проверено 154 человека в трёх написаниях каждый (с «ё», без «ё», без отчества)", "g": "Единственный открытый федеральный источник, который выдаёт ДАТУ СМЕРТИ, последний адрес и номер записи акта ЗАГС. Покрывает и советские дела: самая ранняя найденная запись 1963 года, наши — с 1984. Подтверждено/установлено: L022 Колпаков Виктор Евгеньевич — ум. 15.05.2025, Евпатория, пр-т Ленина 56-78, акт 170259910001000752009; L005 Лухнёв Алексей Дмитриевич — ум. 21.01.2002 (не 2001), Сольвычегодск, ул. Ленина 12-10, акт № 147, дата рождения 06.01.1914 совпала с «Памятью народа» до дня; L010 Лухнёва Тамара Николаевна — ум. 10.06.1989, Котлас; L056 Лухнёва Зоя Владимировна — род. 30.12.1926, ум. 20.07.2015, Кандалакша (объяснена пометка «декабрь» на IMG_0909); AY003 Аюпов Ахметшариф Абуталипович — ум. 05.11.1983, Уфа, ул. Р. Зорге 30-55. Кандидаты: L017 Лухнёва Лидия Сергеевна — ум. 23.06.2008, дело в Калининграде (Q112); L066 Миловидова Наталия Юрьевна — ум. 10.05.2004, Севастополь (Q113). Ограничение: реестр отвечает только на точное ФИО целиком, поэтому как инструмент разведки по фамилии не годится — только как проверка уже известного человека"}, "S41": {"k": "База данных", "h": "«Find a will» — реестр завещаний и грантов Англии и Уэльса (probatesearch.service.gov.uk), 12.08.2026", "f": "«Find a will» — реестр завещаний и грантов Англии и Уэльса (probatesearch.service.gov.uk), 12.08.2026. Сайт на JavaScript, но под ним лежит открытый Nuxeo-API: GET /api/csp/api/v1/search/pp/pp_mainstream_default_search/execute с заголовком «properties: hmcts_grant_schema» и параметрами hmcts_grant_schema_surname / hmcts_grant_schema_firstnames. Отвечает JSON без ключа и без регистрации", "g": "ГЛАВНОЕ: D015 Wood, Evdokija Elsie — ум. 07.08.2018, завещание утверждено 29.04.2020, реестр Cardiff, дело № 1587118662398451, само завещание и грант доступны к заказу за £1,50. Единственная запись «Evdokija Wood» за всю историю реестра. Дала второе имя — Elsie, в честь матери. Отрицательные результаты, тоже ценные: фамилия DANILOFF в основном индексе (дела с 1996 года) — 0 записей, как и DANILOV, DANILOW; «Abigail Wood» на весь реестр одна (ум. 30.06.2003, Brighton), но записана без второго имени Charlotte, так что D017 это скорее всего не она; по «Roy Wood» 146 записей, без адреса разделить нельзя. Ограничение: основной индекс — это дела с 1996 года плюс часть оцифрованных старых; дела 1858–1996 лежат в отдельном сканированном календаре и ищутся другим page provider, по году и тексту"}, "S42": {"k": "База данных", "h": "«Яндекс Поиск по архивам» (yandex.ru/archive), 12.08.2026 — полнотекстовый поиск по оцифрованным и машинно расшифрованным архивным делам", "f": "«Яндекс Поиск по архивам» (yandex.ru/archive), 12.08.2026 — полнотекстовый поиск по оцифрованным и машинно расшифрованным архивным делам. Работает без входа: страница /archive/search?text=… отдаёт результаты внутри JSON __NEXT_DATA__. Постраничная навигация с сервера не идёт, поэтому обход делался уточнением запроса (фамилия + деревня/волость/имя). ВАЖНО ПРО ДОСТОВЕРНОСТЬ: тексты — машинная расшифровка рукописей, а картинка отдаётся только превью 800 px, где почерк не разобрать. То есть чтения ниже НЕ СВЕРЕНЫ с оригиналом; точны в них архивные адреса, а не буквы", "g": "ГЛАВНОЕ ОТКРЫТИЕ: Верхнетоемский район до 1924 года — это Афанасьевская волость (в XVIII в. «Афанасьевская бояршина») СОЛЬВЫЧЕГОДСКОГО УЕЗДА ВОЛОГОДСКОЙ ГУБЕРНИИ, и её ревизии и метрики лежат в ГАВО, а не в архангельских архивах, где мы искали до сих пор. Лухнёвы в родовых деревнях documентированы с 1762 года: ф.388 оп.1 д.8445 (III ревизия 1762) — «Иван Симанов сын Лухнев вдов, у него дети Иван, Ларион, Иван же», «Осип Аверкиев сын Лухнев», а также «афонасьевской боярщины крестьянин Иван Лухнев руку приложил» вместо неграмотного старосты; ф.388 оп.1 д.8460 (IV ревизия 1781–82) — Иван Симанов сын Лухнев; ф.388 оп.9 д.133 (VI ревизия 1811) — «в деревне фатьяновской … Максим Артемьев сын Лухнев»; ф.388 оп.10 д.63 (VIII ревизия 1834, Афанасьевская бояршина) — Максим Артемьев Лухнев 39 лет, Тимофей Леонтиев Лухнев 43 (умер в 1834, переведён в 1828 из д. Фатьяновской), Иван Иванов Лухнев (переведён из д. Кондратовской в 1830); ф.496 оп.19 д.466 (1825) — Тимофей Леонтьев Лухнев, 23; ф.496 оп.6 д.1 (метрики 1757–1783) — брак «иван иванов сын лухнев» из д. Фатьяновской с Дарией Лукиной. ПО ИСТОМИНЫМ КОНДРАТОВСКОЙ: ф.388 оп.10 д.63 (1834) — «Иван Яковлев Истомин, жены Ивановы сыновья от 2-й: Иван, Андрей, Пётр, 43»; ф.496 оп.7 д.176 (1880) — брак Арефия Андреева Истомина, запасно-отпускного машинного унтер-офицера, д. Кондратовская, 32 года; ф.496 оп.55 д.68 — его же смерть, отставной унтер-офицер, 45 лет. ЧЕГО НЕТ: ни одного Ефима Лухнёва в вологодском корпусе — ревизии 1850 и 1858 годов по Афанасьевской волости в оцифровку не попали, а именно в них должны быть Ефим и младенец Дмитрий (L001)"}, "S43": {"k": "Документ", "h": "Семейный архив Юлии Николаевны Лухнёвой (L021), Калининград — снимки документов и её собственные записи, присланные 13.08.2026", "f": "Семейный архив Юлии Николаевны Лухнёвой (L021), Калининград — снимки документов и её собственные записи, присланные 13.08.2026. С этого дня она сама разбирает архив «по паре часов в день» и ведёт роспись на бумаге", "g": "ЧЕТЫРЕ СНИМКА. 1) Свидетельство об окончании начальной школы № 13 г. Евпатории на имя Лухнёва Николая Николаевича, род. 1933: полный курс окончен 14 июня 1946, поведение отличное, № 16, оценки 4/5/5/5/5. 2) Свидетельство об окончании семилетней школы № 53 г. Евпатории на то же имя: окончил в 1949 году, № 181, ДУБЛИКАТ выдан в 1950-м, иностранный язык немецкий. Вдвоём эти два документа сужают провал в биографии деда с 1942–1965 до 1949–1965 и доказывают, что после гибели отца семья из Евпатории не уехала. 3–4) Брошюра «Мастера педагогического труда» о Татьяне Алексеевне Загребельной (L037), 1990 г., типография изд-ва «Правда Севера», тираж 500, составители И. В. Дурягина и Т. И. Маркова: портрет, должность старшего учителя, руководство городским методобъединением Коряжмы, метод опорных сигналов, работа без домашних заданий; ссылка на газету «Правда Севера» от 07.02.1988. ПЛЮС УСТНЫЕ СВЕДЕНИЯ того же дня: биография Дмитрия Ефимовича (писарь в лесничестве, война с 1914, фельдфебель, Георгиевский крест, почта на лошадке Рыжка, похоронен в Вознесенске, 1854–1924); Евдокия Фёдоровна — крестьянка из Красноборска; Семён Данилов уехал учиться в Германию до революции, знал семь языков, ездил по Европе и Северной Африке, там и познакомился с Диной; дата смерти Алексея Дмитриевича 21.01.2002; кто где жил в 2002 году (Сольвычегодск и Коряжма); внуки дяди Саши учились в ХНУРЭ"}, "S44": {"k": "База данных", "h": "chortitza.org (меннонитский портал с фотоархивом и расшифровками книг памяти) + GRANDMA (grandmaonline.org, меннонитская база на 1,5 млн записей) + wo", "f": "chortitza.org (меннонитский портал с фотоархивом и расшифровками книг памяти) + GRANDMA (grandmaonline.org, меннонитская база на 1,5 млн записей) + wolgadeutsche.net, прогнаны 13.08.2026. ДОСТУП К GRANDMA БЕЗ ПОДПИСКИ: поиск по имени закрыт, но карточка по номеру GM отдаётся гостю — POST на grandmaOnline.org/gmol-7/individualProfile.asp с полями IND=<номер>&dummy=d0&iguest=true; древо предков — POST /gmol-7/reports/trees/interactiveTree.asp с той же кукой. В карточке видны супруг и дети", "g": "ПО КАНДИДАТУ В ОТЦЫ ВЛАДИМИРА ГЕРМАНОВИЧА (R005): Герман Яковлевич Ризен, род. 21.12.1882 в с. Гротсфельд Альт-Самары, проповедник меннонитской общины Альт-Самары; после 1917 член Всероссийского сельскохозяйственного союза (Москва), помогал меннонитам выезжать в Канаду; в 1929 арестован в Москве при попытке уехать, освобождён, жил во Владивостоке, по возвращении выслан в Сибирь, работал в совхозе «Верный путь» под Омском; фотография от 20.07.1947. Жена — Августа Корнелиусовна Хамм, род. 10.05.1888, брак 24.10.1915 в Гротсфельде, умерла в ссылке 05.03.1948. Третий арест 28.07.1937, приговор 19.10.1938 (8 лет), дело прекращено 31.03.1939, дело П-3190. КОНТРДОВОД: в GRANDMA #1146081 у него НЕТ ни детей, ни родителей, а единственный брак — 1915 года, куда сын около 1900–1907 не помещается. ГНЕЗДО В НЯНДОМЕ поимённо: семь Ризенов с датами арестов и расстрелов («Поморский мемориал»). ОТРИЦАТЕЛЬНОЕ: базы депортации немцев Поволжья 1941 (578 записей на «Р», Ризена нет — база покрывает только эшелоны из АССР НП, а кошкинских меннонитов везли из Куйбышевской), книга памяти трудармии Усольлага (один Ризен, не наш), AHSGR (только сводные индексы, персональных записей нет — там лютеране и католики), volgagermans.org (поиск даёт ноль), CVGS — домен мёртв с закрытия Concordia University Portland в 2020. На chortitza.org Владимира или Вольдемара Ризена НЕТ ни в одном написании. НЕДОСТУПНО: forum.wolgadeutsche.net закрыт Cloudflare полностью, не берётся ни curl с браузерными заголовками, ни Playwright с настоящим Chromium — челлендж проходит, дальше зависает; обходили через Wayback"}, "S45": {"k": "База данных", "h": "memsearch.org — единая точка поиска по базам «Мемориала» и другим проектам памяти, прогнана 13.08.2026 по всем фамилиям дерева", "f": "memsearch.org — единая точка поиска по базам «Мемориала» и другим проектам памяти, прогнана 13.08.2026 по всем фамилиям дерева. ВАЖНО: ВЕСЬ ДОМЕН memo.ru БОЛЬШЕ НЕ РЕЗОЛВИТСЯ — ни base.memo.ru (та самая сводная база на 3,1 млн имён), ни lists.memo.ru, ни stalin.memo.ru, ни www.memo.ru: DNS не отвечает вовсе. Данные при этом НЕ ПОТЕРЯНЫ: memsearch.org отдаёт записи с пометкой источника «base.memo.ru» рядом с записями «ru.openlist.wiki», то есть работает как агрегатор над умершим сайтом. РАБОЧИЙ ЗАПРОС: GET memsearch.org/ru/search?query=<фамилия>, обычный HTML, без ключа. Ложных срабатываний нет: контрольный запрос «ЛухневЗЗЗ» даёт ноль", "g": "ГЛАВНОЕ: третье независимое подтверждение удмуртского происхождения Горбушиных (Q135) — 171 запись по фамилии, из них 11 по нашей географии, и все удмуртские: Ярский р-н д. Дизмино, Глазовский р-н д. Б. Лудошур, Карсовайский р-н д. Б. Сазаново. После «Бессмертного полка» (куст в Глазове) и ОБД (24 записи по Глазовскому р-ну) это уже не версия, а установленный регион. ПОДТВЕРЖДЕНИЯ прежних находок: Ахмадуллин Сибгай — Марий Эл, Параньгинский р-н, дер. Куянково (AH003, ровно как в дереве); Мехнины Евсей и Прокопий Арефьевичи — с. Солдатово Большенарымского и Катон-Карагайского р-нов; Мехнин Алексей Васильевич 1901, г. Кемь, место смерти Крым (тот самый из джанкойского списка, не наш). НОВОЕ ПО ЗАГРЕБЕЛЬНЫМ: Загребельный Сидор Филатович, Харьковская обл., АХТЫРСКИЙ р-н, хутор Гончарова — подтверждает ядро фамилии из Q110. Отрицательное: по Лошманову 68 записей и ни одной с нашей географией; по Аюпову 813 и ни одной; по Загретдинову 170 и ни одной"}, "S46": {"k": "Публикация", "h": "Печатные книги и научные статьи через полнотекстовый поиск, прогнано 13.08.2026", "f": "Печатные книги и научные статьи через полнотекстовый поиск, прогнано 13.08.2026. РАБОЧИЕ РЕЦЕПТЫ. Google Books — через legacy-фид GData, живой и без ключа: GET books.google.com/books/feeds/volumes?q=<urlencode>&max-results=20&start-index=N, отдаёт Atom, где dc:description это РЕАЛЬНЫЙ OCR-сниппет со страницы. Контрольный «ЛухневЗЗЗ» даёт totalResults 0, значит нулям верить можно; но само число totalResults завышено — Google морфологически расширяет запрос даже в кавычках («Погорянный» → «погорело»), поэтому цифру игнорировать и читать сниппеты. Официальный googleapis.com/books/v1 отдаёт 429 «Quota exceeded» для анонимного проекта — фид его заменяет. КиберЛенинка — POST cyberleninka.ru/api/search с телом {\"mode\":\"articles\",\"q\":\"...\",\"size\":30,\"from\":0}; HTML-страница /search?q= это ловушка, она рендерится скриптом и отдаёт байт-в-байт одно и то же на любой запрос. forum.svrt.ru — GET /search/?q=<enc>&quick=1&sortby=relevancy, между запросами нужно не меньше 9 секунд, иначе nginx 429", "g": "ЛУХНЕВ САВВА, ПОДЬЯЧИЙ 1622–1627 — самый ранний бумажный след фамилии, на сто сорок лет раньше ревизии 1762 года: Пермь, Чаронда, и сыщик разбойных дел НА УСТЮГЕ, то есть в Сольвычегодско-Устюжской зоне (Веселовский 1974 и 1975, Кистерев 2003, ААЭ т. III, Булгаков 2004 и др.). ЛУХНЕВ ЯКОВ ПАВЛОВИЧ подтверждён печатно: Л. М. Абраменко, «Последняя обитель» (2005), под № 53 в нумерованном расстрельном списке, «уроженец Архангельской губернии, поручик» — и соседние номера 52–55 дают состав партии, расстрелянной вместе с ним. ЛУХНЕВ ПАВЕЛ ИВАНОВИЧ 1914 из Верхне-Тоемского р-на — «Книга памяти: Лабазин — Ниязов, 1939–1940» (2003): красноармеец 9-го лыжного батальона 9-й армии, ПРОПАЛ БЕЗ ВЕСТИ В ФЕВРАЛЕ 1940 на советско-финской, батальон почти весь погиб под Ухтой. РИЗЕН ГЕРМАН ЯКОВЛЕВИЧ в печатном мартирологе: Aron A. Töws, «Mennonitische Märtyrer» (1954) — «Pred. Hermann Riesen und Frau, Alt-Samara», и формат подписи означает, что в книге ЕСТЬ ФОТОГРАФИЯ его с женой; Gerhard Fast, «In den Steppen Sibiriens» (1957) — свидетельство очевидца, как Ризен из Альт-Самары ведёт переговоры с ГПУ о выезде; Helmut Harder (2002) — альт-самарских меннонитов ссылали в АРХАНГЕЛЬСК; Peter M. Friesen (1911) — в перечне проповедников значится Hermann Riesen, вероятно поколением раньше, тёзка-дед. МЕХНИН ФЁДОР МИХАЙЛОВИЧ в двух печатных версиях с расхождением района: Бейсембаев (1968) — с. Тарханка КИРОВСКОГО р-на, «Герои Советского Союза» (1987) — ГЛУБОКОВСКОГО; плюс в 1939 окончил курсы трактористов и работал в МТС, образование 6 классов. ТОПЧИЙ ИВАН МИХАЙЛОВИЧ 1923, с. СИДОРОВО Славянского р-на — «Книга памяти Украины» (2001), подполковник 667 гап, три ордена: независимое печатное подтверждение, что Славянский район донецкий, а не кубанский"}, "S47": {"k": "Архив", "h": "Украинские архивные каталоги, ЦДІАК, ДАДнО (Держархів Донецької області), ДАЗкО (Закарпатський), форум GENEO и газетный архив Каразина — прогнаны 13–1", "f": "Украинские архивные каталоги, ЦДІАК, ДАДнО (Держархів Донецької області), ДАЗкО (Закарпатський), форум GENEO и газетный архив Каразина — прогнаны 13–14.08.2026. Рабочий API сводного каталога метрик Украины: GET ridni.org/catalog/api/getCatalogData2.php?settlement=<село>&searchType=places|all — счётчик честный, контрольный мусор даёт 0. Описи ДАХО скачаны PDF с archives.kh.gov.ua и прогреплены полнотекстом", "g": "ПО ТОПЧИЯМ И СИДОРОВУ. Первое документальное появление села: ЦДІАК ф.1989 оп.1 спр.580 — метрическая книга с. Студенок (Введенская церковь) 1783 г., в списке населённых пунктов прихода прямо значится «Сидоров, хутор»; фамилии Топчий в списке 1783 года НЕТ. Весь ряд Студенка в ЦДІАК ф.1989 оп.1: спр.541 (1736), 543, 548, 552, 553, 555, 556 (сповідний розпис 1768), 557–559, 563, 565–568, 570–573, 575–581, 585–588, 592, 595, 597, 599, 601, 603, 605–607, 610 (1792). ГЛАВНЫЙ АДРЕС ДЛЯ ЗАКАЗА: Сидорово своей церкви не имело, ближайший приход — с. Маяки того же сельсовета, и это ДАДнО ф.201 оп.1, Покровская церковь: спр.1 (1871–1875), СПР.2 (1876–1878) — ровно год рождения Евдокии Семёновны Топчий, спр.3 (1879–81), 4 (1882–88), 5–17 до 1921 года. Соседние приходы: ф.205 оп.1 спр.1–11 Богородичное 1871–1919; ф.196 Райгородок; ф.203 Билбасовка; ф.191, 192, 193 три славянские церкви; ф.303 Новославянск. ДВА НОВЫХ ДОКУМЕНТА: форум GENEO, тема 412, стр. 15 — в ревизской сказке Изюмского уезда государственных крестьян СЛАВЯНСКОЙ и Черкасской волостей 10-й ревизии 1858 года есть И «Топчий», И «Загребельный» в одном документе; «Харьковскія губернскія вѣдомости» № 329 от 20.12.1877, общий список присяжных заседателей по Изюмскому уезду на 1878 год, крестьяне Велико-Камышевахской волости — «ТОПЧИЙ ТРОФИМ», а Трофим это одно из искомых отчеств сидоровского куста. ОТРИЦАТЕЛЬНОЕ, честное: Сидорова нет в сводном каталоге метрик ДАХО (том 5, книги 1–2; Изюмский уезд покрыт хорошо, 726 упоминаний); нет в списке метрик ДАДнО; ridni.org по «сидорове/сидорово/сидоровка» даёт 0. Дорофея Топчия не найдено НИГДЕ — ни на GENEO (прогреплены темы 412 на 73 стр., 529 на 32, 1920 на 27, 1815 на 4, и тема «Топчій» id 3732 целиком), ни в газетном архиве. ПО ЗАКАРПАТЬЮ: «Черногоров» в Закарпатье НЕ СУЩЕСТВУЕТ — прогнан полный список 609 населённых пунктов области. Самый вероятный оригинал подписи — ЧОРНОГОЛОВА (венг. Sóhát, известна с 1552, Ужанская жупа): «Черноголова» → «Черногоры» минимальное искажение при переписывании. Метрики с шифрами: ДАЗкО ф.Р-1606 оп.2 — спр.6 (1862–1883), спр.64 (1858–1904), спр.50 (1884–1916), спр.35 (1904–1916), спр.54 (1914–1924), спр.51 (1924–1940), спр.36 (1941–1947). Фонд Р-1606 «Колекція церковних метричних книг Закарпаття» — 5164 ед. хр., 1715–1960, ОТСНЯТ FAMILYSEARCH ЦЕЛИКОМ. Побочно: в Закарпатье есть село ДАНИЛОВО (Хустский р-н, венг. Husztsófalva), метрики ф.Р-1606 оп.13 спр.13 (1806–1851), 68 (1864–1908), 67 (1909–1944)"}, "S48": {"k": "Архив", "h": "Riksarkivet (Швеция), фонд Statens utlänningskommission — вскрыт 14.08.2026", "f": "Riksarkivet (Швеция), фонд Statens utlänningskommission — вскрыт 14.08.2026. ОБХОД КАПЧИ НАЙДЕН: sok.riksarkivet.se закрыт «Verifiera att du är människa», но data.riksarkivet.se/api/records отдаёт JSON ЕСЛИ ПОСЛАТЬ БРАУЗЕРНЫЙ User-Agent (без него WAF 403), а oai-pmh.riksarkivet.se/OAI/?verb=GetRecord&identifier=<шифр>&metadataPrefix=oai_ra_ead отдаёт полную опись в EAD. Опись серии F 1 скачана целиком: 7,95 МБ, 18 598 единиц хранения, из неё вытащены поимённые алфавитные диапазоны томов", "g": "ФОНД НАЙДЕН: SE/RA/420393 — Statens utlänningskommission, 1944–1969, хранится в Riksarkivet Stockholm/Täby (Arninge); включает документы предшественников (Socialstyrelsens utlänningsbyrå, Statens polisbyrå för övervakande av utlänningar, паспортная экспедиция МИД) и преемника (Statens invandrarverk), 13 подархивов. ЛИЧНЫЕ ДЕЛА — путь SE/RA/420393/01/F/F 1; содержат «ansökningar om uppehålls- och arbetstillstånd, främlingspass (fr.o.m. 1938), inresevisering (fr.o.m. 1948)» с решениями. Правило раскладки: когда иностранец получил шведское гражданство или умер в Швеции, досье переносили в серию F 1 B. ТОЧНЫЕ ТОМА С ФАМИЛИЕЙ DANILOFF: F 1 B том 405 «Danielsson, Olaf – Dannenbaum, Ruth» (1941–1955); F 1 B том 3410 «Danielsson, Margareta – Danko, Gabriella» (1956–1970); F 1 AC том 4953 «BUCHONSKI DANIKOW – DANILOW» (уехавшие из Швеции, 1944–1973). Предупреждение из самой описи: «Dossiéerna är dock inte så sällan placerade i felaktig tidsperiod» — досье нередко лежат не в своём периоде, заказывать надо ОБА тома. Серия F 1 AA (действующие досье) ИЗЪЯТА: «Serien övertagen av Statens invandrarverk». КАРТОТЕКА-УКАЗАТЕЛЬ, ею надо искать ПЕРВОЙ, потому что она даёт номер досье: карточка содержит имя, гражданство, время рождения, пол и «numret på den centraldossié»; порядок ЗВУКО-АЛФАВИТНЫЙ, то есть Daniloff, Danilov и Danilow лежат вместе. Адреса: SE/RA/420393/01/D/D 2 BA том 18 «Daniels–Didzus» (1942–1970) — ключ ко всему; D 1 A том 13 «Cow–Ded» (1917–1943, визовый регистр — проверка версии межвоенного эмигранта); D 1 B том 3 «Br–Dö»; D 1 C том 1 «A–H». До 1941 года — SE/RA/420267/12/F/F I/F I b. ЗАКАЗ: специальная форма ровно под этот случай «Personefterforskning, utländsk bakgrund mellan 1840 och 1970» на bestall.riksarkivet.se/sv/person-utlandsk-bakgrund; адрес Riksarkivet, Box 7223, 187 13 Täby, registrator@riksarkivet.se. Секретность: старше 70 лет выдаётся кому угодно, младше — оценка по OSL 2009:400, то есть документы до ~1956 открыты безусловно. ВЕРСИЯ «RYSSLÄGREN» ПРОВЕРЕНА И НЕ ПОДТВЕРЖДАЕТСЯ: реальных лагерей семь — Byringe (Södermanland, единственный с колючей проволокой и вышками, 164 балтфлотца с Даго и Эзеля), Baggå, Baggbron, Krampen (все три Skinnskatteberg), Abborrtjärn (Dalarna), Lissma/Huddinge (до ноября 1946, самый долгий), Storvreta (Uppland), плюс транзитный Hagaström под Евле. Архив лагерей: SE/RA/420393/12 «Andra världskrigets lägerarkiv», 112 лагерных архивов"}, "S49": {"k": "Архив", "h": "Riksarkivet, ОПИСИ НАСЛЕДСТВА (bouppteckningar) — разобрано 14.08.2026", "f": "Riksarkivet, ОПИСИ НАСЛЕДСТВА (bouppteckningar) — разобрано 14.08.2026. Разграничение по датам решает всё: до 31.12.1979 описи лежат в фондах судов (häradsrätt/rådhusrätt, с 1971 tingsrätt) по бывшим ландсархивам; с 01.01.1980 по 30.06.2001 — тоже Riksarkivet, но ОТДЕЛЬНОЙ И УЖЕ ОЦИФРОВАННОЙ группой; с 01.07.2001 — Skatteverket, нас не касается. Семён умер 01.12.1983, то есть попадает ровно в оцифрованный интервал. Две готовые формы: bestall.riksarkivet.se/sv/bouppteckning-fran1980 (на Семёна) и bestall.riksarkivet.se/sv/bouppteckning-till1979 (на Яна Рагнара, ум. 1974). Условие дословно с сайта: «Det utgår ingen kostnad eller handläggningstid när du beställer via formuläret, har fullkomliga ingångsuppgifter och begär svar via e-post» — бесплатно и без срока ожидания, если данные полные и ответ просишь на почту; для оцифрованных 1980–2001 отправка автоматическая. ВАЖНО: описи наследства НЕ засекречены, это публичные документы, запросить вправе кто угодно независимо от родства. ОГОВОРКА: сам поддомен bestall.riksarkivet.se отдаёт HTTP 503 на серверные IP (проверено с первого обращения, это не наша нагрузка) — из обычного браузера должен открыться, но точные поля формы вживую не проверены; описание взято с riksarkivet.se и statensarkiv.se. Онлайн-указателя имён по оцифрованным описям 1980–2001 нет: «tillgängliggörs framför allt i Riksarkivets läsesalar snarare än fritt på öppna nätet», то есть самому найти запись нельзя, только заказать через форму", "g": "Опись 1983 года обязана перечислить ВСЕХ наследников Семёна поимённо — это независимая проверка состава семьи и прямой выход на живую английскую родню. Опись Яна Рагнара 1974 года ценна иначе: наследниками бездетного холостяка становятся родители, значит документ НАЗОВЁТ ЕГО МАТЬ — ту самую неизвестную первую жену Семёна (Q87)"}, "S50": {"k": "Семейный архив", "h": "Семнадцать кадров из домашнего альбома, присланы мамой 14.08.2026, лежат в photos/мама-2026-08-14/", "f": "Семнадцать кадров из домашнего альбома, присланы мамой 14.08.2026, лежат в photos/мама-2026-08-14/. Восемь фотокарточек сняты с двух сторон — лицо и обратная сторона с надписью, — плюс кадр с двумя дореволюционными открытками. Атрибутированы: Лухнёв Николай Николаевич подростком (1949) и солдатом (1952); Лухнёв Николай Дмитриевич с автографом «28/X-38 г., г. Харьков»; Лухнёва Парасковья («Паша») Ивановна; Данилова Евдокия Семёновна (снимок 9.6.1949 с указанием возраста); открытки 1914 года ученикам Леонида Прокофьевича Данилова в Темрюк. НЕ атрибутированы два человека: мужчина с тёмными волнистыми волосами в пальто, на обороте дата «9/VII-36 г.» (кадры 09–10), и мужчина средних лет в светлой рубашке, две карточки с одного негатива, надпись на обороте карандашом не читается (кадры 11–12). ПРИЁМ, КОТОРЫЙ ЗДЕСЬ СРАБОТАЛ: обороты сняты под углом и мелким почерком, читаются только после кадрирования, поворота и autocontrast через PIL. Отдельная ловушка: на обороте кадра 10 печатные слова «Место фотокарточки» видны ЗЕРКАЛЬНО — это просвет с другой стороны тонкого картона, а не перевёрнутый кадр; рукописная дата на том же кадре читается нормально. Не переворачивать изображение, ориентируясь на печать", "g": "Первые изображения четырёх человек, первый автограф Николая Дмитриевича, точный возраст Евдокии Семёновны, служба дедушки в 1952 году и — главное — документальное доказательство, что Леонид Прокофьевич преподавал и жил в Темрюке Кубанской области"}, "S51": {"k": "Печатное издание", "h": "«Кавказский календарь» — ежегодник, где по Кубанской области перечислен ВЕСЬ штат каждого учебного заведения с именами и чинами", "f": "«Кавказский календарь» — ежегодник, где по Кубанской области перечислен ВЕСЬ штат каждого учебного заведения с именами и чинами. Обойден 14.08.2026. РЕЦЕПТ, ПОЛНОСТЬЮ ОТКРЫТЫЙ: тома лежат на archive.org, находятся через archive.org/advancedsearch.php?q=title:(\"Кавказский календарь\")&output=json, а распознанный текст качается напрямую — archive.org/download/<id>/<id>_djvu.txt, по 3 МБ на том, и дальше грепается локально. ВАЖНО: внутренний поиск ia-fts.archive.org НЕ РАБОТАЕТ (хост не резолвится) — не тратить на него время, качать текст целиком. В диапазоне 1893–1918 на archive.org есть три тома: на 1905, 1906 и 1911 год (id kavkazskijkalendarna1905god51, kavkazskijkalendarna1906god79, kavkazskijkalendarna1911god93). OCR дореформенный и грязный, но фамилии читаются; имена в календаре печатались сокращённо («Алдръ Франц. Мусницкм»), поэтому искать надо по ФАМИЛИИ, а не по полному имени. ТУДА ЖЕ ПРОВЕРЕН ВТОРОЙ КАНАЛ И ЗАКРЫТ: «Список лиц, служащих по ведомству Министерства народного просвещения» — на archive.org тринадцать томов (1886, 1901, 1903–1907, 1909, 1911, 1912 ×2, 1914, 1915), скачиваются тем же способом. Прогнаны тома на 1905, 1911, 1912, 1914 и 1915 годы. ВАЖНЫЙ ВЫВОД О САМОМ ИСТОЧНИКЕ: он покрывает только ЦЕНТРАЛЬНЫЙ аппарат, университеты и ДИРЕКТОРОВ с ИНСПЕКТОРАМИ учебных заведений — рядовых преподавателей гимназий в нём нет вовсе (том всего 0,9–2 МБ текста, для штата всей империи этого мало на порядок). Поэтому отсутствие человека в этих томах НЕ значит, что он не преподавал: значит лишь, что он не был директором или инспектором. Рядовой учитель ищется только в «Памятной книжке» и «Циркулярах» своего УЧЕБНОГО ОКРУГА, а их на archive.org за 1895–1917 нет", "g": "Штат Темрюкского городского и Мариинского женского училищ за 1905, 1906 и 1911 годы прочитан целиком — Даниловых там нет ни одного. Заодно видно, что Темрюкское училище было трёхклассным в 1905–1906 и шестиклассным к 1911, то есть семиклассным не было никогда. См. Q145. По «Спискам лиц» МНП за 1905, 1911, 1912, 1914, 1915: Даниловых там трое и все чужие — Василий Фёдорович (директор Майкопского механико-технического), Иван Николаевич, Николай Семёнович. Инспекторы Темрюкского училища за те же годы тоже названы и тоже не Даниловы: в 1911 и 1912 — Алексей Митрофанович Анисимов, в 1915 — Семён Иванович. Значит Леонид Прокофьевич не был ни директором, ни инспектором — он был рядовым преподавателем, и это сужает поиск до окружных изданий"}, "S52": {"k": "Соцсеть", "h": "Instagram — рабочий обход найден 14.08.2026, и он двухходовый, потому что поиск людей внутри сети закрыт", "f": "Instagram — рабочий обход найден 14.08.2026, и он двухходовый, потому что поиск людей внутри сети закрыт. ШАГ 1, найти ник: инстаграмные профили индексируются поисковиками, и запрос site:instagram.com \"Фамилия\" через html.duckduckgo.com/html/?q=... отдаёт список профилей обычным HTML, без ключей и без входа (ссылки лежат в параметре uddg= в закодированном виде). ШАГ 2, проверить ник: GET instagram.com/api/v1/users/web_profile_info/?username=<ник> с заголовком X-IG-App-ID: 936619743392459 отдаёт 200 и полный JSON — full_name, biography, число подписчиков, закрыт профиль или нет. Именно full_name и есть проверка: ник ничего не доказывает, а имя в карточке сверяется с деревом. ЧТО ЗАКРЫТО НАВЕРНЯКА (перепроверено 14.08.2026, не надо пробовать снова): поиск по имени внутри сети — /web/search/topsearch/ отдаёт 401, /api/v1/fbsearch/topsearch/ отдаёт 404. ГЛАВНАЯ ЛОВУШКА, я в неё попал: DuckDuckGo блокирует после трёх-четырёх запросов подряд и начинает отдавать страницу со словом «anomaly» — внешне это ПУСТАЯ ВЫДАЧА, ноль ссылок, и выглядит как «никого нет». Ноль без контрольного запроса не значит ничего. Проверять заведомо результативным запросом и делать паузы; Mojeek, Bing, Startpage и searx на site:instagram.com не отдают профилей вообще, заменой не служат. УТОЧНЕНИЕ ПО ЛИМИТУ, 15.08.2026: порог жёстче, чем я записал сначала. После нескольких часов простоя канал открывается и первый запрос проходит нормально (по «Загртдинова» вернул уже шесть ников вместо двух — индекс за сутки прирос), но СЛЕДУЮЩИЙ ЖЕ запрос отдаёт страницу с «anomaly». То есть не «три-четыре запроса подряд», а фактически ОДИН запрос в окно, и окно измеряется часами. Практический вывод: планировать по одной фамилии за заход, самую ценную первой, и обязательно начинать с контрольного запроса — иначе единственную попытку потратишь на проверку канала. Пакетный обход шестнадцати неотождествлённых родственников этим способом не делается: это шестнадцать заходов в разные часы", "g": "Первый работающий канал по инстаграму: закрывает пробел в карте покрытия, где до 14.08.2026 не было даже колонки. Столбец IG применим только тем, у кого уже есть зацепка в контактах — перебирать сеть по фамилии без ника нельзя"}, "S53": {"k": "Семейный архив", "h": "Военный билет Сарафанова Поливекта Нестеровича, серия У № 00536, выдан 27.10.1948 Шалинским РВК Свердловской обл", "f": "Военный билет Сарафанова Поливекта Нестеровича, серия У № 00536, выдан 27.10.1948 Шалинским РВК Свердловской обл. Скан прислан 14.08.2026 внуком — Евгением Александровичем Лухнёвым (L031), он же назвал дату смерти деда. Файл: photos/2026-08-08-archive/S001_doc_1948_military-id.jpg. Развёрнут на двух страницах: слева учётные данные с вклеенной фотографией и личной подписью владельца, справа раздел «Военно-учётные данные» со штампом о вручении удостоверения участника войны", "g": "Дата смерти 21.12.1986 (Q93 закрыт), первое изображение человека, и — главное — независимое подтверждение отождествления: РВК на билете шалинский, место рождения в карточке «Памяти народа» тоже Шалинский район. Плюс детали службы, которых не было: артиллерия, ВУС 14, лейтенант, командир батареи, удостоверение участника войны вручено 26.03.1979"}, "S54": {"k": "Базы репрессированных", "h": "Сплошной обход украинских и крымских баз, 14.08.2026, все с контрольными запросами", "f": "Сплошной обход украинских и крымских баз, 14.08.2026, все с контрольными запросами. ЧТО ПРОЙДЕНО: «Реабілітовані історією» — все 9 томов «АР Крим» и все 6 томов «Харківська область» скачаны и прогнаны грепом; «Національний банк репресованих» reabit.org.ua (371 663 записи); memsearch.org; «Открытый список» через MediaWiki API; электронная книга памяти Евпаторийского музея (все 107 страниц раздела участников войны плюс раздел погибших в оккупацию, 1272 имени). ТРИ РЕЦЕПТА И ЛОВУШКИ, КОТОРЫЕ СТОИЛИ БЫ ЛОЖНЫХ НУЛЕЙ: (1) memsearch.org НЕ НОРМАЛИЗУЕТ «ё» — запрос «Лухнёв» даёт 0, а «Лухнев» 11 записей; всегда пробовать оба написания. (2) reabit.org.ua требует параметр st=4 (розширений пошук), иначе параметры молча игнорируются и отдаётся дефолтная выдача, которая парсится как результат — идеальный ложный ноль. (3) искать надо и по ИСКАЖЁННЫМ фамилиям: Яков Павлович нашёлся вторым источником только под написанием «ЛУХНИН». ЗАБЛОКИРОВАНО, НЕ ПРОВЕРЕНО: rk-memory.ru (книга памяти Республики Крым) — нужен российский IP, ECONNREFUSED; avr.org.ua — HTML отдаётся, но все /api/* дают HTTP 000 и контрольного попадания получить не удалось, так что это «не проверено», а не «пусто»; ГДА СБУ онлайн-поиска по делам не имеет вовсе, а пилотная база УІНП search.hdauinp.org.ua содержит десятки записей и её ноль ничего не значит", "g": "Яков Павлович: расстрелян 04.12.1920 в Джанкое, тройка особого отдела 6-й армии, № 127 в расстрельном списке, дела ГДА СБУ № 72420 фп и № 5144 (Q81). Николай Дмитриевич: советская репрессия исключена четырьмя независимыми базами, а дата «7 января 1942» НЕ подтверждена — музейный список дат не содержит вовсе (Q07). Загребельные: Сидор Филатович расстрелян 03.01.1938 и отцом Владимира быть не мог; версия Q110 развернулась на Котласский район"}, "S55": {"k": "Архив", "h": "Сарафановы, сплошной обход 14.08.2026", "f": "Сарафановы, сплошной обход 14.08.2026. ГЛАВНОЕ — ДВА НОВЫХ КАНАЛА, КОТОРЫХ В ПРОТОКОЛЕ НЕ БЫЛО. (1) «ПАМЯТЬ НАРОДА» ВСЁ-ТАКИ ЧИТАЕТСЯ МАШИНОЙ. В AGENTS.md стояло «отдаёт 401 с капчей, скриптом нельзя» — это верно для HTML-страницы, но под ней лежит открытый Elasticsearch: POST cdn.pamyat-naroda.ru/ind/<индекс>/_search с заголовком Referer: https://pamyat-naroda.ru/, а GET cdn.pamyat-naroda.ru/ind/_cat/indices?v отдаёт список индексов. Индексы: hero, hero_person, person, podvig, document, burial, voenkomat, callplace, armyunit, birthplace, camp, hospital, geo, vpp, operation, commander. Ценность сверх ОБД: индекс document — это АРХИВНЫЙ КАТАЛОГ ЦАМО С ЗАГОЛОВКАМИ ДЕЛ (именно он расшифровал ф. 8279 оп. 692513 д. 45 как «Список бывших военнопленных, прибывших в 7 зсп»), а индекс voenkomat — справочник ВСЕХ РВК СССР с географией, которым и решился вопрос «Шамский или Шалинский». ОГРАНИЧЕНИЕ: после ~15 запросов IP получает страницу проверки безопасности; делать 10–12 запросов и паузу, сразу писать в файл. (2) СКАНЫ ОБД КАЧАЮТСЯ ЦЕЛИКОМ, а не только поля индекса: GET obd-memorial.ru/html/getimageinfo?id=<id записи> даёт путь образа и его id, дальше id1 = md5(<id образа> + \"db76xdlrtxcxcghn7yusxjcdxsbtq1hnicnaspohh5tzbtgqjixzc5nmhybeh\") и забирать с cdn.obd-memorial.ru/html/images3?id=<id образа>&id1=<хеш>&path=<путь>. Через /html/fullimage идёт 302 — сразу на cdn. Именно так прочитаны жена и маршрут лагерей: индекс этих граф не содержит. ЛОВУШКИ: в ОБД параметр pb=T~Чусов даёт честный «не найдено», потому что T~ ищет токен ЦЕЛИКОМ, а не начало слова — гонять по району либо по всем написаниям; Arolsen Archives машиной не берётся вовсе — оболочка Angular отдаёт 517 629 байт и на осмысленный запрос, и на мусорный, нужен браузер; metriki.gaso-ural.ru рендерится скриптом и на мусор отдаёт те же 18 935 байт — тоже ложный ноль. ПУСТО ПРИ ЖИВОМ КАНАЛЕ: реестр ФНП по девяти написаниям (контроль — «Лухнев Алексей Дмитриевич» вернул карточку); ПермГАСПИ «Военнопленные» (контроль «Иванов» отвечает) — база только по Прикамью; «Яндекс Архив» по «Старо-Шайтанский» (контроль «Шайтанский завод» — 10 сниппетов)", "g": "Дорога плена Поливекта Сарафанова по годам и лагерям, его партийность и образование, жена Ульяна Сергеевна с адресом в Калининской обл. (Q149); расшифровка РВК на военном билете; двое новых Нестеровичей — Константин 1923 (убит 18.08.1943, перезахоронен в Духовщине) и Афанасий 1921 (пропал без вести 12.1942); медаль «За боевые заслуги» и часть Николая Нестеровича; гнездо фамилии в Шалинском районе — около 30 человек по двум деревням"}, "S56": {"k": "Печатное издание", "h": "Памятные книжки Полтавской губернии и Циркуляры по Харьковскому учебному округу — прогнаны 14.08.2026", "f": "Памятные книжки Полтавской губернии и Циркуляры по Харьковскому учебному округу — прогнаны 14.08.2026. ГЛАВНЫЙ АДРЕС: histpol.pl.ua, раздел «Справочные книжки и адрес-календари Полтавской губернии» — тексты открыты, читаются по id страницы (на 1913 id=12583, на 1914 id=12584, на 1915 id=12588, на 1916 id=12589; Памятные книжки Киевского учебного округа — 12607, 12608, 12610). Контроль парсера обязателен: мусорный id=99999999 отдаёт 568 символов, осмысленные — 700–800 тысяч. Циркуляры по Харьковскому учебному округу лежат на archive.org, все 15 томов, качаются как <id>_djvu.txt. ПОПРАВКА К ГЕОГРАФИИ ПОИСКА, которая стоила бы напрасной работы: Полтавская губерния входила в КИЕВСКИЙ учебный округ, а не в Харьковский — контроль: в томе Циркуляра по Харьковскому округу за 1914 слово «Миргород» встречается НОЛЬ раз при десяти вхождениях «Курскаго». ОГОВОРКА: фамилии в Циркулярах печатались курсивом, и OCR курсива местами разрушен до нечитаемого — отрицательный результат там не абсолютный", "g": "Закрыт Q145: «Леон. Прокоф. Данилов» — преподаватель Миргородской мужской гимназии в 1914, 1915 и 1916 годах, пришёл к 1913/14 учебному году. Плюс ранняя карьера: 1907 — и. об. преподавателя НЕМЕЦКОГО языка Нижне-Чирского реального училища и Высочайшее повеление допустить его к экзамену на учителя гимназии БЕЗ свидетельства о среднем образовании; апрель 1912 — уволен по прошению из частной гимназии Денченко в Харькове. Отсюда же объяснение семи языков у сына и немецкого у дочери"}, "S57": {"k": "Архив", "h": "КАТАЛОГ ГАКК БЕРЁТСЯ МАШИНОЙ ЦЕЛИКОМ — вскрыто 14.08.2026", "f": "КАТАЛОГ ГАКК БЕРЁТСЯ МАШИНОЙ ЦЕЛИКОМ — вскрыто 14.08.2026. Сайт kubgosarhiv.ru это только витрина (Bitrix, cp1251), описей там нет. Настоящий каталог — КАИСА-4 на krdar.kaisa.ru, и у него открытый POST API без ключа и логина: POST /api/get-object-list (полные записи), /api/get-object-list-count (только число), /api/get-object-list-combo (id + имя). Тело: {\"objectTypeId\":2790,\"languageId\":1,\"pageSize\":100,\"pageNumber\":1,\"searchParams\":[{\"attributeId\":13537,\"searchConditionId\":12,\"value\":\"Топчий\"}]}. ВНИМАНИЕ: успешный ответ приходит с HTTP-кодом 202, а не 200 — не считать это ошибкой. Типы: 2790 дела, 2788 описи, 225859334 PERSONBIRTH, 225859741 PERSONDECEASED, 225859545 PERSONMARRIADGE (в самом каталоге с опечаткой). Атрибуты дел: 13537 полнотекст (заголовок + OCR скана), 3150 шифр, 3156 опись, 3048 фонд, 3184 номер ед. хр., 3350 крайние даты, 4182 «отсканировано полностью». Условия: 12 содержит, 10 равно, 23 содержит слово, 2781 начинается с. ДВЕ ЛОВУШКИ. Первая: два searchParams на ОДНОМ атрибуте это OR, а не AND («Темрюк» 8402 + «метрическ» 6130 вместе дают 14017); AND получается только на РАЗНЫХ атрибутах — фильтровать по описи и добавлять одно слово. Вторая: параметр ?search= в адресах страниц /db/* и /stocks ИГНОРИРУЕТСЯ — страница отдаёт 200 и ту же первую алфавитную страницу на любой запрос. ТРЕТЬЯ И САМАЯ ОПАСНАЯ: каталог индексирует OCR сканов, и соблазнительно искать фамилии прямо по нему — НО РУКОПИСНЫЙ OCR ФАМИЛИЙ НЕ БЕРЁТ. Калибровка на 178 делах описи по Темрюку: «церкви» 149 дел, «Иван» 113, а «Коваленко», «Шевченко», «Кравченко» — по НУЛЮ, чего в кубанских метриках быть не может. Значит «Данилов 0» и «Топчий 0» по этой описи — ноль сломанного канала, а не отрицательный результат. Книги надо листать глазами. Бесплатно доступны заголовки всех дел, шифры, даты, признак оцифровки и PDF самих описей; образы дел — только по подписке (/site/getImage → HTTP 402). Именные указатели ГАКК (рождения 11 052, смерти 14 342, браки 5 455) построены ТОЛЬКО на ф. 801 оп. 1, то есть на церквях Екатеринодара — Темрюка в них нет по построению. ПОПРАВКА, ПРОВЕРЕННАЯ КОНТРОЛЕМ 14.08.2026: фильтр по НОМЕРУ ФОНДА (атрибут 3048) МОЛЧА ИГНОРИРУЕТСЯ. Запрос «Топчий» даёт 82 дела; «Топчий» + фонд 470 — те же 82; «Топчий» + фонд 449 — те же 82; и, что решает вопрос, «Топчий» + фонд 99999, которого не существует, — тоже 82. То есть параметр принимается, success=true, а на выдачу не влияет: это ложное сужение, из-за которого легко решить, будто дело найдено «в нужном фонде». Фильтр по ОПИСИ (атрибут 3156) при этом работает по-настоящему: «Топчий» + опись 910119820 (Темрюк) даёт 0, а «церкви» по той же описи — 149 дел. ПРАВИЛО: сужать только описью, номер фонда проверять глазами по полю шифра в самой записи. ОПИСЬ ТЕМРЮКА ВЫВЕРЕНА ЛИЧНО 14.08.2026: PDF описи (42 страницы, ~1 МБ) скачан по адресу krdar.kaisa.ru/site/file?objectId=910119820&attributeId=3404&sn=1019656988 — без регистрации, серийник sn виден в разметке страницы описи. Текст извлечён и сверен построчно: номера дел, названия церквей и ГОДЫ совпали с таблицей полностью, ни одного расхождения. То есть заказывать можно с уверенностью: д. 116 — это действительно 1875 год Николаевского собора", "g": "Личное дело Леонида Данилова: Ф. 470 оп. 2 д. 2904, 1902 год, раздел «Личные дела о службе школьных работников» — самый ценный неоткрытый документ по этой ветви. Метрики Темрюка поимённо по годам: ф. 801 оп. 39, включая д. 116 (1875, рождение Евдокии), дд. 132/134 (1895, брак) и дд. 135–153 (шесть рождений детей). Топчии как темрюкские мещане: ф. 449 оп. 5 д. 95, прошения вдовы 1870–71. Метрики Фёдоровского (оп. 4 дд. 76–97) и Шапсугской (дд. 118–124). Найдены ещё два личных дела Топчиев: Ф. Р-781 оп. 1 д. 1238 «ТОПЧИЙ Фёдор Павлович» и д. 1994 «ТОПЧИЙ Павел Лукьянович»; плюс Ф. 396 оп. 2 д. 97 — формулярные списки офицеров, где встречается фамилия. Существование ключевого дела Ф. 470 оп. 2 д. 2904 «Данилов Леонид» перепроверено"}, "S58": {"k": "Открытые источники", "h": "Английская ветвь Wood по письму 2003 года — обход открытых источников 15.08.2026", "f": "Английская ветвь Wood по письму 2003 года — обход открытых источников 15.08.2026. НАЙДЕН СИЛЬНЫЙ КАНДИДАТ НА ЭБИГЕЙЛ: д-р Abigail Wood, этномузыколог. Биография сходится с письмом по обоим пунктам сразу и по годам: PhD Кембриджа 2004 («Yiddish song in contemporary North America», научный руководитель Ruth Davis), ПРЕПОДАВАТЕЛЬ МУЗЫКИ УНИВЕРСИТЕТА САУТГЕМПТОНА 2002–2006, затем Joe Loss Lecturer по еврейской музыке в SOAS 2006–2014, с 2013 — этномузыкология в Хайфском университете; монография «And We’re All Brothers» (Ashgate, 2013). Письмо написано в 2003 году, то есть ровно в те годы, когда она преподавала в Саутгемптоне и дописывала кембриджскую диссертацию. ЧЕГО НЕ НАШЛОСЬ И ПОЧЕМУ ОТОЖДЕСТВЛЕНИЕ НЕ ЗАКРЫТО: ни второго имени (у нашей по GRO — Charlotte), ни года рождения, ни единой привязки к Пулу или Дорсету. Проверены страницы Jewish Music Research Centre (Хайфа), Jewish Music Institute (Joe Loss), Royal Holloway, Academia.edu, Google Scholar, Yiddish Summer Weimar. Фамилия и имя нередкие, поэтому совпадение биографии без личных данных доказательством не считаю. ДЖЕЙМС И МЭЛ: открытый поиск бесполезен — «James Wood» и психология дают сотни посторонних людей, ни одной привязки к Пулу или году рождения 1980. ГРАНИЦА ПО БРАКАМ: брак 2002 года по бесплатным индексам НЕ ПРОВЕРИТЬ. FreeBMD доводит браки только до 2000 года, а собственный онлайн-индекс GRO — это рождения и смерти, браков в нём нет вовсе. Остаются платные (RootsUK и findmypast, «Civil Registration Marriages 1837–2005») либо заказ свидетельства в GRO.", "g": "D017 Эбигейл (кандидат), D018 Джеймс, D019 Мэл — и рабочая граница по английским бракам после 2000 года"}, "S59": {"k": "Семейный архив", "h": "ТРУДОВЫЕ ДОКУМЕНТЫ АНТОНИНЫ ЛЕОНИДОВНЫ (L009) — 29 бумаг 1920–1961 годов, сняты мамой (L021) 15.08.2026, лежат в photos/мама-2026-08-15/", "f": "ТРУДОВЫЕ ДОКУМЕНТЫ АНТОНИНЫ ЛЕОНИДОВНЫ (L009) — 29 бумаг 1920–1961 годов, сняты мамой (L021) 15.08.2026, лежат в photos/мама-2026-08-15/. Что это за корпус: удостоверения, справки с мест работы, приказы о назначении и переводе, разрешения на отпуск, циркуляры районо и одна почтовая карточка. Вместе они дают СПЛОШНОЙ трудовой путь с точностью до дней — от аттестата бывшей женской гимназии Темрюка (июнь 1920) до справки о сдаче жилплощади в Евпатории (август 1961). КЛЮЧЕВЫЕ БУМАГИ: удостоверение № 388 Единой трудовой школы II ступени № 2 г. Темрюка (9.06.1920, восьмой класс: латынь, французский, логика, гигиена, политэкономия); «Единое удостоверение» № 17 Темрюкского исполкома (3.07.1922); удостоверение № 973 о работе в Темрюкском детдоме январь 1924 — октябрь 1925 и его нотариальная копия, заверенная 3 июля 1929; справка № 206 детдома имени павших таманцев (28.10.1926); направление Керченского ОНО № 2590 (июль 1928) и справка № 650 (10.01.1929) о работе в Керченской детской трудовой колонии имени Томского; справка № 5б (2.07.1929) о должности ЗАВЕДЫВАЮЩЕЙ Введенской школой; справка о детяслях консервной фабрики № 8 (26.11.1929); адыгейские бумаги 1930–1931 (Понежукай, Кашпур, Красное Село, Красногвардейское); записка от 30.08.1931 «назначение Даниловой (ЛУХНЕВОЙ)» — верхняя граница даты замужества; справка УВСР № 150 Харьковского военного округа (8.01.1938); справка ОКХ Евпаторийского горсовета (4.08.1961). ОСОБЕННОСТИ ЧТЕНИЯ: бланк Керченского райисполкома двуязычный — русский и крымскотатарский арабицей; в керченской справке отчество записано «Леонардовне»; на двух бумагах год не проставлен или не читается. Пять кадров из тридцати четырёх — не документы, а снимки экрана с поисковой выдачей про колонию имени Томского, сделанные Саввой.", "g": "L009 — весь трудовой путь 1919–1961; косвенно L004 (Харьков), L013 (отъезд из Крыма), география Темрюкского района, Керчи и Адыгеи"}, "S60": {"k": "Семейный архив", "h": "ЧЕТЫРЕ АКТОВЫХ ДОКУМЕНТА ПО ЛИНИИ БАБУШКИ, снимки от Саввы 15.08.2026, лежат в photos/бабушка-2026-08-15/", "f": "ЧЕТЫРЕ АКТОВЫХ ДОКУМЕНТА ПО ЛИНИИ БАБУШКИ, снимки от Саввы 15.08.2026, лежат в photos/бабушка-2026-08-15/. (1) Свидетельство о рождении Трубниковой Лидии Сергеевны (L017), форма НКВД СССР: родилась 16.03.1937, запись № 101 от 24.03.1937, Поспелихинский сельсовет; родители названы поимённо. (2) Повторное свидетельство БЮ № 718876, выдано 17.05.1952 — оно и читается лучше: с. Поспелиха, Поспелихинский район, Алтайский край, РСФСР; отец Трубников Сергей Захарович, русский; мать Трубникова Екатерина Николаевна, русская. (3) Свидетельство о смерти I-ОИ № 463371: Трубникова Екатерина Николаевна умерла 18.07.1993 в возрасте 84 лет, г. Усть-Каменогорск, Ульбинский район, ВКО; причина — атеросклероз; запись № 1059 от 19.07.1993. (4) Свидетельство о смерти (бланк Республики Казахстан) № 0000379: Лухнева Антонина Леонидовна (L009) умерла 10.07.1997 в возрасте 97 лет в г. Усть-Каменогорске; причина — атеросклероз; запись № 2208.", "g": "L017 — дата и место рождения; TR001 — отчество Захарович; TR002 — новый человек целиком; L009 — точная дата и место смерти; Алтай как новая география рода"}, "S61": {"k": "Печатные издания и архивные описи", "h": "ГЛУБИННЫЙ ПРОХОД ПО САВВЕ ЛУХНЕВУ И ПО АДМИНИСТРАТИВНОЙ ИСТОРИИ ВЕРХНЕЙ ТОЙМЫ, 15.08.2026 — работа отдельного агента, сведена и проверена здесь", "f": "ГЛУБИННЫЙ ПРОХОД ПО САВВЕ ЛУХНЕВУ И ПО АДМИНИСТРАТИВНОЙ ИСТОРИИ ВЕРХНЕЙ ТОЙМЫ, 15.08.2026 — работа отдельного агента, сведена и проверена здесь. ЧТО НАЙДЕНО: (1) Кистерев, «Нормативные документы таможенных учреждений городов Устюжской четверти», документ № 10 от 6 марта 1624 — Савва Лухнев служит у Соли Вычегодской и на Устюге «во 128-м и во 129-м году», то есть в 1619/20–1620/21; это на три года раньше прежней самой ранней точки и в самой родовой зоне. (2) Ономастикон Веселовского прогнан целиком: основа «Лухн» — ровно одно вхождение на весь корпус XV–XVII вв. (3) «Устюг Великий. Материалы для истории города XVII и XVIII столетий» (1,38 млн знаков) — «Лухн» ноль вхождений при рабочем контроле: фамилия НЕ устюжская посадская. (4) Полный текст грамоты ААЭ 20.09.1623 с именами дьяка Савы Романчукова и думного дьяка Ивана Грамотина. (5) Список из десяти переписей и писцовых книг по Сольвычегодску/Усольскому уезду 1620–1717 с шифрами РГАДА ф. 1209 — он опровергает прежнее утверждение о «135 годах без документов». ГЛАВНАЯ ПОПРАВКА, ПРОВЕРЕННАЯ НЕЗАВИСИМО: по уставной грамоте Ивана IV 1552 года тоемские земли вошли в ПОДВИНСКИЙ СТАН ВАЖСКОГО УЕЗДА, в XVII веке — Подвинская четь Важского уезда; с 1615 года уезд в ведении Приказа Большого дворца, крестьяне дворцовые, с 1797 удельные; Сольвычегодским уездом это стало только в 1784-м. Отсюда два следствия: искать XVII век надо в ВАЖСКИХ книгах, а не сольвычегодских; и отбраковка шенкурского куста «по разным губерниям» недействительна — до 1784 года это один уезд.", "g": "Q141 (переписан), Q88 и Q81 (переоткрыты в пользу родства), ST03, места P28/P30/P31/P34/P38/P39; новые вопросы Q158 и Q159"}};
